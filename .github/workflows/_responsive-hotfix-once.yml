name: One-shot CPCV responsive hotfix

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/_responsive-hotfix-once.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"

      - name: Apply responsive fix and strengthen audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          app = root / 'public/assets/app.css'
          css = app.read_text(encoding='utf-8')
          marker = '/* 2026-08-20 tablet and zoom reflow fix. */'
          if marker not in css:
              css += '''\n\n/* 2026-08-20 tablet and zoom reflow fix. */\n/* When the lesson workspace becomes one column, the live column must stop being\n   sticky at the same breakpoint. Otherwise 921-1180px viewports can place the\n   following settings column underneath the sticky live controls while scrolling. */\n.admin-page .session-command-center,\n.admin-page .lesson-live-column,\n.admin-page .lesson-settings-column,\n.admin-page .workspace-panel,\n.admin-page .settings-panel {\n  min-width: 0;\n  max-width: 100%;\n}\n.admin-page #joinUrl,\n.admin-page #viewerUrl,\n.admin-page .session-code,\n.admin-page .field-control,\n.admin-page .field-control .select,\n.admin-page .field-control .input,\n.admin-page .full-button {\n  min-width: 0;\n  max-width: 100%;\n}\n.admin-page #joinUrl,\n.admin-page #viewerUrl {\n  overflow-wrap: anywhere;\n  word-break: break-word;\n}\n\n@media (max-width: 1180px) {\n  .admin-page .session-command-center {\n    grid-template-columns: minmax(0, 1fr);\n  }\n  .admin-page .lesson-live-column {\n    position: static;\n    top: auto;\n  }\n  .admin-page .lesson-live-column,\n  .admin-page .lesson-settings-column {\n    width: 100%;\n  }\n}\n\n@media (max-width: 820px) {\n  .admin-page .settings-grid,\n  .admin-page .ai-translation-settings,\n  .admin-page .live-state-grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n  .admin-page .session-settings-savebar,\n  .admin-page .settings-save-row,\n  .admin-page .analytics-export-row {\n    align-items: stretch;\n    flex-direction: column;\n  }\n  .admin-page .session-settings-savebar .button,\n  .admin-page .settings-save-row .button,\n  .admin-page .analytics-export-row .button {\n    width: 100%;\n    min-width: 0;\n  }\n}\n'''
              app.write_text(css, encoding='utf-8')

          # Bust the stylesheet cache consistently on every public HTML page.
          for html in (root / 'public').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              updated, count = re.subn(
                  r'href="/assets/app\.css\?v=[^"]+"',
                  'href="/assets/app.css?v=0.8.10-u22fix2"',
                  text,
              )
              if count and updated != text:
                  html.write_text(updated, encoding='utf-8')

          audit_path = root / 'scripts/audit-responsive-layout.py'
          audit = audit_path.read_text(encoding='utf-8')
          viewport_pattern = re.compile(
              r'VIEWPORTS = \(\n.*?\n\)\nclass QuietStaticHandler',
              re.S,
          )
          viewport_block = '''VIEWPORTS = (\n    ("pane-280", 280, 720),\n    ("phone-320", 320, 720),\n    ("phone-360", 360, 800),\n    ("phone-375", 375, 812),\n    ("phone-390", 390, 844),\n    ("phone-412", 412, 915),\n    ("phone-480", 480, 900),\n    ("small-tablet-600", 600, 960),\n    ("tablet-720", 720, 1024),\n    ("tablet-768", 768, 1024),\n    ("tablet-820", 820, 1180),\n    ("tablet-900", 900, 1200),\n    ("desktop-901", 901, 800),\n    ("tablet-1024", 1024, 1366),\n    ("desktop-1100", 1100, 800),\n    ("desktop-1180", 1180, 900),\n    ("desktop-1181", 1181, 900),\n    ("desktop-1280", 1280, 900),\n    ("desktop-1366", 1366, 900),\n    ("desktop-1440", 1440, 1000),\n)\nclass QuietStaticHandler'''
          audit, count = viewport_pattern.subn(viewport_block, audit, count=1)
          if count != 1:
              raise SystemExit('VIEWPORTS block replacement failed')

          anchor = '          const accountOverlayFailures = [];'
          addition = r'''          const adminLayoutFailures = [];
          const commandCenter = document.querySelector('.session-command-center');
          const liveColumn = document.querySelector('.lesson-live-column');
          const settingsColumn = document.querySelector('.lesson-settings-column');
          if (commandCenter && liveColumn && settingsColumn && visible(commandCenter)) {
            const columns = getComputedStyle(commandCenter).gridTemplateColumns
              .trim().split(/\s+/).filter(Boolean);
            const liveStyle = getComputedStyle(liveColumn);
            if (columns.length === 1 && liveStyle.position === 'sticky') {
              adminLayoutFailures.push({
                kind: 'single-column-live-panel-still-sticky',
                position: liveStyle.position,
                gridTemplateColumns: getComputedStyle(commandCenter).gridTemplateColumns
              });
            }
            for (const panel of commandCenter.querySelectorAll('.workspace-panel')) {
              if (!visible(panel)) continue;
              const pr = panel.getBoundingClientRect();
              for (const control of panel.querySelectorAll('button, input, select, textarea')) {
                if (!visible(control)) continue;
                const r = control.getBoundingClientRect();
                if (r.left < pr.left - 1 || r.right > pr.right + 1) {
                  adminLayoutFailures.push({
                    kind: 'admin-control-outside-panel', ...describe(control),
                    left: r.left, right: r.right, panelLeft: pr.left, panelRight: pr.right
                  });
                }
              }
            }
          }
'''
          if 'single-column-live-panel-still-sticky' not in audit:
              if anchor not in audit:
                  raise SystemExit('admin layout insertion anchor missing')
              audit = audit.replace(anchor, addition + anchor, 1)

          old_return = '            viewerControlFailures,\n            accountOverlayFailures'
          new_return = '            viewerControlFailures,\n            adminLayoutFailures,\n            accountOverlayFailures'
          if 'adminLayoutFailures,\n            accountOverlayFailures' not in audit:
              if old_return not in audit:
                  raise SystemExit('return insertion anchor missing')
              audit = audit.replace(old_return, new_return, 1)

          old_ok = '                        and not result["viewerControlFailures"]\n                        and not result["accountOverlayFailures"]'
          new_ok = '                        and not result["viewerControlFailures"]\n                        and not result["adminLayoutFailures"]\n                        and not result["accountOverlayFailures"]'
          if 'and not result["adminLayoutFailures"]' not in audit:
              if old_ok not in audit:
                  raise SystemExit('ok-condition insertion anchor missing')
              audit = audit.replace(old_ok, new_ok, 1)

          old_shots = 'viewport_name in {"pane-280", "phone-320", "desktop-901", "desktop-1024", "desktop-1100"}'
          new_shots = 'viewport_name in {"pane-280", "phone-320", "phone-390", "tablet-768", "tablet-820", "tablet-1024", "desktop-1180", "desktop-1181", "desktop-1280", "desktop-1440"}'
          if old_shots in audit:
              audit = audit.replace(old_shots, new_shots, 1)

          audit_path.write_text(audit, encoding='utf-8')

          workflow = root / '.github/workflows/responsive-and-ai-regression.yml'
          workflow_text = workflow.read_text(encoding='utf-8')
          workflow_text = workflow_text.replace(
              'Audit every public HTML at five viewport widths',
              'Audit every public HTML across the responsive viewport matrix',
          )
          workflow.write_text(workflow_text, encoding='utf-8')
          PY

      - name: Install visual test dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm ci
          npm install-scripts ls
          python -m pip install --disable-pip-version-check -r requirements-visual.txt
          python -m playwright install --with-deps chromium

      - name: Run expanded responsive audit
        run: python scripts/audit-responsive-layout.py

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-hotfix-evidence-${{ github.sha }}
          path: artifacts/responsive-layout-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Finalize source manifest and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_responsive-hotfix-once.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          root = Path('.')
          override = root / 'SOURCE_SHA256SUMS.override.txt'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT'], text=True
          ).splitlines()
          excluded = {
              'SOURCE_SHA256SUMS.txt',
              'SOURCE_SHA256SUMS.override.txt',
              '.github/workflows/_responsive-hotfix-once.yml',
          }
          paths = [p for p in changed if p not in excluded and (root / p).is_file()]
          lines = override.read_text(encoding='utf-8').splitlines()
          by_path = {}
          order = []
          for line in lines:
              if not line.strip():
                  continue
              digest, path = line.split('  ', 1)
              by_path[path] = digest
              order.append(path)
          for path in paths:
              by_path[path] = hashlib.sha256((root / path).read_bytes()).hexdigest()
              if path not in order:
                  order.append(path)
          override.write_text(
              ''.join(f'{by_path[path]}  {path}\n' for path in order),
              encoding='utf-8',
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[deploy-cpcv] Fix tablet responsive overlap and expand viewport audit"
          git push origin HEAD:master
