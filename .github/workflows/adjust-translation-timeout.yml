name: Adjust translation timeout from live measurements

on:
  push:
    branches:
      - agent/adjust-translation-timeout
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: adjust-translation-timeout
  cancel-in-progress: false

jobs:
  patch-verify-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adjust-translation-timeout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply measured cold-start timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'src/ai/provider.js': [
              ('const DEFAULT_TRANSLATION_TIMEOUT_MS = 3_000;', 'const DEFAULT_TRANSLATION_TIMEOUT_MS = 4_000;'),
            ],
            'wrangler.toml': [
              ('AI_TRANSLATION_TIMEOUT_MS = "3000"', 'AI_TRANSLATION_TIMEOUT_MS = "4000"'),
            ],
            'scripts/test-ai-v2.mjs': [
              ('AI_TRANSLATION_TIMEOUT_MS: "3000"', 'AI_TRANSLATION_TIMEOUT_MS: "4000"'),
            ],
            'scripts/test-v0810-usability.mjs': [
              ("check('translation has a three-second fail-open timeout', wrangler.includes('AI_TRANSLATION_TIMEOUT_MS = \"3000\"'));",
               "check('translation has a four-second fail-open timeout', wrangler.includes('AI_TRANSLATION_TIMEOUT_MS = \"4000\"'));")
            ]
          }

          for filename, pairs in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
            path.write_text(text)

          Path('.github/workflows/adjust-translation-timeout.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
          git diff --cached --check
          git commit -m "Set translation fail-open timeout to four seconds"
      - name: Targeted verification
        run: |
          node --check src/ai/provider.js
          node --no-warnings scripts/test-ai-v2.mjs
          node --no-warnings scripts/test-realtime-v2.mjs
          node --no-warnings scripts/test-v0810-usability.mjs
          node scripts/verify-deployment-config.mjs wrangler.toml
      - name: Full release verification
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run check:stage08
          npm run check:v0810
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified timeout adjustment
        run: git push origin HEAD:agent/adjust-translation-timeout
