name: Apply AI quality and admin UI refinement

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/agent-refine-ai-quality-ui.yml
      - .github/workflows/agent-refine-ai-quality-ui-pr.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/refine-ai-quality-admin-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-ai-quality-admin-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement and compatibility corrections
        shell: bash
        run: |
          sed -n '/^[[:space:]]*H4sI/,/^[[:space:]]*PATCH$/p' .github/workflows/agent-refine-ai-quality-ui.yml | sed '$d' | tr -d '[:space:]' > /tmp/refine.gz.b64
          base64 -d /tmp/refine.gz.b64 | gzip -d > /tmp/refine.mjs
          node --check /tmp/refine.mjs
          node /tmp/refine.mjs
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('src/ai/provider.js')
          text = provider.read_text(encoding='utf-8')
          old = 'if (Object.hasOwn(candidate, "recommendation") || Object.hasOwn(candidate, "translation")) return candidate;'
          new = 'if (Object.hasOwn(candidate, "recommendation") || Object.hasOwn(candidate, "verdict") || Object.hasOwn(candidate, "action") || Object.hasOwn(candidate, "translation")) return candidate;'
          if old not in text:
              raise SystemExit('moderation candidate compatibility anchor not found')
          provider.write_text(text.replace(old, new, 1), encoding='utf-8')

          verifier = Path('scripts/verify-precision-boundaries.mjs')
          text = verifier.read_text(encoding='utf-8')
          start = text.index('const migrationFiles = readdirSync(resolve(ROOT, "migrations-v2")).sort();')
          end = text.index('const csrfMigration = text("migrations-v2/0004_precision_hardening.sql");', start)
          block = '''const migrationFiles = readdirSync(resolve(ROOT, "migrations-v2")).sort();
          const expectedMigrationFiles = [
            "0001_initial_schema.sql", "0002_auth_security.sql", "0003_comments.sql",
            "0004_precision_hardening.sql", "0005_comment_content_guards.sql",
            "0006_manual_moderation.sql", "0007_realtime.sql", "0008_email_auth.sql", "0009_account_lifecycle.sql",
            "0010_ai_moderation_translation.sql", "0011_dictionary_content_filter.sql", "0012_multilingual_filter_usability.sql",
            "0013_bilingual_filter_translation_safety.sql", "0014_filter_pack_expansion.sql", "0015_pdf_page_analytics.sql",
            "0016_stage08_precision_hardening.sql", "0017_final_integrity_hardening.sql", "0018_ai_translation_quality.sql"
          ];
          check(
            "precision migrations are append-only",
            migrationFiles.length === expectedMigrationFiles.length
              && expectedMigrationFiles.every((file, index) => migrationFiles[index] === file),
            migrationFiles
          );
          '''
          verifier.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          rm -f .github/workflows/agent-refine-ai-quality-ui.yml .github/workflows/agent-refine-ai-quality-ui-pr.yml
          git add -A
      - name: Regenerate and commit source manifest
        shell: bash
        run: |
          npm run manifest:source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine AI translation quality and admin UI'
          npm run verify:source-manifest
      - name: Validate feature and full system
        run: |
          npm run test:ai-quality-ui
          npm run check
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified changes
        run: git push origin HEAD:agent/refine-ai-quality-admin-ui
