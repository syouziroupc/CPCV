name: Refine AI quality and admin UI

on:
  push:
    branches: [agent/refine-ai-quality-admin-ui]
    paths: [.github/workflows/agent-refine-ai-quality-ui.yml]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-ai-quality-admin-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply refinement
        shell: bash
        run: |
          cat > /tmp/refine-ai-quality-ui.mjs.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/refine-ai-quality-ui.mjs.gz.b64 | gzip -d > /tmp/refine-ai-quality-ui.mjs
          node --check /tmp/refine-ai-quality-ui.mjs
          node /tmp/refine-ai-quality-ui.mjs
          rm .github/workflows/agent-refine-ai-quality-ui.yml
      - name: Regenerate source manifest
        run: |
          npm run manifest:source
          npm run verify:source-manifest
      - name: Validate feature and full system
        run: |
          npm run test:ai-quality-ui
          npm run check
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine AI translation quality and admin UI"
          git push origin HEAD:agent/refine-ai-quality-admin-ui
