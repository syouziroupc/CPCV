name: Temporary AI response hardening patch

on:
  push:
    branches:
      - agent/ai-response-hardening-20260808

permissions:
  contents: write

concurrency:
  group: ai-response-hardening-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hardening patch
        run: python scripts/ai-response-hardening-patch.py

      - name: Remove temporary patch machinery and stage source changes
        run: |
          git rm scripts/ai-response-hardening-patch.py .github/workflows/ai-response-hardening-patch.yml
          git add src public/assets scripts wrangler.toml

      - name: Regenerate source manifest from staged sources
        run: |
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt

      - name: Run focused reliability and AI regressions
        run: |
          node scripts/test-load-hardening.mjs
          node scripts/test-ai-quality-ui-refinement.mjs
          node scripts/test-ai-translation-resilience.mjs
          node --no-warnings scripts/test-ai-v2.mjs
          node --no-warnings scripts/test-content-filter-v2.mjs
          npm run check
          npm run deploy:dry-run
          git diff --cached --check

      - name: Commit validated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden AI response and comment delivery"
          npm run verify:source-manifest
          git push origin HEAD:agent/ai-response-hardening-20260808
