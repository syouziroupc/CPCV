name: Apply AI capacity v2 2026-08-08

on:
  push:
    branches:
      - agent/ai-capacity-v2-20260808

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-capacity-v2-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply moderation classifier and translation overflow routing
        shell: bash
        run: |
          set -euo pipefail
          cat > src/ai/moderation-classifier.js <<'EOF'
          import { AI_CATEGORIES, normalizeModerationResult } from "./validation.js";
          import { runModerationModel as runLegacyModerationModel } from "./provider-base.js";

          const DEFAULT_MODEL = "@cf/google/embeddinggemma-300m";
          const PROMPT_VERSION = "moderation-embedding-v1";
          const DEFAULT_TIMEOUT_MS = 5_000;
          const CLASSIFIER_LIMIT_KEY = "workers-ai-moderation-embedding";
          const VALID_CATEGORIES = new Set(AI_CATEGORIES);
          const prototypeCache = new Map();

          const PROFILES = Object.freeze([
            { category: "safe", text: "Ordinary classroom discussion, a neutral question, factual explanation, polite disagreement, quotation for study, or harmless casual comment. 普通の授業コメント、質問、説明、学習目的の引用、丁寧な反対意見、無害な雑談。" },
            { category: "harassment", text: "Direct insult, humiliation, bullying, abusive profanity, intimidation, or degrading language aimed at a person. 人への侮辱、罵倒、いじめ、威圧、人格攻撃、相手を傷つける暴言。" },
            { category: "hate", text: "Hateful or discriminatory attack against a protected group or identity, slur, dehumanization, or exclusion based on identity. 属性や集団への差別、蔑称、ヘイト、排斥、非人間化。" },
            { category: "sexual", text: "Explicit sexual content, sexual solicitation, graphic sexual description, or inappropriate sexual remarks. 露骨な性的内容、性的勧誘、性的描写、不適切な性的発言。" },
            { category: "violence", text: "Threat, encouragement, instruction, or graphic description of physical violence or serious harm. 暴力の脅迫、暴行の推奨や指示、深刻な危害、残虐な暴力表現。" },
            { category: "self_harm", text: "Self-harm or suicide intent, encouragement, methods, instructions, or imminent self-injury risk. 自傷や自殺の意図、方法、推奨、実行手順、切迫した自傷リスク。" },
            { category: "spam", text: "Spam, repeated advertising, scams, unsolicited promotion, meaningless flooding, or disruptive repetitive posting. スパム、宣伝、詐欺、無関係な大量投稿、連投による妨害。" },
            { category: "personal_data", text: "Exposure or solicitation of private personal data such as phone number, home address, password, account secret, or sensitive identifier. 電話番号、住所、パスワード、秘密情報、個人識別情報の公開や要求。" },
            { category: "prompt_injection", text: "Instruction attempting to override system rules, reveal hidden prompts, bypass moderation, or manipulate the AI classifier. システム指示の上書き、プロンプト開示要求、検閲回避、AI判定の操作。" },
            { category: "other", text: "Other clearly unsafe, disruptive, malicious, or inappropriate classroom content not covered by the specific safety categories. その他の明確に危険、悪意、授業妨害、不適切な内容。" }
          ]);

          export async function runModerationModel(env, input, options = {}) {
            if (!env?.AI || typeof env.AI.run !== "function") {
              return runLegacyModerationModel(env, input, options);
            }
            const model = String(env?.AI_MODERATION_CLASSIFIER_MODEL || DEFAULT_MODEL).trim() || DEFAULT_MODEL;
            try {
              const capacity = await acquireClassifierCapacity(env);
              if (!capacity) throw codedError("AI_CLASSIFIER_RATE_LIMITED", true);
              const usageEventId = typeof options.reserveUsage === "function"
                ? await options.reserveUsage(model)
                : null;
              const result = await classifyWithEmbeddings(env, model, input);
              return {
                ...result.normalized,
                provider: "workers_ai",
                model,
                promptVersion: PROMPT_VERSION,
                rawOutputLength: result.rawOutputLength,
                usageEventId
              };
            } catch (error) {
              if (error?.code === "AI_DAILY_LIMIT_REACHED") throw error;
              const normalized = normalizeClassifierError(error);
              if (allowLegacyOverflow(env, normalized)) {
                return runLegacyModerationModel(env, input, options);
              }
              throw normalized;
            }
          }

          async function classifyWithEmbeddings(env, model, input) {
            const message = String(input?.message || "").trim();
            if (!message) throw codedError("AI_RESPONSE_INVALID", false);
            const timeout = classifierTimeoutMs(env);
            let prototypes = prototypeCache.get(model);
            let response;
            let messageVector;

            if (!prototypes) {
              response = await withTimeout(
                Promise.resolve(env.AI.run(model, { text: [message, ...PROFILES.map((item) => item.text)] }, gatewayOptions(env))),
                timeout
              );
              const vectors = extractVectors(response);
              if (vectors.length !== PROFILES.length + 1) throw codedError("AI_RESPONSE_INVALID", true);
              messageVector = vectors[0];
              prototypes = vectors.slice(1);
              prototypeCache.set(model, prototypes);
            } else {
              response = await withTimeout(
                Promise.resolve(env.AI.run(model, { text: [message] }, gatewayOptions(env))),
                timeout
              );
              const vectors = extractVectors(response);
              if (vectors.length !== 1) throw codedError("AI_RESPONSE_INVALID", true);
              messageVector = vectors[0];
            }

            if (!Array.isArray(messageVector) || !messageVector.length || prototypes.some((vector) => !Array.isArray(vector) || vector.length !== messageVector.length)) {
              throw codedError("AI_RESPONSE_INVALID", true);
            }

            const scored = PROFILES.map((profile, index) => ({
              category: profile.category,
              score: cosineSimilarity(messageVector, prototypes[index])
            }));
            const safeScore = scored.find((item) => item.category === "safe")?.score ?? -1;
            const unsafe = scored
              .filter((item) => item.category !== "safe")
              .sort((a, b) => b.score - a.score);
            const top = unsafe[0] || { category: "other", score: -1 };
            const dictionaryCategories = extractDictionaryCategories(input?.dictionaryCandidates);
            const hasDictionarySignal = Array.isArray(input?.dictionaryCandidates) && input.dictionaryCandidates.length > 0;

            if (input?.promptInjection) {
              return {
                normalized: normalizeModerationResult({ recommendation: "review", confidence: 0.95, categories: ["prompt_injection"] }),
                rawOutputLength: structuredLength(response)
              };
            }

            const reviewMargin = configuredNumber(env?.AI_MODERATION_REVIEW_MARGIN, 0.035, 0.005, 0.25)
              * (hasDictionarySignal ? 0.65 : 1);
            const hideMargin = configuredNumber(env?.AI_MODERATION_HIDE_MARGIN, 0.12, 0.03, 0.5);
            const margin = top.score - safeScore;
            let recommendation = "allow";
            if (margin >= hideMargin && top.category !== "other") recommendation = "hide";
            else if (margin >= reviewMargin || (hasDictionarySignal && margin >= -0.005)) recommendation = "review";

            let categories = [];
            if (recommendation !== "allow") {
              const scoreFloor = Math.max(safeScore + Math.max(0.005, reviewMargin * 0.5), top.score - 0.045);
              categories = unsafe
                .filter((item) => item.score >= scoreFloor)
                .slice(0, 3)
                .map((item) => item.category);
              categories = [...new Set([...categories, ...dictionaryCategories])].filter((item) => VALID_CATEGORIES.has(item)).slice(0, 9);
              if (!categories.length) categories = [top.category === "safe" ? "other" : top.category];
            }

            const separation = Math.min(0.45, Math.abs(margin));
            const confidence = recommendation === "hide"
              ? Math.min(0.99, 0.74 + separation * 1.7)
              : recommendation === "review"
                ? Math.min(0.92, 0.56 + separation * 1.6)
                : Math.min(0.98, 0.58 + separation * 1.8);

            return {
              normalized: normalizeModerationResult({ recommendation, confidence, categories }),
              rawOutputLength: structuredLength(response)
            };
          }

          function extractDictionaryCategories(value) {
            const categories = [];
            for (const item of Array.isArray(value) ? value : []) {
              if (!item || typeof item !== "object") continue;
              for (const key of ["category", "type", "reason"]) {
                const normalized = String(item[key] || "").trim().toLowerCase().replaceAll("-", "_");
                if (VALID_CATEGORIES.has(normalized)) categories.push(normalized);
              }
            }
            return [...new Set(categories)];
          }

          function extractVectors(value) {
            const data = value?.data ?? value?.result?.data ?? value?.response?.data ?? value;
            if (!Array.isArray(data)) return [];
            if (data.every((item) => Number.isFinite(Number(item)))) return [data.map(Number)];
            return data
              .filter((item) => Array.isArray(item) && item.every((entry) => Number.isFinite(Number(entry))))
              .map((item) => item.map(Number));
          }

          function cosineSimilarity(a, b) {
            let dot = 0;
            let normA = 0;
            let normB = 0;
            for (let index = 0; index < a.length; index += 1) {
              const av = Number(a[index]);
              const bv = Number(b[index]);
              dot += av * bv;
              normA += av * av;
              normB += bv * bv;
            }
            if (!(normA > 0) || !(normB > 0)) return -1;
            return dot / Math.sqrt(normA * normB);
          }

          async function acquireClassifierCapacity(env) {
            const limiter = env?.AI_MODERATION_CLASSIFIER_RATE_LIMITER;
            if (!limiter || typeof limiter.limit !== "function") return true;
            try {
              const result = await limiter.limit({ key: CLASSIFIER_LIMIT_KEY });
              return result?.success !== false;
            } catch (error) {
              console.error("AI moderation embedding limiter failed closed", safeCode(error));
              return false;
            }
          }

          function allowLegacyOverflow(env, error) {
            if (String(env?.AI_MODERATION_CLASSIFIER_FALLBACK || "1") === "0") return false;
            return [
              "AI_CLASSIFIER_RATE_LIMITED",
              "AI_PROVIDER_RATE_LIMITED",
              "AI_PROVIDER_TIMEOUT",
              "AI_PROVIDER_UNAVAILABLE",
              "AI_PROVIDER_FAILED",
              "AI_RESPONSE_INVALID"
            ].includes(String(error?.aiCode || ""));
          }

          function classifierTimeoutMs(env) {
            return Math.round(configuredNumber(env?.AI_MODERATION_CLASSIFIER_TIMEOUT_MS, DEFAULT_TIMEOUT_MS, 1000, 15000));
          }

          function configuredNumber(value, fallback, minimum, maximum) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? Math.min(maximum, Math.max(minimum, parsed)) : fallback;
          }

          function gatewayOptions(env) {
            const id = String(env?.AI_GATEWAY_ID || "").trim();
            return id ? { gateway: { id, skipCache: true } } : undefined;
          }

          function withTimeout(promise, milliseconds) {
            let timer;
            const timeout = new Promise((_, reject) => {
              timer = setTimeout(() => reject(codedError("AI_PROVIDER_TIMEOUT", true)), milliseconds);
            });
            return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
          }

          function normalizeClassifierError(error) {
            if (error?.aiCode) return error;
            const message = String(error?.message || error || "");
            const status = Number(error?.status || error?.statusCode || 0);
            if (status === 429 || /rate.?limit|too many requests/i.test(message)) return codedError("AI_PROVIDER_RATE_LIMITED", true);
            if (status >= 500 || /timeout|temporar|unavailable|network|capacity/i.test(message)) return codedError("AI_PROVIDER_UNAVAILABLE", true);
            if (status >= 400 && status < 500) return codedError("AI_PROVIDER_REQUEST_REJECTED", false);
            return codedError("AI_PROVIDER_FAILED", status === 0 || status >= 500);
          }

          function structuredLength(value) {
            try { return JSON.stringify(value).length; } catch { return 0; }
          }

          function safeCode(error) {
            return String(error?.aiCode || error?.code || error?.message || "unknown")
              .replace(/[^A-Za-z0-9_.:-]/g, "_")
              .slice(0, 120) || "unknown";
          }

          function codedError(code, retryable) {
            const error = new Error(code);
            error.aiCode = code;
            error.retryable = Boolean(retryable);
            return error;
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          provider = Path('src/ai/provider.js')
          text = provider.read_text()
          old = 'import { normalizeTranslationResult } from "./validation.js";\nexport { runModerationModel } from "./provider-base.js";'
          new = 'import { normalizeTranslationResult } from "./validation.js";\nexport { runModerationModel } from "./moderation-classifier.js";'
          if old not in text:
              raise SystemExit('provider moderation export anchor not found')
          text = text.replace(old, new, 1)
          old_loop = '''  for (const candidate of candidates) {\n    try {\n      if (candidate.kind !== "dedicated") {'''
          new_loop = '''  for (const candidate of candidates) {\n    if (candidate.kind === "dedicated") {\n      const dedicatedCapacity = await acquireDedicatedTranslationCapacity(env);\n      if (!dedicatedCapacity) {\n        lastError = codedError("AI_PROVIDER_RATE_LIMITED", true);\n        continue;\n      }\n    }\n    try {\n      if (candidate.kind !== "dedicated") {'''
          if old_loop not in text:
              raise SystemExit('provider translation loop anchor not found')
          text = text.replace(old_loop, new_loop, 1)
          old_catch = '''      if ([\n        "AI_BINDING_NOT_CONFIGURED",\n        "AI_MODEL_NOT_CONFIGURED",\n        "AI_TRANSLATION_LANGUAGE_INVALID",\n        "AI_PROVIDER_RATE_LIMITED"\n      ].includes(lastError.aiCode)) {\n        throw lastError;\n      }'''
          new_catch = '''      if (lastError.aiCode === "AI_PROVIDER_RATE_LIMITED" && candidate.kind === "dedicated") {\n        continue;\n      }\n      if ([\n        "AI_BINDING_NOT_CONFIGURED",\n        "AI_MODEL_NOT_CONFIGURED",\n        "AI_TRANSLATION_LANGUAGE_INVALID",\n        "AI_PROVIDER_RATE_LIMITED"\n      ].includes(lastError.aiCode)) {\n        throw lastError;\n      }'''
          if old_catch not in text:
              raise SystemExit('provider translation catch anchor not found')
          text = text.replace(old_catch, new_catch, 1)
          anchor = 'async function acquireSharedTextGenerationCapacity(env) {'
          helper = '''async function acquireDedicatedTranslationCapacity(env) {\n  const limiter = env?.AI_TRANSLATION_RATE_LIMITER;\n  if (!limiter || typeof limiter.limit !== "function") return true;\n  try {\n    const result = await limiter.limit({ key: "workers-ai-translation" });\n    return result?.success !== false;\n  } catch (error) {\n    console.error("AI dedicated translation capacity limiter failed closed", safeCode(error));\n    return false;\n  }\n}\n\n'''
          if anchor not in text:
              raise SystemExit('provider limiter anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          provider.write_text(text)

          processor = Path('src/ai/processor.js')
          ptext = processor.read_text()
          old_capacity = '''async function acquireQueueCapacity(env, queueKind) {\n  if (queueKind !== QUEUE_KIND_TRANSLATION) return true;\n  const limiter = env?.AI_TRANSLATION_RATE_LIMITER;\n  if (!limiter || typeof limiter.limit !== "function") return true;\n  try {\n    const result = await limiter.limit({ key: `workers-ai-${queueKind}` });\n    return result?.success !== false;\n  } catch (error) {\n    console.error(`AI ${queueKind} capacity limiter failed closed`, safeCode(error));\n    return false;\n  }\n}\n'''
          new_capacity = '''async function acquireQueueCapacity(_env, _queueKind) {\n  // Capacity is provider-specific. The provider can overflow a saturated dedicated\n  // translation task into the separately limited text-generation task instead of\n  // parking the whole queue before model selection.\n  return true;\n}\n'''
          if old_capacity not in ptext:
              raise SystemExit('processor queue limiter anchor not found')
          processor.write_text(ptext.replace(old_capacity, new_capacity, 1))

          wrangler = Path('wrangler.toml')
          wtext = wrangler.read_text()
          old_comment = '''# Keep a small margin below Workers AI's default task limits. Translation-model\n# calls use the translation limiter. Text-generation translation fallbacks share\n# the moderation limiter's counter so both workloads stay under the 300 RPM task limit.'''
          new_comment = '''# Keep margins below Workers AI task limits. Dedicated translation stays below\n# the 720 RPM Translation limit. Moderation embeddings have their own 2800 RPM\n# guard below the 3000 RPM Text Embeddings limit. Text-generation overflow and\n# legacy moderation fallback share one 290 RPM guard below the 300 RPM task limit.'''
          if old_comment not in wtext:
              raise SystemExit('wrangler capacity comment anchor not found')
          wtext = wtext.replace(old_comment, new_comment, 1)
          translation_block = '''[[ratelimits]]\nname = "AI_TRANSLATION_RATE_LIMITER"\nnamespace_id = "826071905" # AI capacity namespace; separate from auth/public boundary namespaces\nsimple = { limit = 700, period = 60 }\n\n'''
          classifier_block = translation_block + '''[[ratelimits]]\nname = "AI_MODERATION_CLASSIFIER_RATE_LIMITER"\nnamespace_id = "826071907" # multilingual embedding moderation capacity\nsimple = { limit = 2800, period = 60 }\n\n'''
          if translation_block not in wtext:
              raise SystemExit('translation limiter block not found')
          wtext = wtext.replace(translation_block, classifier_block, 1)
          wtext = wtext.replace('AI_MODERATION_MODEL = "@cf/moonshotai/kimi-k2.6"', 'AI_MODERATION_CLASSIFIER_MODEL = "@cf/google/embeddinggemma-300m"\nAI_MODERATION_CLASSIFIER_TIMEOUT_MS = "5000"\nAI_MODERATION_REVIEW_MARGIN = "0.035"\nAI_MODERATION_HIDE_MARGIN = "0.12"\nAI_MODERATION_CLASSIFIER_FALLBACK = "1"\nAI_MODERATION_MODEL = "@cf/meta/llama-3.2-3b-instruct"', 1)
          wtext = wtext.replace('AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"', 'AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-3.2-3b-instruct"', 1)
          wrangler.write_text(wtext)

          test = Path('scripts/test-load-hardening.mjs')
          t = test.read_text()
          t = t.replace('import { AI_TARGET_LANGUAGES } from "../src/ai/validation.js";', 'import { AI_TARGET_LANGUAGES } from "../src/ai/validation.js";\nimport { runModerationModel } from "../src/ai/moderation-classifier.js";', 1)
          t = t.replace('const aiRepository = read("src/ai/repository.js");', 'const aiRepository = read("src/ai/repository.js");\nconst aiProvider = read("src/ai/provider.js");\nconst aiProcessor = read("src/ai/processor.js");\nconst moderationClassifier = read("src/ai/moderation-classifier.js");', 1)
          marker = 'assert.match(aiRepository, /hasChangeMetadata/);\n'
          additions = '''assert.match(aiRepository, /hasChangeMetadata/);\nassert.match(moderationClassifier, /@cf\\/google\\/embeddinggemma-300m/);\nassert.match(moderationClassifier, /AI_MODERATION_CLASSIFIER_RATE_LIMITER/);\nassert.match(aiProvider, /acquireDedicatedTranslationCapacity/);\nassert.match(aiProvider, /AI_TRANSLATION_RATE_LIMITER/);\nassert.doesNotMatch(aiProcessor, /env\\?\\.AI_TRANSLATION_RATE_LIMITER/);\nassert.match(wrangler, /name = "AI_MODERATION_CLASSIFIER_RATE_LIMITER"[\\s\\S]*limit = 2800/);\nassert.match(wrangler, /name = "AI_TRANSLATION_RATE_LIMITER"[\\s\\S]*limit = 700/);\nassert.match(wrangler, /name = "AI_MODERATION_RATE_LIMITER"[\\s\\S]*limit = 290/);\n'''
          if marker not in t:
              raise SystemExit('load-hardening marker not found')
          t = t.replace(marker, additions, 1)
          final = 'console.log("load hardening and minimal UI regression passed");\n'
          runtime_test = '''const limiter = { limit: async () => ({ success: true }) };\nlet calls = 0;\nconst mockEnv = {\n  AI_MODERATION_CLASSIFIER_MODEL: "@cf/google/embeddinggemma-300m",\n  AI_MODERATION_CLASSIFIER_RATE_LIMITER: limiter,\n  AI_MODERATION_CLASSIFIER_FALLBACK: "0",\n  AI: {\n    run: async (_model, request) => {\n      calls += 1;\n      const count = Array.isArray(request.text) ? request.text.length : 1;\n      if (count > 1) {\n        return { data: Array.from({ length: count }, (_, index) => index <= 1 ? [1, 0] : [0, 1]) };\n      }\n      return { data: [[0, 1]] };\n    }\n  }\n};\nconst safeModeration = await runModerationModel(mockEnv, { message: "Thank you for the explanation." });\nassert.equal(safeModeration.recommendation, "allow");\nassert.equal(safeModeration.model, "@cf/google/embeddinggemma-300m");\nconst unsafeModeration = await runModerationModel(mockEnv, { message: "targeted abusive message" });\nassert.equal(unsafeModeration.recommendation, "hide");\nassert.ok(unsafeModeration.categories.includes("harassment"));\nassert.equal(calls, 2);\n\nconsole.log("load hardening and minimal UI regression passed");\n'''
          if final not in t:
              raise SystemExit('load-hardening final marker not found')
          test.write_text(t.replace(final, runtime_test, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-ai-capacity-v2-20260808.yml

      - name: Install dependencies and create candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Raise AI moderation and translation capacity"
          npm run manifest:source
          git add -A
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Push verified candidate
        run: git push origin HEAD:agent/ai-capacity-v2-20260808
