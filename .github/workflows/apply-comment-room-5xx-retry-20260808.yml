name: Apply CommentRoom 5xx retry hardening 2026-08-08

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/apply-comment-room-5xx-retry-20260808.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/retry-comment-room-5xx-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/retry-comment-room-5xx-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Retry transient CommentRoom 5xx responses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/public-v2.js'); s=p.read_text()
          old='''    try {\n      return await stub.fetch("https://comment-room/message", init);\n    } catch (error) {\n      lastError = error;\n      if (attempt >= COMMENT_ROOM_RETRY_DELAYS_MS.length) throw error;\n      console.warn("CommentRoom transport retry", attempt + 1, String(error?.name || "ERROR"));\n      await new Promise((resolve) => setTimeout(resolve, COMMENT_ROOM_RETRY_DELAYS_MS[attempt]));\n    }'''
          new='''    try {\n      const response = await stub.fetch("https://comment-room/message", init);\n      if (response.status < 500 || attempt >= COMMENT_ROOM_RETRY_DELAYS_MS.length) return response;\n      console.warn("CommentRoom 5xx retry", attempt + 1, response.status);\n      await new Promise((resolve) => setTimeout(resolve, COMMENT_ROOM_RETRY_DELAYS_MS[attempt]));\n    } catch (error) {\n      lastError = error;\n      if (attempt >= COMMENT_ROOM_RETRY_DELAYS_MS.length) throw error;\n      console.warn("CommentRoom transport retry", attempt + 1, String(error?.name || "ERROR"));\n      await new Promise((resolve) => setTimeout(resolve, COMMENT_ROOM_RETRY_DELAYS_MS[attempt]));\n    }'''
          if s.count(old)!=1: raise SystemExit(f'fetch retry anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          t=Path('scripts/test-load-hardening.mjs'); x=t.read_text()
          anchor='assert.match(publicRoute, /CommentRoom transport retry/);'
          repl=anchor+'\nassert.match(publicRoute, /CommentRoom 5xx retry/);\nassert.match(publicRoute, /response\\.status < 500/);'
          if x.count(anchor)!=1: raise SystemExit('test anchor missing')
          t.write_text(x.replace(anchor,repl,1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-comment-room-5xx-retry-20260808.yml
      - name: Install and commit candidate
        shell: bash
        run: |
          npm install --global npm@11.18.0
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retry transient CommentRoom 5xx responses"
          npm run manifest:source
          git add -A
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"
      - name: Validate candidate
        shell: bash
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          node scripts/test-load-hardening.mjs
          node --no-warnings scripts/test-comments-v2.mjs
          node --no-warnings scripts/test-realtime-v2.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified candidate
        run: git push origin HEAD:agent/retry-comment-room-5xx-20260808
