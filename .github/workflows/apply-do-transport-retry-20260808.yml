name: Apply Durable Object transport retry hardening 2026-08-08

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-do-transport-retry-20260808.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/fix-do-transport-retry-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-do-transport-retry-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded retry to all CommentRoom transport throws
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/public-v2.js')
          s=p.read_text()
          old='const COMMENT_ROOM_RETRY_DELAYS_MS = Object.freeze([40, 120]);'
          new='const COMMENT_ROOM_RETRY_DELAYS_MS = Object.freeze([80, 240, 720, 1600, 3200]);'
          if s.count(old)!=1: raise SystemExit(f'retry delay anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''    } catch (error) {\n      lastError = error;\n      if (!isDurableObjectDeploymentReset(error) || attempt >= COMMENT_ROOM_RETRY_DELAYS_MS.length) throw error;\n      await new Promise((resolve) => setTimeout(resolve, COMMENT_ROOM_RETRY_DELAYS_MS[attempt]));\n    }'''
          new='''    } catch (error) {\n      lastError = error;\n      if (attempt >= COMMENT_ROOM_RETRY_DELAYS_MS.length) throw error;\n      console.warn("CommentRoom transport retry", attempt + 1, String(error?.name || "ERROR"));\n      await new Promise((resolve) => setTimeout(resolve, COMMENT_ROOM_RETRY_DELAYS_MS[attempt]));\n    }'''
          if s.count(old)!=1: raise SystemExit(f'retry catch anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''\nfunction isDurableObjectDeploymentReset(error) {\n  const message = String(error?.message || error || "");\n  return /durable object.*reset|reset.*durable object|code was updated/i.test(message);\n}\n'''
          if s.count(old)!=1: raise SystemExit(f'old reset predicate count={s.count(old)}')
          s=s.replace(old,'\n',1)
          p.write_text(s)

          t=Path('scripts/test-load-hardening.mjs')
          x=t.read_text()
          x=x.replace('assert.match(publicRoute, /COMMENT_ROOM_RETRY_DELAYS_MS = Object\\.freeze\\(\\[40, 120\\]\\)/);', 'assert.match(publicRoute, /COMMENT_ROOM_RETRY_DELAYS_MS = Object\\.freeze\\(\\[80, 240, 720, 1600, 3200\\]\\)/);')
          x=x.replace('assert.match(publicRoute, /code was updated/i);', 'assert.doesNotMatch(publicRoute, /isDurableObjectDeploymentReset/);\nassert.match(publicRoute, /CommentRoom transport retry/);')
          t.write_text(x)
          PY
      - name: Remove temporary workflow before release commit
        run: rm .github/workflows/apply-do-transport-retry-20260808.yml
      - name: Install and create candidate commit
        shell: bash
        run: |
          npm install --global npm@11.18.0
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retry transient CommentRoom transport failures"
      - name: Refresh source manifest from candidate HEAD
        shell: bash
        run: |
          npm run manifest:source
          git add -A
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"
      - name: Validate exact candidate
        shell: bash
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          node scripts/test-load-hardening.mjs
          node --no-warnings scripts/test-comments-v2.mjs
          node --no-warnings scripts/test-realtime-v2.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified release candidate
        run: git push origin HEAD:agent/fix-do-transport-retry-20260808
