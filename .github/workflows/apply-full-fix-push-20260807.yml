name: Apply full fix from branch push
run-name: Apply CPCV responsive and translation repairs

on:
  push:
    branches:
      - agent/full-responsive-layout-hardening-20260807
    paths:
      - '.github/workflows/apply-full-fix-push-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpcv-apply-full-fix-push-20260807
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-responsive-layout-hardening-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source fixes
        run: python scripts/apply-full-fix-20260807.py
      - name: Validate targeted changes and update manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          npm run test:ai-translation-resilience
          npm run test:ai-quality-ui
          npm run test:navigation-ui
          npm run manifest:source
          npm run verify:source-manifest
          npm run deploy:dry-run
          git diff --check
      - name: Commit application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public src wrangler.toml package.json scripts source-manifest.sha256
          git status --short
          git commit -m 'Fix responsive layouts and AI translation resilience'
          git push origin HEAD:agent/full-responsive-layout-hardening-20260807
