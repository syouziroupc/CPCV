name: Apply load runtime capacity fixes temporary

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-load-runtime-fixes-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-load-runtime-capacity-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact capacity-accounting fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/ai/provider-base.js')
          s = p.read_text()
          anchor = 'const DEDICATED_SOURCE_LANGUAGES = new Set(["ja", "en", "ru", "tr"]);\n'
          if 'const SHARED_TEXT_GENERATION_KEY = "workers-ai-moderation";' not in s:
              if anchor not in s: raise SystemExit('provider-base constant anchor missing')
              s = s.replace(anchor, anchor + 'const SHARED_TEXT_GENERATION_KEY = "workers-ai-moderation";\n', 1)
          head, sep, tail = s.partition('async function runWithFallback(env, models, request, validator, options = {}) {')
          if not sep: raise SystemExit('runWithFallback missing')
          if 'const capacity = await acquireSharedTextGenerationCapacity(env);' not in tail:
              needle = '    try {\n'
              if needle not in tail: raise SystemExit('runWithFallback try missing')
              tail = tail.replace(needle, needle + '      const capacity = await acquireSharedTextGenerationCapacity(env);\n      if (!capacity) throw codedError("AI_PROVIDER_RATE_LIMITED", true);\n', 1)
          if 'if (lastError.aiCode === "AI_PROVIDER_RATE_LIMITED") throw lastError;' not in tail:
              needle = '      lastError = normalizeProviderError(error);\n'
              if needle not in tail: raise SystemExit('runWithFallback error normalization missing')
              tail = tail.replace(needle, needle + '      if (lastError.aiCode === "AI_PROVIDER_RATE_LIMITED") throw lastError;\n', 1)
          s = head + sep + tail
          fn_anchor = 'function modelCandidates(env, primaryKey, fallbackKey) {'
          if 'AI moderation capacity limiter failed closed' not in s:
              if fn_anchor not in s: raise SystemExit('modelCandidates missing')
              helper = '''async function acquireSharedTextGenerationCapacity(env) {
            const limiter = env?.AI_MODERATION_RATE_LIMITER;
            if (!limiter || typeof limiter.limit !== "function") return true;
            try {
              const result = await limiter.limit({ key: SHARED_TEXT_GENERATION_KEY });
              return result?.success !== false;
            } catch {
              console.error("AI moderation capacity limiter failed closed");
              return false;
            }
          }

          '''
              s = s.replace(fn_anchor, helper + fn_anchor, 1)
          p.write_text(s)

          p = Path('src/ai/provider.js')
          s = p.read_text()
          if 'AI text-generation capacity limiter failed closed' not in s:
              needle = 'console.error("AI text-generation capacity limiter failed open", safeCode(error));\n    return true;'
              if needle not in s: raise SystemExit('translation limiter fail-open block missing')
              s = s.replace(needle, 'console.error("AI text-generation capacity limiter failed closed", safeCode(error));\n    return false;', 1)
          p.write_text(s)

          p = Path('src/ai/processor.js')
          s = p.read_text()
          if 'if (queueKind !== QUEUE_KIND_TRANSLATION) return true;' not in s:
              start = s.index('async function acquireQueueCapacity(env, queueKind) {')
              end = s.index('\nfunction capacityRetryDelaySeconds(queueKind) {', start)
              replacement = '''async function acquireQueueCapacity(env, queueKind) {
            if (queueKind !== QUEUE_KIND_TRANSLATION) return true;
            const limiter = env?.AI_TRANSLATION_RATE_LIMITER;
            if (!limiter || typeof limiter.limit !== "function") return true;
            try {
              const result = await limiter.limit({ key: `workers-ai-${queueKind}` });
              return result?.success !== false;
            } catch (error) {
              console.error(`AI ${queueKind} capacity limiter failed closed`, safeCode(error));
              return false;
            }
          }
          '''
              s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('scripts/test-ai-translation-resilience.mjs')
          s = p.read_text()
          old_import = 'import assert from "node:assert/strict";\nimport { runTranslationModel } from "../src/ai/provider.js";'
          new_import = 'import assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\nimport { runModerationModel, runTranslationModel } from "../src/ai/provider.js";'
          if old_import in s: s = s.replace(old_import, new_import, 1)
          call_anchor = 'await provider429DoesNotAmplifyIntoFallbackCalls();\nconsole.log("AI translation resilience tests passed");'
          if 'await moderationFallbackConsumesCapacityPerProviderCall();' not in s:
              if call_anchor not in s: raise SystemExit('test call anchor missing')
              s = s.replace(call_anchor, '''await provider429DoesNotAmplifyIntoFallbackCalls();
          await translationLimiterFailureFailsClosed();
          await moderationFallbackConsumesCapacityPerProviderCall();
          await moderationLimiterFailureFailsClosed();
          moderationIsNotDoubleCountedAtQueueAdmission();
          console.log("AI capacity and translation resilience tests passed");''', 1)
          insert_anchor = '\nfunction environment(run, limitCalls = [], capacity = true) {'
          if 'async function moderationFallbackConsumesCapacityPerProviderCall()' not in s:
              if insert_anchor not in s: raise SystemExit('test insert anchor missing')
              tests = r'''

          async function translationLimiterFailureFailsClosed() {
            let aiCalls = 0;
            const env = environment(async () => { aiCalls += 1; return { response: "unexpected" }; });
            env.AI_MODERATION_RATE_LIMITER.limit = async () => { throw new Error("limiter unavailable"); };
            await assert.rejects(
              runTranslationModel(env, { message: "Capacity control must fail closed.", sourceLanguage: "other", targetLanguage: "ja", quality: "balanced" }),
              (error) => error?.aiCode === "AI_PROVIDER_RATE_LIMITED" && error?.retryable === true
            );
            assert.equal(aiCalls, 0);
          }

          async function moderationFallbackConsumesCapacityPerProviderCall() {
            const models = [];
            const limits = [];
            const env = moderationEnvironment(async (model) => {
              models.push(model);
              if (model === GLM) { const error = new Error("temporary model outage"); error.status = 503; throw error; }
              return { recommendation: "allow", confidence: 0.97, categories: [] };
            }, limits);
            const result = await runModerationModel(env, { message: "Ordinary classroom comment.", dictionaryCandidates: [] });
            assert.equal(result.recommendation, "allow");
            assert.deepEqual(models, [GLM, QWEN]);
            assert.deepEqual(limits, ["workers-ai-moderation", "workers-ai-moderation"]);
          }

          async function moderationLimiterFailureFailsClosed() {
            let aiCalls = 0;
            const limits = [];
            const env = moderationEnvironment(async () => { aiCalls += 1; return { recommendation: "allow", confidence: 1, categories: [] }; }, limits);
            env.AI_MODERATION_RATE_LIMITER.limit = async ({ key }) => { limits.push(key); throw new Error("limiter unavailable"); };
            await assert.rejects(
              runModerationModel(env, { message: "Limiter failure check.", dictionaryCandidates: [] }),
              (error) => error?.aiCode === "AI_PROVIDER_RATE_LIMITED" && error?.retryable === true
            );
            assert.equal(aiCalls, 0);
            assert.deepEqual(limits, ["workers-ai-moderation"]);
          }

          function moderationIsNotDoubleCountedAtQueueAdmission() {
            const processor = readFileSync(new URL("../src/ai/processor.js", import.meta.url), "utf8");
            assert.match(processor, /if \(queueKind !== QUEUE_KIND_TRANSLATION\) return true;/);
          }

          function moderationEnvironment(run, limitCalls = []) {
            return {
              AI: { run },
              AI_MODERATION_RATE_LIMITER: { async limit({ key }) { limitCalls.push(key); return { success: true }; } },
              AI_MODERATION_MODEL: GLM,
              AI_MODERATION_FALLBACK_MODEL: QWEN,
              AI_TIMEOUT_MS: "12000"
            };
          }
          '''
              s = s.replace(insert_anchor, tests + insert_anchor, 1)
          p.write_text(s)
          PY
          node --check src/ai/provider-base.js
          node --check src/ai/provider.js
          node --check src/ai/processor.js
          node --check scripts/test-ai-translation-resilience.mjs
          node scripts/test-ai-translation-resilience.mjs
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "cpcv-runtime-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai/provider-base.js src/ai/provider.js src/ai/processor.js scripts/test-ai-translation-resilience.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Account AI capacity per provider call"
          git push origin HEAD:agent/fix-load-runtime-capacity-20260807
