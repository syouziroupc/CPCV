name: Finalize load runtime capacity fixes temporary

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-load-runtime-fixes-temporary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-load-runtime-capacity-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify fixes and update signed source manifest
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-ai-translation-resilience.mjs
          node --check src/ai/provider-base.js
          node --check src/ai/provider.js
          node --check src/ai/processor.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = [
            'scripts/test-ai-translation-resilience.mjs',
            'src/ai/provider-base.js',
            'src/ai/provider.js',
            'src/ai/processor.js',
          ]
          path = Path('SOURCE_SHA256SUMS.override.txt')
          entries = {}
          order = []
          for line in path.read_text().splitlines():
              if not line: continue
              digest, name = line.split('  ', 1)
              entries[name] = digest
              order.append(name)
          for name in files:
              entries[name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              if name not in order: order.append(name)
          order = sorted(set(order))
          path.write_text('\n'.join(f'{entries[name]}  {name}' for name in order) + '\n')
          PY
          git rm .github/workflows/apply-load-runtime-fixes-temporary.yml
          git config user.name "cpcv-runtime-fix"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_SHA256SUMS.override.txt
          git commit -m "Finalize AI capacity hardening"
          git push origin HEAD:agent/fix-load-runtime-capacity-20260807
