name: Apply posting throughput fixes temporary

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-posting-throughput-fixes-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-posting-d1-throughput-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Skip policy and dictionary reads when filtering is disabled
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('src/content-filter/repository.js')
          s = p.read_text()

          old = '''export async function evaluateCommentFilter(db, input) {
            const context = await getFilterContext(db, input.organizationId, input.liveSessionId);
            const language = detectCommentLanguage(input.message);'''
          new = '''export async function evaluateCommentFilter(db, input) {
            const settingsRow = await getSessionFilterSettingsRow(db, input.organizationId, input.liveSessionId);
            const settings = settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings();
            const context = settings.enabled
              ? await getFilterContext(db, input.organizationId, input.liveSessionId, { settingsRow })
              : { settings, policies: [], terms: [], version: Date.parse(settingsRow?.updated_at || "") || 1 };
            const language = detectCommentLanguage(input.message);'''
          if old not in s: raise SystemExit('evaluateCommentFilter anchor missing')
          s = s.replace(old, new, 1)

          start = s.index('export async function evaluateTranslationFilter(db, input) {')
          end = s.index('\nexport async function getFilterContext(', start)
          translation = '''export async function evaluateTranslationFilter(db, input) {
            const settingsRow = await getSessionFilterSettingsRow(db, input.organizationId, input.liveSessionId);
            const settings = settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings();
            if (!settings.translationFilterEnabled) {
              return {
                enabled: false,
                action: "allow",
                displayMessage: null,
                aiRequired: false,
                ambiguous: false,
                requiresReview: false,
                version: 0,
                matches: []
              };
            }
            const context = await getFilterContext(db, input.organizationId, input.liveSessionId, {
              languageCodes: [input.targetLanguage, "und"],
              settingsRow
            });
            const decision = evaluateFilterMessage(input.translatedText, context);
            return {
              ...decision,
              requiresReview: decision.action === "review"
            };
          }
          '''
          s = s[:start] + translation + s[end:]

          start = s.index('export async function getFilterContext(db, organizationId, liveSessionId, options = {}) {')
          settings_select_end = s.index('  const policiesResult = await db.prepare(', start)
          prefix = '''export async function getFilterContext(db, organizationId, liveSessionId, options = {}) {
            const settingsRow = Object.prototype.hasOwnProperty.call(options, "settingsRow")
              ? options.settingsRow
              : await getSessionFilterSettingsRow(db, organizationId, liveSessionId);
          '''
          s = s[:start] + prefix + s[settings_select_end:]

          old_default = '''    settings: settingsRow ? sessionSettingsResponse(settingsRow) : {
                enabled: false,
                aiRoutingMode: "ambiguous",
                maskCharacter: "＊",
                translationFilterEnabled: true,
                unsupportedLanguageMode: "ai_review"
              },'''
          if old_default not in s: raise SystemExit('default settings block missing')
          s = s.replace(old_default, '    settings: settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings(),', 1)

          anchor = '\nexport async function listOrganizationFilter(db, organizationId) {'
          helpers = '''
          async function getSessionFilterSettingsRow(db, organizationId, liveSessionId) {
            return db.prepare(
              `SELECT enabled, ai_routing_mode, mask_character,
                      COALESCE(translation_filter_enabled, 1) AS translation_filter_enabled,
                      COALESCE(unsupported_language_mode, 'ai_review') AS unsupported_language_mode,
                      updated_at
               FROM session_content_filter_settings
               WHERE organization_id = ?1 AND live_session_id = ?2 LIMIT 1`
            ).bind(organizationId, liveSessionId).first();
          }

          function defaultSessionFilterSettings() {
            return {
              enabled: false,
              aiRoutingMode: "ambiguous",
              maskCharacter: "＊",
              translationFilterEnabled: true,
              unsupportedLanguageMode: "ai_review"
            };
          }
          '''
          if anchor not in s: raise SystemExit('filter helper insertion anchor missing')
          s = s.replace(anchor, helpers + anchor, 1)
          p.write_text(s)

          p = Path('scripts/test-content-filter-v2.mjs')
          t = p.read_text()
          if 'await testDisabledFilterFastPath();' not in t:
              t = t.replace('async function main() {\n  const h = createHarness();', 'async function main() {\n  await testDisabledFilterFastPath();\n  const h = createHarness();', 1)
              anchor = '\nasync function testSchema(h) {'
              test = r'''

          async function testDisabledFilterFastPath() {
            const queries = [];
            const db = {
              prepare(sql) {
                queries.push(sql);
                if (/organization_content_filter_policies|content_filter_terms/.test(sql)) {
                  throw new Error("disabled filter performed an unnecessary policy or dictionary query");
                }
                return {
                  bind() { return this; },
                  async first() {
                    return {
                      enabled: 0,
                      ai_routing_mode: "ambiguous",
                      mask_character: "＊",
                      translation_filter_enabled: 1,
                      unsupported_language_mode: "ai_review",
                      updated_at: "2026-08-07T00:00:00.000Z"
                    };
                  }
                };
              }
            };
            const decision = await evaluateCommentFilter(db, {
              organizationId: "org_fast",
              liveSessionId: "sess_fast",
              message: "ordinary classroom comment"
            });
            check("disabled filter skips policy and dictionary reads", decision.action === "allow" && queries.length === 1, { decision, queries });
          }
          '''
              if anchor not in t: raise SystemExit('content filter test anchor missing')
              t = t.replace(anchor, test + anchor, 1)
          p.write_text(t)
          PY
          node --check src/content-filter/repository.js
          node --check scripts/test-content-filter-v2.mjs
          node scripts/test-content-filter-v2.mjs
          node scripts/test-comments-v2.mjs
          npm run check:stage08
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changed = ['src/content-filter/repository.js','scripts/test-content-filter-v2.mjs']
          path = Path('SOURCE_SHA256SUMS.override.txt')
          entries = {}
          for line in path.read_text().splitlines():
              if not line: continue
              digest, name = line.split('  ',1)
              entries[name] = digest
          for name in changed:
              entries[name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          path.write_text('\n'.join(f'{entries[name]}  {name}' for name in sorted(entries)) + '\n')
          PY
          git rm .github/workflows/apply-posting-throughput-fixes-temporary.yml
          git config user.name "cpcv-throughput-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/content-filter/repository.js scripts/test-content-filter-v2.mjs SOURCE_SHA256SUMS.override.txt
          git commit -m "Skip disabled filter dictionary reads"
          git push origin HEAD:agent/fix-posting-d1-throughput-20260807
