name: Apply posting throughput fixes temporary

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-posting-throughput-fixes-temporary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-posting-d1-throughput-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch measured hot paths and validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          # 1) Disabled filtering needs only the session setting row. Do not load the
          # organization policy table and up to 2000 dictionary terms per comment.
          p = Path('src/content-filter/repository.js')
          s = p.read_text()
          old = '''export async function evaluateCommentFilter(db, input) {
            const context = await getFilterContext(db, input.organizationId, input.liveSessionId);
            const language = detectCommentLanguage(input.message);'''
          new = '''export async function evaluateCommentFilter(db, input) {
            const settingsRow = await getSessionFilterSettingsRow(db, input.organizationId, input.liveSessionId);
            const settings = settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings();
            const context = settings.enabled
              ? await getFilterContext(db, input.organizationId, input.liveSessionId, { settingsRow })
              : { settings, policies: [], terms: [], version: Date.parse(settingsRow?.updated_at || "") || 1 };
            const language = detectCommentLanguage(input.message);'''
          if 'const settingsRow = await getSessionFilterSettingsRow' not in s:
              if old not in s: raise SystemExit('evaluateCommentFilter anchor missing')
              s = s.replace(old, new, 1)

          old = '''export async function evaluateTranslationFilter(db, input) {
            const context = await getFilterContext(db, input.organizationId, input.liveSessionId, {
              languageCodes: [input.targetLanguage, "und"]
            });
            if (!context.settings.translationFilterEnabled) {'''
          new = '''export async function evaluateTranslationFilter(db, input) {
            const settingsRow = await getSessionFilterSettingsRow(db, input.organizationId, input.liveSessionId);
            const settings = settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings();
            if (!settings.translationFilterEnabled) {'''
          if 'const settings = settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings();\n  if (!settings.translationFilterEnabled)' not in s:
              if old not in s: raise SystemExit('evaluateTranslationFilter anchor missing')
              s = s.replace(old, new, 1)
              end_anchor = '''      matches: []
            };
          }
          const decision = evaluateFilterMessage(input.translatedText, context);'''
              end_new = '''      matches: []
            };
          }
          const context = await getFilterContext(db, input.organizationId, input.liveSessionId, {
            languageCodes: [input.targetLanguage, "und"],
            settingsRow
          });
          const decision = evaluateFilterMessage(input.translatedText, context);'''
              if end_anchor not in s: raise SystemExit('translation context insert anchor missing')
              s = s.replace(end_anchor, end_new, 1)

          old = '''export async function getFilterContext(db, organizationId, liveSessionId, options = {}) {
            const settingsRow = await db.prepare(
              `SELECT enabled, ai_routing_mode, mask_character,
                      COALESCE(translation_filter_enabled, 1) AS translation_filter_enabled,
                      COALESCE(unsupported_language_mode, 'ai_review') AS unsupported_language_mode,
                      updated_at
               FROM session_content_filter_settings
               WHERE organization_id = ?1 AND live_session_id = ?2 LIMIT 1`
            ).bind(organizationId, liveSessionId).first();'''
          new = '''export async function getFilterContext(db, organizationId, liveSessionId, options = {}) {
            const settingsRow = Object.prototype.hasOwnProperty.call(options, "settingsRow")
              ? options.settingsRow
              : await getSessionFilterSettingsRow(db, organizationId, liveSessionId);'''
          if 'Object.prototype.hasOwnProperty.call(options, "settingsRow")' not in s:
              if old not in s: raise SystemExit('getFilterContext settings anchor missing')
              s = s.replace(old, new, 1)

          old_default = '''    settings: settingsRow ? sessionSettingsResponse(settingsRow) : {
                enabled: false,
                aiRoutingMode: "ambiguous",
                maskCharacter: "＊",
                translationFilterEnabled: true,
                unsupportedLanguageMode: "ai_review"
              },'''
          new_default = '''    settings: settingsRow ? sessionSettingsResponse(settingsRow) : defaultSessionFilterSettings(),'''
          if old_default in s: s = s.replace(old_default, new_default, 1)

          helper_anchor = '\nexport async function listOrganizationFilter(db, organizationId) {'
          if 'async function getSessionFilterSettingsRow(db, organizationId, liveSessionId)' not in s:
              helpers = '''
          async function getSessionFilterSettingsRow(db, organizationId, liveSessionId) {
            return db.prepare(
              `SELECT enabled, ai_routing_mode, mask_character,
                      COALESCE(translation_filter_enabled, 1) AS translation_filter_enabled,
                      COALESCE(unsupported_language_mode, 'ai_review') AS unsupported_language_mode,
                      updated_at
               FROM session_content_filter_settings
               WHERE organization_id = ?1 AND live_session_id = ?2 LIMIT 1`
            ).bind(organizationId, liveSessionId).first();
          }

          function defaultSessionFilterSettings() {
            return {
              enabled: false,
              aiRoutingMode: "ambiguous",
              maskCharacter: "＊",
              translationFilterEnabled: true,
              unsupportedLanguageMode: "ai_review"
            };
          }
          '''
              if helper_anchor not in s: raise SystemExit('filter helper anchor missing')
              s = s.replace(helper_anchor, helpers + helper_anchor, 1)
          p.write_text(s)

          # 2) New idempotency keys currently do DELETE + duplicate SELECT + conflict SELECT.
          # Replace the normal path with one lookup. Expired collisions still delete lazily.
          p = Path('src/comments/repository.js')
          s = p.read_text()
          old = '''  await releaseExpiredIdempotencyKey(db, input.liveSessionId, input.idempotencyKey, nowIso);
            const existing = await findCommentByIdempotency(
              db,
              input.liveSessionId,
              input.idempotencyKey,
              input.participantTokenHash,
              nowIso
            );
            if (existing) return { comment: commentResponse(existing), duplicate: true };
            if (await activeIdempotencyKeyExists(db, input.liveSessionId, input.idempotencyKey, nowIso)) {
              throw new AuthError(409, "IDEMPOTENCY_KEY_CONFLICT");
            }'''
          new = '''  const existingKey = await findIdempotencyRecord(
              db,
              input.liveSessionId,
              input.idempotencyKey,
              input.participantTokenHash
            );
            if (existingKey) {
              if (Date.parse(existingKey.retained_until) <= now.getTime()) {
                await db.prepare(
                  `DELETE FROM comments WHERE id = ?1 AND retained_until <= ?2`
                ).bind(existingKey.id, nowIso).run();
              } else if (existingKey.participant_matches) {
                return { comment: commentResponse(existingKey), duplicate: true };
              } else {
                throw new AuthError(409, "IDEMPOTENCY_KEY_CONFLICT");
              }
            }'''
          if 'const existingKey = await findIdempotencyRecord' not in s:
              if old not in s: raise SystemExit('idempotency preflight anchor missing')
              s = s.replace(old, new, 1)

          helper_anchor = '\nasync function findCommentByIdempotency(db, liveSessionId, key, participantTokenHash, nowIso) {'
          if 'async function findIdempotencyRecord(db, liveSessionId, key, participantTokenHash)' not in s:
              helper = '''
          async function findIdempotencyRecord(db, liveSessionId, key, participantTokenHash) {
            const pdfPageSelect = await pdfPageSelectExpression(db, "c");
            return db.prepare(
              `SELECT c.id, c.nickname, c.message, c.display_message, c.message_length, c.moderation_state,
                      c.filter_action, c.filter_ai_required, c.filter_version,
                      c.detected_language, c.language_confidence_milli, c.unsupported_language,
                      c.created_at, c.updated_at, c.retained_until, c.deleted_at,
                      ${pdfPageSelect} AS pdf_page_number,
                      CASE WHEN p.token_hash = ?3 THEN 1 ELSE 0 END AS participant_matches
               FROM comments c
               LEFT JOIN participants p ON p.id = c.participant_id
               WHERE c.live_session_id = ?1 AND c.idempotency_key = ?2
               LIMIT 1`
            ).bind(liveSessionId, key, participantTokenHash).first();
          }
          '''
              if helper_anchor not in s: raise SystemExit('comments helper anchor missing')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          # Unconditional delete helper is no longer part of the hot path.
          start_text = '\nasync function releaseExpiredIdempotencyKey(db, liveSessionId, key, nowIso) {'
          if start_text in s:
              start = s.index(start_text)
              end = s.index('\nasync function findCommentById(db, id) {', start)
              s = s[:start] + '\n' + s[end:]
          p.write_text(s)

          # Add a focused regression proving the disabled filter does not touch policy/term tables.
          p = Path('scripts/test-content-filter-v2.mjs')
          s = p.read_text()
          if 'await testDisabledFilterFastPath();' not in s:
              s = s.replace('async function main() {\n  const h = createHarness();', 'async function main() {\n  await testDisabledFilterFastPath();\n  const h = createHarness();', 1)
              anchor = '\nasync function testSchema(h) {'
              test = r'''

          async function testDisabledFilterFastPath() {
            const queries = [];
            const db = {
              prepare(sql) {
                queries.push(sql);
                if (/organization_content_filter_policies|content_filter_terms/.test(sql)) {
                  throw new Error("disabled filter performed an unnecessary dictionary/policy query");
                }
                return {
                  bind() { return this; },
                  async first() {
                    return {
                      enabled: 0,
                      ai_routing_mode: "ambiguous",
                      mask_character: "＊",
                      translation_filter_enabled: 1,
                      unsupported_language_mode: "ai_review",
                      updated_at: "2026-08-07T00:00:00.000Z"
                    };
                  }
                };
              }
            };
            const decision = await evaluateCommentFilter(db, {
              organizationId: "org_fast",
              liveSessionId: "sess_fast",
              message: "ordinary classroom comment"
            });
            check("disabled filter skips policy and dictionary reads", decision.action === "allow" && queries.length === 1, { decision, queries });
          }
          '''
              if anchor not in s: raise SystemExit('content filter test anchor missing')
              s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)

          for path in ['src/content-filter/repository.js','src/comments/repository.js','scripts/test-content-filter-v2.mjs']:
              data = Path(path).read_text()
              if '\r' in data: raise SystemExit(f'CRLF unexpectedly introduced: {path}')
          PY
          node --check src/content-filter/repository.js
          node --check src/comments/repository.js
          node --check scripts/test-content-filter-v2.mjs
          node scripts/test-content-filter-v2.mjs
          node scripts/test-comments-v2.mjs
          npm run check:stage08
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changed = ['src/content-filter/repository.js','src/comments/repository.js','scripts/test-content-filter-v2.mjs']
          path = Path('SOURCE_SHA256SUMS.override.txt')
          entries = {}
          for line in path.read_text().splitlines():
              if not line: continue
              digest, name = line.split('  ',1)
              entries[name] = digest
          for name in changed:
              entries[name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          path.write_text('\n'.join(f'{entries[name]}  {name}' for name in sorted(entries)) + '\n')
          PY
          git rm .github/workflows/apply-posting-throughput-fixes-temporary.yml
          git config user.name "cpcv-throughput-fix"
          git config user.email "actions@users.noreply.github.com"
          git add src/content-filter/repository.js src/comments/repository.js scripts/test-content-filter-v2.mjs SOURCE_SHA256SUMS.override.txt
          git commit -m "Reduce posting D1 round trips"
          git push origin HEAD:agent/fix-posting-d1-throughput-20260807
