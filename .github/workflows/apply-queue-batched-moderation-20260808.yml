name: Apply final AI capacity patch 2026-08-08

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-queue-batched-moderation-20260808.yml
      - scripts/finalize-ai-capacity-20260808.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ai-capacity-v2-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-capacity-v2-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize-ai-capacity-20260808.py
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/test-ai-translation-resilience.mjs')
          s=p.read_text().replace('workers-ai-moderation','workers-ai-text-generation')
          old='''function moderationIsNotDoubleCountedAtQueueAdmission() {\n  const processor = readFileSync(new URL("../src/ai/processor.js", import.meta.url), "utf8");\n  assert.match(processor, /if \\(queueKind !== QUEUE_KIND_TRANSLATION\\) return true;/);\n}'''
          new='''function moderationIsNotDoubleCountedAtQueueAdmission() {\n  const processor = readFileSync(new URL("../src/ai/processor.js", import.meta.url), "utf8");\n  assert.doesNotMatch(processor, /AI_TRANSLATION_RATE_LIMITER|acquireQueueCapacity/);\n  assert.match(processor, /processModerationQueueBatch/);\n}'''
          if old not in s: raise SystemExit('obsolete queue admission test anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('assert.match(wranglerSource, /AI_MODERATION_MODEL_BATCH_SIZE = "20"/);\n','')
          s=s.replace('assert.match(wranglerSource, /AI_MODERATION_BATCH_WINDOW_MS = "8"/);\n','')
          insert='''assert.match(wranglerSource, /queue = "cpcv-ai-moderation-jobs"[\\s\\S]*?max_batch_size = 20[\\s\\S]*?max_batch_timeout = 1/);\n'''
          anchor='''assert.match(wranglerSource, /AI_MODERATION_CLASSIFIER_MODEL = "@cf\\/baai\\/bge-reranker-base"/);\n'''
          if anchor not in s: raise SystemExit('classifier wrangler assertion anchor missing')
          s=s.replace(anchor,anchor+insert,1)
          p.write_text(s)

          p=Path('scripts/verify-ai-readiness.mjs')
          s=p.read_text()
          old='''const producer = arrayBlock(config, "queues.producers", "binding", "AI_JOBS_QUEUE");\nconst producerQueue = producer.match(/^queue\\s*=\\s*"([^"]+)"\\s*$/m)?.[1] || "";\nconst consumer = [...config.matchAll(/\\[\\[queues\\.consumers\\]\\]([\\s\\S]*?)(?=\\n\\[\\[|\\n\\[[^\\[]|$)/g)]\n  .map((match) => match[0])\n  .find((block) => /^queue\\s*=\\s*"([^"]+)"\\s*$/m.test(block)) || "";\nconst consumerQueue = consumer.match(/^queue\\s*=\\s*"([^"]+)"\\s*$/m)?.[1] || "";\nif (!producerQueue) failures.push("AI queue producer is missing.");\nif (!consumerQueue) failures.push("AI queue consumer is missing.");\nif (producerQueue && consumerQueue && producerQueue !== consumerQueue) failures.push("AI queue producer and consumer must use the same queue.");\n'''
          new='''const requiredQueues = ["AI_TRANSLATION_QUEUE", "AI_MODERATION_QUEUE"];\nconst queueNames = [];\nfor (const binding of requiredQueues) {\n  const producer = arrayBlock(config, "queues.producers", "binding", binding);\n  const producerQueue = producer.match(/^queue\\s*=\\s*"([^"]+)"\\s*$/m)?.[1] || "";\n  const consumerQueue = [...config.matchAll(/\\[\\[queues\\.consumers\\]\\]([\\s\\S]*?)(?=\\n\\[\\[|\\n\\[[^\\[]|$)/g)]\n    .map((match) => match[0])\n    .map((block) => block.match(/^queue\\s*=\\s*"([^"]+)"\\s*$/m)?.[1] || "")\n    .find((queue) => queue === producerQueue) || "";\n  if (!producerQueue) failures.push(`${binding} producer is missing.`);\n  if (!consumerQueue) failures.push(`${binding} consumer is missing.`);\n  if (producerQueue) queueNames.push(producerQueue);\n}\nif (new Set(queueNames).size !== queueNames.length) failures.push("AI queue bindings must use distinct queues.");\n'''
          if old not in s: raise SystemExit('verify-ai-readiness legacy queue anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('for (const name of ["AI_MODERATION_MODEL", "AI_TRANSLATION_MODEL"]) {', 'for (const name of ["AI_MODERATION_CLASSIFIER_MODEL", "AI_TRANSLATION_MODEL"]) {',1)
          s=s.replace('console.log(`AI configuration is structurally ready. Verify remote queue ${producerQueue} and apply DB_V2 migration 0010 before cutover.`);', 'console.log(`AI configuration is structurally ready. Verify remote queues ${queueNames.join(", ")} and apply DB_V2 migration 0010 before cutover.`);',1)
          p.write_text(s)

          p=Path('scripts/verify-environment-separation.mjs')
          s=p.read_text()
          s=s.replace('const knownProduction = { worker: "class-pdf-comment-viewer-v01", legacyDbId: "f11457fa-27af-468d-94cc-6cdf1ae814e4", queue: "cpcv-ai-jobs" };', 'const knownProduction = { worker: "class-pdf-comment-viewer-v01", legacyDbId: "f11457fa-27af-468d-94cc-6cdf1ae814e4", queues: { AI_TRANSLATION_QUEUE: "cpcv-ai-translation-jobs", AI_MODERATION_QUEUE: "cpcv-ai-moderation-jobs" } };',1)
          old='''const stageQueue = queue(staging); required("staging queue producer", stageQueue.producer); if (stageQueue.producer !== stageQueue.consumer) failures.push("Staging queue producer and consumer must match."); different("known production Queue", knownProduction.queue, stageQueue.producer);'''
          new='''for (const binding of ["AI_TRANSLATION_QUEUE", "AI_MODERATION_QUEUE"]) {\n  const prodQueue = queue(production, binding), stageQueue = queue(staging, binding);\n  required(`staging ${binding} producer`, stageQueue.producer);\n  required(`staging ${binding} consumer`, stageQueue.consumer);\n  if (stageQueue.producer && stageQueue.producer !== stageQueue.consumer) failures.push(`Staging ${binding} producer and consumer must match.`);\n  different(`known production ${binding}`, knownProduction.queues[binding], stageQueue.producer);\n  if (mode === "production-gate") {\n    required(`production ${binding} producer`, prodQueue.producer);\n    required(`production ${binding} consumer`, prodQueue.consumer);\n    if (prodQueue.producer && prodQueue.producer !== prodQueue.consumer) failures.push(`Production ${binding} producer and consumer must match.`);\n  }\n  different(`${binding} queue`, prodQueue.producer, stageQueue.producer);\n}'''
          if old not in s: raise SystemExit('environment queue anchor missing')
          s=s.replace(old,new,1)
          old='''function queue(t) { return { producer: value(block(t, "queues.producers", "binding", "AI_JOBS_QUEUE"), "queue"), consumer: value((t.match(/\\[\\[queues\\.consumers\\]\\]([\\s\\S]*?)(?=\\n\\[\\[|\\n\\[[^\\[]|$)/) || [])[0] || "", "queue") }; }\nfunction limiterIds(t) { return ["AUTH_LOGIN_IP_LIMITER", "AUTH_LOGIN_ACCOUNT_LIMITER", "PUBLIC_COMMENT_RATE_LIMITER", "AUTH_PUBLIC_EMAIL_LIMITER"].map((n) => value(block(t, "ratelimits", "name", n), "namespace_id")); }'''
          new='''function queue(t, binding) {\n  const producer = value(block(t, "queues.producers", "binding", binding), "queue");\n  const consumer = [...t.matchAll(/\\[\\[queues\\.consumers\\]\\]([\\s\\S]*?)(?=\\n\\[\\[|\\n\\[[^\\[]|$)/g)]\n    .map((m) => value(m[0], "queue"))\n    .find((name) => name === producer) || "";\n  return { producer, consumer };\n}\nfunction limiterIds(t) { return [...t.matchAll(/\\[\\[ratelimits\\]\\]([\\s\\S]*?)(?=\\n\\[\\[|\\n\\[[^\\[]|$)/g)].map((m) => value(m[0], "namespace_id")).filter(Boolean); }'''
          if old not in s: raise SystemExit('environment queue helper anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('scripts/test-deployment-verifiers.mjs')
          s=p.read_text()
          s=s.replace('.replaceAll(\'queue = "cpcv-ai-jobs"\', \'queue = "cpcv-ai-jobs-staging"\')', '.replaceAll(\'queue = "cpcv-ai-translation-jobs"\', \'queue = "cpcv-ai-translation-jobs-staging"\')\n    .replaceAll(\'queue = "cpcv-ai-moderation-jobs"\', \'queue = "cpcv-ai-moderation-jobs-staging"\')',1)
          anchor='''.replace('namespace_id = "826071904"', 'namespace_id = "826071804"');'''
          replacement='''.replace('namespace_id = "826071904"', 'namespace_id = "826071804"')\n    .replace('namespace_id = "826071906"', 'namespace_id = "826071806"')\n    .replace('namespace_id = "826071907"', 'namespace_id = "826071807"')\n    .replace('namespace_id = "826071908"', 'namespace_id = "826071808"');'''
          if anchor not in s: raise SystemExit('staging namespace fixture anchor missing')
          s=s.replace(anchor,replacement,1)
          old='''check("AI readiness accepts a separated staging queue", stagingAiTarget.status === 0 && stagingAiTarget.stdout.includes("cpcv-ai-jobs-staging"), stagingAiTarget);'''
          new='''check("AI readiness accepts separated staging queues", stagingAiTarget.status === 0 && stagingAiTarget.stdout.includes("cpcv-ai-translation-jobs-staging") && stagingAiTarget.stdout.includes("cpcv-ai-moderation-jobs-staging"), stagingAiTarget);'''
          if old not in s: raise SystemExit('staging AI readiness fixture anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Remove operational patch files and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/finalize-ai-capacity-20260808.py
          rm .github/workflows/apply-queue-batched-moderation-20260808.yml
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize high-throughput AI runtime"
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"

      - name: Validate exact candidate before push
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          node scripts/test-ai-translation-resilience.mjs
          node scripts/test-load-hardening.mjs
          node scripts/test-ai-runtime-cleanup.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Push verified candidate
        run: git push origin HEAD:agent/ai-capacity-v2-20260808
