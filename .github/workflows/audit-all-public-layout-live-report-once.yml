name: Audit all public layouts and report once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/audit-all-public-layout-live-report-once.yml"

permissions:
  contents: read
  issues: write

env:
  ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.12"
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
      - name: Capture and audit all public/auth-entry pages
        shell: bash
        run: |
          mkdir -p all-layout-evidence/screenshots
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageOps, ImageDraw

          origin='https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'
          pages=[('home','/'),('about','/about'),('guide','/guide'),('privacy','/privacy'),('admin','/admin'),('signup','/signup'),('forgot','/forgot-password'),('check-email','/check-email'),('verify-email','/verify-email'),('reset-password','/reset-password'),('accept-invitation','/accept-invitation'),('confirm-email-change','/confirm-email-change'),('account','/account'),('master','/master')]
          widths=[390,768,1024,1440]
          heights={390:844,768:1024,1024:900,1440:1000}
          out=Path('all-layout-evidence/screenshots')
          records=[]; hard=[]; warnings=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for name,path in pages:
              for width in widths:
                page=browser.new_page(viewport={'width':width,'height':heights[width]},device_scale_factor=1)
                response=page.goto(origin+path+f'?all_audit={width}',wait_until='networkidle',timeout=60000)
                page.wait_for_timeout(300)
                page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                status=response.status if response else 0
                data=page.evaluate('''() => {
                  const W=innerWidth, root=document.documentElement;
                  const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&parseFloat(s.opacity||'1')>0&&r.width>0&&r.height>0};
                  const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,right:r.right,y:r.y,width:r.width,height:r.height}};
                  const lines=el=>{const a=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())for(let i=0;i<n.data.length;i++){const c=n.data[i];if(/\\s/.test(c))continue;const q=document.createRange();q.setStart(n,i);q.setEnd(n,i+1);const rs=[...q.getClientRects()].filter(r=>r.width>0&&r.height>0);if(!rs.length)continue;const t=Math.round(rs[0].top*2)/2;let z=a.find(v=>Math.abs(v.top-t)<1.5);if(!z){z={top:t,count:0,text:''};a.push(z)}z.count++;z.text+=c}return a.sort((a,b)=>a.top-b.top)};
                  const headings=[...document.querySelectorAll('h1,h2,h3')].filter(visible).map(e=>({text:(e.textContent||'').trim().replace(/\\s+/g,' '),rect:rect(e),lines:lines(e)}));
                  const controls=[...document.querySelectorAll('a,button,input,select,textarea,[role="button"]')].filter(visible).map(e=>({text:(e.textContent||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').trim().slice(0,60),rect:rect(e)})).filter(x=>x.rect.x<-1||x.rect.right>W+1);
                  const navs=[...document.querySelectorAll('nav')].filter(visible).map(e=>({rect:rect(e),scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,text:(e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,120)}));
                  const skinny=[...document.querySelectorAll('h1,h2,h3,p,label,li,a,button')].filter(visible).map(e=>({tag:e.tagName,text:(e.textContent||'').trim().replace(/\\s+/g,' ').slice(0,80),rect:rect(e),font:parseFloat(getComputedStyle(e).fontSize||'0')})).filter(x=>x.text.length>=4&&x.rect.width<Math.max(34,x.font*2.2)&&x.rect.height>x.font*2.6);
                  return {title:document.title,scrollWidth:root.scrollWidth,clientWidth:root.clientWidth,headings,controls,navs,skinny};
                }''')
                rec={'page':name,'path':path,'width':width,'status':status,**data};records.append(rec)
                if status>=400: hard.append(f'{name} {width}: HTTP {status}')
                if data['scrollWidth']-data['clientWidth']>1: hard.append(f'{name} {width}: horizontal overflow {data["scrollWidth"]-data["clientWidth"]}px')
                if data['controls']: hard.append(f'{name} {width}: controls outside viewport {data["controls"]}')
                for h in data['headings']:
                  if len(h['lines'])>1 and any(x['count']<=1 for x in h['lines']): hard.append(f'{name} {width}: orphan heading glyph {h["text"]} {h["lines"]}')
                  elif len(h['lines'])>1 and any(x['count']==2 for x in h['lines']): warnings.append(f'{name} {width}: short heading line {h["text"]} {h["lines"]}')
                for n in data['navs']:
                  if n['scrollWidth']>n['clientWidth']+1: warnings.append(f'{name} {width}: nav overflow {n}')
                if data['skinny']: warnings.append(f'{name} {width}: suspicious skinny text {data["skinny"][:5]}')
                page.close()
            browser.close()

          Path('all-layout-evidence/records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('all-layout-evidence/hard-failures.json').write_text(json.dumps(hard,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('all-layout-evidence/warnings.json').write_text(json.dumps(warnings,ensure_ascii=False,indent=2),encoding='utf-8')

          for width in widths:
            thumbs=[]
            for name,_ in pages:
              im=Image.open(out/f'{name}-{width}.png').convert('RGB')
              scale=300/im.width
              h=min(int(im.height*scale),1400)
              im=im.resize((300,int(im.height*scale)))
              if im.height>h: im=im.crop((0,0,300,h))
              canvas=Image.new('RGB',(320,im.height+34),'white');canvas.paste(im,(10,24))
              ImageDraw.Draw(canvas).text((10,5),name,fill='black')
              thumbs.append(canvas)
            total_h=sum(x.height for x in thumbs)
            sheet=Image.new('RGB',(320,total_h),'white'); y=0
            for im in thumbs: sheet.paste(im,(0,y)); y+=im.height
            sheet.save(Path('all-layout-evidence')/f'contact-{width}.jpg',quality=88)
          print('hard=',json.dumps(hard,ensure_ascii=False))
          print('warnings=',json.dumps(warnings,ensure_ascii=False))
          if hard: raise SystemExit('hard layout failures found')
          PY
      - name: Report audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "CPCV all-page visual audit: status=${{ job.status }} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcv-all-page-visual-audit
          path: all-layout-evidence/
          retention-days: 30
