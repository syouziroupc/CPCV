name: Bootstrap flat UI and fast translation

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/bootstrap-flat-ui-fast-translation.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-flat-ui-fast-translation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/flat-ui-fast-translation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium

      - name: Extract and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/agent-flat-ui-fast-translation.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/cpcv-apply.py').write_text(dedent(workflow[start:end]), encoding='utf-8')
          PY
          python /tmp/cpcv-apply.py
          rm -f .github/workflows/agent-pr-flat-ui-fast-translation.yml

      - name: Validate JavaScript and focused tests
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ai/provider.js
          node --check src/ai/processor.js
          node --no-warnings scripts/test-ai-v2.mjs
          node scripts/test-v0810-usability.mjs
          node scripts/test-v0810-security-ui.mjs

      - name: Render and validate screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run visual:v0810

      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-flat-ui-screenshots
          path: docs/v0.8.10-screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Generate manifest and run full validation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          npm run manifest:source
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Commit feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Flatten UI and accelerate AI translation"
          git push origin HEAD:agent/flat-ui-fast-translation

      - name: Remove bootstrap workflow from master
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          rm -f .github/workflows/bootstrap-flat-ui-fast-translation.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove temporary CPCV bootstrap workflow"
          git push origin HEAD:master
