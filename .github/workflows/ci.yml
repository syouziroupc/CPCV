name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-load-ui:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/final-load-ui-hardening-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-load-ui-hardening-20260808
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve duplicate broadcast semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/apply-final-load-ui.py')
          s = p.read_text()
          old = '      if (result.comment.moderationState === "visible") {'
          new = '      if (!result.duplicate && result.comment.moderationState === "visible") {'
          if s.count(old) != 1:
              raise SystemExit(f'expected one duplicate-broadcast patch point, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply product patch
        run: python .github/apply-final-load-ui.py
      - name: Remove temporary patch machinery
        shell: bash
        run: |
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/apply-final-load-ui.py
          git add scripts/test-load-hardening.mjs
      - name: Install dependencies
        shell: bash
        run: |
          npm install --global npm@11.18.0
          npm ci || { npm cache clean --force; npm ci; }
      - name: Refresh source manifest
        run: npm run manifest:source
      - name: Run focused load/UI regression
        run: node scripts/test-load-hardening.mjs
      - name: Run comments, realtime, AI and full Stage 8 regressions
        shell: bash
        run: |
          node --no-warnings scripts/test-comments-v2.mjs
          node --no-warnings scripts/test-realtime-v2.mjs
          node --no-warnings scripts/test-ai-v2.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "Finish load hardening and simplify CPCV UI"
          git push origin HEAD:agent/final-load-ui-hardening-20260808

  check:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/final-load-ui-hardening-20260808'
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and documentation checks
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev
