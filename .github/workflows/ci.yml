name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translation-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-translation-language:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/translation-language-hardening-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/translation-language-hardening-20260809
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply translation hardening
        run: python3 scripts/apply-translation-language-hotfix.py

      - name: Remove temporary patch machinery and restore canonical CI
        shell: bash
        run: |
          rm -f scripts/apply-translation-language-hotfix.py
          rm -f .github/workflows/translation-language-hotfix.yml
          git fetch origin master --depth=1
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Targeted translation regression
        run: |
          npm run test:translation-language-hardening
          node --check src/content-filter/language.js
          node --check src/ai/provider-base.js
          node --check src/ai/processor.js
          node --check src/ai/repository.js

      - name: Regenerate source manifest
        run: npm run manifest:source

      - name: Full validation
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Verify final diff scope and push
        shell: bash
        run: |
          git status --short
          test ! -e .github/workflows/translation-language-hotfix.yml
          test ! -e scripts/apply-translation-language-hotfix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          for path in $changed; do
            case "$path" in
              SOURCE_SHA256SUMS.txt|package.json|scripts/test-translation-language-hardening.mjs|src/ai/processor.js|src/ai/provider-base.js|src/ai/repository.js|src/content-filter/language.js|.github/workflows/ci.yml|.github/workflows/translation-language-hotfix.yml|scripts/apply-translation-language-hotfix.py) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --cached --quiet && exit 0
          git commit -m 'Harden multilingual translation routing and validation'
          git push origin HEAD:agent/translation-language-hardening-20260809
