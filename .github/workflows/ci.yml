name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and documentation checks
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev

  apply-ai-response-hardening:
    name: Apply and validate AI response hardening
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/ai-response-hardening-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hardening patch
        run: python scripts/ai-response-hardening-patch.py

      - name: Remove temporary machinery and restore permanent CI
        run: |
          git rm scripts/ai-response-hardening-patch.py .github/workflows/ai-response-hardening-patch.yml
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add .github/workflows/ci.yml src public/assets scripts wrangler.toml

      - name: Regenerate source manifest
        run: |
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt

      - name: Run focused reliability regressions
        run: |
          node scripts/test-load-hardening.mjs
          node scripts/test-ai-quality-ui-refinement.mjs
          node scripts/test-ai-translation-resilience.mjs
          node --no-warnings scripts/test-ai-v2.mjs
          node --no-warnings scripts/test-content-filter-v2.mjs
          npm run check
          npm run deploy:dry-run
          git diff --cached --check

      - name: Commit validated hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden AI response and comment delivery"
          npm run verify:source-manifest
          git push origin HEAD:agent/ai-response-hardening-20260808
