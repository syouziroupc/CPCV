name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full local validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin and verify npm
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        shell: bash
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Verify install-script approvals
        run: npm install-scripts ls

      - name: Print final manifest input hashes
        run: sha256sum package.json .gitignore .github/workflows/ci.yml .github/workflows/desktop-overlay-poc.yml .github/workflows/deploy-production.yml .github/workflows/responsive-and-ai-regression.yml scripts/verify-u22-freeze.mjs scripts/build-u22-freeze-bundle.mjs docs/INDEX.md docs/U22_DATA_FREEZE_PLAN.md

      - name: Run static project and freeze checks
        run: |
          npm run verify:source-manifest
          node scripts/verify-u22-freeze.mjs
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Build source freeze candidate
        run: node scripts/build-u22-freeze-bundle.mjs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Upload source freeze candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpcv-u22-source-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .freeze-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
