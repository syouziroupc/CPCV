name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and documentation checks
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev

  apply-user-stability-patch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/fix-ui-auth-state-language-20260808'
    name: Apply user-facing stability patch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ui-auth-state-language-20260808
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/apply-user-stability-patch.py
          node --check public/assets/admin.js
          node --check public/assets/master.js
          node --check public/assets/account.js
          node --check public/assets/organization-settings.js
          node --check src/content-filter/language.js
          node --check src/ai/provider.js
          node scripts/test-user-facing-stability.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          git checkout origin/master -- .github/workflows/ci.yml
          git rm scripts/apply-user-stability-patch.py
          git config user.name "cpcv-stability-fix"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_SHA256SUMS.override.txt package.json public src scripts/test-user-facing-stability.mjs
          git commit -m "Fix navigation auth state selections and language support"
          node scripts/verify-source-manifest.mjs
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/fix-ui-auth-state-language-20260808
