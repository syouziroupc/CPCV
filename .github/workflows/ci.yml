name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr55-final-production-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-pr55-release:
    name: Promote verified PR55 release
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/deploy-pr55-staging-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@v7
        with:
          ref: 4a295ae5505a680019b9896b97e1d6f1ec2f20cd

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote release and verify production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ORIGIN='https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev'
          BASELINE='e91f823d-5d48-419b-acce-7d6f6c760f9c'
          RELEASE='fd201f19-aff1-4b2b-8315-ca23ec4caaae'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          npx wrangler deployments status | tee /tmp/before.txt
          grep -Fq "$BASELINE" /tmp/before.txt
          npx wrangler versions list --json > /tmp/versions.json
          node --input-type=module - "$RELEASE" <<'NODE'
          import fs from 'node:fs';
          const release = process.argv[2];
          const x = JSON.parse(fs.readFileSync('/tmp/versions.json','utf8'));
          const rows = Array.isArray(x) ? x : (x.items || x.versions || []);
          if (!rows.some((v) => (v.id || v.version_id || v.versionId) === release)) {
            throw new Error(`Release version ${release} is not available`);
          }
          NODE

          npx wrangler rollback "$RELEASE" --message 'Promote validated PR55 release 4a295ae5505a680019b9896b97e1d6f1ec2f20cd'

          success=0
          for attempt in $(seq 1 30); do
            echo "production verification attempt $attempt/30"
            status_ok=0
            content_ok=0
            api_ok=0
            secret_ok=0
            db_ok=0

            if npx wrangler deployments status > /tmp/current-status.txt 2>&1 && grep -Fq "$RELEASE" /tmp/current-status.txt; then status_ok=1; fi

            curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/forgot-password?release=4a295ae5505a680019b9896b97e1d6f1ec2f20cd&attempt=$attempt" -o /tmp/forgot.html || true
            if grep -Fq '第三者による登録状況の確認を防ぐため' /tmp/forgot.html 2>/dev/null; then content_ok=1; fi

            if node scripts/smoke-production.mjs >/tmp/production-smoke.txt 2>&1; then api_ok=1; fi

            if npx wrangler secret list --config wrangler.toml >/tmp/secrets.json 2>/dev/null && node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const names = new Set(x.map((v) => String(v.name || '')));
          const required = ['AUTH_RATE_LIMIT_PEPPER','PUBLIC_RATE_LIMIT_PEPPER','TURNSTILE_SECRET_KEY'];
          if (required.some((name) => !names.has(name))) process.exit(1);
          NODE
            then secret_ok=1; fi

            if node scripts/verify-remote-d1.mjs >/tmp/remote-d1.txt 2>&1; then db_ok=1; fi

            echo "status=$status_ok content=$content_ok api=$api_ok secrets=$secret_ok db=$db_ok"
            if [ "$status_ok$content_ok$api_ok$secret_ok$db_ok" = '11111' ]; then
              success=1
              break
            fi
            sleep 3
          done

          if [ "$success" -ne 1 ]; then
            echo 'Release verification did not converge; restoring exact predeploy Worker version.' >&2
            cat /tmp/current-status.txt || true
            cat /tmp/production-smoke.txt || true
            cat /tmp/remote-d1.txt || true
            npx wrangler rollback "$BASELINE" --message 'Automatic restore after PR55 promotion verification failure'
            npx wrangler deployments status | tee /tmp/restored.txt
            grep -Fq "$BASELINE" /tmp/restored.txt
            node scripts/smoke-production.mjs
            exit 1
          fi

          for path in / /about /guide /privacy /admin /signup /forgot-password; do
            code="$(curl -sS -L -H 'Cache-Control: no-cache' --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o /tmp/page.html -w '%{http_code}' "$ORIGIN$path?release=4a295ae5505a680019b9896b97e1d6f1ec2f20cd")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/assets/http-client.js?release=4a295ae5505a680019b9896b97e1d6f1ec2f20cd" >/tmp/http-client.js
          test -s /tmp/http-client.js
          curl -fsS -H 'Cache-Control: no-cache' "$ORIGIN/assets/app.css?release=4a295ae5505a680019b9896b97e1d6f1ec2f20cd" >/tmp/app.css
          test -s /tmp/app.css
          npx wrangler deployments status | tee /tmp/final-status.txt
          grep -Fq "$RELEASE" /tmp/final-status.txt
          echo 'PR55_PRODUCTION_DEPLOYMENT_VERIFIED=YES'
