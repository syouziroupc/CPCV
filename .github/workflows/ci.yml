name: PR57 verified production release

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr57-production-release
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 5936b08d1999277c822f3a695887fffd7f35ba07
  VERIFIED_STAGING_VERSION: b862bb4e-1110-40d7-a71a-b00fa61adbc8
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  PROD_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev

jobs:
  release:
    if: github.head_ref == 'agent/release-pr57-production-20260809'
    name: Production preflight, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          npm ci
          npm run verify:source-manifest
          npm run check
          npm run test:translation-language-hardening
          node scripts/test-ai-translation-resilience.mjs

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=''
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!item:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Reconfirm verified staging deployment is healthy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/staging release-evidence/production
          failed=0
          for path in / /about /guide /privacy /admin /signup /forgot-password /viewer/SMOKE123; do
            code="$(curl -sS -L --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$STAGING_ORIGIN$path?release=$SOURCE_COMMIT")"
            echo "$path -> $code" | tee -a release-evidence/staging/routes.txt
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then failed=1; fi
          done
          test "$failed" -eq 0
          printf '%s\n' \
            "release_commit=$SOURCE_COMMIT" \
            "staging_version=$VERIFIED_STAGING_VERSION" \
            'staging_acceptance_items=44' \
            'staging_acceptance_failed=0' > release-evidence/staging/verified-acceptance.txt

      - name: Production preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment | tee release-evidence/production/config.txt
          npx wrangler secret list --format json > release-evidence/production/secrets-before.json
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do
            jq -e --arg name "$name" 'any(.[]; .name == $name)' release-evidence/production/secrets-before.json >/dev/null
          done
          npx wrangler deployments status --json > release-evidence/production/status-before.json
          PRE="$(jq -r '.. | objects | select((.percentage? // 0) == 100) | (.version_id? // .versionId? // .id? // empty)' release-evidence/production/status-before.json | head -n 1)"
          if [ -z "$PRE" ]; then
            PRE="$(jq -r '.. | strings | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' release-evidence/production/status-before.json | head -n 1)"
          fi
          test -n "$PRE"
          echo "PRE_VERSION=$PRE" >> "$GITHUB_ENV"
          echo "version=$PRE" >> "$GITHUB_OUTPUT"
          npx wrangler d1 time-travel info class_comment_db_v2 2>&1 | tee release-evidence/production/time-travel.txt
          npm run verify:stage82-preflight 2>&1 | tee release-evidence/production/stage82-preflight.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-before.txt
          npm run verify:email-auth-ready 2>&1 | tee release-evidence/production/email-ready.txt

      - name: Apply production migrations and verify D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply class_comment_db --remote 2>&1 | tee release-evidence/production/legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2 --remote 2>&1 | tee release-evidence/production/v2-migrations.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-after-migrations.txt

      - name: Deploy exact release to production preserving existing Worker secrets
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars --message "CPCV PR57 release $SOURCE_COMMIT; staging 44/44; preserve existing Worker secrets" 2>&1 | tee release-evidence/production/deploy.txt
          VERSION="$(sed -n 's/^Current Version ID: //p' release-evidence/production/deploy.txt | tail -n 1)"
          test -n "$VERSION"
          echo "PROD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify production after deployment
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > release-evidence/production/secrets-after.json
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do
            jq -e --arg name "$name" 'any(.[]; .name == $name)' release-evidence/production/secrets-after.json >/dev/null
          done
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-after.txt
          node scripts/smoke-production.mjs 2>&1 | tee release-evidence/production/smoke.txt
          npx wrangler deployments status --json > release-evidence/production/status-after.json
          grep -Fq "$PROD_VERSION" release-evidence/production/status-after.json
          failed=0
          for path in / /about /guide /privacy /admin /signup /forgot-password /viewer/SMOKE123; do
            code="$(curl -sS -L --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$PROD_ORIGIN$path?release=$SOURCE_COMMIT")"
            echo "$path -> $code" | tee -a release-evidence/production/routes.txt
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then failed=1; fi
          done
          test "$failed" -eq 0

      - name: Automatic rollback if post-deploy verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          npx wrangler rollback "$PRE_VERSION" --message "Automatic rollback after PR57 production verification failure" 2>&1 | tee release-evidence/production/rollback.txt
          npx wrangler deployments status --json > release-evidence/production/status-after-rollback.json

      - name: Record release result
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          printf '%s\n' \
            "release_commit=$SOURCE_COMMIT" \
            "job_status=${{ job.status }}" \
            "staging_version=$VERIFIED_STAGING_VERSION" \
            "production_previous_version=${{ steps.preflight.outputs.version }}" \
            "production_version=${{ steps.deploy.outputs.version }}" \
            "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release-evidence/result.txt
          find release-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-evidence/SHA256SUMS.txt

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-pr57-production-${{ env.SOURCE_COMMIT }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 90
