name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pr55-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr55-production-release:
    name: PR55 production release preserving Worker secrets
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/deploy-pr55-staging-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout release orchestrator only
        uses: actions/checkout@v7
        with:
          ref: agent/deploy-pr55-staging-20260809
          path: orchestrator

      - name: Checkout immutable production source
        uses: actions/checkout@v7
        with:
          ref: 4a295ae5505a680019b9896b97e1d6f1ec2f20cd
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install immutable-source dependencies
        working-directory: source
        run: npm ci

      - name: Execute protected production release
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash ../orchestrator/scripts/pr55-production-preserve-secrets.sh

      - name: Upload production deployment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-pr55-production-records-4a295ae5505a680019b9896b97e1d6f1ec2f20cd
          path: source/deployment-records/
          if-no-files-found: warn
          retention-days: 90
