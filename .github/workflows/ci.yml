name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full local validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin and verify npm
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        shell: bash
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
          NPM_CONFIG_ALLOW_SCRIPTS: "esbuild,workerd"
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and freeze checks
        run: |
          npm run verify:source-manifest
          node scripts/verify-u22-freeze.mjs
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Build source freeze candidate
        run: node scripts/build-u22-freeze-bundle.mjs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Upload source freeze candidate
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-u22-source-candidate-${{ github.sha }}
          path: ../CPCV-freeze-output/
          if-no-files-found: error
          retention-days: 30
