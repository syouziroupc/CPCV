name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-load-revalidation:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/staging-reload-audit-20260807'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_COMMIT: bd95f77d466787a504ad1082c6a9cdd62f33dbbc
      STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: agent/staging-reload-audit-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy exact release to staging and execute bounded real load audit
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!key:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$account"

          cp scripts/staging-load-audit-v3.mjs /tmp/staging-load-audit-v3.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/staging-load-audit-v3.mjs')
          s=p.read_text()
          s=s.replace("count: 120, concurrency: 60", "count: 80, concurrency: 40")
          s=s.replace("count: 100, concurrency: 50", "count: 60, concurrency: 30")
          s=s.replace("count: 40, concurrency: 20", "count: 20, concurrency: 10")
          s=s.replace("timeoutMs: 150_000", "timeoutMs: 75_000")
          s=s.replace("timeoutMs: 240_000", "timeoutMs: 75_000")
          s=s.replace("timeoutMs: 300_000", "timeoutMs: 75_000")
          s=s.replace("await sleep(65_000);", "await sleep(5_000);")
          p.write_text(s)
          PY
          git reset --hard "$RELEASE_COMMIT"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          npm ci

          cat > .staging-load.wrangler.toml <<'TOML'
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true
          assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }
          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]
          [ai]
          binding = "AI"
          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 10
          max_batch_timeout = 0
          max_retries = 3
          [[queues.producers]]
          binding = "AI_TRANSLATION_QUEUE"
          queue = "cpcv-ai-translation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-translation-jobs-staging"
          max_batch_size = 6
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-translation-dlq-staging"
          [[queues.producers]]
          binding = "AI_MODERATION_QUEUE"
          queue = "cpcv-ai-moderation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-moderation-jobs-staging"
          max_batch_size = 6
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-moderation-dlq-staging"
          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]
          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071801"
          simple = { limit = 20, period = 60 }
          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071802"
          simple = { limit = 10, period = 60 }
          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071804"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AI_TRANSLATION_RATE_LIMITER"
          namespace_id = "826071805"
          simple = { limit = 700, period = 60 }
          [[ratelimits]]
          name = "AI_MODERATION_RATE_LIMITER"
          namespace_id = "826071806"
          simple = { limit = 290, period = 60 }
          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_MODERATION_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_ACCURATE_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "8000"
          AI_TRANSLATION_BALANCED_TIMEOUT_MS = "18000"
          AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "30000"
          AI_QUEUE_PARALLELISM = "5"
          AI_TRANSLATION_QUEUE_PARALLELISM = "3"
          AI_MODERATION_QUEUE_PARALLELISM = "3"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          TOML

          node scripts/verify-deployment-config.mjs .staging-load.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .staging-load.wrangler.toml
          node scripts/verify-ai-readiness.mjs --config .staging-load.wrangler.toml
          npx wrangler d1 migrations apply class_comment_db_staging --remote --config .staging-load.wrangler.toml
          npx wrangler d1 migrations apply class_comment_db_v2_staging --remote --config .staging-load.wrangler.toml
          node scripts/verify-remote-d1.mjs --database class_comment_db_v2_staging --config .staging-load.wrangler.toml
          npx wrangler deploy --config .staging-load.wrangler.toml --keep-vars 2>&1 | tee staging-deploy.txt
          node scripts/smoke-production.mjs --config .staging-load.wrangler.toml --origin "$STAGING_ORIGIN" | tee staging-smoke.txt

          timeout 1200s npx wrangler tail class-pdf-comment-viewer-v01-staging --format json > worker-tail-v3.jsonl 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 5
          set +e
          STAGING_ORIGIN="$STAGING_ORIGIN" STAGING_WRANGLER_CONFIG=.staging-load.wrangler.toml node /tmp/staging-load-audit-v3.mjs
          load_status=$?
          set -e
          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          set +e
          npx wrangler d1 insights class_comment_db_v2_staging --config .staging-load.wrangler.toml --time-period 1h --sort-type sum --sort-by time --limit 40 --json > d1-insights-time-v3.json 2> d1-insights-time-v3.err
          npx wrangler d1 insights class_comment_db_v2_staging --config .staging-load.wrangler.toml --time-period 1h --sort-type sum --sort-by count --limit 40 --json > d1-insights-count-v3.json 2> d1-insights-count-v3.err
          set -e
          exit "$load_status"
      - name: Upload staging load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-staging-reload-audit-${{ github.run_id }}
          path: |
            load-v3-report.json
            load-v3-summary.md
            worker-tail-v3.jsonl
            d1-insights-time-v3.json
            d1-insights-time-v3.err
            d1-insights-count-v3.json
            d1-insights-count-v3.err
            staging-deploy.txt
            staging-smoke.txt
          if-no-files-found: warn
          retention-days: 30

  check:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || { npm cache clean --force; npm ci; }
      - name: Run static project and documentation checks
        run: npm run verify:source-manifest
