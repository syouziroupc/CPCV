name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-email-identity:
    name: Finalize email identity hardening
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply hardening patches
        run: |
          python scripts/fix-email-identity-invariants.py
          python scripts/fix-email-identity-ownership.py

      - name: Remove temporary machinery and restore permanent CI
        run: |
          git rm -f scripts/fix-email-identity-invariants.py
          git rm -f scripts/fix-email-identity-ownership.py
          git rm -f .github/workflows/finalize-email-identity-hardening.yml
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Regenerate source manifest
        run: npm run manifest:source

      - name: Focused validation
        run: |
          node --no-warnings scripts/test-email-auth-v2.mjs
          node --no-warnings scripts/test-account-lifecycle-v2.mjs
          node scripts/test-system-hardening.mjs
          npm run check
          npm run verify:source-manifest
          git diff --check

      - name: Full validation
        run: |
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden email identity and delivery quotas"
          git push origin HEAD:agent/ai-response-hardening-20260808

  check:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and documentation checks
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev