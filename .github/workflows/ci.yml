name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-audit-fixes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/cpcv-u22-final-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Apply reviewed freeze audit fixes atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected source fragment missing: {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, count))

          replace('public/assets/viewer.js',
                  "const externalUrl = annotation.url || annotation.unsafeUrl || '';",
                  "const externalUrl = annotation.url || '';")

          p = Path('scripts/verify-pdf-link-logic.mjs')
          s = p.read_text()
          needle = "if (viewer.includes('recentComments')) {\n  throw new Error('Recent comment replay must remain disabled');\n}\n"
          addition = "\nif (viewer.includes('annotation.unsafeUrl')) {\n  throw new Error('PDF.js unsafeUrl must never become a clickable external link');\n}\n\nif (!viewer.includes(\"const externalUrl = annotation.url || '';\")) {\n  throw new Error('External PDF links must use only PDF.js validated annotation.url');\n}\n"
          if needle not in s:
              raise SystemExit('PDF link verifier insertion point missing')
          p.write_text(s.replace(needle, needle + addition, 1))

          replace('scripts/stage-compatibility-checks.mjs',
                  '    check("current password scheme uses PBKDF2-SHA-256 with 600000 iterations", passwords.includes("600_000") || passwords.includes("600000"));',
                  '    check("current password scheme is PBKDF2-SHA-256 with 100000 iterations",\n      passwords.includes(\'PASSWORD_SCHEME = "pbkdf2-sha256-100000-v3"\') && passwords.includes("iterations: 100_000"));\n    check("600000-iteration PBKDF2 scheme remains verification-only compatibility",\n      passwords.includes(\'HIGH_ITERATION_PASSWORD_SCHEME = "pbkdf2-sha256-600000-v2"\') && passwords.includes("iterations: 600_000"));')

          replace('scripts/test-auth-v2.mjs',
                  '  LEGACY_PASSWORD_SCHEME,\n  PASSWORD_SCHEME,',
                  '  HIGH_ITERATION_PASSWORD_SCHEME,\n  LEGACY_PASSWORD_SCHEME,\n  PASSWORD_SCHEME,')
          replace('scripts/test-auth-v2.mjs',
                  'assert("current password scheme respects the Workers PBKDF2 limit", PASSWORD_SCHEME === "pbkdf2-sha256-100000-v3");',
                  'assert("current password scheme is the 100000-iteration v3 scheme", PASSWORD_SCHEME === "pbkdf2-sha256-100000-v3");\n  assert("600000-iteration v2 scheme remains supported only for verification migration", HIGH_ITERATION_PASSWORD_SCHEME === "pbkdf2-sha256-600000-v2" && needsPasswordRehash(HIGH_ITERATION_PASSWORD_SCHEME));')

          replace('docs/current-system.md',
                  '- PBKDF2-HMAC-SHA-256、600000 iterations',
                  '- PBKDF2-HMAC-SHA-256。現行schemeは100,000 iterations。既存の600,000-iteration v2 hashは検証互換のみ残し、次回認証時の再hash対象')
          replace('docs/final-stage08/04_SECURITY_AUTHORIZATION_SPEC.md',
                  '- 現行iterationは600,000である。',
                  '- 現行scheme `pbkdf2-sha256-100000-v3` は100,000 iterationsである。\n- 既存の`pbkdf2-sha256-600000-v2`は検証互換のみ残し、認証成功後の再hash対象とする。')
          replace('docs/database-schema.md',
                  '- password scheme: `pbkdf2-sha256-600000-v2`\n- 旧`pbkdf2-sha256-100000-v1`の検証互換',
                  '- current password scheme: `pbkdf2-sha256-100000-v3`\n- `pbkdf2-sha256-600000-v2`は検証互換のみ。認証成功後の再hash対象\n- 旧`pbkdf2-sha256-100000-v1`も検証互換。認証成功後の再hash対象')

          replace('scripts/audit-responsive-layout.py',
                  '        """({source, width}) => {',
                  '        r"""({source, width}) => {')

          old_action = 'ea165f8d65b6e75b540449e92b4886f43607fa02'
          new_action = '043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
          for path in [
              '.github/workflows/responsive-and-ai-regression.yml',
              '.github/workflows/desktop-overlay-poc.yml',
              '.github/workflows/deploy-production.yml',
          ]:
              replace(path, f'actions/upload-artifact@{old_action} # v4', f'actions/upload-artifact@{new_action} # v7.0.1')
          replace('.github/workflows/responsive-and-ai-regression.yml',
                  'name: responsive-ai-${{ github.sha }}',
                  'name: responsive-ai-${{ github.event.pull_request.head.sha || github.sha }}')
          p = Path('scripts/verify-u22-freeze.mjs')
          s = p.read_text()
          if old_action not in s:
              raise SystemExit('old upload-artifact pin missing from freeze verifier')
          p.write_text(s.replace(old_action, new_action))

          final_ci_b64 = ''
          Path('.github/workflows/ci.yml').write_bytes(base64.b64decode(final_ci_b64))

          changed = [
              '.github/workflows/ci.yml',
              '.github/workflows/desktop-overlay-poc.yml',
              '.github/workflows/deploy-production.yml',
              '.github/workflows/responsive-and-ai-regression.yml',
              'public/assets/viewer.js',
              'scripts/verify-pdf-link-logic.mjs',
              'scripts/stage-compatibility-checks.mjs',
              'scripts/test-auth-v2.mjs',
              'scripts/audit-responsive-layout.py',
              'scripts/verify-u22-freeze.mjs',
              'docs/current-system.md',
              'docs/final-stage08/04_SECURITY_AUTHORIZATION_SPEC.md',
              'docs/database-schema.md',
          ]
          manifest = Path('SOURCE_SHA256SUMS.override.txt')
          entries = []
          for line in manifest.read_text().splitlines():
              if not line:
                  continue
              digest, path = line.split('  ', 1)
              entries.append([digest, path])
          by_path = {path: digest for digest, path in entries}
          for path in changed:
              by_path[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          seen = set()
          output = []
          for _, path in entries:
              if path not in seen:
                  output.append(f'{by_path[path]}  {path}')
                  seen.add(path)
          for path in changed:
              if path not in seen:
                  output.append(f'{by_path[path]}  {path}')
                  seen.add(path)
          manifest.write_text('\n'.join(output) + '\n')
          PY
          git config user.name "CPCV freeze audit"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/desktop-overlay-poc.yml .github/workflows/deploy-production.yml .github/workflows/responsive-and-ai-regression.yml public/assets/viewer.js scripts/verify-pdf-link-logic.mjs scripts/stage-compatibility-checks.mjs scripts/test-auth-v2.mjs scripts/audit-responsive-layout.py scripts/verify-u22-freeze.mjs docs/current-system.md docs/final-stage08/04_SECURITY_AUTHORIZATION_SPEC.md docs/database-schema.md SOURCE_SHA256SUMS.override.txt
          git diff --cached --check
          git commit -m "Harden final CPCV freeze candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
