name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Full local validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci || {
            echo "npm ci failed once; clearing the npm cache and retrying."
            npm cache clean --force
            npm ci
          }

      - name: Run static project and documentation checks
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs

      - name: Run all implemented-stage tests
        run: npm run check:stage08

      - name: Run Owner bootstrap regression
        run: npm run test:owner-bootstrap

      - name: Validate Wrangler bundle
        run: npm run deploy:dry-run

      - name: Audit all dependencies
        run: |
          npm audit
          npm audit --omit=dev

  inspect-production-secrets:
    name: Inspect production secret bindings
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/deploy-pr55-staging-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout immutable source commit
        uses: actions/checkout@v7
        with:
          ref: 4a295ae5505a680019b9896b97e1d6f1ec2f20cd

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact-source dependencies
        run: npm ci

      - name: List secret names only and verify required bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler secret list --config wrangler.toml > production-secret-names.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('production-secret-names.json', 'utf8');
          const data = JSON.parse(raw);
          const names = new Set(data.map((item) => String(item.name || '')));
          const required = ['AUTH_RATE_LIMIT_PEPPER', 'PUBLIC_RATE_LIMIT_PEPPER', 'TURNSTILE_SECRET_KEY'];
          for (const name of required) {
            console.log(`${name}=${names.has(name) ? 'PRESENT' : 'MISSING'}`);
          }
          if (required.some((name) => !names.has(name))) process.exit(2);
          NODE
