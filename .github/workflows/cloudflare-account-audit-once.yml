name: Cloudflare account audit once

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[cf-account-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Show authenticated Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.129.1 whoami
      - name: Verify TalkSys and auditor in same account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo '--- talksys ---'
          npx wrangler@4.129.1 deployments list --name talksys | head -40
          echo '--- kimi-vs-gpt-auditor ---'
          npx wrangler@4.129.1 deployments list --name kimi-vs-gpt-auditor | head -40
