name: CPCV auth layout debug and release

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-auth-layout-debug.yml]

permissions:
  contents: write

env:
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  EVIDENCE_DIR: /tmp/cpcv-auth-layout-evidence

jobs:
  fix-test-release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-visual.txt
          python -m playwright install --with-deps chromium

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!item:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Patch authentication hierarchy and related defects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, content):
              (root / path).write_text(content, encoding='utf-8')

          def require_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected fragment: {label}')
              return text.replace(old, new, 1)

          admin_path = Path('public/admin/index.html')
          admin = read(admin_path)
          admin = require_replace(admin, '<body class="page admin-page">', '<body class="page admin-page auth-view">', 'admin initial auth state')
          admin = require_replace(admin, '<main id="mainContent" class="card admin-shell">', '<main id="mainContent" class="admin-shell">', 'admin outer card removal')
          old_login = '''    <section id="loginSection" class="section auth-panel">
              <h2>先生ログイン</h2>
              <p class="muted">登録したメールアドレスとパスワードを入力してください。</p>
              <label class="label" for="teacherLoginId">メールアドレス<span class="muted">（移行前はログインID）</span></label>
              <input id="teacherLoginId" class="input" autocomplete="username">
              <label class="label" for="teacherPassword">パスワード</label>
              <input id="teacherPassword" class="input" type="password" autocomplete="current-password">
              <div id="teacherOrganizationGroup" class="hidden">
                <label class="label" for="teacherOrganization">組織</label>
                <select id="teacherOrganization" class="select"></select>
              </div>
              <button id="loginButton" class="button primary auth-submit">ログイン</button>
              <p id="loginStatus" class="status" aria-live="polite"></p>
              <div class="auth-links"><a href="/forgot-password">パスワードを忘れた</a><a href="/signup">組織を登録</a></div>
            </section>'''
          new_login = '''    <section id="loginSection" class="auth-shell admin-login-shell" aria-labelledby="teacherLoginHeading">
              <header class="auth-header">
                <p class="eyebrow">CPCV</p>
                <h1 id="teacherLoginHeading">授業管理へログイン</h1>
                <p class="muted">登録したメールアドレスとパスワードを入力してください。</p>
              </header>
              <form id="teacherLoginForm" class="auth-form">
                <label class="label" for="teacherLoginId">メールアドレス<span class="muted">（移行前はログインID）</span></label>
                <input id="teacherLoginId" class="input" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                <label class="label" for="teacherPassword">パスワード</label>
                <input id="teacherPassword" class="input" type="password" autocomplete="current-password" required>
                <div id="teacherOrganizationGroup" class="hidden">
                  <label class="label" for="teacherOrganization">組織</label>
                  <select id="teacherOrganization" class="select"></select>
                </div>
                <button id="loginButton" class="button primary auth-submit" type="submit">ログイン</button>
              </form>
              <p id="loginStatus" class="status" aria-live="polite"></p>
              <nav class="auth-links auth-footer" aria-label="ログイン補助"><a href="/forgot-password">パスワードを忘れた</a><a href="/signup">組織を登録</a></nav>
            </section>'''
          admin = require_replace(admin, old_login, new_login, 'admin login hierarchy')
          admin = admin.replace('/assets/app.css?v=0.8.10-ui2', '/assets/app.css?v=0.8.10-ui3')
          admin = admin.replace('/assets/admin.js?v=0.8.10', '/assets/admin.js?v=0.8.10-auth-layout')
          write(admin_path, admin)
          write('public/_admin_spa.html', admin)

          account_path = 'public/account/index.html'
          account = read(account_path)
          account = require_replace(account, '<body class="page">', '<body class="page account-page">', 'account body class')
          account = require_replace(account, '<main id="mainContent" class="card wide account-shell">', '<main id="mainContent" class="wide account-shell">', 'account outer card removal')
          account = account.replace('/assets/app.css?v=0.8.10-ui2', '/assets/app.css?v=0.8.10-ui3')
          write(account_path, account)

          structured = {
              'public/signup/index.html': (
                  '''    <p class="eyebrow">CPCV</p>\n    <h1>アカウントを登録</h1>\n    <p class="muted">確認メールを受け取れるメールアドレスを使用してください。</p>''',
                  '''    <header class="auth-header">\n      <p class="eyebrow">CPCV</p>\n      <h1>アカウントを登録</h1>\n      <p class="muted">確認メールを受け取れるメールアドレスを使用してください。</p>\n    </header>'''
              ),
              'public/forgot-password/index.html': (
                  '''    <p class="eyebrow">CPCV</p>\n    <h1>パスワード再設定</h1>\n    <p class="muted">登録済みの場合に限り再設定メールを送信します。</p>''',
                  '''    <header class="auth-header">\n      <p class="eyebrow">CPCV</p>\n      <h1>パスワード再設定</h1>\n      <p class="muted">登録済みの場合に限り再設定メールを送信します。</p>\n    </header>'''
              ),
              'public/reset-password/index.html': (
                  '''    <p class="eyebrow">CPCV</p>\n    <h1>新しいパスワード</h1>''',
                  '''    <header class="auth-header">\n      <p class="eyebrow">CPCV</p>\n      <h1>新しいパスワード</h1>\n    </header>'''
              ),
          }
          for path, (old_header, new_header) in structured.items():
              text = read(path)
              text = require_replace(text, '<body class="page">', '<body class="page auth-page">', f'{path} body')
              text = require_replace(text, '<main class="card narrow">', '<main class="auth-shell">', f'{path} shell')
              text = require_replace(text, old_header, new_header, f'{path} header')
              text = text.replace('<form id="signupForm">', '<form id="signupForm" class="auth-form">')
              text = text.replace('<form id="forgotForm">', '<form id="forgotForm" class="auth-form">')
              text = text.replace('<form id="resetForm">', '<form id="resetForm" class="auth-form">')
              text = text.replace('<p><a href="/admin">ログインへ戻る</a></p>', '<p class="auth-footer"><a href="/admin">ログインへ戻る</a></p>')
              text = text.replace('/assets/app.css?v=0.8.10-ui2', '/assets/app.css?v=0.8.10-ui3')
              write(path, text)

          # Other public account lifecycle pages use the same single-shell structure when present.
          for name in ['check-email', 'verify-registration', 'accept-invite', 'verify-email-change']:
              path = root / 'public' / name / 'index.html'
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('<body class="page">', '<body class="page auth-page">')
              text = text.replace('<main class="card narrow">', '<main class="auth-shell">')
              text = text.replace('/assets/app.css?v=0.8.10-ui2', '/assets/app.css?v=0.8.10-ui3')
              path.write_text(text, encoding='utf-8')

          # Refresh the CSS cache key consistently for all HTML entry points.
          for path in (root / 'public').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('/assets/app.css?v=0.8.10-ui2', '/assets/app.css?v=0.8.10-ui3')
              path.write_text(text, encoding='utf-8')

          js_path = 'public/assets/admin.js'
          js = read(js_path)
          js = require_replace(js, "const loginSection = document.getElementById('loginSection');", "const loginSection = document.getElementById('loginSection');\nconst teacherLoginForm = document.getElementById('teacherLoginForm');", 'login form reference')
          old_status = '''function setStatus(text, error = false) {
            adminStatus.textContent = text;
            adminStatus.style.color = error ? '#dc2626' : '#2563eb';
          }

          function setLoginStatus(text, error = false) {
            loginStatus.textContent = text;
            loginStatus.style.color = error ? '#dc2626' : '#2563eb';
          }'''
          new_status = '''function setStatusElement(element, text, error = false) {
            if (!element) return;
            element.textContent = text;
            element.classList.toggle('error-status', Boolean(error));
          }

          function setStatus(text, error = false) {
            setStatusElement(adminStatus, text, error);
          }

          function setLoginStatus(text, error = false) {
            setStatusElement(loginStatus, text, error);
          }

          function setViewMode(mode) {
            const authView = mode === 'auth';
            document.body.classList.toggle('auth-view', authView);
            document.body.dataset.view = authView ? 'auth' : 'application';
          }'''
          js = require_replace(js, old_status, new_status, 'status and view helpers')
          js = require_replace(js, "  currentSession = null;\n  moderationComments = [];\n  show(loginSection, true);", "  currentSession = null;\n  moderationComments = [];\n  setViewMode('auth');\n  show(loginSection, true);", 'showLogin view')
          js = require_replace(js, "function showAdminTop() {\n  stopModerationRefresh();\n  stopAnalyticsRefresh();", "function showAdminTop() {\n  stopModerationRefresh();\n  stopAnalyticsRefresh();\n  setViewMode('application');", 'showAdminTop view')
          js = require_replace(js, "function showSession() {\n  show(loginSection, false);", "function showSession() {\n  setViewMode('application');\n  show(loginSection, false);", 'showSession view')
          js = require_replace(js, "function showNotFound() {\n  stopModerationRefresh();\n  stopAnalyticsRefresh();", "function showNotFound() {\n  stopModerationRefresh();\n  stopAnalyticsRefresh();\n  setViewMode('application');", 'showNotFound view')
          js = require_replace(js, "  button.disabled = true;\n  button.textContent = '処理中...';", "  button.disabled = true;\n  button.setAttribute('aria-busy', 'true');\n  button.textContent = '処理中...';", 'button busy start')
          js = require_replace(js, "    button.disabled = false;\n    button.textContent = label || original;", "    button.disabled = false;\n    button.removeAttribute('aria-busy');\n    button.textContent = label || original;", 'button busy end')

          login_pattern = re.compile(r"loginButton\.addEventListener\('click', \(\) => withButton\(loginButton, 'ログイン', async \(\) => \{(?P<body>[\s\S]*?)\n\}\)\);\n\nteacherPassword\.addEventListener\('keydown',[\s\S]*?teacherLoginId\.addEventListener\('keydown', \(event\) => \{\n  if \(event\.key === 'Enter'\) teacherPassword\.focus\(\);\n\}\);", re.M)
          match = login_pattern.search(js)
          if not match:
              raise SystemExit('login event block not found')
          replacement = "teacherLoginForm.addEventListener('submit', (event) => {\n  event.preventDefault();\n  return withButton(loginButton, 'ログイン', async () => {" + match.group('body') + "\n  });\n});"
          js = js[:match.start()] + replacement + js[match.end():]
          write(js_path, js)

          auth_public_path = 'public/assets/auth-public.js'
          auth_public = read(auth_public_path)
          auth_public = require_replace(auth_public, '      sitekey: siteKey,\n      callback: onToken,', '      sitekey: siteKey,\n      size: "flexible",\n      theme: "auto",\n      callback: onToken,', 'responsive Turnstile')
          write(auth_public_path, auth_public)

          css_path = 'public/assets/app.css'
          css = read(css_path)
          marker = '/* v0.8.10 auth hierarchy and form debug */'
          if marker in css:
              raise SystemExit('auth hierarchy CSS marker already exists')
          css += r'''

          /* v0.8.10 auth hierarchy and form debug */
          .auth-page {
            place-items: center;
            align-content: center;
          }
          .auth-shell {
            width: min(100%, 560px);
            min-width: 0;
            justify-self: center;
            border: 2px solid var(--border);
            background: var(--card);
            padding: clamp(20px, 4vw, 32px);
            box-shadow: 8px 8px 0 var(--flat-shadow-color);
          }
          .auth-header {
            margin: 0 0 20px;
            padding: 0 0 18px;
            border-bottom: 2px solid var(--border);
          }
          .auth-header > :first-child { margin-top: 0; }
          .auth-header > :last-child { margin-bottom: 0; }
          .auth-form { margin: 0; }
          .auth-form > .label:first-child { margin-top: 0; }
          .auth-footer {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--flat-divider);
          }
          .auth-links.auth-footer { gap: 12px 20px; }
          .auth-challenge {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow: hidden;
          }
          .auth-challenge > div,
          .auth-challenge iframe { max-width: 100% !important; }
          .status.error-status { color: var(--danger); }
          .status:not(.error-status) { color: var(--primary); }
          .button[aria-busy="true"] { cursor: progress; }

          .admin-page.auth-view {
            place-items: center;
            align-content: center;
          }
          .admin-page.auth-view .admin-shell {
            width: min(100%, 560px);
            max-width: 560px;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            overflow: visible;
          }
          .admin-page.auth-view .admin-shell > .app-header { display: none; }
          .admin-page.auth-view .admin-shell > :not(.app-header) {
            margin-left: 0;
            margin-right: 0;
          }
          .admin-page.auth-view .admin-login-shell {
            max-width: none;
            margin-top: 0;
            border-top: 2px solid var(--border);
            padding-top: clamp(20px, 4vw, 32px);
          }

          /* Remove card-within-card framing from account settings without erasing section boundaries. */
          .account-summary-grid > .info-box,
          .account-settings-grid > .workspace-panel {
            border: 0;
            border-left: 4px solid var(--flat-divider);
            background: transparent;
            padding: 12px 0 12px 16px;
            box-shadow: none;
          }
          .account-shell .filter-editor-panel {
            border: 0;
            border-top: 2px solid var(--flat-divider);
            background: transparent;
            padding: 24px 0 0;
            box-shadow: none;
          }
          .account-shell .danger-zone.workspace-panel {
            border: 0;
            border-top: 2px solid var(--danger);
            background: transparent;
            padding: 24px 0 0;
            box-shadow: none;
          }

          @media (max-width: 380px) {
            .auth-page { padding: 8px; }
            .auth-shell { padding: 18px 14px; box-shadow: 4px 4px 0 var(--flat-shadow-color); }
            .admin-page.auth-view { padding: 8px; }
          }
          '''
          write(css_path, css)

          test_path = 'scripts/test-v0810-usability.mjs'
          test = read(test_path)
          anchor = "check('initial lesson buttons describe their action', admin.includes('>投稿を停止<') && admin.includes('>コメントを隠す<'));"
          additions = r'''
          check('login uses one standalone auth shell', admin.includes('class="auth-shell admin-login-shell"') && !admin.includes('class="section auth-panel"') && !admin.includes('class="card admin-shell"'));
          check('login uses semantic form submission', admin.includes('id="teacherLoginForm"') && admin.includes('type="submit">ログイン') && text('public/assets/admin.js').includes("teacherLoginForm.addEventListener('submit'"));
          check('login state removes the application shell framing', appCss.includes('.admin-page.auth-view .admin-shell') && appCss.includes('box-shadow: none'));
          check('account settings avoid nested card framing', !account.includes('class="card wide account-shell"') && appCss.includes('.account-summary-grid > .info-box'));
          check('public auth pages use the shared auth shell', ['signup', 'forgot-password', 'reset-password'].every((name) => text(`public/${name}/index.html`).includes('class="auth-shell"')));
          check('Turnstile uses responsive flexible sizing', text('public/assets/auth-public.js').includes('size: "flexible"'));
          '''
          test = require_replace(test, anchor, anchor + additions, 'usability auth assertions')
          write(test_path, test)

          # Record audited HTML entry points for evidence.
          html_files = sorted(str(p) for p in (root / 'public').rglob('*.html'))
          Path('/tmp/cpcv-auth-layout-evidence/html-entry-points.txt').write_text('\n'.join(html_files) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/cpcv-auth-layout-debug.yml
          node scripts/generate-source-manifest.mjs
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Flatten authentication layouts and fix form behavior"
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | tee "$EVIDENCE_DIR/git-status.txt"
          test -z "$(git status --porcelain)"
          node --check public/assets/admin.js
          node --check public/assets/auth-public.js
          npm run verify:source-manifest | tee "$EVIDENCE_DIR/source-manifest.txt"
          npm run check:v0810 | tee "$EVIDENCE_DIR/check-v0810.txt"
          npm run check:project | tee "$EVIDENCE_DIR/check-project.txt"
          npm run check:stage08 | tee "$EVIDENCE_DIR/check-stage08.txt"
          npm run deploy:dry-run | tee "$EVIDENCE_DIR/deploy-dry-run.txt"

      - name: Materialize staging configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          text = text.replace('name = "class-pdf-comment-viewer-v01"', 'name = "class-pdf-comment-viewer-v01-staging"', 1)
          text = text.replace('database_name = "class_comment_db"\ndatabase_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"', 'database_name = "class_comment_db_staging"\ndatabase_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"')
          text = text.replace('database_name = "class_comment_db_v2"\ndatabase_id = "8315a076-67ad-44e6-8286-11887af52ad3"', 'database_name = "class_comment_db_v2_staging"\ndatabase_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"')
          text = text.replace('queue = "cpcv-ai-jobs"', 'queue = "cpcv-ai-jobs-staging"')
          text = text.replace('namespace_id = "826071901"', 'namespace_id = "826071801"')
          text = text.replace('namespace_id = "826071902"', 'namespace_id = "826071802"')
          text = text.replace('namespace_id = "826071903"', 'namespace_id = "826071803"')
          text = text.replace('namespace_id = "826071904"', 'namespace_id = "826071804"')
          text = text.replace('https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev', 'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev')
          text = re.sub(r'TURNSTILE_SITE_KEY = "[^"]+"', 'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"', text)
          Path('.cpcv-staging.wrangler.toml').write_text(text, encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml | tee "$EVIDENCE_DIR/staging-config.txt"
          npx wrangler deploy --dry-run --config .cpcv-staging.wrangler.toml > "$EVIDENCE_DIR/staging-dry-run.txt"

      - name: Deploy and verify staging
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars | tee "$EVIDENCE_DIR/staging-deploy.txt"
          ORIGIN="$STAGING_ORIGIN" LABEL=staging python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          origin = os.environ['ORIGIN']
          label = os.environ['LABEL']
          out = Path(os.environ['EVIDENCE_DIR']) / label
          out.mkdir(parents=True, exist_ok=True)
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for width in (320, 390, 768, 1440):
                  for path, name in [('/admin', 'login'), ('/signup', 'signup'), ('/forgot-password', 'forgot'), ('/reset-password', 'reset')]:
                      page = browser.new_page(viewport={'width': width, 'height': 900})
                      response = page.goto(origin + path + '?release=' + os.environ['CANDIDATE_COMMIT'], wait_until='domcontentloaded', timeout=90000)
                      assert response and response.status < 400, (path, response.status if response else None)
                      page.wait_for_timeout(900)
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), (path, width, page.evaluate('document.documentElement.scrollWidth'))
                      if path == '/admin':
                          assert page.locator('body.auth-view').count() == 1
                          shell = page.locator('.admin-shell')
                          login = page.locator('#loginSection')
                          assert login.is_visible()
                          assert page.locator('#teacherLoginForm').count() == 1
                          assert page.locator('#loginButton[type="submit"]').count() == 1
                          assert shell.evaluate("e => getComputedStyle(e).boxShadow === 'none' && parseFloat(getComputedStyle(e).borderTopWidth) === 0")
                          assert login.evaluate("e => parseFloat(getComputedStyle(e).borderTopWidth) >= 1 && getComputedStyle(e).boxShadow !== 'none'")
                          assert page.locator('.admin-shell > .app-header').evaluate("e => getComputedStyle(e).display === 'none'")
                      else:
                          assert page.locator('main.auth-shell').count() == 1
                          assert page.locator('main.auth-shell .card, main.auth-shell .auth-panel').count() == 0
                      page.screenshot(path=str(out / f'{name}-{width}.png'), full_page=True)
                      results.append({'path': path, 'width': width, 'status': response.status})
                      page.close()
              browser.close()
          (out / 'results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml --keep-vars | tee "$EVIDENCE_DIR/production-deploy.txt"
          ORIGIN="$PRODUCTION_ORIGIN" LABEL=production python - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          origin = os.environ['ORIGIN']
          label = os.environ['LABEL']
          out = Path(os.environ['EVIDENCE_DIR']) / label
          out.mkdir(parents=True, exist_ok=True)
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for width in (320, 390, 768, 1440):
                  for path, name in [('/admin', 'login'), ('/signup', 'signup'), ('/forgot-password', 'forgot'), ('/reset-password', 'reset'), ('/account', 'account')]:
                      page = browser.new_page(viewport={'width': width, 'height': 900})
                      response = page.goto(origin + path + '?release=' + os.environ['CANDIDATE_COMMIT'], wait_until='domcontentloaded', timeout=90000)
                      assert response and response.status < 400, (path, response.status if response else None)
                      page.wait_for_timeout(900)
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), (path, width, page.evaluate('document.documentElement.scrollWidth'))
                      if path == '/admin':
                          assert page.locator('body.auth-view').count() == 1
                          assert page.locator('#teacherLoginForm').count() == 1
                          assert page.locator('#loginButton[type="submit"]').count() == 1
                          assert page.locator('.admin-shell').evaluate("e => getComputedStyle(e).boxShadow === 'none' && parseFloat(getComputedStyle(e).borderTopWidth) === 0")
                          assert page.locator('#loginSection').evaluate("e => parseFloat(getComputedStyle(e).borderTopWidth) >= 1 && getComputedStyle(e).boxShadow !== 'none'")
                      if path in ['/signup', '/forgot-password', '/reset-password']:
                          assert page.locator('main.auth-shell').count() == 1
                      page.screenshot(path=str(out / f'{name}-{width}.png'), full_page=True)
                      results.append({'path': path, 'width': width, 'status': response.status})
                      page.close()
              browser.close()
          (out / 'results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          npx wrangler deployments status --name class-pdf-comment-viewer-v01 > "$EVIDENCE_DIR/production-status.txt"

      - name: Publish verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          candidate_commit=$CANDIDATE_COMMIT
          staging_origin=$STAGING_ORIGIN
          production_origin=$PRODUCTION_ORIGIN
          auth_layout_flattened=true
          semantic_login_form=true
          responsive_turnstile=true
          account_nested_cards_flattened=true
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git push origin HEAD:master

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-auth-layout-debug-evidence
          path: /tmp/cpcv-auth-layout-evidence
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove temporary workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/cpcv-auth-layout-debug.yml ]; then
            git rm .github/workflows/cpcv-auth-layout-debug.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV auth layout debug failed run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
