name: CPCV credential capabilities

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-credential-capabilities.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce93380d617672e086b9971fe82bb4f8ffccf861
      - name: Test configured credentials without revealing values
        shell: bash
        env:
          TOKEN_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TOKEN_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          KEY_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          KEY_CF_API_KEY: ${{ secrets.CF_API_KEY }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
          EMAIL_1: ${{ secrets.CLOUDFLARE_EMAIL }}
          EMAIL_2: ${{ secrets.CF_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p capability
          account=""; email=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          for item in EMAIL_1 EMAIL_2; do value="${!item:-}"; if [ -n "$value" ]; then email="$value"; break; fi; done
          test -n "$account"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${account}/d1/database?page=1&per_page=1"
          : > capability/results.txt
          for item in TOKEN_CLOUDFLARE_API_TOKEN TOKEN_CF_API_TOKEN TOKEN_CLOUDFLARE_TOKEN; do
            value="${!item:-}"
            if [ -z "$value" ]; then echo "$item=ABSENT" >> capability/results.txt; continue; fi
            echo "::add-mask::$value"
            response=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $value" "$endpoint")
            status="${response##*$'\n'}"; body="${response%$'\n'*}"
            success=$(printf '%s' "$body" | jq -r '.success // false' 2>/dev/null || echo false)
            code=$(printf '%s' "$body" | jq -r '.errors[0].code // empty' 2>/dev/null || true)
            echo "$item=PRESENT http=$status success=$success error_code=${code:-none}" >> capability/results.txt
          done
          for item in KEY_CLOUDFLARE_API_KEY KEY_CF_API_KEY; do
            value="${!item:-}"
            if [ -z "$value" ]; then echo "$item=ABSENT" >> capability/results.txt; continue; fi
            if [ -z "$email" ]; then echo "$item=PRESENT email=ABSENT" >> capability/results.txt; continue; fi
            echo "::add-mask::$value"; echo "::add-mask::$email"
            response=$(curl -sS -w '\n%{http_code}' -H "X-Auth-Email: $email" -H "X-Auth-Key: $value" "$endpoint")
            status="${response##*$'\n'}"; body="${response%$'\n'*}"
            success=$(printf '%s' "$body" | jq -r '.success // false' 2>/dev/null || echo false)
            code=$(printf '%s' "$body" | jq -r '.errors[0].code // empty' 2>/dev/null || true)
            echo "$item=PRESENT http=$status success=$success error_code=${code:-none}" >> capability/results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-credential-capabilities
          path: capability
          retention-days: 3
      - name: Remove workflow and record run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-credential-capabilities.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV credential diagnostic run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
