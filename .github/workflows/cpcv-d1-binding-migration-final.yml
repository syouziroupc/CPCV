name: CPCV final D1 binding migration

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-d1-binding-migration-final.yml]

permissions:
  contents: write

env:
  RELEASE_COMMIT: cec431da537f76ab4c7b32a5e5d780daf72fa8b3
  PRODUCTION_DB_ID: 8315a076-67ad-44e6-8286-11887af52ad3
  EVIDENCE_DIR: /tmp/cpcv-d1-binding-final

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm install --global npm@11.18.0
          npm ci
          mkdir -p "$EVIDENCE_DIR"
      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Start private remote D1 proxy
        shell: bash
        run: |
          set -euo pipefail
          cat > .cpcv-d1-proxy.js <<'JS'
          export default {
            async fetch(request, env) {
              if (request.headers.get('x-cpcv-maintenance-nonce') !== env.MAINTENANCE_NONCE) return Response.json({ok:false,error:'FORBIDDEN'},{status:403});
              if (request.method === 'GET') return Response.json({ok:true});
              try {
                const body = await request.json();
                const sql = String(body?.sql || '').trim();
                if (!sql) return Response.json({ok:false,error:'SQL_REQUIRED'},{status:400});
                if (body.action === 'all') {
                  const value = await env.DB_V2.prepare(sql).all();
                  return Response.json({ok:true,results:value.results || [],meta:value.meta || {}});
                }
                if (body.action === 'run') {
                  const value = await env.DB_V2.prepare(sql).run();
                  return Response.json({ok:true,meta:value.meta || {}});
                }
                return Response.json({ok:false,error:'ACTION_INVALID'},{status:400});
              } catch (error) {
                return Response.json({ok:false,error:String(error?.message || error).slice(0,2000)},{status:500});
              }
            }
          };
          JS
          cat > .cpcv-d1-proxy.toml <<EOF
          name = "cpcv-production-d1-migration-proxy"
          main = ".cpcv-d1-proxy.js"
          compatibility_date = "2026-06-17"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2"
          database_id = "${PRODUCTION_DB_ID}"
          EOF
          nonce=$(openssl rand -hex 32)
          echo "::add-mask::$nonce"
          echo "CPCV_MIGRATION_NONCE=$nonce" >> "$GITHUB_ENV"
          npx wrangler dev --remote --config .cpcv-d1-proxy.toml --port 8787 --var "MAINTENANCE_NONCE:$nonce" > "$EVIDENCE_DIR/proxy.log" 2>&1 &
          echo $! > /tmp/cpcv-proxy.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -A 'curl/8.5.0 CPCV-Migration' -fsS -H "x-cpcv-maintenance-nonce: $nonce" http://127.0.0.1:8787/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Apply complete trigger statements
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$EVIDENCE_DIR/stdout.txt" 2> "$EVIDENCE_DIR/stderr.txt"
          import json, os, re, sqlite3, traceback, urllib.error, urllib.request
          from pathlib import Path
          endpoint='http://127.0.0.1:8787/'
          nonce=os.environ['CPCV_MIGRATION_NONCE']
          out=Path(os.environ['EVIDENCE_DIR'])
          events=[]
          def call(action, sql):
              preview=' '.join(sql.split())[:300]
              req=urllib.request.Request(endpoint,data=json.dumps({'action':action,'sql':sql}).encode(),method='POST',headers={
                  'Content-Type':'application/json',
                  'x-cpcv-maintenance-nonce':nonce,
                  'User-Agent':'curl/8.5.0 CPCV-Migration'
              })
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      raw=response.read().decode('utf-8','replace'); status=response.status
              except urllib.error.HTTPError as error:
                  raw=error.read().decode('utf-8','replace'); status=error.code
                  events.append({'event':'http-error','status':status,'body':raw,'preview':preview})
                  raise RuntimeError(raw) from error
              body=json.loads(raw)
              events.append({'event':'response','status':status,'body':body,'preview':preview})
              if not body.get('ok'): raise RuntimeError(raw)
              return body.get('results') or []
          def all(sql): return call('all',sql)
          def run(sql): call('run',sql)
          def split(text):
              result=[]; buffer=''
              for line in text.splitlines(keepends=True):
                  buffer += line
                  if sqlite3.complete_statement(buffer):
                      result.append(buffer.strip()); buffer=''
              if buffer.strip(): raise RuntimeError('local incomplete SQL: '+buffer[-300:])
              return result
          def strip_comments(statement):
              lines=statement.splitlines()
              while lines and (not lines[0].strip() or lines[0].lstrip().startswith('--')): lines.pop(0)
              return '\n'.join(lines).strip()
          def trigger(statement):
              match=re.search(r'\bCREATE\s+TRIGGER\s+([A-Za-z0-9_]+)',statement,re.I)
              return match.group(1) if match else ''
          try:
              recorded={row.get('name') for row in all('SELECT name FROM d1_migrations ORDER BY id;')}
              events.append({'event':'recorded','names':sorted(x for x in recorded if x)})
              for filename in ['0016_stage08_precision_hardening.sql','0017_final_integrity_hardening.sql']:
                  if filename in recorded:
                      events.append({'event':'skip-migration','name':filename}); continue
                  if filename.startswith('0017'):
                      for sql in ['DROP TRIGGER IF EXISTS trg_migration_0017_term_limit_guard;','DROP TABLE IF EXISTS migration_0017_term_limit_guard;','DROP TRIGGER IF EXISTS trg_migration_0017_boundary_guard;','DROP TABLE IF EXISTS migration_0017_boundary_guard;']:
                          run(sql)
                  statements=split(Path('migrations-v2',filename).read_text(encoding='utf-8'))
                  events.append({'event':'count','migration':filename,'statements':len(statements)})
                  for index,raw in enumerate(statements,1):
                      statement=strip_comments(raw)
                      if not statement: continue
                      name=trigger(statement)
                      if name and all("SELECT name FROM sqlite_schema WHERE type='trigger' AND name='"+name+"';"):
                          events.append({'event':'skip-trigger','migration':filename,'index':index,'trigger':name}); continue
                      events.append({'event':'apply','migration':filename,'index':index,'trigger':name,'preview':' '.join(statement.split())[:500]})
                      run(statement)
                  run("INSERT OR IGNORE INTO d1_migrations (name) VALUES ('"+filename+"');")
                  if not all("SELECT name FROM d1_migrations WHERE name='"+filename+"';"): raise RuntimeError('record missing: '+filename)
                  events.append({'event':'recorded-migration','name':filename})
              final=[row.get('name') for row in all('SELECT name FROM d1_migrations ORDER BY id;')]
              missing=[f'{n:04d}' for n in range(1,18) if not any(str(name).startswith(f'{n:04d}') for name in final)]
              if missing: raise RuntimeError('missing migration prefixes: '+','.join(missing))
              out.joinpath('result.txt').write_text('PASSED\n',encoding='utf-8')
              out.joinpath('migration-names.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')
          except Exception as error:
              events.append({'event':'exception','type':type(error).__name__,'message':str(error),'traceback':traceback.format_exc()})
              out.joinpath('result.txt').write_text('FAILED\n',encoding='utf-8')
              raise
          finally:
              out.joinpath('events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          status=$?
          echo "$status" > "$EVIDENCE_DIR/exit-code.txt"
          exit "$status"
      - name: Stop proxy and verify Wrangler migration state
        if: always()
        shell: bash
        run: |
          set +e
          test -f /tmp/cpcv-proxy.pid && kill "$(cat /tmp/cpcv-proxy.pid)" >/dev/null 2>&1
          rm -f .cpcv-d1-proxy.js .cpcv-d1-proxy.toml
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/wrangler-list-after.txt" 2>&1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-d1-binding-final
          path: /tmp/cpcv-d1-binding-final
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAILED
          test -f "$EVIDENCE_DIR/result.txt" && result=$(tr -d '\r\n' < "$EVIDENCE_DIR/result.txt")
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-d1-binding-migration-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV D1 binding migration ${result} run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
