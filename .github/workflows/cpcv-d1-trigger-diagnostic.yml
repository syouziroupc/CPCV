name: CPCV D1 trigger migration diagnostic

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-d1-trigger-diagnostic.yml]

permissions:
  contents: write

env:
  RELEASE_COMMIT: cec431da537f76ab4c7b32a5e5d780daf72fa8b3
  PRODUCTION_DB_ID: 8315a076-67ad-44e6-8286-11887af52ad3
  EVIDENCE_DIR: /tmp/cpcv-d1-trigger-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Resolve credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"
      - name: Apply with detailed diagnostics
        shell: bash
        run: |
          set +e
          python - <<'PY' > "$EVIDENCE_DIR/stdout.txt" 2> "$EVIDENCE_DIR/stderr.txt"
          import json, os, re, sqlite3, sys, traceback, urllib.error, urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; db=os.environ['PRODUCTION_DB_ID']; out=Path(os.environ['EVIDENCE_DIR'])
          endpoint=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{db}/query'
          events=[]
          def call(sql):
              preview=' '.join(sql.split())[:240]
              events.append({'event':'request','preview':preview})
              request=urllib.request.Request(endpoint,data=json.dumps({'sql':sql}).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=60) as response:
                      raw=response.read().decode('utf-8','replace'); status=response.status
              except urllib.error.HTTPError as error:
                  raw=error.read().decode('utf-8','replace'); status=error.code
                  events.append({'event':'http-error','status':status,'body':raw[:2000],'preview':preview})
                  raise
              events.append({'event':'response','status':status,'body':raw[:2000],'preview':preview})
              body=json.loads(raw)
              if not body.get('success',False): raise RuntimeError(raw)
              if any(isinstance(x,dict) and x.get('success') is False for x in (body.get('result') or [])): raise RuntimeError(raw)
              return body.get('result') or []
          def rows(sql):
              result=[]
              for execution in call(sql):
                  if isinstance(execution,dict) and isinstance(execution.get('results'),list): result.extend(execution['results'])
              return result
          def split(text):
              result=[]; buf=''
              for line in text.splitlines(keepends=True):
                  buf += line
                  if sqlite3.complete_statement(buf):
                      statement=buf.strip(); buf=''
                      if statement: result.append(statement)
              if buf.strip(): raise RuntimeError('local incomplete SQL: '+buf[-300:])
              return result
          def trig(sql):
              m=re.search(r'\bCREATE\s+TRIGGER\s+([A-Za-z0-9_]+)',sql,re.I); return m.group(1) if m else ''
          try:
              migrations={r.get('name') for r in rows('SELECT name FROM d1_migrations ORDER BY id;')}
              events.append({'event':'recorded-migrations','names':sorted(x for x in migrations if x)})
              for filename in ['0016_stage08_precision_hardening.sql','0017_final_integrity_hardening.sql']:
                  if filename in migrations:
                      events.append({'event':'migration-skip','name':filename}); continue
                  if filename.startswith('0017'):
                      for cleanup in ['DROP TRIGGER IF EXISTS trg_migration_0017_term_limit_guard;','DROP TABLE IF EXISTS migration_0017_term_limit_guard;','DROP TRIGGER IF EXISTS trg_migration_0017_boundary_guard;','DROP TABLE IF EXISTS migration_0017_boundary_guard;']:
                          call(cleanup)
                  statements=split(Path('migrations-v2',filename).read_text(encoding='utf-8'))
                  events.append({'event':'statement-count','name':filename,'count':len(statements)})
                  for index,statement in enumerate(statements,1):
                      name=trig(statement)
                      if name and rows("SELECT name FROM sqlite_schema WHERE type='trigger' AND name='"+name+"';"):
                          events.append({'event':'skip-existing-trigger','migration':filename,'index':index,'trigger':name}); continue
                      events.append({'event':'apply-statement','migration':filename,'index':index,'trigger':name,'sql':statement[:1200]})
                      call(statement)
                  call("INSERT OR IGNORE INTO d1_migrations (name) VALUES ('"+filename+"');")
                  if not rows("SELECT name FROM d1_migrations WHERE name='"+filename+"';"): raise RuntimeError('migration record absent: '+filename)
                  events.append({'event':'migration-recorded','name':filename})
              final=[r.get('name') for r in rows('SELECT name FROM d1_migrations ORDER BY id;')]
              events.append({'event':'final','names':final})
              out.joinpath('result.txt').write_text('PASSED\n',encoding='utf-8')
          except Exception as error:
              events.append({'event':'exception','type':type(error).__name__,'message':str(error),'traceback':traceback.format_exc()})
              out.joinpath('result.txt').write_text('FAILED\n',encoding='utf-8')
              raise
          finally:
              out.joinpath('events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          status=$?
          echo "$status" > "$EVIDENCE_DIR/exit-code.txt"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-d1-trigger-diagnostic
          path: /tmp/cpcv-d1-trigger-diagnostic
          if-no-files-found: error
          retention-days: 14
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAILED
          test -f "$EVIDENCE_DIR/result.txt" && result=$(tr -d '\r\n' < "$EVIDENCE_DIR/result.txt")
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-d1-trigger-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV D1 trigger diagnostic ${result} run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
