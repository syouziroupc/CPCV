name: CPCV filter settings finalize

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cpcv-filter-settings-finalize.yml

permissions:
  contents: write

env:
  PRODUCTION_ORIGIN: "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
  EVIDENCE_DIR: "/tmp/cpcv-filter-settings-final"
  PATCH_COMMIT: "493de0d6d98973d3061fd8322537fef39b68d25a"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-visual.txt
          python -m playwright install --with-deps chromium
      - name: Recreate production source candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/live"
          git show "$PATCH_COMMIT:scripts/apply-filter-settings-ux.py" > /tmp/apply-filter-settings-ux.py
          python /tmp/apply-filter-settings-ux.py
          rm .github/workflows/cpcv-filter-settings-finalize.yml
          rm scripts/verify-filter-settings-production.py
          git add -A
          node scripts/generate-source-manifest.mjs
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Simplify filter presets and batch moderation settings"
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node --check public/assets/organization-settings.js
          npm run verify:source-manifest | tee "$EVIDENCE_DIR/source-manifest.txt"
          npm run check:v0810 | tee "$EVIDENCE_DIR/check-v0810.txt"
          npm run check:project | tee "$EVIDENCE_DIR/check-project.txt"
          npm run check:stage08 | tee "$EVIDENCE_DIR/check-stage08.txt"
          npm run deploy:dry-run | tee "$EVIDENCE_DIR/deploy-dry-run.txt"
      - name: Match production source files
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0 Safari/537.36'
          found=0
          for attempt in $(seq 1 100); do
            curl --fail --silent --show-error --retry 2 -A "$ua" -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/account?source=$CANDIDATE_COMMIT&attempt=$attempt" > "$EVIDENCE_DIR/live/account.html" || true
            if grep -q 'data-filter-preset="standard"' "$EVIDENCE_DIR/live/account.html"; then found=1; break; fi
            sleep 3
          done
          test "$found" = 1
          curl --fail --silent --show-error --retry 10 -A "$ua" -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/app.css?v=0.8.10-ui4&source=$CANDIDATE_COMMIT" > "$EVIDENCE_DIR/live/app.css"
          curl --fail --silent --show-error --retry 10 -A "$ua" -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/organization-settings.js?source=$CANDIDATE_COMMIT" > "$EVIDENCE_DIR/live/organization-settings.js"
          cmp public/account/index.html "$EVIDENCE_DIR/live/account.html"
          cmp public/assets/app.css "$EVIDENCE_DIR/live/app.css"
          cmp public/assets/organization-settings.js "$EVIDENCE_DIR/live/organization-settings.js"
          sha256sum public/account/index.html public/assets/app.css public/assets/organization-settings.js | tee "$EVIDENCE_DIR/production-source-hashes.txt"
          echo "LIVE_ACCOUNT_FILE=$EVIDENCE_DIR/live/account.html" >> "$GITHUB_ENV"
          echo "LIVE_CSS_FILE=$EVIDENCE_DIR/live/app.css" >> "$GITHUB_ENV"
          echo "LIVE_JS_FILE=$EVIDENCE_DIR/live/organization-settings.js" >> "$GITHUB_ENV"
      - name: Verify production behavior and visuals
        run: |
          set -euo pipefail
          git show HEAD^:scripts/verify-filter-settings-production.py > /tmp/verify-filter-settings-production.py
          python /tmp/verify-filter-settings-production.py
      - name: Publish verified source
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          candidate_commit=$CANDIDATE_COMMIT
          production_version=5ad25154-5d99-40a2-8181-1c8c4cd8db95
          production_source_matches=true
          instant_presets=true
          batch_review_mask_reject=true
          manual_changes_mark_custom=true
          responsive_widths=320,390,768,1440
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git push origin HEAD:master
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-filter-settings-final-evidence
          path: /tmp/cpcv-filter-settings-final
          if-no-files-found: ignore
          retention-days: 90
      - name: Cleanup failed finalizer
        if: failure()
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          for path in .github/workflows/cpcv-filter-settings-finalize.yml scripts/verify-filter-settings-production.py; do
            if [ -f "$path" ]; then git rm "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV filter settings finalizer failed run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
