name: CPCV filter settings release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cpcv-filter-settings-release.yml

permissions:
  contents: write

env:
  STAGING_ORIGIN: "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
  PRODUCTION_ORIGIN: "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
  EVIDENCE_DIR: "/tmp/cpcv-filter-settings-ux-evidence"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-visual.txt
          python -m playwright install --with-deps chromium
      - name: Resolve Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!item:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$TOKEN" && test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Build release candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python scripts/apply-filter-settings-ux.py
          rm scripts/apply-filter-settings-ux.py
          rm scripts/verify-filter-settings-ux.py
          rm .github/workflows/cpcv-filter-settings-release.yml
          git add -A
          node scripts/generate-source-manifest.mjs
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Simplify filter presets and batch moderation settings"
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Validate candidate
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          node --check public/assets/organization-settings.js
          npm run verify:source-manifest | tee "$EVIDENCE_DIR/source-manifest.txt"
          npm run check:v0810 | tee "$EVIDENCE_DIR/check-v0810.txt"
          npm run check:project | tee "$EVIDENCE_DIR/check-project.txt"
          npm run check:stage08 | tee "$EVIDENCE_DIR/check-stage08.txt"
          npm run deploy:dry-run | tee "$EVIDENCE_DIR/deploy-dry-run.txt"
      - name: Build staging config
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('wrangler.toml').read_text(encoding='utf-8')
          replacements = [
            ('name = "class-pdf-comment-viewer-v01"', 'name = "class-pdf-comment-viewer-v01-staging"'),
            ('database_name = "class_comment_db"\ndatabase_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"', 'database_name = "class_comment_db_staging"\ndatabase_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"'),
            ('database_name = "class_comment_db_v2"\ndatabase_id = "8315a076-67ad-44e6-8286-11887af52ad3"', 'database_name = "class_comment_db_v2_staging"\ndatabase_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"'),
            ('queue = "cpcv-ai-jobs"', 'queue = "cpcv-ai-jobs-staging"'),
            ('namespace_id = "826071901"', 'namespace_id = "826071801"'),
            ('namespace_id = "826071902"', 'namespace_id = "826071802"'),
            ('namespace_id = "826071903"', 'namespace_id = "826071803"'),
            ('namespace_id = "826071904"', 'namespace_id = "826071804"'),
            ('https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev', 'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'),
          ]
          for old, new in replacements:
            text = text.replace(old, new)
          text = re.sub(r'TURNSTILE_SITE_KEY = "[^"]+"', 'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"', text)
          Path('.cpcv-staging.wrangler.toml').write_text(text, encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml | tee "$EVIDENCE_DIR/staging-config.txt"
      - name: Deploy and verify staging
        run: |
          set -euo pipefail
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars | tee "$EVIDENCE_DIR/staging-deploy.txt"
          git show HEAD^:scripts/verify-filter-settings-ux.py > /tmp/verify-filter-settings-ux.py
          ORIGIN="$STAGING_ORIGIN" LABEL="staging" python /tmp/verify-filter-settings-ux.py
      - name: Deploy and verify production
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.toml --keep-vars | tee "$EVIDENCE_DIR/production-deploy.txt"
          ORIGIN="$PRODUCTION_ORIGIN" LABEL="production" python /tmp/verify-filter-settings-ux.py
          npx wrangler deployments status --name class-pdf-comment-viewer-v01 > "$EVIDENCE_DIR/production-status.txt"
      - name: Publish release
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          candidate_commit=$CANDIDATE_COMMIT
          instant_presets=true
          batch_review_mask_reject=true
          manual_changes_mark_custom=true
          flat_policy_hierarchy=true
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git push origin HEAD:master
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-filter-settings-ux-evidence
          path: /tmp/cpcv-filter-settings-ux-evidence
          if-no-files-found: ignore
          retention-days: 90
      - name: Cleanup failed release scaffolding
        if: failure()
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          for path in .github/workflows/cpcv-filter-settings-release.yml scripts/apply-filter-settings-ux.py scripts/verify-filter-settings-ux.py; do
            if [ -f "$path" ]; then git rm "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV filter settings release failed run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
