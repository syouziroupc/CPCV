name: CPCV filter UX actionlint

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cpcv-filter-ux-actionlint.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
      - name: Lint release workflow
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./actionlint -color .github/workflows/cpcv-filter-settings-ux.yml 2>&1 | tee /tmp/actionlint.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpcv-filter-ux-actionlint
          path: /tmp/actionlint.txt
          if-no-files-found: error
      - name: Remove diagnostic workflow
        if: always()
        run: |
          set -euo pipefail
          git rm .github/workflows/cpcv-filter-ux-actionlint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV filter UX actionlint run ${GITHUB_RUN_ID} result ${{ steps.lint.outcome }}"
          git push origin HEAD:master
