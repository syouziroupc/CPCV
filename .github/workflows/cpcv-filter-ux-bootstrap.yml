name: CPCV filter UX workflow bootstrap

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cpcv-filter-ux-bootstrap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair release workflow YAML
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cpcv-filter-settings-ux.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev': '  STAGING_ORIGIN: "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"',
            '  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev': '  PRODUCTION_ORIGIN: "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"',
            '  EVIDENCE_DIR: /tmp/cpcv-filter-settings-ux-evidence': '  EVIDENCE_DIR: "/tmp/cpcv-filter-settings-ux-evidence"',
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/cpcv-filter-ux-bootstrap.yml
          if [ -f .github/workflows/cpcv-filter-ux-yaml-fix.yml ]; then git rm .github/workflows/cpcv-filter-ux-yaml-fix.yml; fi
          git add .github/workflows/cpcv-filter-settings-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair CPCV filter UX release workflow YAML"
          git push origin HEAD:master
