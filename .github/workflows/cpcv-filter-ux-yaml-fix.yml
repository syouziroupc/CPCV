name: Fix CPCV filter UX workflow YAML

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cpcv-filter-ux-yaml-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quote release environment values
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cpcv-filter-settings-ux.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev', '  STAGING_ORIGIN: "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"')
          text = text.replace('  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev', '  PRODUCTION_ORIGIN: "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"')
          text = text.replace('  EVIDENCE_DIR: /tmp/cpcv-filter-settings-ux-evidence', '  EVIDENCE_DIR: "/tmp/cpcv-filter-settings-ux-evidence"')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/cpcv-filter-ux-yaml-fix.yml
          git add .github/workflows/cpcv-filter-settings-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix CPCV filter UX workflow YAML"
          git push origin HEAD:master
