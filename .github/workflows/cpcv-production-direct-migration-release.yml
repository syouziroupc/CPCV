name: CPCV direct trigger migration and production release

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-production-direct-migration-release.yml]

permissions:
  contents: write

env:
  RELEASE_COMMIT: cec431da537f76ab4c7b32a5e5d780daf72fa8b3
  PRODUCTION_DB_ID: 8315a076-67ad-44e6-8286-11887af52ad3
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  EVIDENCE_DIR: /tmp/cpcv-production-direct-release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium
          mkdir -p "$EVIDENCE_DIR"

      - name: Resolve Cloudflare credentials and runtime secrets
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""; account=""
          for item in TOKEN_1 TOKEN_2 TOKEN_3; do value="${!item:-}"; if [ -n "$value" ]; then token="$value"; break; fi; done
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

          auth=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets" > /tmp/widgets.json
          sitekey=$(jq -r '.result[]? | select(.name=="CPCV Production") | .sitekey' /tmp/widgets.json | head -n1)
          test -n "$sitekey"
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets/${sitekey}" > /tmp/widget.json
          secret=$(jq -r '.result.secret // empty' /tmp/widget.json)
          if [ -z "$secret" ]; then
            curl --fail-with-body -sS "${auth[@]}" --request POST "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets/${sitekey}/rotate_secret" > /tmp/rotate.json
            jq -e '.success == true' /tmp/rotate.json >/dev/null
            secret=$(jq -r '.result.secret // empty' /tmp/rotate.json)
          fi
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "TURNSTILE_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          auth_pepper=$(openssl rand -hex 32)
          public_pepper=$(openssl rand -hex 32)
          echo "::add-mask::$auth_pepper"; echo "::add-mask::$public_pepper"
          echo "AUTH_RATE_LIMIT_PEPPER=$auth_pepper" >> "$GITHUB_ENV"
          echo "PUBLIC_RATE_LIMIT_PEPPER=$public_pepper" >> "$GITHUB_ENV"

      - name: Reconfirm release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test -z "$(git status --porcelain)"
          npm run verify:source-manifest
          npm run verify:deployment
          npm run check:v0810
          node --no-warnings scripts/test-ai-v2.mjs
          npx wrangler deploy --dry-run --config wrangler.toml > "$EVIDENCE_DIR/dry-run.txt" 2>&1

      - name: Apply trigger migrations through complete SQLite statements
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_d1_migrations.py <<'PY'
          import json
          import os
          import re
          import sqlite3
          import urllib.error
          import urllib.request
          from pathlib import Path

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          database = os.environ['PRODUCTION_DB_ID']
          evidence = Path(os.environ['EVIDENCE_DIR'])
          endpoint = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          log = []

          def query(sql):
              payload = json.dumps({'sql': sql}).encode('utf-8')
              req = urllib.request.Request(endpoint, data=payload, method='POST', headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  body_text = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'HTTP {error.code}: {body_text}') from error
              if not body.get('success', False):
                  raise RuntimeError(json.dumps(body.get('errors', body), ensure_ascii=False))
              results = body.get('result') or []
              if any(item.get('success') is False for item in results if isinstance(item, dict)):
                  raise RuntimeError(json.dumps(results, ensure_ascii=False))
              return results

          def rows(sql):
              executions = query(sql)
              output = []
              for execution in executions:
                  if isinstance(execution, dict) and isinstance(execution.get('results'), list):
                      output.extend(execution['results'])
              return output

          def split_statements(text):
              statements = []
              buffer = ''
              for line in text.splitlines(keepends=True):
                  buffer += line
                  if sqlite3.complete_statement(buffer):
                      statement = buffer.strip()
                      buffer = ''
                      if statement and not all(part.strip().startswith('--') for part in statement.splitlines() if part.strip()):
                          statements.append(statement)
              if buffer.strip():
                  raise RuntimeError(f'incomplete local SQL buffer: {buffer[-200:]}')
              return statements

          def trigger_name(statement):
              match = re.search(r'\bCREATE\s+TRIGGER\s+([A-Za-z0-9_]+)', statement, re.I)
              return match.group(1) if match else ''

          applied = {row.get('name') for row in rows('SELECT name FROM d1_migrations ORDER BY id;')}
          for filename in ['0016_stage08_precision_hardening.sql', '0017_final_integrity_hardening.sql']:
              if filename in applied:
                  log.append({'migration': filename, 'status': 'already-recorded'})
                  continue
              if filename.startswith('0017'):
                  for cleanup in [
                      'DROP TRIGGER IF EXISTS trg_migration_0017_term_limit_guard;',
                      'DROP TABLE IF EXISTS migration_0017_term_limit_guard;',
                      'DROP TRIGGER IF EXISTS trg_migration_0017_boundary_guard;',
                      'DROP TABLE IF EXISTS migration_0017_boundary_guard;'
                  ]:
                      query(cleanup)
              statements = split_statements(Path('migrations-v2', filename).read_text(encoding='utf-8'))
              count = 0
              for statement in statements:
                  name = trigger_name(statement)
                  if name:
                      existing = rows("SELECT name FROM sqlite_schema WHERE type='trigger' AND name='" + name.replace("'", "''") + "';")
                      if existing:
                          log.append({'migration': filename, 'statement': name, 'status': 'already-exists'})
                          continue
                  query(statement)
                  count += 1
                  log.append({'migration': filename, 'statement': name or statement.split(None, 2)[:2], 'status': 'applied'})
              safe_name = filename.replace("'", "''")
              query(f"INSERT OR IGNORE INTO d1_migrations (name) VALUES ('{safe_name}');")
              recorded = rows(f"SELECT name FROM d1_migrations WHERE name='{safe_name}';")
              if not recorded:
                  raise RuntimeError(f'migration record missing after apply: {filename}')
              log.append({'migration': filename, 'status': 'recorded', 'statements_applied': count})

          final = [row.get('name') for row in rows('SELECT name FROM d1_migrations ORDER BY id;')]
          for prefix in [f'{number:04d}' for number in range(1, 18)]:
              if not any(str(name).startswith(prefix) for name in final):
                  raise RuntimeError(f'migration prefix missing: {prefix}')
          evidence.joinpath('direct-migration-log.json').write_text(json.dumps(log, ensure_ascii=False, indent=2), encoding='utf-8')
          evidence.joinpath('migration-names.json').write_text(json.dumps(final, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/apply_d1_migrations.py
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/migrations-after.txt" 2>&1

      - name: Verify remote database integrity
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/verify-remote-d1.mjs --config wrangler.toml > "$EVIDENCE_DIR/remote-d1-verification.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo initial_owner_pending=false > "$EVIDENCE_DIR/owner-status.txt"
          else
            grep -F 'DB_V2 has no active Owner in an active organization.' "$EVIDENCE_DIR/remote-d1-verification.txt"
            echo initial_owner_pending=true > "$EVIDENCE_DIR/owner-status.txt"
          fi

      - name: Configure Worker secrets and deploy production
        shell: bash
        run: |
          set -euo pipefail
          export AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY
          node scripts/configure-rate-limit-secret.mjs --config wrangler.toml > "$EVIDENCE_DIR/secret-configuration.txt" 2>&1
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/class-pdf-comment-viewer-v01"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-before.json"
          npx wrangler deploy --config wrangler.toml --keep-vars > "$EVIDENCE_DIR/deploy.txt" 2>&1
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-after.json"

      - name: Verify production pages, bindings and UI
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup; do
            safe=$(echo "$path" | tr '/' '_')
            code=$(curl -sS -L --retry 15 --retry-delay 3 --retry-all-errors -o "$EVIDENCE_DIR/page${safe}.html" -w '%{http_code}' "${PRODUCTION_ORIGIN}${path}?release=${RELEASE_COMMIT}")
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --fail-with-body -sS --retry 15 --retry-delay 3 "${PRODUCTION_ORIGIN}/assets/app.css?release=${RELEASE_COMMIT}" > "$EVIDENCE_DIR/app.css"
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$EVIDENCE_DIR/app.css"
          grep -F '<title>授業管理 | CPCV</title>' "$EVIDENCE_DIR/page_admin.html"
          grep -F '<title>アカウント作成 | CPCV</title>' "$EVIDENCE_DIR/page_signup.html"

          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev'
          out=Path(os.environ['EVIDENCE_DIR'])
          selector='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width in (390,768,1440):
                  page=browser.new_page(viewport={'width':width,'height':900})
                  for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                      response=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000)
                      assert response and response.status < 400
                      page.wait_for_timeout(900)
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                      rounded=page.eval_on_selector_all(selector,"els=>els.filter(e=>getComputedStyle(e).borderRadius.split(/\\s+/).some(v=>parseFloat(v)>0)).length")
                      assert rounded == 0
                      page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                  page.close()
              browser.close()
          PY

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/class-pdf-comment-viewer-v01"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/settings" > /tmp/settings.json
          jq 'walk(if type == "object" and has("text") and ((.type // "") | startswith("secret")) then .text = "<redacted>" else . end)' /tmp/settings.json > "$EVIDENCE_DIR/settings.json"
          jq -e '.result.bindings | any(.name=="DB_V2" and .type=="d1")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI_JOBS_QUEUE")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI")' "$EVIDENCE_DIR/settings.json" >/dev/null

      - name: Publish verified release tree
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          run_id=$GITHUB_RUN_ID
          release_commit=$RELEASE_COMMIT
          production_origin=$PRODUCTION_ORIGIN
          migration_method=complete-statement-D1-API
          migrations_applied=true
          secrets_configured=true
          deployed=true
          external_smoke=true
          responsive_screenshots=true
          initial_owner_signup_required=$(grep -q true "$EVIDENCE_DIR/owner-status.txt" && echo true || echo false)
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"

          git fetch origin master
          current_master=$(git rev-parse origin/master)
          tree=$(git rev-parse "${RELEASE_COMMIT}^{tree}")
          publish_commit=$(printf '%s\n' 'Publish verified CPCV production release' | git commit-tree "$tree" -p "$current_master" -p "$RELEASE_COMMIT")
          git push origin "$publish_commit":master
          echo "publish_commit=$publish_commit" >> "$EVIDENCE_DIR/release-record.txt"
          echo RELEASE_RESULT=PASSED >> "$GITHUB_ENV"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-direct-release-evidence
          path: /tmp/cpcv-production-direct-release
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove temporary workflow after failure
        if: always() && env.RELEASE_RESULT != 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/cpcv-production-direct-migration-release.yml ]; then
            git rm .github/workflows/cpcv-production-direct-migration-release.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV direct production release FAILED run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
