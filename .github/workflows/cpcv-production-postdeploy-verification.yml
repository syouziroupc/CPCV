name: CPCV production post-deploy verification

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-production-postdeploy-verification.yml]

permissions:
  contents: write

env:
  RELEASE_COMMIT: cec431da537f76ab4c7b32a5e5d780daf72fa8b3
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  EVIDENCE_DIR: /tmp/cpcv-production-postdeploy

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium
          mkdir -p "$EVIDENCE_DIR"
      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""; account=""
          for item in TOKEN_1 TOKEN_2 TOKEN_3; do value="${!item:-}"; if [ -n "$value" ]; then token="$value"; break; fi; done
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Verify release source and database
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          npm run verify:source-manifest
          npm run verify:deployment
          npm run check:v0810
          node --no-warnings scripts/test-ai-v2.mjs
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/migrations.txt" 2>&1
          grep -F 'No migrations to apply' "$EVIDENCE_DIR/migrations.txt"
          set +e
          node scripts/verify-remote-d1.mjs --config wrangler.toml > "$EVIDENCE_DIR/remote-d1-verification.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo initial_owner_pending=false > "$EVIDENCE_DIR/owner-status.txt"
          else
            grep -F 'DB_V2 has no active Owner in an active organization.' "$EVIDENCE_DIR/remote-d1-verification.txt"
            echo initial_owner_pending=true > "$EVIDENCE_DIR/owner-status.txt"
          fi
      - name: Verify every production page with propagation retries
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/http-status.txt"
          for item in 'home:/' 'about:/about' 'guide:/guide' 'privacy:/privacy' 'admin:/admin' 'signup:/signup'; do
            name=${item%%:*}; path=${item#*:}; success=0
            for attempt in $(seq 1 30); do
              code=$(curl -A 'curl/8.5.0 CPCV-Release-Verification' -sS -L --connect-timeout 15 --max-time 45 -o "$EVIDENCE_DIR/page_${name}.html" -w '%{http_code}' "${PRODUCTION_ORIGIN}${path}?release=${RELEASE_COMMIT}&attempt=${attempt}" || true)
              echo "$name attempt=$attempt status=$code" >> "$EVIDENCE_DIR/http-status.txt"
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ]; then success=1; break; fi
              sleep 3
            done
            test "$success" -eq 1
            test -s "$EVIDENCE_DIR/page_${name}.html"
          done
          curl -A 'curl/8.5.0 CPCV-Release-Verification' --fail-with-body -sS --retry 20 --retry-delay 3 --retry-all-errors "${PRODUCTION_ORIGIN}/assets/app.css?release=${RELEASE_COMMIT}" > "$EVIDENCE_DIR/app.css"
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$EVIDENCE_DIR/app.css"
          grep -F '<title>CPCV | 授業の反応をその場で拾う</title>' "$EVIDENCE_DIR/page_home.html"
          grep -F '<title>CPCVとは | 授業の反応をその場で拾う</title>' "$EVIDENCE_DIR/page_about.html"
          grep -F '<title>使い方 | CPCV</title>' "$EVIDENCE_DIR/page_guide.html"
          grep -F '<title>プライバシー | CPCV</title>' "$EVIDENCE_DIR/page_privacy.html"
          grep -F '<title>授業管理 | CPCV</title>' "$EVIDENCE_DIR/page_admin.html"
          grep -F '<title>アカウント作成 | CPCV</title>' "$EVIDENCE_DIR/page_signup.html"
      - name: Verify responsive visual layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev'
          out=Path(os.environ['EVIDENCE_DIR'])
          selector='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          measurements=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width in (390,768,1440):
                  page=browser.new_page(viewport={'width':width,'height':900}, user_agent='Mozilla/5.0 CPCV Release Verification')
                  for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                      response=None
                      for attempt in range(10):
                          response=page.goto(origin+path+f'?visual={width}-{attempt}',wait_until='domcontentloaded',timeout=60000)
                          if response and response.status < 400: break
                          page.wait_for_timeout(2000)
                      assert response and response.status < 400
                      page.wait_for_timeout(1000)
                      scroll=page.evaluate('document.documentElement.scrollWidth')
                      inner=page.evaluate('window.innerWidth')
                      rounded=page.eval_on_selector_all(selector,"els=>els.filter(e=>getComputedStyle(e).borderRadius.split(/\\s+/).some(v=>parseFloat(v)>0)).length")
                      assert scroll <= inner + 1
                      assert rounded == 0
                      measurements.append({'page':name,'width':width,'scrollWidth':scroll,'innerWidth':inner,'roundedTargets':rounded})
                      page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                  page.close()
              browser.close()
          import json
          out.joinpath('visual-measurements.json').write_text(json.dumps(measurements,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Verify deployed bindings and deployment ID
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/class-pdf-comment-viewer-v01"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/settings" > /tmp/settings.json
          jq 'walk(if type == "object" and has("text") and ((.type // "") | startswith("secret")) then .text = "<redacted>" else . end)' /tmp/settings.json > "$EVIDENCE_DIR/settings.json"
          jq -e '.result.bindings | any(.name=="DB_V2" and .type=="d1")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI_JOBS_QUEUE")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AUTH_RATE_LIMIT_PEPPER" and (.type|startswith("secret")))' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="PUBLIC_RATE_LIMIT_PEPPER" and (.type|startswith("secret")))' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="TURNSTILE_SECRET_KEY" and (.type|startswith("secret")))' "$EVIDENCE_DIR/settings.json" >/dev/null
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments.json"
          deployment_id=$(jq -r '.result[0].id // .result[0].version_id // empty' "$EVIDENCE_DIR/deployments.json")
          test -n "$deployment_id"
          echo "DEPLOYMENT_ID=$deployment_id" >> "$GITHUB_ENV"
      - name: Publish release to master
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          run_id=$GITHUB_RUN_ID
          release_commit=$RELEASE_COMMIT
          production_origin=$PRODUCTION_ORIGIN
          deployment_id=$DEPLOYMENT_ID
          migrations_applied=true
          secrets_configured=true
          deployed=true
          external_pages_verified=true
          responsive_screenshots=true
          initial_owner_signup_required=$(grep -q true "$EVIDENCE_DIR/owner-status.txt" && echo true || echo false)
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git fetch origin master
          current_master=$(git rev-parse origin/master)
          tree=$(git rev-parse "${RELEASE_COMMIT}^{tree}")
          publish_commit=$(printf '%s\n' 'Publish verified CPCV production release' | git commit-tree "$tree" -p "$current_master" -p "$RELEASE_COMMIT")
          git push origin "$publish_commit":master
          echo "publish_commit=$publish_commit" >> "$EVIDENCE_DIR/release-record.txt"
          echo RELEASE_RESULT=PASSED >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-postdeploy-evidence
          path: /tmp/cpcv-production-postdeploy
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove workflow after failure
        if: always() && env.RELEASE_RESULT != 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/cpcv-production-postdeploy-verification.yml ]; then
            git rm .github/workflows/cpcv-production-postdeploy-verification.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV postdeploy verification FAILED run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
