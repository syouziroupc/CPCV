name: CPCV production release final

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-production-release-final.yml]

permissions:
  contents: write

env:
  PRODUCTION_WORKER: class-pdf-comment-viewer-v01
  PRODUCTION_DB: class_comment_db_v2
  PRODUCTION_QUEUE: cpcv-ai-jobs
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  RELEASE_BRANCH: agent/production-release-v0810
  EVIDENCE_DIR: /tmp/cpcv-production-evidence

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""; account=""
          for item in TOKEN_1 TOKEN_2 TOKEN_3; do value="${!item:-}"; if [ -n "$value" ]; then token="$value"; break; fi; done
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE_DIR"

      - name: Remove temporary workflow locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cpcv-production-release-final.yml
          git commit -m "Remove temporary CPCV final production workflow"

      - name: Resolve production resources and secrets
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" > /tmp/d1-list.json
          jq -e '.success == true' /tmp/d1-list.json >/dev/null
          dbid=$(jq -r --arg name "$PRODUCTION_DB" '.result[]? | select(.name==$name) | (.uuid // .id // empty)' /tmp/d1-list.json | head -n1)
          test -n "$dbid"
          echo "PRODUCTION_DB_ID=$dbid" >> "$GITHUB_ENV"
          jq -n --arg id "$dbid" --arg name "$PRODUCTION_DB" '{action:"existing",name:$name,database_id:$id}' > "$EVIDENCE_DIR/d1.json"

          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues?per_page=100" > /tmp/queues.json
          jq -e '.success == true' /tmp/queues.json >/dev/null
          queue_id=$(jq -r --arg name "$PRODUCTION_QUEUE" '.result[]? | select(.queue_name==$name or .name==$name) | (.queue_id // .id // empty)' /tmp/queues.json | head -n1)
          test -n "$queue_id"
          jq -n --arg id "$queue_id" --arg name "$PRODUCTION_QUEUE" '{action:"existing",name:$name,queue_id:$id}' > "$EVIDENCE_DIR/queue.json"

          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" > /tmp/widgets.json
          jq -e '.success == true' /tmp/widgets.json >/dev/null
          sitekey=$(jq -r '.result[]? | select(.name=="CPCV Production") | .sitekey' /tmp/widgets.json | head -n1)
          test -n "$sitekey"
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${sitekey}" > /tmp/widget-detail.json
          secret=$(jq -r '.result.secret // empty' /tmp/widget-detail.json)
          action=existing
          if [ -z "$secret" ]; then
            curl --fail-with-body -sS "${auth[@]}" --request POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${sitekey}/rotate_secret" > /tmp/widget-rotate.json
            jq -e '.success == true' /tmp/widget-rotate.json >/dev/null
            secret=$(jq -r '.result.secret // empty' /tmp/widget-rotate.json)
            action=rotated
          fi
          test -n "$secret"
          echo "::add-mask::$secret"
          echo "TURNSTILE_SITE_KEY=$sitekey" >> "$GITHUB_ENV"
          echo "TURNSTILE_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          jq -n --arg action "$action" --arg sitekey "$sitekey" '{action:$action,name:"CPCV Production",sitekey:$sitekey}' > "$EVIDENCE_DIR/turnstile.json"

          auth_pepper=$(openssl rand -hex 32)
          public_pepper=$(openssl rand -hex 32)
          echo "::add-mask::$auth_pepper"; echo "::add-mask::$public_pepper"
          echo "AUTH_RATE_LIMIT_PEPPER=$auth_pepper" >> "$GITHUB_ENV"
          echo "PUBLIC_RATE_LIMIT_PEPPER=$public_pepper" >> "$GITHUB_ENV"

      - name: Create and publish release candidate branch
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true

          assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }

          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db"
          database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"

          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2"
          database_id = "${PRODUCTION_DB_ID}"
          migrations_dir = "migrations-v2"

          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]

          [ai]
          binding = "AI"

          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs"

          [[queues.consumers]]
          queue = "cpcv-ai-jobs"
          max_batch_size = 5
          max_batch_timeout = 1
          max_retries = 3
          max_concurrency = 10

          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]

          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071901"
          simple = { limit = 20, period = 60 }

          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071902"
          simple = { limit = 10, period = 60 }

          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071903"
          simple = { limit = 30, period = 60 }

          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071904"
          simple = { limit = 30, period = 60 }

          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_MODERATION_FALLBACK_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "5000"
          AI_TRANSLATION_FALLBACK_TIMEOUT_MS = "5000"
          AI_QUEUE_PARALLELISM = "5"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "${TURNSTILE_SITE_KEY}"

          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          EOF

          cat > docs/final-stage08/17_CLOUDFLARE_PENDING_VALUES.md <<EOF
          # Cloudflare production設定状態

          2026-07-25のproduction releaseで外部値を確定した。

          ## 設定済み

          - DB_V2: class_comment_db_v2 / ${PRODUCTION_DB_ID}
          - Rate Limiting namespace: 826071901から826071904
          - AUTH_EMAIL_FROM: noreply@szworld.uk
          - AUTH_EMAIL_REPLY_TO: noreply@szworld.uk
          - TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
          - EMAIL.allowed_sender_addresses: noreply@szworld.uk
          - Queue: cpcv-ai-jobs
          - AUTH_RATE_LIMIT_PEPPER: Worker secret
          - PUBLIC_RATE_LIMIT_PEPPER: Worker secret
          - TURNSTILE_SECRET_KEY: Worker secret

          このcommitは全回帰。D1 migration。remote schema検査。production deploy。外部smoke testが合格した場合だけmasterへ反映する。
          EOF

          git add wrangler.toml docs/final-stage08/17_CLOUDFLARE_PENDING_VALUES.md
          npm run manifest:source
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          git commit -m "Configure verified CPCV production resources"
          release_commit=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          git push --force origin HEAD:${RELEASE_BRANCH}
          printf 'release_commit=%s\n' "$release_commit" > "$EVIDENCE_DIR/release-candidate.txt"

      - name: Validate clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm run verify:source-manifest
          npm run verify:deployment
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Apply all production migrations
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PRODUCTION_WORKER}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-before.json"
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/migrations-before.txt"
          npx wrangler d1 migrations apply DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/migrations-apply.txt"
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/migrations-after.txt"
          node scripts/verify-remote-d1.mjs --config wrangler.toml > "$EVIDENCE_DIR/remote-d1-verification.txt"

      - name: Configure secrets and deploy production
        shell: bash
        run: |
          set -euo pipefail
          export AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY
          node scripts/configure-rate-limit-secret.mjs --config wrangler.toml > "$EVIDENCE_DIR/secret-configuration.txt"
          npx wrangler deploy --config wrangler.toml --keep-vars > "$EVIDENCE_DIR/deploy.txt"

      - name: Verify production externally and visually
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup; do
            safe=$(echo "$path" | tr '/' '_')
            code=$(curl -sS -L --retry 15 --retry-delay 3 --retry-all-errors -o "$EVIDENCE_DIR/page${safe}.html" -w '%{http_code}' "${PRODUCTION_ORIGIN}${path}?release=${RELEASE_COMMIT}")
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --fail-with-body -sS --retry 15 --retry-delay 3 "${PRODUCTION_ORIGIN}/assets/app.css?release=${RELEASE_COMMIT}" > "$EVIDENCE_DIR/app.css"
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$EVIDENCE_DIR/app.css"
          grep -F 'app.css?v=0.8.10' "$EVIDENCE_DIR/page_.html"
          grep -F '<title>授業管理 | CPCV</title>' "$EVIDENCE_DIR/page_admin.html"

          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev'
          out=Path(os.environ['EVIDENCE_DIR'])
          selector='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for width in (390,768,1440):
                  page=browser.new_page(viewport={'width':width,'height':900})
                  for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                      response=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000)
                      assert response and response.status < 400
                      page.wait_for_timeout(900)
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                      rounded=page.eval_on_selector_all(selector,"els=>els.filter(e=>getComputedStyle(e).borderRadius.split(/\\s+/).some(v=>parseFloat(v)>0)).length")
                      assert rounded == 0
                      page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                  page.close()
              browser.close()
          PY

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PRODUCTION_WORKER}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/settings" > /tmp/settings.json
          jq 'walk(if type == "object" and has("text") and ((.type // "") | startswith("secret")) then .text = "<redacted>" else . end)' /tmp/settings.json > "$EVIDENCE_DIR/settings.json"
          jq -e '.result.bindings | any(.name=="DB_V2" and .type=="d1")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI_JOBS_QUEUE")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI")' "$EVIDENCE_DIR/settings.json" >/dev/null
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-after.json"

      - name: Publish verified production release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          run_id=${GITHUB_RUN_ID}
          release_commit=${RELEASE_COMMIT}
          production_origin=${PRODUCTION_ORIGIN}
          production_db_id=${PRODUCTION_DB_ID}
          turnstile_site_key=${TURNSTILE_SITE_KEY}
          migrations_applied=true
          secrets_configured=true
          deployed=true
          external_smoke=true
          responsive_screenshots=true
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git push origin HEAD:master
          echo "RELEASE_RESULT=PASSED" >> "$GITHUB_ENV"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-final-evidence
          path: /tmp/cpcv-production-evidence
          if-no-files-found: ignore
          retention-days: 90

      - name: Cleanup failed workflow
        if: always() && env.RELEASE_RESULT != 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/cpcv-production-release-final.yml ]; then
            git rm .github/workflows/cpcv-production-release-final.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV production final FAILED run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
