name: CPCV production release fixture fix and deploy

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-production-release-fixture-fix.yml]

permissions:
  contents: write

env:
  BASE_RELEASE_COMMIT: 86d4589ccb8b19564dd989bb12e9a9792d09fad3
  RELEASE_BRANCH: agent/production-release-v0810
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  EVIDENCE_DIR: /tmp/cpcv-production-release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_RELEASE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium
          mkdir -p "$EVIDENCE_DIR"

      - name: Resolve Cloudflare credentials and secrets
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""; account=""
          for item in TOKEN_1 TOKEN_2 TOKEN_3; do value="${!item:-}"; if [ -n "$value" ]; then token="$value"; break; fi; done
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          auth=(-H "Authorization: Bearer ${token}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets" > /tmp/widgets.json
          sitekey=$(jq -r '.result[]? | select(.name=="CPCV Production") | .sitekey' /tmp/widgets.json | head -n1)
          test -n "$sitekey"
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets/${sitekey}" > /tmp/widget.json
          secret=$(jq -r '.result.secret // empty' /tmp/widget.json)
          if [ -z "$secret" ]; then
            curl --fail-with-body -sS "${auth[@]}" --request POST "https://api.cloudflare.com/client/v4/accounts/${account}/challenges/widgets/${sitekey}/rotate_secret" > /tmp/rotate.json
            jq -e '.success == true' /tmp/rotate.json >/dev/null
            secret=$(jq -r '.result.secret // empty' /tmp/rotate.json)
          fi
          test -n "$secret"
          echo "::add-mask::$secret"; echo "TURNSTILE_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          auth_pepper=$(openssl rand -hex 32); public_pepper=$(openssl rand -hex 32)
          echo "::add-mask::$auth_pepper"; echo "::add-mask::$public_pepper"
          echo "AUTH_RATE_LIMIT_PEPPER=$auth_pepper" >> "$GITHUB_ENV"
          echo "PUBLIC_RATE_LIMIT_PEPPER=$public_pepper" >> "$GITHUB_ENV"

      - name: Repair deployment verifier fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/test-deployment-verifiers.mjs')
          text=path.read_text(encoding='utf-8')
          start=text.index('  const current = readFileSync(resolve(ROOT, "wrangler.toml"), "utf8");')
          end=text.index('  const incompletePath = join(temp, "incomplete.toml");', start)
          block='''  const current = readFileSync(resolve(ROOT, "wrangler.toml"), "utf8");
          const validConfig = current;
          const incompleteConfig = current
            .replace(/(\\[\\[d1_databases\\]\\][\\s\\S]*?binding = "DB_V2"[\\s\\S]*?database_name = "class_comment_db_v2"\\s*\\n)\\s*database_id = "[^"]+"\\s*\\n/, "$1")
            .replace(/\\n\\[\\[ratelimits\\]\\][\\s\\S]*?(?=\\n\\[\\[ratelimits\\]\\]|\\n\\[vars\\])/g, "");
          '''
          text=text[:start]+block+text[end:]
          text=text.replace('writeFileSync(incompletePath, current);','writeFileSync(incompletePath, incompleteConfig);')
          text=text.replace('allowed_sender_addresses = [ "noreply@auth.real-domain.jp" ]\\n','allowed_sender_addresses = [ "noreply@szworld.uk" ]\\n')
          text=text.replace("validConfig.replace('namespace_id = \"1002\"', 'namespace_id = \"1001\"')","validConfig.replace('namespace_id = \"826071902\"', 'namespace_id = \"826071901\"')")
          text=text.replace('database_id = "123e4567-e89b-42d3-a456-426614174000"','database_id = "8315a076-67ad-44e6-8286-11887af52ad3"')
          text=text.replace('database_id = "323e4567-e89b-42d3-a456-426614174002"','database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"')
          text=text.replace(".replace('TURNSTILE_SITE_KEY = \"0x4AAAAA-real-site-key\"', 'TURNSTILE_SITE_KEY = \"0x4AAAAA-staging-site-key\"')", ".replace(/TURNSTILE_SITE_KEY = \"[^\"]+\"/, 'TURNSTILE_SITE_KEY = \"1x00000000000000000000AA\"')")
          text=text.replace(".replace('namespace_id = \"1001\"', 'namespace_id = \"2001\"')", ".replace('namespace_id = \"826071901\"', 'namespace_id = \"826071801\"')")
          text=text.replace(".replace('namespace_id = \"1002\"', 'namespace_id = \"2002\"')", ".replace('namespace_id = \"826071902\"', 'namespace_id = \"826071802\"')")
          text=text.replace(".replace('namespace_id = \"1003\"', 'namespace_id = \"2003\"')", ".replace('namespace_id = \"826071903\"', 'namespace_id = \"826071803\"')")
          text=text.replace(".replace('namespace_id = \"1004\"', 'namespace_id = \"2004\"');", ".replace('namespace_id = \"826071904\"', 'namespace_id = \"826071804\"');")
          text=text.replace("stagingConfig.replace('database_id = \"323e4567-e89b-42d3-a456-426614174002\"', 'database_id = \"123e4567-e89b-42d3-a456-426614174000\"')", "stagingConfig.replace('database_id = \"7b30a11d-5b3c-49f5-bc54-9a1326818089\"', 'database_id = \"8315a076-67ad-44e6-8286-11887af52ad3\"')")
          text=text.replace("stagingConfig.replace('namespace_id = \"2001\"', 'namespace_id = \"1001\"')", "stagingConfig.replace('namespace_id = \"826071801\"', 'namespace_id = \"826071901\"')")
          path.write_text(text,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test-deployment-verifiers.mjs
          npm run manifest:source
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          git commit -m "Update deployment verifier fixtures for production values"
          release_commit=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          echo "release_commit=$release_commit" > "$EVIDENCE_DIR/release-candidate.txt"
          git push --force origin HEAD:${RELEASE_BRANCH}

      - name: Run complete validation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm run verify:source-manifest
          npm run verify:deployment
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Apply legacy and DB_V2 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.toml > "$EVIDENCE_DIR/legacy-migrations.txt"
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/v2-migrations-before.txt"
          npx wrangler d1 migrations apply DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/v2-migrations-apply.txt"
          npx wrangler d1 migrations list DB_V2 --remote --config wrangler.toml > "$EVIDENCE_DIR/v2-migrations-after.txt"
          set +e
          node scripts/verify-remote-d1.mjs --config wrangler.toml > "$EVIDENCE_DIR/remote-d1-verification.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            grep -F 'DB_V2 has no active Owner in an active organization.' "$EVIDENCE_DIR/remote-d1-verification.txt"
            echo initial_owner_pending=true > "$EVIDENCE_DIR/owner-status.txt"
          else
            echo initial_owner_pending=false > "$EVIDENCE_DIR/owner-status.txt"
          fi

      - name: Configure secrets and deploy
        shell: bash
        run: |
          set -euo pipefail
          export AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY
          node scripts/configure-rate-limit-secret.mjs --config wrangler.toml > "$EVIDENCE_DIR/secret-configuration.txt"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/class-pdf-comment-viewer-v01"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-before.json"
          npx wrangler deploy --config wrangler.toml --keep-vars > "$EVIDENCE_DIR/deploy.txt"
          curl --fail-with-body -sS "${auth[@]}" "${api}/deployments" > "$EVIDENCE_DIR/deployments-after.json"

      - name: Verify production remotely
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup; do
            safe=$(echo "$path" | tr '/' '_')
            code=$(curl -sS -L --retry 15 --retry-delay 3 --retry-all-errors -o "$EVIDENCE_DIR/page${safe}.html" -w '%{http_code}' "${PRODUCTION_ORIGIN}${path}?release=${RELEASE_COMMIT}")
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --fail-with-body -sS --retry 15 --retry-delay 3 "$PRODUCTION_ORIGIN/assets/app.css?release=$RELEASE_COMMIT" > "$EVIDENCE_DIR/app.css"
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$EVIDENCE_DIR/app.css"
          grep -F '<title>授業管理 | CPCV</title>' "$EVIDENCE_DIR/page_admin.html"
          grep -F '<title>アカウント作成 | CPCV</title>' "$EVIDENCE_DIR/page_signup.html"
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev'; out=Path(os.environ['EVIDENCE_DIR'])
          selector='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for width in (390,768,1440):
                  page=b.new_page(viewport={'width':width,'height':900})
                  for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                      response=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000); assert response and response.status<400
                      page.wait_for_timeout(900); assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                      assert page.eval_on_selector_all(selector,"els=>els.filter(e=>getComputedStyle(e).borderRadius.split(/\\s+/).some(v=>parseFloat(v)>0)).length")==0
                      page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                  page.close()
              b.close()
          PY
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/class-pdf-comment-viewer-v01"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "${api}/settings" > /tmp/settings.json
          jq 'walk(if type == "object" and has("text") and ((.type // "") | startswith("secret")) then .text = "<redacted>" else . end)' /tmp/settings.json > "$EVIDENCE_DIR/settings.json"
          jq -e '.result.bindings | any(.name=="DB_V2" and .type=="d1")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI_JOBS_QUEUE")' "$EVIDENCE_DIR/settings.json" >/dev/null
          jq -e '.result.bindings | any(.name=="AI")' "$EVIDENCE_DIR/settings.json" >/dev/null

      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/release-record.txt" <<EOF
          result=PASSED
          run_id=$GITHUB_RUN_ID
          release_commit=$RELEASE_COMMIT
          production_origin=$PRODUCTION_ORIGIN
          migrations_applied=true
          secrets_configured=true
          deployed=true
          external_smoke=true
          responsive_screenshots=true
          initial_owner_signup_required=$(grep -q true "$EVIDENCE_DIR/owner-status.txt" && echo true || echo false)
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find "$EVIDENCE_DIR" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/SHA256SUMS.txt"
          git push origin HEAD:master
          echo RELEASE_RESULT=PASSED >> "$GITHUB_ENV"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-release-final-evidence
          path: /tmp/cpcv-production-release
          if-no-files-found: ignore
          retention-days: 90

      - name: Cleanup failed trigger
        if: always() && env.RELEASE_RESULT != 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/cpcv-production-release-fixture-fix.yml ]; then
            git rm .github/workflows/cpcv-production-release-fixture-fix.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "CPCV production fixture release FAILED run ${GITHUB_RUN_ID}"
            git push origin HEAD:master
          fi
