name: CPCV updated release candidate diagnostic

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-release-candidate-diagnostic-2.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86d4589ccb8b19564dd989bb12e9a9792d09fad3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm install --global npm@11.18.0
          npm ci
      - name: Run validators independently
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/cpcv-diagnostic-2
          commands=(
            "npm run verify:source-manifest"
            "npm run verify:deployment"
            "npm run check"
            "npm run check:project"
            "npm run check:pdf-links"
            "npm run verify:final-docs"
            "npm run check:stage08"
            "npm run test:owner-bootstrap"
            "npm run deploy:dry-run"
            "npm audit"
            "npm audit --omit=dev"
          )
          i=0; : > /tmp/cpcv-diagnostic-2/summary.txt
          for command in "${commands[@]}"; do
            i=$((i+1)); file=$(printf '/tmp/cpcv-diagnostic-2/%02d.log' "$i")
            echo "$command" > "$file"; bash -lc "$command" >> "$file" 2>&1; status=$?
            printf '%02d status=%d command=%s\n' "$i" "$status" "$command" >> /tmp/cpcv-diagnostic-2/summary.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-release-candidate-diagnostic-2
          path: /tmp/cpcv-diagnostic-2
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-release-candidate-diagnostic-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV candidate diagnostic 2 run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
