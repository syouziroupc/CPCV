name: CPCV release candidate diagnostic

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-release-candidate-diagnostic.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec2fdffbf04639aacfa06b34df86ff5b91aa6f6b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm install --global npm@11.18.0
          npm ci
      - name: Run validators independently
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/cpcv-candidate-diagnostic
          commands=(
            "npm run verify:source-manifest"
            "npm run verify:deployment"
            "npm run check"
            "npm run check:project"
            "npm run check:pdf-links"
            "npm run verify:final-docs"
            "npm run check:stage08"
            "npm run test:owner-bootstrap"
            "npm run deploy:dry-run"
            "npm audit"
            "npm audit --omit=dev"
          )
          i=0
          : > /tmp/cpcv-candidate-diagnostic/summary.txt
          for command in "${commands[@]}"; do
            i=$((i+1))
            file=$(printf '/tmp/cpcv-candidate-diagnostic/%02d.log' "$i")
            echo "$command" > "$file"
            bash -lc "$command" >> "$file" 2>&1
            status=$?
            printf '%02d status=%d command=%s\n' "$i" "$status" "$command" >> /tmp/cpcv-candidate-diagnostic/summary.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-release-candidate-diagnostic
          path: /tmp/cpcv-candidate-diagnostic
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-release-candidate-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV candidate diagnostic run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
