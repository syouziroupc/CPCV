name: CPCV staging remote-dev release

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-staging-remote-dev-release.yml]

permissions:
  contents: write

env:
  SOURCE_COMMIT: ce93380d617672e086b9971fe82bb4f8ffccf861
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium
      - name: Resolve credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Validate source
        run: |
          npm run verify:source-manifest
          npm run check:v0810
          node --no-warnings scripts/test-ai-v2.mjs
      - name: Materialize runtime files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-evidence
          cat > .cpcv-staging.wrangler.toml <<'TOML'
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true
          assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }
          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]
          [ai]
          binding = "AI"
          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 5
          max_batch_timeout = 1
          max_retries = 3
          max_concurrency = 10
          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]
          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071801"
          simple = { limit = 20, period = 60 }
          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071802"
          simple = { limit = 10, period = 60 }
          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071804"
          simple = { limit = 30, period = 60 }
          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_MODERATION_FALLBACK_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "5000"
          AI_TRANSLATION_FALLBACK_TIMEOUT_MS = "5000"
          AI_QUEUE_PARALLELISM = "5"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          TOML
          cat > .cpcv-db-inspector.js <<'JS'
          const required=["organizations","users","organization_members","auth_sessions","password_reset_tokens","live_sessions","audit_logs","participants","comments","comment_events","auth_session_csrf_tokens","session_moderation_settings","comment_moderation_actions","realtime_session_state","realtime_events","realtime_connection_tickets","pending_registrations","organization_origins","organization_quotas","organization_invitations","email_change_requests","email_enrollment_requests","email_delivery_attempts","auth_public_counters","organization_email_events","organization_ai_settings","session_ai_settings","ai_jobs","ai_results","translations","ai_usage_events","content_filter_terms","organization_content_filter_policies","session_content_filter_settings","comment_filter_matches","content_filter_pack_installs","pdf_documents","session_pdf_bindings","pdf_pages","session_pdf_state","pdf_page_events","comment_page_links","understanding_signals","analytics_snapshots"];
          export default {async fetch(req,env){if(req.headers.get('x-maintenance-nonce')!==env.MAINTENANCE_NONCE)return new Response('forbidden',{status:403});const m=(await env.DB_V2.prepare("SELECT name FROM d1_migrations ORDER BY id").all()).results||[];const t=(await env.DB_V2.prepare("SELECT name FROM sqlite_schema WHERE type='table'").all()).results||[];const names=new Set(t.map(x=>x.name));const q=(await env.DB_V2.prepare('PRAGMA quick_check').all()).results||[];const fk=(await env.DB_V2.prepare('PRAGMA foreign_key_check').all()).results||[];return Response.json({ok:true,migrations:m.map(x=>x.name),missingTables:required.filter(x=>!names.has(x)),quick:q,foreignKeyErrors:fk.length});}};
          JS
          cat > .cpcv-inspector.wrangler.toml <<'TOML'
          name = "cpcv-staging-db-inspector-preview"
          main = ".cpcv-db-inspector.js"
          compatibility_date = "2026-06-17"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          TOML
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          npx wrangler deploy --dry-run --config .cpcv-staging.wrangler.toml
      - name: Inspect remote staging D1 through preview proxy
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(openssl rand -hex 32); echo "::add-mask::$nonce"
          npx wrangler dev --remote --config .cpcv-inspector.wrangler.toml --port 8787 --var "MAINTENANCE_NONCE:$nonce" > staging-evidence/remote-dev.log 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS -H "x-maintenance-nonce: $nonce" http://127.0.0.1:8787/ > staging-evidence/db-schema.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
          jq -e '.ok and (.missingTables|length)==0 and .foreignKeyErrors==0 and .quick[0].quick_check=="ok"' staging-evidence/db-schema.json >/dev/null
          for p in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016 0017; do jq -e --arg p "$p" '.migrations|any(startswith($p))' staging-evidence/db-schema.json >/dev/null; done
          kill $pid >/dev/null 2>&1 || true
          wait $pid 2>/dev/null || true
          trap - EXIT
      - name: Configure secrets and deploy staging
        shell: bash
        run: |
          set -euo pipefail
          a=$(openssl rand -hex 32); p=$(openssl rand -hex 32); echo "::add-mask::$a"; echo "::add-mask::$p"
          export AUTH_RATE_LIMIT_PEPPER="$a" PUBLIC_RATE_LIMIT_PEPPER="$p" TURNSTILE_SECRET_KEY='1x0000000000000000000000000000000AA'
          node scripts/configure-rate-limit-secret.mjs --config .cpcv-staging.wrangler.toml > staging-evidence/secret-configuration.txt
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars > staging-evidence/deploy.txt
      - name: Verify remote staging and screenshots
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup; do code=$(curl -sS -L --retry 12 --retry-delay 3 --retry-all-errors -o "staging-evidence/page$(echo "$path"|tr '/' '_').html" -w '%{http_code}' "$STAGING_ORIGIN$path?source=$SOURCE_COMMIT"); test "$code" -ge 200 -a "$code" -lt 400; done
          curl --fail-with-body -sS --retry 12 --retry-delay 3 "$STAGING_ORIGIN/assets/app.css?source=$SOURCE_COMMIT" > staging-evidence/app.css
          grep -F 'v0.8.10 flat hierarchy and tactile controls' staging-evidence/app.css
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          origin='https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'; out=Path('staging-evidence'); sel='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for w in (390,768,1440):
              page=b.new_page(viewport={'width':w,'height':900})
              for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                r=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000); assert r and r.status<400; page.wait_for_timeout(800)
                assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                assert page.eval_on_selector_all(sel,"els=>els.filter(e=>getComputedStyle(e).borderRadius.split(/\\s+/).some(v=>parseFloat(v)>0)).length")==0
                page.screenshot(path=str(out/f'{name}-{w}.png'),full_page=True)
              page.close()
            b.close()
          PY
          cat > staging-evidence/release-record.txt <<EOF
          result=PASSED
          run_id=$GITHUB_RUN_ID
          source_commit=$SOURCE_COMMIT
          staging_origin=$STAGING_ORIGIN
          schema_verified=true
          migrations_0001_through_0017_present=true
          deployed=true
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          find staging-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > staging-evidence/SHA256SUMS.txt
          echo STAGING_RESULT=PASSED >> "$GITHUB_ENV"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-staging-remote-dev-evidence
          path: staging-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="${STAGING_RESULT:-FAILED}"
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-staging-remote-dev-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV staging-remote ${result} run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
