name: CPCV token management diagnostic

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-token-management-diagnostic.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce93380d617672e086b9971fe82bb4f8ffccf861
      - name: Resolve credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Test token management endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p token-capability
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          : > token-capability/results.txt
          test_endpoint() {
            name="$1"; url="$2"
            response=$(curl -sS -w '\n%{http_code}' "${auth[@]}" "$url")
            status="${response##*$'\n'}"; body="${response%$'\n'*}"
            success=$(printf '%s' "$body" | jq -r '.success // false' 2>/dev/null || echo false)
            code=$(printf '%s' "$body" | jq -r '.errors[0].code // empty' 2>/dev/null || true)
            message=$(printf '%s' "$body" | jq -r '.errors[0].message // empty' 2>/dev/null | tr '\r\n' ' ' || true)
            echo "$name http=$status success=$success error_code=${code:-none} message=${message:-none}" >> token-capability/results.txt
          }
          test_endpoint user_tokens "https://api.cloudflare.com/client/v4/user/tokens?per_page=5"
          test_endpoint account_tokens "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens?per_page=5"
          test_endpoint permission_groups "https://api.cloudflare.com/client/v4/user/tokens/permission_groups"
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-token-management-capability
          path: token-capability
          retention-days: 3
      - name: Remove workflow and record run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-token-management-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV token diagnostic run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
