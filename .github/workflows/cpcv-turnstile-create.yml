name: CPCV production Turnstile create

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-turnstile-create.yml]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce93380d617672e086b9971fe82bb4f8ffccf861
      - name: Resolve credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Create or locate production widget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p turnstile-evidence
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" > /tmp/widgets.json
          sitekey=$(jq -r '.result[]? | select(.name=="CPCV Production") | .sitekey' /tmp/widgets.json | head -n1)
          if [ -n "$sitekey" ]; then
            jq -n --arg sitekey "$sitekey" '{result:"existing",sitekey:$sitekey}' > turnstile-evidence/result.json
            echo TURNSTILE_RESULT=PASSED >> "$GITHUB_ENV"
            exit 0
          fi
          status=$(curl -sS -o /tmp/create.json -w '%{http_code}' "${auth[@]}" --request POST \
            --data '{"domains":["class-pdf-comment-viewer-v01.syouziroupc.workers.dev"],"mode":"managed","name":"CPCV Production"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets")
          success=$(jq -r '.success // false' /tmp/create.json)
          code=$(jq -r '.errors[0].code // empty' /tmp/create.json)
          message=$(jq -r '.errors[0].message // empty' /tmp/create.json)
          if [ "$success" = true ]; then
            sitekey=$(jq -r '.result.sitekey' /tmp/create.json)
            jq -n --arg sitekey "$sitekey" '{result:"created",sitekey:$sitekey}' > turnstile-evidence/result.json
            echo TURNSTILE_RESULT=PASSED >> "$GITHUB_ENV"
          else
            jq -n --arg status "$status" --arg code "$code" --arg message "$message" '{result:"failed",http_status:$status,error_code:$code,error_message:$message}' > turnstile-evidence/result.json
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-turnstile-create-evidence
          path: turnstile-evidence
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="${TURNSTILE_RESULT:-FAILED}"
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-turnstile-create.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV Turnstile ${result} run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
