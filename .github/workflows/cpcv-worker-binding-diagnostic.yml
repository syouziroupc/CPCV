name: CPCV Worker binding diagnostic

on:
  push:
    branches: [master]
    paths: [.github/workflows/cpcv-worker-binding-diagnostic.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ce93380d617672e086b9971fe82bb4f8ffccf861
      - name: Resolve credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Fetch Worker settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          for worker in class-pdf-comment-viewer-v01-staging class-pdf-comment-viewer-v01; do
            api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}"
            curl --fail-with-body -sS "${auth[@]}" "$api/settings" > "bindings/${worker}.raw.json"
            jq 'walk(if type=="object" and has("text") and ((.type//"")|startswith("secret")) then .text="<redacted>" else . end)' "bindings/${worker}.raw.json" > "bindings/${worker}.json"
            rm "bindings/${worker}.raw.json"
            jq -e '.success==true' "bindings/${worker}.json" >/dev/null
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-worker-bindings
          path: bindings
          retention-days: 3
      - name: Remove workflow and record run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          git rm .github/workflows/cpcv-worker-binding-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "CPCV binding diagnostic run ${GITHUB_RUN_ID}"
          git push origin HEAD:master
