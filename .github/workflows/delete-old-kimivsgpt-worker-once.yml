name: Delete old duplicate Kimi vs GPT Worker once

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  delete-old:
    if: contains(github.event.head_commit.message, '[delete-old-kimivsgpt-worker]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify canonical Worker is healthy
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error https://kimivsgpt.syouziroupc.workers.dev/health)"
          echo "$body"
          printf '%s' "$body" | grep -q '"version":"0.3.2"'
      - name: Delete old duplicate Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/delete-response.txt --write-out '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/kimi-vs-gpt-auditor")"
          cat /tmp/delete-response.txt || true
          test "$code" = "200"
      - name: Verify canonical Worker still works
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 3 --retry-delay 1 https://kimivsgpt.syouziroupc.workers.dev/health)"
          echo "$body"
          printf '%s' "$body" | grep -q '"version":"0.3.2"'
