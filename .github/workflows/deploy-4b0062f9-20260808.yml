name: Deploy final 5xx recovery release 2026-08-08

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/deploy-4b0062f9-20260808.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/deploy-4b0062f9-20260808'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: 4b0062f9149bca7b1019fa125f314986191c6e44
      PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""; for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!key:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Revalidate exact release
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          node scripts/test-load-hardening.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Record rollback state and block live classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-records
          npx wrangler secret list > deployment-records/secrets-before.txt
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do grep -F "$name" deployment-records/secrets-before.txt >/dev/null; done
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/db-before.txt
          npx wrangler d1 time-travel info class_comment_db_v2 2>&1 | tee deployment-records/time-travel.txt
          npx wrangler deployments status 2>&1 | tee deployment-records/deployments-before.txt
          npx wrangler d1 execute class_comment_db_v2 --remote --command "SELECT COUNT(*) AS active_count FROM live_sessions WHERE status='active' AND expires_at > strftime('%Y-%m-%dT%H:%M:%fZ','now');" --json > deployment-records/active-sessions.json
          active=$(node -e "const x=require('./deployment-records/active-sessions.json');let n=null;const w=v=>{if(n!==null)return;if(Array.isArray(v))v.forEach(w);else if(v&&typeof v==='object'){if('active_count' in v)n=Number(v.active_count);else Object.values(v).forEach(w)}};w(x);if(n===null)process.exit(2);process.stdout.write(String(n));")
          printf 'active_sessions=%s\n' "$active" | tee deployment-records/active-session-gate.txt
          test "$active" -eq 0
      - name: Apply migrations and deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply class_comment_db --remote 2>&1 | tee deployment-records/legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2 --remote 2>&1 | tee deployment-records/v2-migrations.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/db-after-migrations.txt
          npx wrangler deploy 2>&1 | tee deployment-records/deploy.txt
          version_id=$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' deployment-records/deploy.txt | tail -n1)
          test -n "$version_id"
          echo "PRODUCTION_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          printf '%s\n' "$version_id" > deployment-records/version-id.txt
      - name: Verify exact production assets and state
        shell: bash
        run: |
          set -euo pipefail
          expected_css=$(sha256sum public/assets/app.css | awk '{print $1}')
          expected_js=$(sha256sum public/assets/admin.js | awk '{print $1}')
          ready=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/app.css?release=$SOURCE_COMMIT&a=$attempt" -o deployment-records/app.css || true
            curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/admin.js?release=$SOURCE_COMMIT&a=$attempt" -o deployment-records/admin.js || true
            css=$(sha256sum deployment-records/app.css 2>/dev/null | awk '{print $1}' || true)
            js=$(sha256sum deployment-records/admin.js 2>/dev/null | awk '{print $1}' || true)
            if [ "$css" = "$expected_css" ] && [ "$js" = "$expected_js" ]; then ready=1; break; fi
            sleep 3
          done
          test "$ready" = 1
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/db-after.txt
          node scripts/smoke-production.mjs --origin "$PRODUCTION_ORIGIN" 2>&1 | tee deployment-records/http-smoke.txt
          curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/admin" > deployment-records/admin.html
          curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/account" > deployment-records/account.html
          grep -F 'Minimal application finish' deployment-records/app.css >/dev/null
          grep -F 'AI_TARGET_LANGUAGE_CODES' deployment-records/admin.js >/dev/null
          grep -E 'id="loginSection" class="[^"]*hidden' deployment-records/admin.html >/dev/null
          grep -F 'このフォームを送信した場合だけパスワードを変更します' deployment-records/account.html >/dev/null
          npx wrangler deployments status 2>&1 | tee deployment-records/deployments-after.txt
          npx wrangler secret list > deployment-records/secrets-after.txt
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do grep -F "$name" deployment-records/secrets-after.txt >/dev/null; done
          printf 'result=PASSED\nrelease_commit=%s\nproduction_version_id=%s\ncompleted_at_utc=%s\n' "$SOURCE_COMMIT" "$PRODUCTION_VERSION_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-records/result.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-${{ env.SOURCE_COMMIT }}
          path: deployment-records/
          if-no-files-found: warn
          retention-days: 90
