name: Deploy AI quality navigation production v3

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/deploy-ai-quality-navigation-20260806.yml
      - scripts/ops-deploy-ai-quality-navigation-production.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-ai-quality-navigation-production
  cancel-in-progress: true

env:
  SOURCE_COMMIT: a4211f6b52f81d6e2f3ef4d43e0b8c84bf9abbf5
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  STAGING_DEPLOYMENT_ID: fb551173-cc3a-4df6-b318-2f2809f465d3
  STAGING_CONFIG_SHA256: 70988e5013c715c727d5404c4b04c28fd293d12d467b89b141733e152c43144a

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-ai-quality-navigation-20260806
          fetch-depth: 0
      - name: Preserve operations script and checkout immutable release
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ops-deploy-ai-quality-navigation-production.sh /tmp/cpcv-production-deploy.sh
          git reset --hard "$SOURCE_COMMIT"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          chmod +x /tmp/cpcv-production-deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy exact release and verify production
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!key:-}"
            [ -z "$value" ] || { account="$value"; break; }
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          /tmp/cpcv-production-deploy.sh
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-production-v3-${{ env.SOURCE_COMMIT }}
          path: deployment-records/
          if-no-files-found: error
          retention-days: 90
