# one-shot bridge: deploy kimivsgpt v0.3.1 using CPCV production credentials
name: Deploy Kimi vs GPT auditor once

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: kimivsgpt-production-once
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-kimivsgpt]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout Kimi vs GPT
        uses: actions/checkout@v4
        with:
          repository: syouziroupc/kimivsgpt
          ref: main
          path: kimivsgpt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials are available
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install and validate
        working-directory: kimivsgpt
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run type-check
          npm run build-check

      - name: Deploy Worker
        working-directory: kimivsgpt
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/kimivsgpt-deploy.log

      - name: Show deployment record
        if: always()
        shell: bash
        run: |
          echo "source_repo=syouziroupc/kimivsgpt"
          echo "source_ref=main"
          if [ -f /tmp/kimivsgpt-deploy.log ]; then
            cat /tmp/kimivsgpt-deploy.log
          fi
