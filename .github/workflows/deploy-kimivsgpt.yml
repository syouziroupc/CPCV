name: Deploy Kimi vs GPT auditor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-kimivsgpt.yml'

permissions:
  contents: read

concurrency:
  group: kimivsgpt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout Kimi vs GPT
        uses: actions/checkout@v4
        with:
          repository: syouziroupc/kimivsgpt
          ref: main
          path: kimivsgpt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.129.1 whoami | tee /tmp/cf-whoami.txt
          grep -F "Syouziroupc@gmail.com's Account" /tmp/cf-whoami.txt

      - name: Install and validate
        working-directory: kimivsgpt
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run audit
          npm run type-check
          npm run build-check

      - name: Deploy to canonical Cloudflare account
        working-directory: kimivsgpt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Verify live auditor after propagation
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error https://kimi-vs-gpt-auditor.syouziroupc.workers.dev/health || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true' && printf '%s' "$body" | grep -q '"version":"0.3.2"'; then
              exit 0
            fi
            sleep 3
          done
          exit 1
