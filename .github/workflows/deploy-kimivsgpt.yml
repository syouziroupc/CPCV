name: Deploy Kimi vs GPT auditor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-kimivsgpt.yml'

permissions:
  contents: read

concurrency:
  group: kimivsgpt-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout Kimi vs GPT
        uses: actions/checkout@v4
        with:
          repository: syouziroupc/kimivsgpt
          ref: main
          path: kimivsgpt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.129.1 whoami | tee /tmp/cf-whoami.txt
          grep -F "Syouziroupc@gmail.com's Account" /tmp/cf-whoami.txt

      - name: Install and validate
        working-directory: kimivsgpt
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run audit
          npm run type-check
          npm run test:concurrency
          npm run build-check

      - name: Deploy canonical GitHub-linked Worker
        working-directory: kimivsgpt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Verify canonical live auditor after propagation
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body="$(curl --fail --silent --show-error https://kimivsgpt.syouziroupc.workers.dev/health || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true' \
              && printf '%s' "$body" | grep -q '"version":"0.5.5"' \
              && printf '%s' "$body" | grep -q '"pkce":"S256"' \
              && printf '%s' "$body" | grep -q '"refresh_replay_grace_seconds":30' \
              && printf '%s' "$body" | grep -q '"batch_review_calls":true'; then
              break
            fi
            if [ "$i" = "6" ]; then exit 1; fi
            sleep 3
          done

          status="$(curl --silent --show-error -D /tmp/mcp-headers.txt -o /tmp/mcp-body.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{},"clientInfo":{"name":"production-smoke","version":"1.0.0"}}}' \
            https://kimivsgpt.syouziroupc.workers.dev/mcp)"
          cat /tmp/mcp-headers.txt
          test "$status" = "401"
          grep -qi '^www-authenticate: Bearer resource_metadata=' /tmp/mcp-headers.txt
          grep -qi '^access-control-allow-origin: \*' /tmp/mcp-headers.txt
          grep -qi '^access-control-expose-headers: WWW-Authenticate' /tmp/mcp-headers.txt
