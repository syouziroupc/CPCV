name: Deploy final landing polish to staging once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-landing-polish-staging-once.yml"

permissions:
  contents: read
  issues: write

env:
  SOURCE_COMMIT: bb448924fa50a79297661cd4d12bdf83eab3f57a
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  deploy-and-inspect:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout exact polished source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.12"

      - name: Install frozen dependencies and Chromium
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm install --global npm@11.18.0
          npm ci
          npm install-scripts ls
          python -m pip install --disable-pip-version-check -r requirements-visual.txt
          python -m playwright install --with-deps chromium

      - name: Verify polished source before staging
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          npm run verify:source-manifest
          npm run check:v0810
          python scripts/audit-responsive-layout.py

      - name: Materialize separated staging runtime config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('wrangler.toml').read_text(encoding='utf-8')
          replacements={
            'name = "class-pdf-comment-viewer-v01"':'name = "class-pdf-comment-viewer-v01-staging"',
            'database_name = "class_comment_db"':'database_name = "class_comment_db_staging"',
            'database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"':'database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"',
            'database_name = "class_comment_db_v2"':'database_name = "class_comment_db_v2_staging"',
            'database_id = "8315a076-67ad-44e6-8286-11887af52ad3"':'database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"',
            'queue = "cpcv-ai-jobs"':'queue = "cpcv-ai-jobs-staging"',
            'queue = "cpcv-ai-translation-jobs"':'queue = "cpcv-ai-translation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-translation-dlq"':'dead_letter_queue = "cpcv-ai-translation-dlq-staging"',
            'queue = "cpcv-ai-moderation-jobs"':'queue = "cpcv-ai-moderation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-moderation-dlq"':'dead_letter_queue = "cpcv-ai-moderation-dlq-staging"',
            '826071901':'826071801','826071902':'826071802','826071903':'826071803','826071904':'826071804',
            '826071905':'826071805','826071906':'826071806',
            'https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev':'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev',
            'TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"':'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"',
          }
          for old,new in replacements.items():
            if old not in source: raise SystemExit(f'missing staging replacement: {old}')
            source=source.replace(old,new)
          Path('.cpcv-staging.wrangler.toml').write_text(source,encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml

      - name: Verify staging DB and deploy polished LP
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p polish-evidence/screenshots
          node scripts/verify-remote-d1.mjs --config .cpcv-staging.wrangler.toml --database class_comment_db_v2_staging 2>&1 | tee polish-evidence/01-db-health.txt
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars 2>&1 | tee polish-evidence/02-deploy.txt
          node scripts/smoke-production.mjs --config .cpcv-staging.wrangler.toml --origin "$STAGING_ORIGIN" 2>&1 | tee polish-evidence/03-smoke.txt
          curl --fail-with-body --silent --show-error -H 'Cache-Control: no-cache' "$STAGING_ORIGIN/?polish=$SOURCE_COMMIT" > polish-evidence/live-home.html
          grep -F '/assets/landing.css?v=0.8.10-lp6' polish-evidence/live-home.html >/dev/null
          grep -F '/assets/landing-narrow.css?v=0.8.10-lp6a' polish-evidence/live-home.html >/dev/null

      - name: Capture first, then validate line breaks and alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          origin='https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'
          out=Path('polish-evidence/screenshots')
          results=[]
          failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for width,height in [(390,844),(768,1024),(1024,900),(1440,1000)]:
              page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              response=page.goto(f'{origin}/?polish_visual={width}',wait_until='networkidle',timeout=60000)
              page.wait_for_timeout(500)
              page.screenshot(path=str(out/f'landing-{width}.png'),full_page=True)
              if not response or response.status >= 400:
                failures.append(f'HTTP failure at {width}: {response.status if response else "none"}')
                page.close(); continue

              data=page.evaluate('''() => {
                const root=document.documentElement;
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}};
                const lineData=(el)=>{
                  if(!el) return [];
                  const lines=[];
                  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                  let node;
                  while((node=walker.nextNode())){
                    for(let i=0;i<node.data.length;i++){
                      const ch=node.data[i];
                      if(/\\s/.test(ch)) continue;
                      const range=document.createRange();
                      range.setStart(node,i); range.setEnd(node,i+1);
                      const rs=[...range.getClientRects()].filter(r=>r.width>0 && r.height>0);
                      if(!rs.length) continue;
                      const top=Math.round(rs[0].top*2)/2;
                      let line=lines.find(x=>Math.abs(x.top-top)<1.5);
                      if(!line){line={top,count:0,text:''};lines.push(line);}
                      line.count+=1; line.text+=ch;
                    }
                  }
                  return lines.sort((a,b)=>a.top-b.top);
                };
                const headings={
                  hero:lineData(document.querySelector('.refined-hero h1')),
                  start:lineData(document.querySelector('#startHeading')),
                  how:lineData(document.querySelector('#howHeading')),
                  features:lineData(document.querySelector('#featureHeading')),
                  desktop:lineData(document.querySelector('#desktopHeading')),
                  trust:lineData(document.querySelector('#trustHeading')),
                  final:lineData(document.querySelector('#finalCtaHeading')),
                };
                const headingBlocks=[...document.querySelectorAll('.start-heading,.landing-heading')].map(block=>{
                  const kids=[...block.children].filter(x=>getComputedStyle(x).display!=='none');
                  return {xs:kids.map(x=>rect(x).x), kicker:kids[0]?rect(kids[0]):null};
                });
                const ids=['homePublicCode','homeJoinButton','homeJoinStatus'];
                return {
                  overflow:root.scrollWidth-window.innerWidth,
                  landingLink:Boolean(document.querySelector('link[href*="/assets/landing.css"]')),
                  narrowLink:Boolean(document.querySelector('link[href*="/assets/landing-narrow.css"]')),
                  projection:rect(document.querySelector('.projection-screen')),
                  headings,
                  headingBlocks,
                  ids:Object.fromEntries(ids.map(id=>[id,Boolean(document.getElementById(id))]))
                };
              }''')

              data['viewport']={'width':width,'height':height}
              results.append(data)
              if data['overflow'] > 1: failures.append(f'horizontal overflow {width}: {data["overflow"]}')
              if not data['landingLink'] or not data['narrowLink']: failures.append(f'landing links missing {width}')
              if not all(data['ids'].values()): failures.append(f'join IDs missing {width}: {data["ids"]}')
              projection=data['projection']
              if not projection or projection['width'] < 250:
                failures.append(f'projection missing/small {width}')
              else:
                ratio=projection['width']/projection['height']
                data['projectionRatio']=ratio
                if not 1.73 <= ratio <= 1.83: failures.append(f'projection ratio {width}: {ratio}')

              headings=data['headings']
              if width >= 768:
                if len(headings['hero']) != 2: failures.append(f'hero line count {width}: {headings["hero"]}')
                if len(headings['desktop']) != 2: failures.append(f'desktop line count {width}: {headings["desktop"]}')
                for name in ('start','how','features','trust','final'):
                  lines=headings[name]
                  if len(lines) > 2 or any(x['count'] < 4 for x in lines):
                    failures.append(f'{name} bad lines {width}: {lines}')
              else:
                for name,lines in headings.items():
                  if any(x['count'] < 3 for x in lines): failures.append(f'{name} orphan line {width}: {lines}')

              for block in data['headingBlocks']:
                xs=block['xs']
                if xs and max(xs)-min(xs) > 2: failures.append(f'heading x mismatch {width}: {xs}')
                k=block['kicker']
                if k and (k['height'] > 36 or k['width'] < 32): failures.append(f'kicker cramped {width}: {k}')
              page.close()
            browser.close()

          Path('polish-evidence/04-visual-metrics.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('polish-evidence/05-visual-failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          if failures:
            raise SystemExit('visual failures: '+json.dumps(failures,ensure_ascii=False))
          print('all live landing typography/alignment checks passed')
          PY

      - name: Report final staging polish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ job.status }}"
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' polish-evidence/02-deploy.txt 2>/dev/null | tail -1 | cut -d' ' -f4 || true)"
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "CPCV final LP polish staging: source=${SOURCE_COMMIT} status=${status} version=${version:-unknown} origin=${STAGING_ORIGIN} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload all screenshots even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcv-final-landing-polish-${{ env.SOURCE_COMMIT }}
          path: polish-evidence/
          if-no-files-found: warn
          retention-days: 30
