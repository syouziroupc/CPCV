name: Deploy TalkSys final v45 search fixes

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: talksys-production-direct
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-talksys]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: b4d815e7142b9fae2cf3d6dec18364c1db0f0140
          path: talksys
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate exact revision
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run
      - name: Verify credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Deploy exact revision
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production smoke
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$URL/voice-health")"
          HEALTH="$health" node - <<'NODE'
          const d=JSON.parse(process.env.HEALTH||'{}');
          if(d.voiceRevision!=='talksys-v45-api-first-single-search-provider'||d.searchSingleProvider!==true||d.searchProvider!=='bing-rss-keyless-single-index'||d.searchEngineRotation!==false||d.searchEngineRetry!==false) throw new Error(process.env.HEALTH);
          NODE

          call() { node -e 'process.stdout.write(JSON.stringify({text:process.argv[1],history:[]}))' "$1" | curl -fsS --max-time "$2" -H 'content-type: application/json' --data-binary @- "$URL/api/turn"; }

          out="$(call '12345÷15' 20)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT)"

          out="$(call '別府市の今日の天気は？' 30)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!(d.apiSources||[]).some(x=>x.tool==='jma_weather'))throw new Error(process.env.OUT)"

          out="$(call 'MSI X79A-GD45の最新BIOSを公式で確認して' 25)"
          echo "$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}'), x=d.searchDiagnostics||{};
          if(!d.ok||d.search!==true||x.plannerPlanned===true) throw new Error('simple route');
          if(!(d.queries||[]).includes('X79A-GD45 BIOS site:msi.com')) throw new Error('noncompact BIOS query '+JSON.stringify(d.queries));
          if(/検索機能.*(?:無効|禁止|使えない)|外部検索を使わない設定/.test(String(d.answer||''))) throw new Error('false capability statement '+d.answer);
          if(Number(d.timings?.searchMs||0)>9000) throw new Error('budget '+JSON.stringify(d.timings));
          NODE

          out="$(call '3万円以下で動画視聴用の中古ノートPCを候補から比較して選んで' 30)"
          echo "$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}'), x=d.searchDiagnostics||{};
          if(!d.ok||d.search!==true) throw new Error('complex route');
          if(x.plannerTransport==='deterministic-fallback' && (x.researchMode!=='discover_then_verify'||x.candidateType!=='product_model')) throw new Error('bad fallback '+JSON.stringify(x));
          if((x.probes||[]).some(p=>!String(p.engine||'').includes('bing-rss-keyless-single-index'))) throw new Error('provider rotation');
          if(Number(d.timings?.searchMs||0)>9000) throw new Error('budget '+JSON.stringify(d.timings));
          if(/外部情報を取得できなかったため、現在情報は断定しません。/.test(String(d.answer||''))) throw new Error('old giveup');
          NODE
