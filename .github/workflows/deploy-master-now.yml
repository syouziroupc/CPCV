name: Deploy TalkSys Search Director fix

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: talksys-production-direct
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-talksys]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 59015c1c6ae500579f10e4e5e0c4fe23e121bc60
          path: talksys

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install and validate exact revision
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Verify production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy exact validated revision
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production health and local routes
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(Boolean(d.voiceRevision==='talksys-v45-unified-router-no-v43-turn-delegation'&&d.unifiedTurnRouter===true&&d.legacyV43TurnDelegation===false&&d.apiFirst===true&&d.apiParallel===true&&d.groundedEvidenceFallback===true&&d.externalFailureUsesCasualModel===false&&d.modelTimeoutMs===12000&&d.searchDirectorModel==='@cf/qwen/qwen3-30b-a3b-fp8'&&d.searchDefault==='intent-routed-v45')))" )"
            [[ "$ok" == "true" ]] && break
            [[ "$attempt" -eq 20 ]] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

          call() {
            local text="$1" max="$2"
            local payload
            payload="$(node -e 'process.stdout.write(JSON.stringify({text:process.argv[1],history:[]}))' "$text")"
            curl -fsS --max-time "$max" -H 'content-type: application/json' --data "$payload" "$URL/api/turn"
          }
          out="$(call '12345÷15' 20)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);"
          out="$(call '42' 20)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='clarification-v45'||d.search!==false||d.clarificationRequired!==true)throw new Error(process.env.OUT);"
          out="$(call 'Web検索は使わないで。RAMとSSDの違いを短く説明して' 25)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.search!==false||!['local-conversation-v45','local-mechanical-fallback-v45'].includes(d.route))throw new Error(process.env.OUT);"

      - name: Verify structured API routes
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          smoke() {
            local text="$1" expected="$2"
            local payload out
            payload="$(node -e 'process.stdout.write(JSON.stringify({text:process.argv[1],history:[]}))' "$text")"
            out="$(curl -fsS --max-time 80 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
            echo "$out"
            OUT="$out" EXPECTED="$expected" node -e "const d=JSON.parse(process.env.OUT||'{}');const t=(d.apiSources||[]).map(x=>x.tool);if(!d.ok||d.route!=='api-first-v45'||d.apiFirst!==true||!t.includes(process.env.EXPECTED))throw new Error(JSON.stringify({route:d.route,apiSources:d.apiSources,apiDiagnostics:d.apiDiagnostics,answer:d.answer,error:d.error}));"
          }
          smoke '別府市の今日の天気は？' jma_weather
          smoke '100米ドルは日本円でいくら？' frankfurter
          smoke '日本の一人当たりGDPは？' world_bank_wdi

      - name: Verify Search Director is genuinely active and useful
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          payload='{"text":"3万円以下の中古ノートPCを動画視聴用に選ぶなら何を確認して探すべき？","history":[]}'
          out="$(curl -fsS --max-time 105 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          echo "$out"
          OUT="$out" node <<'NODE'
          const d = JSON.parse(process.env.OUT || '{}');
          const x = d.searchDiagnostics || {};
          const qs = d.queries || [];
          const src = d.sources || [];
          const bad = src.filter(s => /results\.vote\.wa\.gov|accounts\.google\.com|gamewith\.jp/i.test(String(s.url || '')));
          if (!d.ok || d.route !== 'api-first-v45' || d.search !== true) throw new Error('web route failed: ' + JSON.stringify({route:d.route,error:d.error}));
          if (x.plannerPlanned !== true) throw new Error('Qwen planner did not produce a valid plan: ' + JSON.stringify(x));
          if (x.plannerTransport !== 'tool_call') throw new Error('Qwen planner did not use tool call: ' + JSON.stringify(x));
          if (x.plannerError) throw new Error('planner error: ' + x.plannerError);
          if (qs.some(q => String(q).includes('何を確認して探すべき'))) throw new Error('long-question fallback query leaked: ' + JSON.stringify(qs));
          if (!src.length || x.searchUseful !== true) throw new Error('search still produced no useful evidence: ' + JSON.stringify({queries:qs,diagnostics:x,sources:src}));
          if (bad.length) throw new Error('known garbage source admitted: ' + JSON.stringify(bad));
          NODE
