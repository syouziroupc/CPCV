name: Deploy CPCV production from master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cpcv-production-direct
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-cpcv]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm

      - name: Pin and verify npm
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.18.0"

      - name: Install dependencies
        shell: bash
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          set -euo pipefail
          npm ci || {
            npm cache clean --force
            npm ci
          }
          npm install-scripts ls

      - name: Verify Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Print final UI source hashes
        shell: bash
        run: |
          sha256sum \
            public/assets/app.css \
            public/index.html \
            public/about/index.html \
            public/guide/index.html \
            public/privacy/index.html \
            public/signup/index.html \
            public/forgot-password/index.html \
            public/reset-password/index.html \
            public/accept-invitation/index.html \
            public/check-email/index.html \
            public/confirm-email-change/index.html \
            public/verify-email/index.html

      - name: Run full validation
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          node scripts/verify-u22-freeze.mjs
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Initialize deployment records
        shell: bash
        run: |
          mkdir -p deployment-records
          {
            echo "commit=${{ github.sha }}"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "wrangler=$(npx wrangler --version | tail -n 1)"
          } > deployment-records/00-metadata.txt

      - name: Record DB_V2 rollback bookmark
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler d1 time-travel info class_comment_db_v2 2>&1 | tee deployment-records/01-d1-time-travel.txt

      - name: Verify production data before migration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm run verify:stage82-preflight 2>&1 | tee deployment-records/02-stage82-preflight.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/03-remote-d1-before.txt

      - name: Apply database migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler d1 migrations apply class_comment_db --remote 2>&1 | tee deployment-records/10-legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2 --remote 2>&1 | tee deployment-records/11-v2-migrations.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/12-remote-d1-after-migration.txt

      - name: Record current Worker state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deployments status 2>&1 | tee deployment-records/15-before-deploy.txt

      - name: Deploy selected revision
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deployment-records/20-worker-deploy.txt

      - name: Verify production after deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/21-remote-d1-after-deploy.txt
          node scripts/smoke-production.mjs 2>&1 | tee deployment-records/22-production-basic-check.txt
          npx wrangler deployments status 2>&1 | tee deployment-records/23-after-deploy.txt

      - name: Finalize deployment records
        if: always()
        shell: bash
        run: |
          mkdir -p deployment-records
          {
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "final_commit=$(git rev-parse HEAD 2>/dev/null || true)"
          } > deployment-records/99-result.txt
          find deployment-records -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > deployment-records/SHA256SUMS.txt || true

      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpcv-production-direct-${{ github.sha }}
          path: deployment-records/
          if-no-files-found: warn
          retention-days: 90

      - name: Report deployment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "CPCV production deploy: commit=${{ github.sha }} status=${JOB_STATUS} run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
