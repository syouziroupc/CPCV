name: Deploy TalkSys through CPCV production

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: talksys-production-direct
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TalkSys question-first search
    if: contains(github.event.head_commit.message, '[deploy-talksys]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Checkout TalkSys exact revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ee1958b3fbd4de40090607e9ac24496b1b1fa8a8
          path: talksys

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install and validate TalkSys
        working-directory: talksys
        run: |
          npm install --no-audit --no-fund
          node --check src/research-plan-v44.js
          node --check src/search-v44.js
          node --check src/worker-v44.js
          node --test tests/v44-query-quality.test.mjs
          node --test tests/v44-deep-search-default.test.mjs
          npx wrangler deploy --dry-run

      - name: Verify Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy TalkSys exact revision
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production question-first architecture
        env:
          URL: https://talksys.syouziroupc.workers.dev
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision==='talksys-v44-default-exhaustive-search'&&d.searchRevision==='deep-search-v44-question-first-evidence-loop'&&d.searchQuestionFirstPlanning===true&&d.searchGapDrivenFollowups===true&&d.searchResearchStateMachine===true))")"
            [ "$ok" = "true" ] && break
            [ "$attempt" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Smoke test real adaptive research turn
        env:
          URL: https://talksys.syouziroupc.workers.dev
        run: |
          set -euo pipefail
          turn='{"text":"3万円以下の中古ノートPCを動画視聴用に選ぶなら何を確認して探すべき？","history":[],"searchPlan":{"planner":"deep-search-v44"}}'
          out="$(curl -fsS --max-time 55 -H 'content-type: application/json' --data "$turn" "$URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');const x=d.searchDiagnostics||{};if(!d.ok||d.route!=='deep-search-v44'||x.searchRevision!=='deep-search-v44-question-first-evidence-loop'||x.questionFirstPlanning!==true||x.gapDrivenFollowups!==true||!(Number(x.researchFacetCount)>=1))throw new Error(JSON.stringify({ok:d.ok,route:d.route,error:d.error,diagnostics:x}));console.log(JSON.stringify({route:d.route,queries:d.queries,coverage:d.searchCoverage,diagnostics:x,sources:(d.sources||[]).slice(0,5).map(s=>({title:s.title,url:s.url}))}));"
