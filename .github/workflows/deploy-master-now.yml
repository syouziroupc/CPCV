name: Deploy CPCV production from master

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CPCV production
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-cpcv]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout master
        uses: actions/checkout@v6

      - name: Verify required secrets are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Run local validation
        shell: bash
        run: |
          set -euo pipefail
          npm run validate

      - name: Resolve current production version
        id: current
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(
            npx --yes wrangler versions view 2>&1 |
              sed -n 's/^Version ID: //p' |
              tail -1 |
              tr -d '\r'
          )"
          if [[ -z "$CURRENT_VERSION" ]]; then
            echo "::error::Could not resolve the current production version."
            exit 1
          fi
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current production version: $CURRENT_VERSION"

      - name: Upload validated candidate version
        id: candidate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUTPUT="$(npx --yes wrangler versions upload 2>&1 | tee /tmp/cpcv-versions-upload.log)"
          CANDIDATE_VERSION="$(
            printf '%s\n' "$OUTPUT" |
              sed -n 's/^Worker Version ID: //p' |
              tail -1 |
              tr -d '\r'
          )"
          if [[ -z "$CANDIDATE_VERSION" ]]; then
            echo "::error::Could not resolve uploaded candidate version."
            cat /tmp/cpcv-versions-upload.log
            exit 1
          fi
          echo "candidate_version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Uploaded candidate version: $CANDIDATE_VERSION"

      - name: Smoke test candidate build locally
        shell: bash
        run: |
          set -euo pipefail
          PORT=8790
          npx --yes wrangler dev --local --port "$PORT" > /tmp/cpcv-local-smoke.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          LOCAL_URL="http://127.0.0.1:${PORT}"
          READY=0
          for _ in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 4 "${LOCAL_URL}/api/manifest" >/tmp/cpcv-local-manifest.json 2>/tmp/cpcv-local-manifest.err; then
              READY=1
              break
            fi
            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Local Wrangler smoke server did not become ready."
            cat /tmp/cpcv-local-smoke.log
            exit 1
          fi

          node ./scripts/smoke-production.mjs "$LOCAL_URL"

      - name: Deploy exact validated candidate to 100 percent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler versions deploy "${{ steps.candidate.outputs.candidate_version }}@100%" --yes

      - name: Verify deployed version and production smoke
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PRODUCTION_VERSION="$(
            npx --yes wrangler versions view 2>&1 |
              sed -n 's/^Version ID: //p' |
              tail -1 |
              tr -d '\r'
          )"
          CANDIDATE_VERSION="${{ steps.candidate.outputs.candidate_version }}"
          if [[ "$PRODUCTION_VERSION" != "$CANDIDATE_VERSION" ]]; then
            echo "::error::Production version '$PRODUCTION_VERSION' does not match validated candidate '$CANDIDATE_VERSION'."
            exit 1
          fi

          echo "Production now serves validated candidate: $PRODUCTION_VERSION"
          node ./scripts/smoke-production.mjs
