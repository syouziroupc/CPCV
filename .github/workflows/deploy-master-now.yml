name: Deploy TalkSys v45 formal retrieval

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: talksys-production-formal-retrieval
  cancel-in-progress: false

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-talksys]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 52591eb357f41529ea2b05537878b817be1d3f94
          path: talksys
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate exact revision
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "52591eb357f41529ea2b05537878b817be1d3f94"
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run
      - name: Verify credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Deploy exact revision
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production smoke
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$URL/voice-health")"
          echo "HEALTH=$health"
          HEALTH="$health" node - <<'NODE'
          const d=JSON.parse(process.env.HEALTH||'{}');
          if(d.voiceRevision!=='talksys-v45-formal-api-primary-safe-fallback') throw new Error('revision '+JSON.stringify(d));
          if(d.searchProvider!=='formal-structured-apis+direct-primary') throw new Error('provider '+JSON.stringify(d));
          if(d.searchSingleProvider!==false||d.searchGeneralWebEnabled!==false) throw new Error('search topology '+JSON.stringify(d));
          if(d.bingRssEnabled!==false||d.generalWebScraping!==false) throw new Error('legacy web path '+JSON.stringify(d));
          if(d.webSearch!==false||d.webRetrieval!==true) throw new Error('web metadata '+JSON.stringify(d));
          if(d.searchDirectPrimaryResolver!==true||d.shoppingApiFirst!==true) throw new Error('resolver/api metadata '+JSON.stringify(d));
          if(!d.shoppingApiRegistry||!d.shoppingApiRegistry.yahoo_shopping||!d.shoppingApiRegistry.rakuten_ichiba) throw new Error('shopping registry '+JSON.stringify(d));
          if(d.searchDirectorModel!=='@cf/qwen/qwen3-30b-a3b-fp8') throw new Error('director '+JSON.stringify(d));
          if(d.weatherDirect!=='jma-api-first-with-met-norway-fallback'||d.openMeteoExcluded!==true) throw new Error('weather metadata '+JSON.stringify(d));
          NODE

          call() { node -e 'process.stdout.write(JSON.stringify({text:process.argv[1],history:[]}))' "$1" | curl -fsS --max-time "$2" -H 'content-type: application/json' --data-binary @- "$URL/api/turn"; }

          out="$(call '12345÷15' 20)"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT)"

          out="$(call '別府市の今日の天気は？' 30)"
          echo "WEATHER=$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!(d.apiSources||[]).some(x=>x.tool==='jma_weather'))throw new Error(process.env.OUT)"

          out="$(call '100米ドルは日本円でいくら？' 30)"
          echo "FX=$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!(d.apiSources||[]).some(x=>x.tool==='frankfurter'))throw new Error(process.env.OUT)"

          out="$(call '日本の一人当たりGDPは？' 35)"
          echo "WDI=$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!(d.apiSources||[]).some(x=>x.tool==='world_bank_wdi'))throw new Error(process.env.OUT)"

          out="$(call 'DOI 10.1038/s41586-020-2649-2 の文献情報を確認して' 35)"
          echo "CROSSREF=$out"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!(d.apiSources||[]).some(x=>x.tool==='crossref'))throw new Error(process.env.OUT)"

          out="$(call 'MSI X79A-GD45の最新BIOSを公式で確認して' 30)"
          echo "BIOS=$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}'), x=d.searchDiagnostics||{};
          if(!d.ok||d.search!==true||x.plannerPlanned===true) throw new Error('simple route '+process.env.OUT);
          if(!(d.queries||[]).includes('X79A-GD45 BIOS site:msi.com')) throw new Error('noncompact BIOS query '+JSON.stringify(d.queries));
          if(!Array.isArray(x.directPrimaryTargets)||!x.directPrimaryTargets.some(t=>String(t.url||'').includes('jp.msi.com/Motherboard/X79A-GD45/support'))) throw new Error('missing direct target '+JSON.stringify(x));
          if(!Array.isArray(x.directPrimaryDiagnostics)||!x.directPrimaryDiagnostics.some(p=>p.ok===true&&String(p.engine||'').includes('direct-primary:msi-motherboard'))) throw new Error('MSI primary fetch did not succeed '+JSON.stringify(x.directPrimaryDiagnostics));
          if(/検索機能.*(?:無効|禁止|使えない)|外部検索を使わない設定/.test(String(d.answer||''))) throw new Error('false capability statement '+d.answer);
          if(Number(d.timings?.searchMs||0)>9000) throw new Error('budget '+JSON.stringify(d.timings));
          NODE

          out="$(call '3万円以下で動画視聴用の中古ノートPCを候補から比較して選んで' 30)"
          echo "SHOPPING=$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}'), x=d.searchDiagnostics||{};
          if(!d.ok||d.search!==true) throw new Error('shopping route '+process.env.OUT);
          if(x.plannerPlanned===true||x.plannerTransport!=='deterministic-simple') throw new Error('routine shopping should skip Qwen '+JSON.stringify(x));
          if(x.generalWebSearchEnabled!==false) throw new Error('general web unexpectedly enabled '+JSON.stringify(x));
          if((x.probes||[]).some(p=>String(p.engine||'').includes('bing-rss'))) throw new Error('bing RSS still active '+JSON.stringify(x.probes));
          if(Number(d.timings?.searchMs||0)>5000) throw new Error('shopping search budget '+JSON.stringify(d.timings));
          if(/外部情報を取得できなかったため、現在情報は断定しません。/.test(String(d.answer||''))) throw new Error('old giveup '+d.answer);
          const a=String(d.answer||'');
          if(!a.trim()) throw new Error('empty answer');
          NODE
