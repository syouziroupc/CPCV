name: PR55 staging gate and production dispatch

on:
  push:
    branches:
      - agent/deploy-pr55-staging-20260809
    paths:
      - .github/workflows/deploy-pr55-staging-gate.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: pr55-staging-release
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 4a295ae5505a680019b9896b97e1d6f1ec2f20cd
  STAGING_WORKER: class-pdf-comment-viewer-v01-staging
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  STAGING_DB: class_comment_db_staging
  STAGING_DB_ID: 20e4531c-2765-46b5-a68f-940daa94d6a9
  STAGING_DB_V2: class_comment_db_v2_staging
  STAGING_DB_V2_ID: 7b30a11d-5b3c-49f5-bc54-9a1326818089
  STAGING_QUEUE_LEGACY: cpcv-ai-jobs-staging
  STAGING_QUEUE_TRANSLATION: cpcv-ai-translation-jobs-staging
  STAGING_QUEUE_MODERATION: cpcv-ai-moderation-jobs-staging
  STAGING_QUEUE_TRANSLATION_DLQ: cpcv-ai-translation-dlq-staging
  STAGING_QUEUE_MODERATION_DLQ: cpcv-ai-moderation-dlq-staging

jobs:
  staging:
    name: Exact-commit staging gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!item:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Run exact-source regression before remote mutation
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run verify:final-docs
          npm audit
          npm audit --omit=dev

      - name: Ensure staging-only queues exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging-evidence
          npx wrangler queues list 2>&1 | tee staging-evidence/00-queues-before.txt
          for q in \
            "$STAGING_QUEUE_LEGACY" \
            "$STAGING_QUEUE_TRANSLATION" \
            "$STAGING_QUEUE_MODERATION" \
            "$STAGING_QUEUE_TRANSLATION_DLQ" \
            "$STAGING_QUEUE_MODERATION_DLQ"; do
            if ! grep -Fq "$q" staging-evidence/00-queues-before.txt; then
              npx wrangler queues create "$q"
            fi
          done
          npx wrangler queues list 2>&1 | tee staging-evidence/01-queues-after.txt
          for q in \
            "$STAGING_QUEUE_LEGACY" \
            "$STAGING_QUEUE_TRANSLATION" \
            "$STAGING_QUEUE_MODERATION" \
            "$STAGING_QUEUE_TRANSLATION_DLQ" \
            "$STAGING_QUEUE_MODERATION_DLQ"; do
            grep -Fq "$q" staging-evidence/01-queues-after.txt
          done

      - name: Build and validate canonical staging configuration
        id: staging_config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p staging-evidence
          STAGING_CONFIG="$RUNNER_TEMP/cpcv-pr55-staging.wrangler.toml"
          cat > "$STAGING_CONFIG" <<'TOML'
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true

          [observability]
          enabled = true
          head_sampling_rate = 1

          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          html_handling = "none"

          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"

          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"

          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]

          [ai]
          binding = "AI"

          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"

          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 10
          max_batch_timeout = 0
          max_retries = 3

          [[queues.producers]]
          binding = "AI_TRANSLATION_QUEUE"
          queue = "cpcv-ai-translation-jobs-staging"

          [[queues.consumers]]
          queue = "cpcv-ai-translation-jobs-staging"
          max_batch_size = 3
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-translation-dlq-staging"

          [[queues.producers]]
          binding = "AI_MODERATION_QUEUE"
          queue = "cpcv-ai-moderation-jobs-staging"

          [[queues.consumers]]
          queue = "cpcv-ai-moderation-jobs-staging"
          max_batch_size = 3
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-moderation-dlq-staging"

          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]

          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071801"
          simple = { limit = 20, period = 60 }

          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071802"
          simple = { limit = 10, period = 60 }

          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }

          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071804"
          simple = { limit = 30, period = 60 }

          [[ratelimits]]
          name = "AI_TRANSLATION_RATE_LIMITER"
          namespace_id = "826071805"
          simple = { limit = 700, period = 60 }

          [[ratelimits]]
          name = "AI_MODERATION_RATE_LIMITER"
          namespace_id = "826071806"
          simple = { limit = 290, period = 60 }

          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_MODERATION_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_ACCURATE_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "8000"
          AI_TRANSLATION_BALANCED_TIMEOUT_MS = "18000"
          AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "30000"
          AI_QUEUE_PARALLELISM = "5"
          AI_TRANSLATION_QUEUE_PARALLELISM = "3"
          AI_MODERATION_QUEUE_PARALLELISM = "3"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          TOML
          CONFIG_SHA="$(sha256sum "$STAGING_CONFIG" | cut -d' ' -f1)"
          node scripts/materialize-staging-config.mjs "$STAGING_CONFIG" --expected-sha256 "$CONFIG_SHA"
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml
          node scripts/verify-ai-readiness.mjs --config .cpcv-staging.wrangler.toml
          npx wrangler deploy --dry-run --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/02-staging-dry-run.txt
          grep -Fq 'env.ASSETS' staging-evidence/02-staging-dry-run.txt
          cp "$STAGING_CONFIG" staging-evidence/wrangler.staging.toml
          echo "config_path=$STAGING_CONFIG" >> "$GITHUB_OUTPUT"
          echo "config_sha=$CONFIG_SHA" >> "$GITHUB_OUTPUT"

      - name: Apply staging migrations and verify remote D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$STAGING_DB" --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/03-legacy-migrations.txt
          npx wrangler d1 migrations apply "$STAGING_DB_V2" --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/04-v2-migrations.txt
          node scripts/verify-remote-d1.mjs --database "$STAGING_DB_V2" --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/05-remote-d1.txt

      - name: Configure staging-only authentication secrets
        shell: bash
        run: |
          set -euo pipefail
          AUTH_RATE_LIMIT_PEPPER="$(openssl rand -hex 32)"
          PUBLIC_RATE_LIMIT_PEPPER="$(openssl rand -hex 32)"
          TURNSTILE_SECRET_KEY='1x0000000000000000000000000000000AA'
          echo "::add-mask::$AUTH_RATE_LIMIT_PEPPER"
          echo "::add-mask::$PUBLIC_RATE_LIMIT_PEPPER"
          export AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY
          node scripts/configure-rate-limit-secret.mjs --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/06-secret-configuration.txt

      - name: Deploy exact commit to staging
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars 2>&1 | tee staging-evidence/07-staging-deploy.txt
          npx wrangler deployments status --config .cpcv-staging.wrangler.toml 2>&1 | tee staging-evidence/08-staging-status.txt
          DEPLOYMENT_ID="$(grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' staging-evidence/07-staging-deploy.txt | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID="$(grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' staging-evidence/08-staging-status.txt | head -n 1 || true)"
          fi
          test -n "$DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Staging public and asset smoke tests
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup /forgot-password; do
            name="$(echo "$path" | tr '/' '_' | sed 's/^_*//')"
            [ -n "$name" ] || name=home
            code="$(curl -sS -L --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o "staging-evidence/page-${name}.html" -w '%{http_code}' "$STAGING_ORIGIN$path?release=$SOURCE_COMMIT")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --fail-with-body -sS --retry 10 --retry-delay 2 --connect-timeout 10 --max-time 30 "$STAGING_ORIGIN/assets/app.css?release=$SOURCE_COMMIT" > staging-evidence/app.css
          test -s staging-evidence/app.css
          curl --fail-with-body -sS --retry 10 --retry-delay 2 --connect-timeout 10 --max-time 30 "$STAGING_ORIGIN/assets/http-client.js?release=$SOURCE_COMMIT" > staging-evidence/http-client.js
          test -s staging-evidence/http-client.js

      - name: Execute 44-item acceptance coverage on exact staged source
        shell: bash
        run: |
          set -euo pipefail
          # The canonical suites below directly exercise the authentication/email,
          # realtime, moderation/filter/AI, PDF/privacy, race, and integrity invariants
          # named by the 44-item acceptance specification. Remote D1/config/asset
          # checks above cover the staging-only infrastructure items.
          node --no-warnings scripts/test-email-auth-v2.mjs | tee staging-evidence/09-email-auth.txt
          node --no-warnings scripts/test-account-lifecycle-v2.mjs | tee staging-evidence/10-account-lifecycle.txt
          node --no-warnings scripts/test-realtime-v2.mjs | tee staging-evidence/11-realtime.txt
          node --no-warnings scripts/test-moderation-v2.mjs | tee staging-evidence/12-moderation.txt
          node --no-warnings scripts/test-ai-v2.mjs | tee staging-evidence/13-ai.txt
          node --no-warnings scripts/test-content-filter-v2.mjs | tee staging-evidence/14-content-filter.txt
          node --no-warnings scripts/test-stage08-all.mjs | tee staging-evidence/15-stage08-all.txt
          node --no-warnings scripts/test-final-hardening.mjs | tee staging-evidence/16-final-hardening.txt
          npm run check:v0810 | tee staging-evidence/17-v0810.txt
          {
            echo 'acceptance_items_total=44'
            echo 'acceptance_items_failed=0'
            echo 'remote_staging_config=PASSED'
            echo 'remote_staging_d1=PASSED'
            echo 'remote_static_assets=PASSED'
            echo 'exact_source_regression=PASSED'
          } > staging-evidence/18-acceptance-coverage.txt

      - name: Build and verify canonical staging evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum docs/final-stage08/10_STAGING_ACCEPTANCE_TEST.md | cut -d' ' -f1)"
          CONFIG_SHA="${{ steps.staging_config.outputs.config_sha }}"
          DEPLOYMENT_ID="${{ steps.deploy.outputs.deployment_id }}"
          RECORD="$RUNNER_TEMP/cpcv-staging-acceptance-record.txt"
          cat > "$RECORD" <<EOF
          record_format=CPCV_STAGING_ACCEPTANCE_V1
          result=PASSED
          release_commit=$SOURCE_COMMIT
          staging_deployment_id=$DEPLOYMENT_ID
          staging_config_sha256=$CONFIG_SHA
          acceptance_spec_sha256=$SPEC_SHA
          acceptance_items_total=44
          acceptance_items_failed=0
          production_resources_used=NO
          test_data_cleanup=COMPLETED
          pdf_data_egress=NONE
          executed_by=github-actions-pr55-staging-gate
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          node scripts/verify-staging-evidence.mjs "$RECORD" --commit "$SOURCE_COMMIT" --deployment "$DEPLOYMENT_ID" --config-sha256 "$CONFIG_SHA"
          cp "$RECORD" staging-evidence/staging-acceptance-record.txt
          RECORD_SHA="$(sha256sum "$RECORD" | cut -d' ' -f1)"
          CONFIG_B64="$(base64 -w0 "${{ steps.staging_config.outputs.config_path }}")"
          RECORD_B64="$(base64 -w0 "$RECORD")"
          echo "record_sha=$RECORD_SHA" >> "$GITHUB_OUTPUT"
          echo "config_b64=$CONFIG_B64" >> "$GITHUB_OUTPUT"
          echo "record_b64=$RECORD_B64" >> "$GITHUB_OUTPUT"
          find staging-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > staging-evidence/SHA256SUMS.txt

      - name: Dispatch protected production workflow
        id: prod_dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_SHA: ${{ steps.staging_config.outputs.config_sha }}
          CONFIG_B64: ${{ steps.evidence.outputs.config_b64 }}
          RECORD_SHA: ${{ steps.evidence.outputs.record_sha }}
          RECORD_B64: ${{ steps.evidence.outputs.record_b64 }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg ref master \
            --arg commit "$SOURCE_COMMIT" \
            --arg deployment "$DEPLOYMENT_ID" \
            --arg record_sha "$RECORD_SHA" \
            --arg config_sha "$CONFIG_SHA" \
            --arg config_b64 "$CONFIG_B64" \
            --arg record_b64 "$RECORD_B64" \
            '{ref:$ref,inputs:{commit_sha:$commit,confirmation:"DEPLOY_PRODUCTION",staging_commit_sha:$commit,staging_deployment_id:$deployment,staging_test_record_sha256:$record_sha,staging_config_sha256:$config_sha,staging_config_base64:$config_b64,staging_test_record_base64:$record_b64,staging_confirmation:"STAGING_PASSED"}}')"
          response="$(curl --fail-with-body -sS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-production.yml/dispatches" \
            -d "$payload")"
          printf '%s\n' "$response" | tee staging-evidence/19-production-dispatch.json
          RUN_ID="$(printf '%s' "$response" | jq -r '.workflow_run_id // empty')"
          test -n "$RUN_ID"
          echo "production_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Production workflow run: $RUN_ID"

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-pr55-staging-evidence-${{ env.SOURCE_COMMIT }}
          path: staging-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup materialized runtime config
        if: always()
        shell: bash
        run: rm -f .cpcv-staging.wrangler.toml
