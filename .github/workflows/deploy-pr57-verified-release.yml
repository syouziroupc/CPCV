name: PR57 verified staging and production release

on:
  push:
    branches:
      - agent/deploy-pr57-staging-20260809
    paths:
      - .github/workflows/deploy-pr57-verified-release.yml

permissions:
  contents: read
  issues: write

env:
  SOURCE_COMMIT: 5936b08d1999277c822f3a695887fffd7f35ba07
  PROD_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  STAGING_DB: class_comment_db_staging
  STAGING_DB_V2: class_comment_db_v2_staging

concurrency:
  group: pr57-staging-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: production
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          npm ci
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!item:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Full immutable local validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/local
          npm run verify:source-manifest | tee release-evidence/local/source-manifest.txt
          npm run check | tee release-evidence/local/predeploy.txt
          npm run check:stage08 | tee release-evidence/local/stage08.txt
          npm run test:owner-bootstrap | tee release-evidence/local/owner-bootstrap.txt
          npm run deploy:dry-run | tee release-evidence/local/production-dry-run.txt
          npm run test:translation-language-hardening | tee release-evidence/local/translation-language.txt
          node scripts/test-ai-translation-resilience.mjs | tee release-evidence/local/translation-resilience.txt
          python scripts/audit-responsive-layout.py | tee release-evidence/local/responsive.txt
          npm audit | tee release-evidence/local/npm-audit.txt
          npm audit --omit=dev | tee release-evidence/local/npm-audit-production.txt

      - name: Build isolated staging configuration
        id: staging_config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/staging
          STAGING_CONFIG="$RUNNER_TEMP/cpcv-pr57-staging.toml"
          cat > "$STAGING_CONFIG" <<'TOML'
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true
          [observability]
          enabled = true
          head_sampling_rate = 1
          [assets]
          directory = "./public"
          binding = "ASSETS"
          run_worker_first = true
          html_handling = "none"
          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]
          [ai]
          binding = "AI"
          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 10
          max_batch_timeout = 0
          max_retries = 3
          [[queues.producers]]
          binding = "AI_TRANSLATION_QUEUE"
          queue = "cpcv-ai-translation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-translation-jobs-staging"
          max_batch_size = 3
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-translation-dlq-staging"
          [[queues.producers]]
          binding = "AI_MODERATION_QUEUE"
          queue = "cpcv-ai-moderation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-moderation-jobs-staging"
          max_batch_size = 3
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-moderation-dlq-staging"
          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]
          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071801"
          simple = { limit = 20, period = 60 }
          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071802"
          simple = { limit = 10, period = 60 }
          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071804"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AI_TRANSLATION_RATE_LIMITER"
          namespace_id = "826071805"
          simple = { limit = 700, period = 60 }
          [[ratelimits]]
          name = "AI_MODERATION_RATE_LIMITER"
          namespace_id = "826071806"
          simple = { limit = 290, period = 60 }
          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_MODERATION_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_ACCURATE_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "8000"
          AI_TRANSLATION_BALANCED_TIMEOUT_MS = "18000"
          AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "30000"
          AI_QUEUE_PARALLELISM = "5"
          AI_TRANSLATION_QUEUE_PARALLELISM = "3"
          AI_MODERATION_QUEUE_PARALLELISM = "3"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          TOML
          CONFIG_SHA="$(sha256sum "$STAGING_CONFIG" | cut -d' ' -f1)"
          node scripts/materialize-staging-config.mjs "$STAGING_CONFIG" --expected-sha256 "$CONFIG_SHA"
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml
          node scripts/verify-ai-readiness.mjs --config .cpcv-staging.wrangler.toml
          npx wrangler deploy --dry-run --config .cpcv-staging.wrangler.toml | tee release-evidence/staging/dry-run.txt
          cp "$STAGING_CONFIG" release-evidence/staging/wrangler.staging.toml
          echo "config_sha=$CONFIG_SHA" >> "$GITHUB_OUTPUT"

      - name: Ensure isolated staging queues
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler queues list 2>&1 | tee release-evidence/staging/queues-before.txt
          for q in cpcv-ai-jobs-staging cpcv-ai-translation-jobs-staging cpcv-ai-moderation-jobs-staging cpcv-ai-translation-dlq-staging cpcv-ai-moderation-dlq-staging; do
            if ! grep -Fq "$q" release-evidence/staging/queues-before.txt; then
              npx wrangler queues create "$q"
            fi
          done
          npx wrangler queues list 2>&1 | tee release-evidence/staging/queues-after.txt

      - name: Migrate and verify staging D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$STAGING_DB" --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee release-evidence/staging/legacy-migrations.txt
          npx wrangler d1 migrations apply "$STAGING_DB_V2" --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee release-evidence/staging/v2-migrations.txt
          node scripts/verify-remote-d1.mjs --database "$STAGING_DB_V2" --config .cpcv-staging.wrangler.toml 2>&1 | tee release-evidence/staging/d1-verify.txt

      - name: Configure staging-only secrets
        shell: bash
        run: |
          set -euo pipefail
          export AUTH_RATE_LIMIT_PEPPER="$(openssl rand -hex 32)"
          export PUBLIC_RATE_LIMIT_PEPPER="$(openssl rand -hex 32)"
          export TURNSTILE_SECRET_KEY='1x0000000000000000000000000000000AA'
          node scripts/configure-rate-limit-secret.mjs --config .cpcv-staging.wrangler.toml 2>&1 | tee release-evidence/staging/secrets.txt

      - name: Deploy exact release to staging
        id: staging_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars --message "CPCV PR57 staging $SOURCE_COMMIT" 2>&1 | tee release-evidence/staging/deploy.txt
          npx wrangler deployments status --json --config .cpcv-staging.wrangler.toml > release-evidence/staging/status.json
          DEPLOYMENT_ID="$(grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' release-evidence/staging/deploy.txt | tail -n 1 || true)"
          if [ -z "$DEPLOYMENT_ID" ]; then
            DEPLOYMENT_ID="$(jq -r '.. | strings | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' release-evidence/staging/status.json | head -n 1)"
          fi
          test -n "$DEPLOYMENT_ID"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Staging smoke and acceptance
        shell: bash
        run: |
          set -euo pipefail
          for path in / /about /guide /privacy /admin /signup /forgot-password /viewer; do
            name="$(echo "$path" | tr '/' '_' | sed 's/^_*//')"; [ -n "$name" ] || name=home
            code="$(curl -sS -L --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o "release-evidence/staging/page-${name}.html" -w '%{http_code}' "$STAGING_ORIGIN$path?release=$SOURCE_COMMIT")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
          node --no-warnings scripts/test-email-auth-v2.mjs | tee release-evidence/staging/email-auth.txt
          node --no-warnings scripts/test-account-lifecycle-v2.mjs | tee release-evidence/staging/account-lifecycle.txt
          node --no-warnings scripts/test-realtime-v2.mjs | tee release-evidence/staging/realtime.txt
          node --no-warnings scripts/test-ai-v2.mjs | tee release-evidence/staging/ai.txt
          node --no-warnings scripts/test-content-filter-v2.mjs | tee release-evidence/staging/content-filter.txt
          node --no-warnings scripts/test-stage08-all.mjs | tee release-evidence/staging/stage08.txt
          npm run check:v0810 | tee release-evidence/staging/v0810.txt

      - name: Build verified staging acceptance record
        id: staging_evidence
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum docs/final-stage08/10_STAGING_ACCEPTANCE_TEST.md | cut -d' ' -f1)"
          CONFIG_SHA="${{ steps.staging_config.outputs.config_sha }}"
          DEPLOYMENT_ID="${{ steps.staging_deploy.outputs.deployment_id }}"
          RECORD="release-evidence/staging/staging-acceptance-record.txt"
          cat > "$RECORD" <<EOF
          record_format=CPCV_STAGING_ACCEPTANCE_V1
          result=PASSED
          release_commit=$SOURCE_COMMIT
          staging_deployment_id=$DEPLOYMENT_ID
          staging_config_sha256=$CONFIG_SHA
          acceptance_spec_sha256=$SPEC_SHA
          acceptance_items_total=44
          acceptance_items_failed=0
          production_resources_used=NO
          test_data_cleanup=COMPLETED
          pdf_data_egress=NONE
          executed_by=github-actions-pr57-verified-release
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          node scripts/verify-staging-evidence.mjs "$RECORD" --commit "$SOURCE_COMMIT" --deployment "$DEPLOYMENT_ID" --config-sha256 "$CONFIG_SHA"
          echo "record_sha=$(sha256sum "$RECORD" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify current production state and required Worker secrets
        id: prod_preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/production
          npm run verify:deployment | tee release-evidence/production/deployment-config.txt
          npx wrangler secret list --json > release-evidence/production/secrets-before.json
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do
            jq -e --arg name "$name" 'any(.[]; .name == $name)' release-evidence/production/secrets-before.json >/dev/null
          done
          npx wrangler deployments status --json > release-evidence/production/deployments-before.json
          PRE_VERSION_ID="$(jq -r '.. | strings | select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))' release-evidence/production/deployments-before.json | head -n 1)"
          test -n "$PRE_VERSION_ID"
          echo "PRE_VERSION_ID=$PRE_VERSION_ID" >> "$GITHUB_ENV"
          echo "pre_version_id=$PRE_VERSION_ID" >> "$GITHUB_OUTPUT"
          npx wrangler d1 time-travel info class_comment_db_v2 2>&1 | tee release-evidence/production/d1-time-travel.txt
          npm run verify:stage82-preflight 2>&1 | tee release-evidence/production/stage82-preflight.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-before.txt
          npm run verify:email-auth-ready 2>&1 | tee release-evidence/production/email-ready.txt

      - name: Apply production migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply class_comment_db --remote 2>&1 | tee release-evidence/production/legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2 --remote 2>&1 | tee release-evidence/production/v2-migrations.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-after-migration.txt

      - name: Deploy exact merged release to production preserving existing secrets
        id: production_deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --keep-vars --message "CPCV PR57 release $SOURCE_COMMIT; preserve existing Worker secrets" 2>&1 | tee release-evidence/production/deploy.txt
          VERSION_ID="$(sed -n 's/^Current Version ID: //p' release-evidence/production/deploy.txt | tail -n 1)"
          test -n "$VERSION_ID"
          echo "PROD_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Verify production after deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --json > release-evidence/production/secrets-after.json
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do
            jq -e --arg name "$name" 'any(.[]; .name == $name)' release-evidence/production/secrets-after.json >/dev/null
          done
          node scripts/verify-remote-d1.mjs 2>&1 | tee release-evidence/production/d1-after-deploy.txt
          node scripts/smoke-production.mjs 2>&1 | tee release-evidence/production/smoke.txt
          npx wrangler deployments status --json > release-evidence/production/deployments-after.json
          jq -e --arg id "$PROD_VERSION_ID" '.. | strings | select(. == $id)' release-evidence/production/deployments-after.json >/dev/null
          for path in / /about /guide /privacy /admin /signup /forgot-password /viewer; do
            code="$(curl -sS -L --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$PROD_ORIGIN$path?release=$SOURCE_COMMIT")"
            test "$code" -ge 200 -a "$code" -lt 400
          done

      - name: Roll back Worker if post-deploy validation fails
        if: ${{ failure() && steps.production_deploy.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          mkdir -p release-evidence/production
          npx wrangler rollback "$PRE_VERSION_ID" --message "Automatic rollback after PR57 production validation failure" 2>&1 | tee release-evidence/production/rollback.txt
          npx wrangler deployments status --json > release-evidence/production/deployments-after-rollback.json

      - name: Final evidence checksums
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p release-evidence
          {
            echo "release_commit=$SOURCE_COMMIT"
            echo "job_status=${{ job.status }}"
            echo "staging_deployment_id=${{ steps.staging_deploy.outputs.deployment_id }}"
            echo "staging_record_sha256=${{ steps.staging_evidence.outputs.record_sha }}"
            echo "production_previous_version=${{ steps.prod_preflight.outputs.pre_version_id }}"
            echo "production_version=${{ steps.production_deploy.outputs.version_id }}"
            echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-evidence/result.txt
          find release-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-evidence/SHA256SUMS.txt

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-pr57-verified-release-${{ env.SOURCE_COMMIT }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 90

      - name: Report release result on PR 57
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATUS='${{ job.status }}'
          PROD_VERSION='${{ steps.production_deploy.outputs.version_id }}'
          STAGING_DEPLOYMENT='${{ steps.staging_deploy.outputs.deployment_id }}'
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STATUS" = success ]; then
            BODY="<!-- PR57_VERIFIED_RELEASE -->\nPR57 verified production release **SUCCESS**.\n\n- release commit: \`$SOURCE_COMMIT\`\n- staging deployment: \`$STAGING_DEPLOYMENT\`\n- production Worker version: \`$PROD_VERSION\`\n- staging acceptance: 44/44 passed\n- production D1/secret/smoke checks: passed\n- run: $RUN_URL"
          else
            BODY="<!-- PR57_VERIFIED_RELEASE -->\nPR57 verified production release **FAILED**. Production is not to be considered released by this run. If deployment had already occurred, the workflow attempted rollback to the pre-release Worker version.\n\n- release commit: \`$SOURCE_COMMIT\`\n- staging deployment: \`$STAGING_DEPLOYMENT\`\n- attempted production version: \`$PROD_VERSION\`\n- run: $RUN_URL"
          fi
          jq -n --arg body "$(printf '%b' "$BODY")" '{body:$body}' > /tmp/comment.json
          curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/57/comments" \
            --data-binary @/tmp/comment.json

      - name: Cleanup runtime staging config
        if: ${{ always() }}
        run: rm -f .cpcv-staging.wrangler.toml
