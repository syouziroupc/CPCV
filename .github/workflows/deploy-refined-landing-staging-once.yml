name: Deploy refined landing to staging once
# LP-only staging gate with explicit typography and alignment checks.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-refined-landing-staging-once.yml"

permissions:
  contents: read
  issues: write

env:
  SYSTEM_COMMIT: 0f61a65ff056539742657272cc63fba4af8560ac
  LP_COMMIT: 38ba5743e5f21f724ef51ab453d888b7db70c0a3
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  deploy-and-render:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout corrected LP revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.LP_COMMIT }}
          fetch-depth: 0

      - name: Prove application runtime is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LP_COMMIT"
          git diff --name-only "$SYSTEM_COMMIT" "$LP_COMMIT" | tee /tmp/lp-diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            'public/index.html',
            'public/assets/landing.css',
            'SOURCE_SHA256SUMS.override.txt',
            '.github/workflows/landing-manifest-repair.yml',
            '.github/workflows/audit-staging-runtime-once.yml',
            '.github/workflows/sync-staging-system-once.yml',
            '.github/workflows/deploy-refined-landing-staging-once.yml',
          }
          changed={x.strip() for x in Path('/tmp/lp-diff.txt').read_text().splitlines() if x.strip()}
          unexpected=changed-allowed
          if unexpected:
            raise SystemExit('LP revision changes application runtime files: '+', '.join(sorted(unexpected)))
          required={'public/index.html','public/assets/landing.css'}
          if not required.issubset(changed):
            raise SystemExit('Expected LP files are missing from diff')
          if any(p.startswith('src/') or p.startswith('migrations') for p in changed):
            raise SystemExit('Backend or migration change detected in LP revision')
          print('LP-only application diff verified:', ', '.join(sorted(changed)))
          PY

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.12"

      - name: Install frozen dependencies and Chromium
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm install --global npm@11.18.0
          npm ci
          npm install-scripts ls
          python -m pip install --disable-pip-version-check -r requirements-visual.txt
          python -m playwright install --with-deps chromium

      - name: Validate corrected LP revision
        run: |
          npm run verify:source-manifest
          npm run check:v0810
          python scripts/audit-responsive-layout.py

      - name: Materialize identical staging runtime config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('wrangler.toml').read_text(encoding='utf-8')
          replacements={
            'name = "class-pdf-comment-viewer-v01"':'name = "class-pdf-comment-viewer-v01-staging"',
            'database_name = "class_comment_db"':'database_name = "class_comment_db_staging"',
            'database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"':'database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"',
            'database_name = "class_comment_db_v2"':'database_name = "class_comment_db_v2_staging"',
            'database_id = "8315a076-67ad-44e6-8286-11887af52ad3"':'database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"',
            'queue = "cpcv-ai-jobs"':'queue = "cpcv-ai-jobs-staging"',
            'queue = "cpcv-ai-translation-jobs"':'queue = "cpcv-ai-translation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-translation-dlq"':'dead_letter_queue = "cpcv-ai-translation-dlq-staging"',
            'queue = "cpcv-ai-moderation-jobs"':'queue = "cpcv-ai-moderation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-moderation-dlq"':'dead_letter_queue = "cpcv-ai-moderation-dlq-staging"',
            '826071901':'826071801','826071902':'826071802','826071903':'826071803','826071904':'826071804',
            '826071905':'826071805','826071906':'826071806',
            'https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev':'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev',
            'TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"':'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"',
          }
          for old,new in replacements.items():
            if old not in source: raise SystemExit(f'missing staging replacement: {old}')
            source=source.replace(old,new)
          Path('.cpcv-staging.wrangler.toml').write_text(source,encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml

      - name: Read-only staging DB health before LP deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p landing-evidence
          node scripts/verify-remote-d1.mjs --config .cpcv-staging.wrangler.toml --database class_comment_db_v2_staging 2>&1 | tee landing-evidence/01-db-health-before.txt

      - name: Deploy corrected LP to staging
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars 2>&1 | tee landing-evidence/02-deploy.txt
          npx wrangler deployments status --config .cpcv-staging.wrangler.toml 2>&1 | tee landing-evidence/03-deployment-status.txt

      - name: Smoke application behavior after LP deploy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/smoke-production.mjs --config .cpcv-staging.wrangler.toml --origin "$STAGING_ORIGIN" 2>&1 | tee landing-evidence/04-smoke.txt
          curl --fail-with-body --silent --show-error -H 'Cache-Control: no-cache' "$STAGING_ORIGIN/?lp=$LP_COMMIT" > landing-evidence/live-home.html
          grep -F '/assets/landing.css?v=0.8.10-lp6' landing-evidence/live-home.html >/dev/null
          grep -F 'hero-line-main' landing-evidence/live-home.html >/dev/null
          grep -F 'projection-demo' landing-evidence/live-home.html >/dev/null
          grep -F 'homePublicCode' landing-evidence/live-home.html >/dev/null
          grep -F 'homeJoinButton' landing-evidence/live-home.html >/dev/null
          grep -F 'homeJoinStatus' landing-evidence/live-home.html >/dev/null

      - name: Render, measure and reject bad Japanese line breaks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          origin='https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'
          out=Path('landing-evidence/screenshots'); out.mkdir(parents=True,exist_ok=True)
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
            for width,height in [(390,844),(768,1024),(1024,900),(1440,1000)]:
              page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
              response=page.goto(f'{origin}/?visual={width}',wait_until='networkidle',timeout=60000)
              if not response or response.status>=400:
                raise RuntimeError(f'HTTP failure at {width}: {response.status if response else "none"}')
              page.wait_for_timeout(500)
              data=page.evaluate('''() => {
                const root=document.documentElement;
                const ids=['homePublicCode','homeJoinButton','homeJoinStatus'];
                const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom}};
                const lineData=(el)=>{
                  if(!el) return [];
                  const lines=[];
                  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                  let node;
                  while((node=walker.nextNode())){
                    for(let i=0;i<node.data.length;i++){
                      const ch=node.data[i];
                      if(/\\s/.test(ch)) continue;
                      const range=document.createRange();
                      range.setStart(node,i); range.setEnd(node,i+1);
                      const rs=[...range.getClientRects()].filter(r=>r.width>0 && r.height>0);
                      if(!rs.length) continue;
                      const top=Math.round(rs[0].top*2)/2;
                      let line=lines.find(x=>Math.abs(x.top-top)<1.5);
                      if(!line){line={top,count:0,text:''};lines.push(line);}
                      line.count+=1; line.text+=ch;
                    }
                  }
                  return lines.sort((a,b)=>a.top-b.top);
                };
                const headings={
                  hero:lineData(document.querySelector('.refined-hero h1')),
                  start:lineData(document.querySelector('#startHeading')),
                  how:lineData(document.querySelector('#howHeading')),
                  features:lineData(document.querySelector('#featureHeading')),
                  desktop:lineData(document.querySelector('#desktopHeading')),
                  trust:lineData(document.querySelector('#trustHeading')),
                  final:lineData(document.querySelector('#finalCtaHeading')),
                };
                const headingBlocks=[...document.querySelectorAll('.start-heading,.landing-heading')].map(block=>{
                  const kids=[...block.children].filter(x=>getComputedStyle(x).display!=='none');
                  return {xs:kids.map(x=>rect(x).x), kicker:kids[0]?rect(kids[0]):null};
                });
                return {
                  title:document.title,
                  overflow:root.scrollWidth-window.innerWidth,
                  projection:rect(document.querySelector('.projection-screen')),
                  ids:Object.fromEntries(ids.map(id=>[id,Boolean(document.getElementById(id))])),
                  landingCss:[...document.styleSheets].some(x=>String(x.href||'').includes('/assets/landing.css')),
                  headings,
                  headingBlocks
                };
              }''')

              if data['overflow']>1:
                raise RuntimeError(f'horizontal overflow {width}: {data["overflow"]}')
              if not data['landingCss']:
                raise RuntimeError(f'landing css missing {width}')
              if not all(data['ids'].values()):
                raise RuntimeError(f'join IDs missing {width}: {data["ids"]}')
              projection=data['projection']
              if not projection or projection['width'] < 250:
                raise RuntimeError(f'projection too small/missing {width}')
              ratio=projection['width']/projection['height']
              if not (1.73 <= ratio <= 1.83):
                raise RuntimeError(f'projection ratio not 16:9-ish {width}: {ratio}')

              headings=data['headings']
              if width >= 768:
                if len(headings['hero']) != 2:
                  raise RuntimeError(f'hero must be exactly two readable lines at {width}: {headings["hero"]}')
                for name in ('start','how','features','trust','final'):
                  lines=headings[name]
                  if len(lines) > 2:
                    raise RuntimeError(f'{name} heading has too many lines at {width}: {lines}')
                  if any(line['count'] < 4 for line in lines):
                    raise RuntimeError(f'{name} heading has orphan glyph line at {width}: {lines}')
                if len(headings['desktop']) != 2:
                  raise RuntimeError(f'desktop heading must use controlled two-line break at {width}: {headings["desktop"]}')
              else:
                for name,lines in headings.items():
                  if any(line['count'] < 3 for line in lines):
                    raise RuntimeError(f'{name} heading has orphan glyph line on mobile: {lines}')

              for block in data['headingBlocks']:
                xs=block['xs']
                if xs and max(xs)-min(xs) > 2:
                  raise RuntimeError(f'section heading left edges are misaligned at {width}: {xs}')
                kicker=block['kicker']
                if kicker and (kicker['height'] > 36 or kicker['width'] < 32):
                  raise RuntimeError(f'section kicker is vertical/cramped at {width}: {kicker}')

              page.screenshot(path=str(out/f'landing-{width}.png'),full_page=True)
              data['viewport']={'width':width,'height':height}
              data['projectionRatio']=ratio
              results.append(data)
              page.close()
            browser.close()

          Path('landing-evidence/05-visual-metrics.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Report corrected staging LP
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ job.status }}"
          version="$(grep -oE 'Current Version ID: [0-9a-f-]+' landing-evidence/02-deploy.txt 2>/dev/null | tail -1 | cut -d' ' -f4 || true)"
          body="CPCV corrected LP staging: source=${LP_COMMIT} system_base=${SYSTEM_COMMIT} status=${status} version=${version:-unknown} origin=${STAGING_ORIGIN} run=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 70 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Upload live visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcv-corrected-landing-live-${{ env.LP_COMMIT }}
          path: landing-evidence/
          if-no-files-found: warn
          retention-days: 30
