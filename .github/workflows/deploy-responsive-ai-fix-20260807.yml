name: Deploy responsive and AI translation fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-responsive-ai-fix-20260807.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-responsive-ai-production-20260807
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 82e96a23e103c0c826b772c576408c58ec8f9ce7
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev

jobs:
  validate-stage-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!key:-}"
            [ -z "$value" ] || { account="$value"; break; }
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run complete source and regression validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-records
          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "started_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deployment-records/00-metadata.txt
          npm run verify:source-manifest 2>&1 | tee deployment-records/01-source-manifest.txt
          node scripts/test-ai-translation-resilience.mjs 2>&1 | tee deployment-records/02-ai-translation-unit.txt
          npm run check 2>&1 | tee deployment-records/03-predeploy-check.txt
          npm run check:project 2>&1 | tee deployment-records/04-project-check.txt
          npm run check:pdf-links 2>&1 | tee deployment-records/05-pdf-links.txt
          npm run verify:final-docs 2>&1 | tee deployment-records/06-final-docs.txt
          npm run check:stage08 2>&1 | tee deployment-records/07-stage08-all.txt
          npm run test:owner-bootstrap 2>&1 | tee deployment-records/08-owner-bootstrap.txt
          npm run deploy:dry-run 2>&1 | tee deployment-records/09-dry-run.txt
          npm audit 2>&1 | tee deployment-records/10-audit-all.txt
          npm audit --omit=dev 2>&1 | tee deployment-records/11-audit-production.txt
          python scripts/audit-responsive-layout.py 2>&1 | tee deployment-records/12-local-layout-audit.txt
          cp -R artifacts/responsive-layout-audit deployment-records/local-layout-evidence
          rm -rf artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code

      - name: Materialize isolated staging configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('wrangler.toml').read_text(encoding='utf-8')
          replacements = {
            'name = "class-pdf-comment-viewer-v01"': 'name = "class-pdf-comment-viewer-v01-staging"',
            'database_name = "class_comment_db"': 'database_name = "class_comment_db_staging"',
            'database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"': 'database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"',
            'database_name = "class_comment_db_v2"': 'database_name = "class_comment_db_v2_staging"',
            'database_id = "8315a076-67ad-44e6-8286-11887af52ad3"': 'database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"',
            'queue = "cpcv-ai-jobs"': 'queue = "cpcv-ai-jobs-staging"',
            'queue = "cpcv-ai-translation-jobs"': 'queue = "cpcv-ai-translation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-translation-dlq"': 'dead_letter_queue = "cpcv-ai-translation-dlq-staging"',
            'queue = "cpcv-ai-moderation-jobs"': 'queue = "cpcv-ai-moderation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-moderation-dlq"': 'dead_letter_queue = "cpcv-ai-moderation-dlq-staging"',
            '826071901': '826071801',
            '826071902': '826071802',
            '826071903': '826071803',
            '826071904': '826071804',
            '826071905': '826071805',
            '826071906': '826071806',
            'https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev': 'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev',
            'TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"': 'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"'
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'missing staging replacement: {old}')
              source = source.replace(old, new)
          Path('.cpcv-staging.wrangler.toml').write_text(source, encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml
          sha256sum .cpcv-staging.wrangler.toml | tee deployment-records/13-staging-config-sha256.txt

      - name: Apply and verify staging database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply class_comment_db_staging --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee deployment-records/14-staging-legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml 2>&1 | tee deployment-records/15-staging-v2-migrations.txt
          node scripts/verify-remote-d1.mjs --config .cpcv-staging.wrangler.toml --database class_comment_db_v2_staging 2>&1 | tee deployment-records/16-staging-db-health.txt

      - name: Deploy exact release to staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars 2>&1 | tee deployment-records/17-staging-deploy.txt
          npx wrangler deployments status --config .cpcv-staging.wrangler.toml 2>&1 | tee deployment-records/18-staging-deployment-status.txt
          node scripts/smoke-production.mjs --config .cpcv-staging.wrangler.toml --origin "$STAGING_ORIGIN" 2>&1 | tee deployment-records/19-staging-smoke.txt

      - name: Create live responsive audit script
        shell: bash
        run: |
          cat > /tmp/live-layout-audit.py <<'PY'
          from __future__ import annotations
          import asyncio, json, sys
          from pathlib import Path
          from playwright.async_api import async_playwright

          origin, output, release = sys.argv[1:4]
          out = Path(output); out.mkdir(parents=True, exist_ok=True)
          paths = ('/', '/admin', '/signup', '/forgot-password', '/account', '/master', '/about', '/guide', '/privacy')
          widths = ((320,720),(375,812),(768,1024),(1024,768),(1440,1000))

          async def main():
              failures=[]; checks=0
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  page=await browser.new_page()
                  for path in paths:
                      for width,height in widths:
                          checks += 1
                          await page.set_viewport_size({'width':width,'height':height})
                          sep='&' if '?' in path else '?'
                          await page.goto(f'{origin}{path}{sep}release={release}',wait_until='domcontentloaded',timeout=30000)
                          await page.wait_for_timeout(700)
                          result=await page.evaluate('''(width)=>{
                            const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)!==0&&r.width>.5&&r.height>.5};
                            const scrollParent=e=>{for(let n=e.parentElement;n;n=n.parentElement){const s=getComputedStyle(n);if(/(auto|scroll)/.test(s.overflowX)&&n.scrollWidth>n.clientWidth+1)return true}return false};
                            const outside=[];
                            for(const e of [...document.body.querySelectorAll('*')].filter(visible)){
                              if(scrollParent(e))continue;const r=e.getBoundingClientRect();
                              if(r.left < -1 || r.right > width+1){outside.push({tag:e.tagName,id:e.id||'',class:String(e.className||'').slice(0,80),left:r.left,right:r.right});if(outside.length>=20)break}
                            }
                            const auth=[];
                            for(const shell of document.querySelectorAll('.auth-shell,.admin-login-shell')){
                              if(!visible(shell))continue;const sr=shell.getBoundingClientRect();
                              for(const e of shell.querySelectorAll('input,select,textarea,button,iframe')){if(!visible(e))continue;const r=e.getBoundingClientRect();if(r.left<sr.left-1||r.right>sr.right+1)auth.push({tag:e.tagName,id:e.id||'',left:r.left,right:r.right,shellLeft:sr.left,shellRight:sr.right})}
                            }
                            return {documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,outside,auth}
                          }''',width)
                          ok=result['documentWidth']<=width+1 and result['bodyWidth']<=width+1 and not result['outside'] and not result['auth']
                          if not ok:
                              item={'path':path,'width':width,**result};failures.append(item)
                              await page.screenshot(path=str(out/f'FAIL-{path.strip("/").replace("/","_") or "home"}-{width}.png'),full_page=True)
                          elif path in ('/admin','/signup','/forgot-password') and width in (320,1024):
                              await page.screenshot(path=str(out/f'PASS-{path.strip("/")}-{width}.png'),full_page=True)
                  await browser.close()
              summary={'ok':not failures,'checks':checks,'failureCount':len(failures),'failures':failures}
              (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(json.dumps({'ok':summary['ok'],'checks':checks,'failureCount':len(failures)}))
              if failures:
                  for item in failures[:10]: print(json.dumps(item,ensure_ascii=False))
                  raise SystemExit(1)
          asyncio.run(main())
          PY

      - name: Verify staging pages at five viewport widths
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/live-layout-audit.py "$STAGING_ORIGIN" deployment-records/staging-live-layout "$SOURCE_COMMIT" 2>&1 | tee deployment-records/20-staging-live-layout.txt
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$STAGING_ORIGIN/admin?release=$SOURCE_COMMIT" | grep -F '授業管理へログイン'
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$STAGING_ORIGIN/assets/app.css?release=$SOURCE_COMMIT" | grep -F 'app-base.css'
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$STAGING_ORIGIN/assets/app-base.css?release=$SOURCE_COMMIT" | grep -F 'v0.8.10 auth hierarchy'

      - name: Verify exact translation provider through Workers AI binding
        shell: bash
        run: |
          set -euo pipefail
          probe="cpcv-translation-probe-${GITHUB_RUN_ID}"
          mkdir -p /tmp/cpcv-ai-probe/src/ai
          cp src/ai/provider.js src/ai/provider-base.js src/ai/validation.js /tmp/cpcv-ai-probe/src/ai/
          cat > /tmp/cpcv-ai-probe/index.mjs <<'JS'
          import { runTranslationModel } from './src/ai/provider.js';
          const samples = {
            fast: { message: 'This is a translation health check.', sourceLanguage: 'en', targetLanguage: 'ja', quality: 'fast' },
            balanced: { message: 'La precisione della traduzione è scarsa.', sourceLanguage: 'other', targetLanguage: 'ja', quality: 'balanced' },
            accurate: { message: 'Bugün hava bulutlu ve yağmurlu.', sourceLanguage: 'tr', targetLanguage: 'ja', quality: 'accurate' }
          };
          export default { async fetch(request, env) {
            const key = new URL(request.url).pathname.slice(1);
            if (!samples[key]) return new Response('not found', { status: 404 });
            const started = Date.now();
            try {
              const result = await runTranslationModel(env, samples[key]);
              return Response.json({ ok: true, durationMs: Date.now()-started, key, result });
            } catch (error) {
              return Response.json({ ok: false, durationMs: Date.now()-started, key, error: String(error?.message||error), aiCode: error?.aiCode||'', retryable: Boolean(error?.retryable) }, { status: 502 });
            }
          }};
          JS
          cat > /tmp/cpcv-ai-probe/wrangler.toml <<EOF
          name = "$probe"
          main = "index.mjs"
          compatibility_date = "2026-06-17"
          workers_dev = true
          [ai]
          binding = "AI"
          [vars]
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_BALANCED_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_TRANSLATION_ACCURATE_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          AI_TRANSLATION_TIMEOUT_MS = "3000"
          AI_TRANSLATION_BALANCED_TIMEOUT_MS = "6000"
          AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "12000"
          EOF
          cleanup() { npx wrangler delete --config /tmp/cpcv-ai-probe/wrangler.toml --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          (cd /tmp/cpcv-ai-probe && npx --prefix "$GITHUB_WORKSPACE" wrangler deploy --config wrangler.toml) 2>&1 | tee deployment-records/21-ai-probe-deploy.txt
          origin="https://${probe}.syouziroupc.workers.dev"
          for mode in fast balanced accurate; do
            curl --fail-with-body -sS --retry 4 --retry-delay 2 --retry-all-errors "$origin/$mode" | tee "deployment-records/22-ai-${mode}.json"
            node -e "const x=require('./deployment-records/22-ai-${mode}.json'); if(!x.ok || !x.result || !x.result.translatedText) process.exit(1)"
          done
          cleanup
          trap - EXIT

      - name: Record production rollback state and verify prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list 2>&1 | tee deployment-records/23-production-secret-names.txt
          for name in AUTH_RATE_LIMIT_PEPPER PUBLIC_RATE_LIMIT_PEPPER TURNSTILE_SECRET_KEY; do
            grep -F "$name" deployment-records/23-production-secret-names.txt >/dev/null
          done
          npx wrangler d1 time-travel info class_comment_db_v2 2>&1 | tee deployment-records/24-production-time-travel.txt
          npx wrangler d1 migrations list class_comment_db --remote 2>&1 | tee deployment-records/25-production-legacy-migrations-before.txt
          npx wrangler d1 migrations list class_comment_db_v2 --remote 2>&1 | tee deployment-records/26-production-v2-migrations-before.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/27-production-db-before.txt
          npx wrangler deployments status 2>&1 | tee deployment-records/28-production-deployments-before.txt
          npx wrangler versions list 2>&1 | tee deployment-records/29-production-versions-before.txt

      - name: Apply production migrations and deploy exact release
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply class_comment_db --remote 2>&1 | tee deployment-records/30-production-legacy-migrations.txt
          npx wrangler d1 migrations apply class_comment_db_v2 --remote 2>&1 | tee deployment-records/31-production-v2-migrations.txt
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/32-production-db-after-migrations.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code
          npx wrangler deploy --keep-vars 2>&1 | tee deployment-records/33-production-deploy.txt

      - name: Verify production release and live layouts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-remote-d1.mjs 2>&1 | tee deployment-records/34-production-db-after-deploy.txt
          node scripts/smoke-production.mjs --origin "$PRODUCTION_ORIGIN" 2>&1 | tee deployment-records/35-production-smoke.txt
          python /tmp/live-layout-audit.py "$PRODUCTION_ORIGIN" deployment-records/production-live-layout "$SOURCE_COMMIT" 2>&1 | tee deployment-records/36-production-live-layout.txt
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/admin?release=$SOURCE_COMMIT" | grep -F '授業管理へログイン'
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/app.css?release=$SOURCE_COMMIT" | grep -F 'app-base.css'
          curl --fail-with-body -sS -H 'Cache-Control: no-cache' "$PRODUCTION_ORIGIN/assets/app-base.css?release=$SOURCE_COMMIT" | grep -F 'v0.8.10 auth hierarchy'
          npx wrangler deployments status 2>&1 | tee deployment-records/37-production-deployments-after.txt
          npx wrangler versions list 2>&1 | tee deployment-records/38-production-versions-after.txt
          echo "completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment-records/99-result.txt
          echo 'result=PASSED' >> deployment-records/99-result.txt
          find deployment-records -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > deployment-records/SHA256SUMS.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-responsive-ai-deployment-${{ env.SOURCE_COMMIT }}
          path: deployment-records/
          if-no-files-found: error
          retention-days: 90
