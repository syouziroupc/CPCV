name: Deploy TalkSys parallel grounding once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-talksys-parallel-grounding-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout TalkSys exact revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 7664956d374be4cc353578a07feff840e1412aef
          path: talksys

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install and validate TalkSys
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          node --check src/worker-v44.js
          node --check src/search-v45.js
          npm run architecture:check
          npm run architecture:graph
          npm test
          npx wrangler deploy --dry-run

      - name: Require retained Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy TalkSys to Cloudflare Workers
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production revision and safeguards
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            ok="$(BODY="$body" node - <<'NODE'
          let d={}; try { d=JSON.parse(process.env.BODY||'{}'); } catch {}
          process.stdout.write(String(
            d.revision==='talksys-v45-parallel-grounding-r1' &&
            d.searchDirectorParallelSeed===true &&
            d.groundedHistoryUserOnly===true &&
            d.transitEvidenceGuard===true
          ));
          NODE
          )"
            [ "$ok" = "true" ] && break
            [ "$attempt" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Smoke deterministic route
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          payload='{"text":"12345÷15","history":[]}'
          out="$(curl -fsS --max-time 25 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);console.log(JSON.stringify({ok:d.ok,route:d.route,answer:d.answer}));"

      - name: Probe transit regression
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          payload='{"text":"大分から行橋まで電車でどうやって行けばいい？","history":[]}'
          out="$(curl -fsS --max-time 75 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          echo "$out"
          OUT="$out" node - <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          if(!d.ok) throw new Error(process.env.OUT);
          const a=String(d.answer||'');
          if(/小倉[^。]{0,40}(?:鹿児島本線|乗り換)/.test(a) || /鹿児島本線[^。]{0,40}乗り換/.test(a)) {
            throw new Error('dangerous transit regression: '+a);
          }
          console.log(JSON.stringify({ok:d.ok,route:d.route,answer:a,searchUseful:d.searchUseful}));
          NODE
