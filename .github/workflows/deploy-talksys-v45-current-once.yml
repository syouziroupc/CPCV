name: Verify current TalkSys v45 production once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-talksys-v45-current-once.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - name: Verify current v45 production contract
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          BODY="$body" node -e "const d=JSON.parse(process.env.BODY||'{}');if(!(d.ok===true&&d.voiceRevision==='talksys-v45-formal-api-primary-safe-fallback'&&d.revision==='talksys-v45-formal-api-primary-safe-fallback'&&d.unifiedTurnRouter===true&&d.legacyV43TurnDelegation===false&&d.apiFirst===true&&d.apiParallel===true&&d.groundedEvidenceFallback===true&&d.externalFailureUsesCasualModel===false&&d.modelTimeoutMs===12000&&d.searchDirectorModel==='@cf/qwen/qwen3-30b-a3b-fp8'&&d.searchDefault==='intent-routed-v45'))throw new Error(process.env.BODY);"
          echo "$body"

      - name: Smoke deterministic arithmetic route
        run: |
          set -euo pipefail
          payload='{"text":"12345÷15","history":[]}'
          out="$(curl -fsS --max-time 20 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);console.log(JSON.stringify({ok:d.ok,route:d.route,search:d.search,answer:d.answer}));"

      - name: Smoke JMA weather API route
        run: |
          set -euo pipefail
          payload='{"text":"別府市の今日の天気は？","history":[]}'
          out="$(curl -fsS --max-time 75 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');const tools=(d.apiSources||[]).map(x=>x.tool);if(!d.ok||d.route!=='api-first-v45'||!tools.includes('jma_weather'))throw new Error(process.env.OUT);console.log(JSON.stringify({ok:d.ok,route:d.route,tools,answer:d.answer}));"

      - name: Record completion
        run: echo "TalkSys v45 production verification completed."
