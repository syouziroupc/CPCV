name: Deploy repaired TalkSys v45 UI and voice once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-talksys-v45-ui-voice-repair-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      TALKSYS_SHA: cd4403840a4b64a5925d9b552327952b2bb04998
    steps:
      - name: Checkout exact repaired TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          path: talksys

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install and validate exact repaired runtime
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          find src -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          npx wrangler deploy --dry-run

      - name: Require CPCV Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy exact repaired TalkSys revision
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Verify repaired production contract
        shell: bash
        run: |
          set -euo pipefail
          body=''
          for attempt in $(seq 1 25); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(Boolean(d.ok===true&&d.revision==='talksys-v45-formal-api-primary-safe-fallback'&&d.voiceRevision==='talksys-v45-http-adaptive-vad'&&d.uiRevision==='talksys-v45-ui-restored-20260911'&&d.sttRevision==='talksys-v45-hardened-whisper'&&d.voiceArchitecture==='http-turns-client-vad-v45'&&d.adaptiveNoiseVad===true&&d.ambientCalibration===true&&d.legacyWebSocketVoice===false&&d.durableObjectVoice===false&&d.legacyAgentRoute===false&&d.unifiedTurnRouter===true&&d.apiFirst===true&&d.apiParallel===true)))")"
            [[ "$ok" == 'true' ]] && break
            [[ "$attempt" -eq 25 ]] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"

      - name: Verify production UI and microphone route
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsS --max-time 20 "$PRODUCTION_URL/")"
          grep -F 'talksys-v45-ui-restored-20260911' <<< "$page"
          grep -F '/talk-v45.js' <<< "$page"
          grep -F '非常用の文字入力' <<< "$page"
          grep -F 'Foonz' <<< "$page"

          client="$(curl -fsS --max-time 20 "$PRODUCTION_URL/talk-v45.js")"
          grep -F 'talksys-v45-http-adaptive-vad' <<< "$client"
          grep -F 'getUserMedia' <<< "$client"
          grep -F '/api/transcribe' <<< "$client"
          grep -F '/api/turn' <<< "$client"
          grep -F 'noiseBoost' <<< "$client"
          grep -F 'calibrationUntil' <<< "$client"
          if grep -E 'new[[:space:]]+WebSocket|/agents/' <<< "$client"; then
            echo 'legacy websocket/agent voice path found in production client'
            exit 1
          fi

          telephony="$(curl -fsS --max-time 20 "$PRODUCTION_URL/telephony-health")"
          TELEPHONY="$telephony" node -e "const d=JSON.parse(process.env.TELEPHONY||'{}');if(d.provider!=='Foonz'||d.connected!==false||d.status!=='planned-not-wired')throw new Error(process.env.TELEPHONY);"

      - name: Verify improved v45 backend remains intact
        shell: bash
        run: |
          set -euo pipefail
          payload='{"text":"12345÷15","history":[]}'
          out="$(curl -fsS --max-time 20 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');if(!d.ok||d.route!=='deterministic-v45'||d.search!==false||!String(d.answer||'').includes('823'))throw new Error(process.env.OUT);"

          payload='{"text":"別府市の今日の天気は？","history":[]}'
          out="$(curl -fsS --max-time 75 -H 'content-type: application/json' --data "$payload" "$PRODUCTION_URL/api/turn")"
          OUT="$out" node -e "const d=JSON.parse(process.env.OUT||'{}');const tools=(d.apiSources||[]).map(x=>x.tool);if(!d.ok||d.route!=='api-first-v45'||!tools.includes('jma_weather'))throw new Error(process.env.OUT);"

      - name: Record completion
        run: echo "Repaired TalkSys v45 UI, HTTP microphone path, and v45 backend verified in production."
