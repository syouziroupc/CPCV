name: Diagnose Cloudflare staging authentication

on:
  push:
    branches:
      - agent/deploy-translation-fix-staging
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: diagnose-cloudflare-staging-auth
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 3c1da6900b0d0d91043b2f823581ca79fd4a31f4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose product permissions
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: 7cea58251b35319648343e0dd9f7cb76
        run: |
          set -euo pipefail
          mkdir -p auth-diagnostic
          report=auth-diagnostic/report.txt
          : > "$report"
          test -n "${TOKEN:-}"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          printf 'token_present=true\n' | tee -a "$report"

          set +e
          env -u CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN="$TOKEN" \
            npx wrangler whoami --json > /tmp/whoami.json 2>/tmp/whoami.err
          whoami_exit=$?
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" \
            npx wrangler deployments list --name class-pdf-comment-viewer-v01-staging --json \
            > /tmp/workers.json 2>/tmp/workers.err
          workers_exit=$?
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" \
            npx wrangler d1 list --json > /tmp/d1.json 2>/tmp/d1.err
          d1_exit=$?
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" \
            npx wrangler queues info cpcv-ai-jobs-staging > /tmp/queue.txt 2>/tmp/queue.err
          queue_exit=$?
          set -e

          whoami_json=false
          workers_json=false
          d1_json=false
          jq -e . /tmp/whoami.json >/dev/null 2>&1 && whoami_json=true
          jq -e . /tmp/workers.json >/dev/null 2>&1 && workers_json=true
          jq -e . /tmp/d1.json >/dev/null 2>&1 && d1_json=true
          printf 'wrangler_whoami_exit=%s\nwrangler_whoami_json=%s\nworkers_read_exit=%s\nworkers_json=%s\nd1_list_exit=%s\nd1_json=%s\nqueue_info_exit=%s\n' \
            "$whoami_exit" "$whoami_json" "$workers_exit" "$workers_json" "$d1_exit" "$d1_json" "$queue_exit" | tee -a "$report"

          for pair in workers:/tmp/workers.err d1:/tmp/d1.err queue:/tmp/queue.err; do
            label=${pair%%:*}
            path=${pair#*:}
            code=$(grep -Eo 'code: [0-9]+' "$path" 2>/dev/null | tail -1 | awk '{print $2}' || true)
            printf '%s_error_code=%s\n' "$label" "${code:-none}" | tee -a "$report"
          done
          cat "$report"
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-staging-permission-diagnostic
          path: auth-diagnostic/report.txt
          if-no-files-found: warn
          retention-days: 30
