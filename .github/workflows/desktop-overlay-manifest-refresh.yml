name: Refresh overlay PoC source manifest

on:
  push:
    branches:
      - agent/desktop-overlay-poc
    paths:
      - .github/workflows/desktop-overlay-manifest-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-overlay-poc
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/desktop-overlay-manifest-refresh.yml
          node scripts/generate-source-manifest.mjs
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh source manifest for overlay PoC"
          git push origin HEAD:agent/desktop-overlay-poc
