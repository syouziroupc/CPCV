name: CPCV Desktop

on:
  pull_request:
    paths:
      - "desktop-overlay-poc/**"
      - "docs/desktop-overlay-stage2-plan.md"
      - ".github/workflows/desktop-overlay-poc.yml"
      - "SOURCE_SHA256SUMS.override.txt"
      - "README.md"
      - "public/admin/**"
      - "public/viewer/**"
      - "public/assets/admin.js"
      - "public/assets/viewer.js"
      - "src/index.js"
      - "wrangler.toml"
  push:
    branches:
      - "master"
      - "agent/desktop-*"
      - "release/cpcv-u22-final-*"
    paths:
      - "desktop-overlay-poc/**"
      - "docs/desktop-overlay-stage2-plan.md"
      - ".github/workflows/desktop-overlay-poc.yml"
      - "SOURCE_SHA256SUMS.override.txt"
      - "README.md"
      - "public/admin/**"
      - "public/viewer/**"
      - "public/assets/admin.js"
      - "public/assets/viewer.js"
      - "src/index.js"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop-overlay-poc
    env:
      CPCV_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.CPCV_WINDOWS_CERTIFICATE_BASE64 }}
      CPCV_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CPCV_WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        shell: pwsh
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Unexpected source SHA: $actual" }

      - name: Verify source manifest
        working-directory: .
        run: node scripts/verify-source-manifest.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: desktop-overlay-poc/package-lock.json

      - name: Pin Desktop npm
        run: npm install --global npm@10.9.8

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Verify frozen build toolchain
        shell: pwsh
        run: |
          $nodeVersion = (node --version).Trim()
          $npmVersion = (npm --version).Trim()
          $rustVersion = (rustc --version).Trim()
          Write-Host "node=$nodeVersion"
          Write-Host "npm=$npmVersion"
          rustc --version --verbose
          if ($nodeVersion -ne "v22.23.1") { throw "Unexpected node version: $nodeVersion" }
          if ($npmVersion -ne "10.9.8") { throw "Unexpected npm version: $npmVersion" }
          if ($rustVersion -notmatch '^rustc 1\.97\.1 ') { throw "Unexpected rustc version: $rustVersion" }

      - name: Install locked desktop dependencies
        run: npm ci

      - name: Check bundled JavaScript
        run: npm run check:ui

      - name: Verify compatibility with bundled CPCV source
        run: npm run check:compat

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install pinned RustSec cargo-audit
        shell: pwsh
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          $auditVersion = (cargo audit --version).Trim()
          Write-Host "cargo_audit=$auditVersion"
          if ($auditVersion -notmatch '^cargo-audit(?:-audit)? 0\.22\.2(?:\s|$)') { throw "Unexpected cargo-audit version: $auditVersion" }

      - name: Audit Rust dependencies with RustSec
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows release executable
        run: npm run build:release

      - name: Sign Windows release executable
        if: env.CPCV_WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Executable "src-tauri/target/release/cpcv-desktop.exe"

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/cpcv-desktop.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "CPCV Desktop exited during startup. Exit code: $($process.ExitCode)"
            exit 1
          }
          Write-Host "CPCV Desktop remained alive for 20 seconds. PID=$($process.Id)"
          Stop-Process -Id $process.Id -Force

      - name: Generate SHA-256 checksum and build record
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/cpcv-desktop.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cpcv-desktop.exe" | Set-Content -Encoding ascii "src-tauri/target/release/cpcv-desktop.exe.sha256"
          $os = Get-CimInstance Win32_OperatingSystem
          @(
            "source_git_sha=$(git rev-parse HEAD)",
            "runner_os=$($os.Caption)",
            "runner_version=$($os.Version)",
            "node=$(node --version)",
            "npm=$(npm --version)",
            "rustc=$((rustc --version).Trim())",
            "cargo_audit=$((cargo audit --version).Trim())",
            "desktop_version=0.2.2",
            "web_contract_version=0.8.10",
            "exe_sha256=$hash"
          ) | Set-Content -Encoding ascii "src-tauri/target/release/CPCV_BUILD_ENVIRONMENT.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpcv-desktop-v0.2.2-cpcv0.8.10-windows-release
          path: |
            desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe
            desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe.sha256
            desktop-overlay-poc/src-tauri/target/release/CPCV_BUILD_ENVIRONMENT.txt
          if-no-files-found: error
          retention-days: 30
