name: CPCV Desktop

on:
  pull_request:
    paths:
      - "desktop-overlay-poc/**"
      - "docs/desktop-overlay-stage2-plan.md"
      - ".github/workflows/desktop-overlay-poc.yml"
      - "README.md"
      - "public/admin/**"
      - "public/viewer/**"
      - "public/assets/admin.js"
      - "public/assets/viewer.js"
      - "src/index.js"
      - "wrangler.toml"
  push:
    branches:
      - "master"
      - "agent/desktop-*"
      - "release/cpcv-u22-final-*"
    paths:
      - "desktop-overlay-poc/**"
      - "docs/desktop-overlay-stage2-plan.md"
      - ".github/workflows/desktop-overlay-poc.yml"
      - "README.md"
      - "public/admin/**"
      - "public/viewer/**"
      - "public/assets/admin.js"
      - "public/assets/viewer.js"
      - "src/index.js"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop-overlay-poc
    env:
      CPCV_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.CPCV_WINDOWS_CERTIFICATE_BASE64 }}
      CPCV_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CPCV_WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify source manifest
        working-directory: .
        run: node scripts/verify-source-manifest.mjs

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-overlay-poc/package-lock.json

      - name: Pin Desktop npm
        run: npm install --global npm@10.9.8

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt,clippy

      - name: Verify frozen build toolchain
        shell: pwsh
        run: |
          $npmVersion = (npm --version).Trim()
          $rustVersion = (rustc --version).Trim()
          Write-Host "node=$(node --version)"
          Write-Host "npm=$npmVersion"
          rustc --version --verbose
          if ($npmVersion -ne "10.9.8") { throw "Unexpected npm version: $npmVersion" }
          if ($rustVersion -notmatch '^rustc 1\.97\.1 ') { throw "Unexpected rustc version: $rustVersion" }

      - name: Install locked desktop dependencies
        run: npm ci

      - name: Check bundled JavaScript
        run: npm run check:ui

      - name: Verify compatibility with bundled CPCV source
        run: npm run check:compat

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows release executable
        run: npm run build:release

      - name: Sign Windows release executable
        if: env.CPCV_WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Executable "src-tauri/target/release/cpcv-desktop.exe"

      - name: Launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/cpcv-desktop.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "CPCV Desktop exited during startup. Exit code: $($process.ExitCode)"
            exit 1
          }
          Write-Host "CPCV Desktop remained alive for 20 seconds. PID=$($process.Id)"
          Stop-Process -Id $process.Id -Force

      - name: Generate SHA-256 checksum and build record
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/cpcv-desktop.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cpcv-desktop.exe" | Set-Content -Encoding ascii "src-tauri/target/release/cpcv-desktop.exe.sha256"
          $os = Get-CimInstance Win32_OperatingSystem
          @(
            "source_git_sha=$(git rev-parse HEAD)",
            "runner_os=$($os.Caption)",
            "runner_version=$($os.Version)",
            "node=$(node --version)",
            "npm=$(npm --version)",
            "rustc=$((rustc --version).Trim())",
            "desktop_version=0.2.2",
            "web_contract_version=0.8.10",
            "exe_sha256=$hash"
          ) | Set-Content -Encoding ascii "src-tauri/target/release/CPCV_BUILD_ENVIRONMENT.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-desktop-v0.2.2-cpcv0.8.10-windows-release
          path: |
            desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe
            desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe.sha256
            desktop-overlay-poc/src-tauri/target/release/CPCV_BUILD_ENVIRONMENT.txt
          if-no-files-found: error
          retention-days: 30
