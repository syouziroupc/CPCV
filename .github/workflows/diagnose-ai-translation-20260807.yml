name: Diagnose production AI translation

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/diagnose-ai-translation-20260807.yml'
      - 'src/ai/**'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-production-ai-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!key:-}"
            [ -z "$value" ] || { account="$value"; break; }
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Record translation job aggregates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-diagnostic
          query() {
            local name="$1"
            local sql="$2"
            npx wrangler d1 execute class_comment_db_v2 --remote --json --command "$sql" > "ai-diagnostic/$name.json"
          }
          query job-status "SELECT job_type,status,COALESCE(last_error_code,'') AS last_error_code,COUNT(*) AS count,MIN(created_at) AS oldest,MAX(updated_at) AS newest FROM ai_jobs WHERE created_at >= datetime('now','-2 days') GROUP BY job_type,status,last_error_code ORDER BY job_type,status,last_error_code;"
          query recent-translation-jobs "SELECT id,status,attempt_count,COALESCE(last_error_code,'') AS last_error_code,created_at,updated_at,run_after,claimed_at FROM ai_jobs WHERE job_type='translation' ORDER BY created_at DESC LIMIT 30;"
          query translation-output-count "SELECT COUNT(*) AS translations_last_2_days,MAX(created_at) AS newest_translation FROM translations WHERE created_at >= datetime('now','-2 days');"
          query usage-models "SELECT job_type,model,COUNT(*) AS count,MAX(created_at) AS newest FROM ai_usage_events WHERE created_at >= datetime('now','-2 days') GROUP BY job_type,model ORDER BY job_type,model;"
          npx wrangler queues info cpcv-ai-translation-jobs > ai-diagnostic/queue-info.txt 2>&1 || true
      - name: Call Workers AI models with fixed test text
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run"
          call_model() {
            local name="$1"
            local model="$2"
            local body="$3"
            local code
            code=$(curl -sS -o "ai-diagnostic/$name.json" -w '%{http_code}' \
              -X POST "$base/$model" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$body")
            printf '%s\n' "$code" > "ai-diagnostic/$name.http-status.txt"
          }
          call_model m2m100 '@cf/meta/m2m100-1.2b' '{"text":"This is a translation health check.","source_lang":"en","target_lang":"ja"}'
          call_model glm '@cf/zai-org/glm-4.7-flash' '{"messages":[{"role":"system","content":"Translate into Japanese. Return only the translation."},{"role":"user","content":"This is a translation health check."}],"max_tokens":100,"temperature":0}'
          call_model qwen '@cf/qwen/qwen3-30b-a3b-fp8' '{"messages":[{"role":"system","content":"Translate into Japanese. Return only the translation."},{"role":"user","content":"This is a translation health check."}],"max_tokens":100,"temperature":0}'
      - name: Summarize diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '=== queue ==='
          cat ai-diagnostic/queue-info.txt || true
          echo '=== job status ==='
          cat ai-diagnostic/job-status.json
          echo '=== recent translation jobs ==='
          cat ai-diagnostic/recent-translation-jobs.json
          echo '=== model HTTP status ==='
          for f in ai-diagnostic/*.http-status.txt; do echo "$f: $(cat "$f")"; done
          echo '=== model response shapes ==='
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['m2m100','glm','qwen']) {
            const value = JSON.parse(fs.readFileSync(`ai-diagnostic/${name}.json`, 'utf8'));
            const result = value?.result ?? value;
            console.log(name, JSON.stringify({ success: value?.success, errors: value?.errors, resultType: Array.isArray(result) ? 'array' : typeof result, resultKeys: result && typeof result === 'object' && !Array.isArray(result) ? Object.keys(result) : [] }));
          }
          NODE
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-ai-translation-diagnostic-${{ github.sha }}
          path: ai-diagnostic/
          if-no-files-found: error
          retention-days: 30
