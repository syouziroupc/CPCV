name: Diagnose flat UI and fast translation

on:
  push:
    branches: [master]
    paths: [.github/workflows/diagnose-flat-ui-fast-translation.yml]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flat-ui-fast-translation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm install --global npm@11.18.0
          npm ci
      - name: Apply and capture tests
        shell: bash
        run: |
          set -u
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/agent-flat-ui-fast-translation.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          Path('/tmp/cpcv-apply.py').write_text(dedent(workflow[start:end]), encoding='utf-8')
          PY
          python /tmp/cpcv-apply.py > /tmp/apply.log 2>&1
          mkdir -p docs/diagnostics
          cp /tmp/apply.log docs/diagnostics/flat-ui-apply.log
          set +e
          node --check src/ai/provider.js > docs/diagnostics/provider-check.log 2>&1
          echo $? > docs/diagnostics/provider-check.exit
          node --check src/ai/processor.js > docs/diagnostics/processor-check.log 2>&1
          echo $? > docs/diagnostics/processor-check.exit
          node --no-warnings scripts/test-ai-v2.mjs > docs/diagnostics/test-ai-v2.log 2>&1
          echo $? > docs/diagnostics/test-ai-v2.exit
          node scripts/test-v0810-usability.mjs > docs/diagnostics/test-v0810-usability.log 2>&1
          echo $? > docs/diagnostics/test-v0810-usability.exit
          node scripts/test-v0810-security-ui.mjs > docs/diagnostics/test-v0810-security-ui.log 2>&1
          echo $? > docs/diagnostics/test-v0810-security-ui.exit
          set -e
          rm -f .github/workflows/agent-pr-flat-ui-fast-translation.yml
      - name: Commit diagnostics and implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply flat UI translation draft with diagnostics"
          git push origin HEAD:agent/flat-ui-fast-translation
      - name: Remove diagnostic workflow
        if: always()
        run: |
          git fetch origin master
          git checkout -B master origin/master
          rm -f .github/workflows/diagnose-flat-ui-fast-translation.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove temporary CPCV diagnostic workflow"
          git push origin HEAD:master
