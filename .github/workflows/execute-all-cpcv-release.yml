name: Execute complete CPCV release

on:
  push:
    branches: [master]
    paths: [.github/workflows/execute-all-cpcv-release.yml]

permissions:
  contents: write

env:
  SOURCE_COMMIT: ce93380d617672e086b9971fe82bb4f8ffccf861
  STAGING_WORKER: class-pdf-comment-viewer-v01-staging
  PRODUCTION_WORKER: class-pdf-comment-viewer-v01
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
  PRODUCTION_ORIGIN: https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev

concurrency:
  group: cpcv-complete-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout release workflow commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_COMMIT"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/execute-all-cpcv-release.yml"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN_1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_2: ${{ secrets.CF_API_TOKEN }}
          TOKEN_3: ${{ secrets.CLOUDFLARE_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_4: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=""; account=""
          for item in TOKEN_1 TOKEN_2 TOKEN_3; do value="${!item:-}"; if [ -n "$value" ]; then token="$value"; break; fi; done
          for item in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3 ACCOUNT_4; do value="${!item:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Baseline source validation
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          npm run check:v0810
          node --no-warnings scripts/test-ai-v2.mjs
          npm run check:stage08
          npm run test:owner-bootstrap

      - name: Provision production resources and prepare release config
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/cpcv-release
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          mkdir -p "$work" "$evidence"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          npx wrangler whoami > "$evidence/wrangler-whoami.txt"
          npx wrangler d1 list --json > "$work/d1-list.json"
          prod_db_id=$(node - "$work/d1-list.json" <<'NODE'
          const fs=require('fs'); const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||[]); const row=rows.find(x=>x.name==='class_comment_db_v2');
          process.stdout.write(String(row?.uuid||row?.id||row?.database_id||''));
          NODE
          )
          if [ -z "$prod_db_id" ]; then
            npx wrangler d1 create class_comment_db_v2 --location apac > "$evidence/d1-create-production.txt"
            npx wrangler d1 list --json > "$work/d1-list.json"
            prod_db_id=$(node - "$work/d1-list.json" <<'NODE'
          const fs=require('fs'); const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||[]); const row=rows.find(x=>x.name==='class_comment_db_v2');
          process.stdout.write(String(row?.uuid||row?.id||row?.database_id||''));
          NODE
            )
          fi
          [[ "$prod_db_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "PROD_DB_V2_ID=$prod_db_id" >> "$GITHUB_ENV"

          for pair in \
            'class_comment_db_staging:20e4531c-2765-46b5-a68f-940daa94d6a9' \
            'class_comment_db_v2_staging:7b30a11d-5b3c-49f5-bc54-9a1326818089' \
            'class_comment_db:f11457fa-27af-468d-94cc-6cdf1ae814e4'; do
            name="${pair%%:*}"; expected="${pair#*:}"
            actual=$(node - "$work/d1-list.json" "$name" <<'NODE'
          const fs=require('fs'); const raw=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const rows=Array.isArray(raw)?raw:(raw.result||[]); const row=rows.find(x=>x.name===process.argv[3]);
          process.stdout.write(String(row?.uuid||row?.id||row?.database_id||''));
          NODE
            )
            test "$actual" = "$expected"
          done

          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" > "$work/queues.json"
          jq -e '.success == true' "$work/queues.json" >/dev/null
          for queue in cpcv-ai-jobs cpcv-ai-jobs-staging; do
            if ! jq -e --arg q "$queue" '.result[]? | select(.queue_name==$q)' "$work/queues.json" >/dev/null; then
              npx wrangler queues create "$queue"
            fi
          done

          widgets="$work/widgets.json"
          curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" > "$widgets"
          jq -e '.success == true' "$widgets" >/dev/null
          widget_name="CPCV Production"
          sitekey=$(jq -r --arg n "$widget_name" '.result[]? | select(.name==$n) | .sitekey' "$widgets" | head -n1)
          if [ -z "$sitekey" ]; then
            curl --fail-with-body -sS "${auth[@]}" \
              --request POST \
              --data "$(jq -nc --arg d 'class-pdf-comment-viewer-v01.syouziroupc.workers.dev' --arg n "$widget_name" '{domains:[$d],mode:"managed",name:$n}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets" > "$work/widget-created.json"
            jq -e '.success == true' "$work/widget-created.json" >/dev/null
            sitekey=$(jq -r '.result.sitekey' "$work/widget-created.json")
            turnstile_secret=$(jq -r '.result.secret' "$work/widget-created.json")
          else
            curl --fail-with-body -sS "${auth[@]}" \
              --request PUT \
              --data "$(jq -nc --arg d 'class-pdf-comment-viewer-v01.syouziroupc.workers.dev' --arg n "$widget_name" '{domains:[$d],mode:"managed",name:$n}')" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${sitekey}" > "$work/widget-updated.json"
            jq -e '.success == true' "$work/widget-updated.json" >/dev/null
            curl --fail-with-body -sS "${auth[@]}" \
              --request POST --data '{"invalidate_immediately":false}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${sitekey}/rotate_secret" > "$work/widget-rotated.json"
            jq -e '.success == true' "$work/widget-rotated.json" >/dev/null
            turnstile_secret=$(jq -r '.result.secret' "$work/widget-rotated.json")
          fi
          test -n "$sitekey"; test -n "$turnstile_secret"; test "$turnstile_secret" != "null"
          echo "::add-mask::$turnstile_secret"
          echo "PROD_TURNSTILE_SITE_KEY=$sitekey" >> "$GITHUB_ENV"
          echo "PROD_TURNSTILE_SECRET_KEY=$turnstile_secret" >> "$GITHUB_ENV"
          jq -n --arg sitekey "$sitekey" --arg db "$prod_db_id" '{production_db_v2_id:$db,production_turnstile_sitekey:$sitekey}' > "$evidence/provisioned-public-resources.json"
          rm -f "$work"/widget-*.json

          cat > "$work/staging.toml" <<'TOML'
          #:schema node_modules/wrangler/config-schema.json
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true
          assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }
          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = [ "noreply@szworld.uk" ]
          [ai]
          binding = "AI"
          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 5
          max_batch_timeout = 1
          max_retries = 3
          max_concurrency = 10
          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = [ "CommentRoom" ]
          [[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071801"
          simple = { limit = 20, period = 60 }
          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071802"
          simple = { limit = 10, period = 60 }
          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071804"
          simple = { limit = 30, period = 60 }
          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_MODERATION_FALLBACK_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "5000"
          AI_TRANSLATION_FALLBACK_TIMEOUT_MS = "5000"
          AI_QUEUE_PARALLELISM = "5"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
          [triggers]
          crons = [ "*/5 * * * *", "17 3 * * *" ]
          TOML

          python - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('wrangler.toml')
          text=p.read_text(encoding='utf-8')
          db=os.environ['PROD_DB_V2_ID']
          key=os.environ['PROD_TURNSTILE_SITE_KEY']
          text=re.sub(r'(binding = "DB_V2"\ndatabase_name = "class_comment_db_v2"\n)(?!database_id)', rf'\1database_id = "{db}"\n', text)
          text=text.replace('[[send_email]]\nname = "EMAIL"', '[[send_email]]\nname = "EMAIL"\nallowed_sender_addresses = [ "noreply@szworld.uk" ]')
          rate='''[[ratelimits]]
          name = "AUTH_LOGIN_IP_LIMITER"
          namespace_id = "826071701"
          simple = { limit = 20, period = 60 }

          [[ratelimits]]
          name = "AUTH_LOGIN_ACCOUNT_LIMITER"
          namespace_id = "826071702"
          simple = { limit = 10, period = 60 }

          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071703"
          simple = { limit = 30, period = 60 }

          [[ratelimits]]
          name = "AUTH_PUBLIC_EMAIL_LIMITER"
          namespace_id = "826071704"
          simple = { limit = 30, period = 60 }

          '''
          text=text.replace('[[durable_objects.bindings]]', rate+'[[durable_objects.bindings]]')
          text=text.replace('PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"', 'PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"\nAUTH_EMAIL_FROM = "noreply@szworld.uk"\nAUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"\nTURNSTILE_SITE_KEY = "'+key+'"')
          text=re.sub(r'# DB_V2 is the application source of truth\.[\s\S]*?# handoff\. Do not invent one\. Deployment is blocked until the real UUID is set\.\n', '', text)
          text=re.sub(r'\n# Production deployment requires four distinct Rate Limiting bindings\.[\s\S]*$', '\n', text)
          p.write_text(text,encoding='utf-8')
          PY

          git rm .github/workflows/execute-all-cpcv-release.yml
          git add wrangler.toml
          npm run manifest:source
          rm -f SOURCE_SHA256SUMS.override.txt
          git add SOURCE_SHA256SUMS.txt wrangler.toml .github/workflows/execute-all-cpcv-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Configure and release CPCV 0.8.10"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          npm run verify:source-manifest
          node scripts/verify-deployment-config.mjs wrangler.toml
          node scripts/verify-deployment-config.mjs /tmp/cpcv-release/staging.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging /tmp/cpcv-release/staging.toml
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run visual:v0810
          npx wrangler deploy --dry-run --config /tmp/cpcv-release/staging.toml
          npx wrangler deploy --dry-run --config wrangler.toml
          npm audit
          npm audit --omit=dev

      - name: Migrate and deploy staging
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          config=/tmp/cpcv-release/staging.toml
          auth_pepper=$(openssl rand -hex 32)
          public_pepper=$(openssl rand -hex 32)
          echo "::add-mask::$auth_pepper"; echo "::add-mask::$public_pepper"
          export AUTH_RATE_LIMIT_PEPPER="$auth_pepper"
          export PUBLIC_RATE_LIMIT_PEPPER="$public_pepper"
          export TURNSTILE_SECRET_KEY='1x0000000000000000000000000000000AA'
          npx wrangler d1 time-travel info class_comment_db_v2_staging --config "$config" > "$evidence/staging-d1-bookmark-before.txt"
          npx wrangler d1 migrations apply DB --remote --config "$config" > "$evidence/staging-legacy-migrations.txt"
          npx wrangler d1 migrations apply DB_V2 --remote --config "$config" > "$evidence/staging-v2-migrations.txt"
          node scripts/verify-remote-d1.mjs --database class_comment_db_v2_staging --config "$config" > "$evidence/staging-remote-d1.txt"
          node scripts/configure-rate-limit-secret.mjs --config "$config" > "$evidence/staging-secret-configuration.txt"
          npx wrangler deploy --config "$config" > "$evidence/staging-deploy.txt"

      - name: Verify staging deployment and screenshots
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          origin="$STAGING_ORIGIN"
          for path in / /about /guide /privacy /admin /signup; do
            code=$(curl -sS -L --retry 12 --retry-delay 3 --retry-all-errors -o "$evidence/staging$(echo "$path" | tr '/' '_').html" -w '%{http_code}' "$origin$path?release=$RELEASE_COMMIT")
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --fail-with-body -sS --retry 12 --retry-delay 3 "$origin/assets/app.css?release=$RELEASE_COMMIT" > "$evidence/staging-app.css"
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$evidence/staging-app.css"
          grep -F 'border-radius: 0' "$evidence/staging-app.css"
          python - "$origin" staging "$evidence" <<'PY'
          import sys, pathlib
          from playwright.sync_api import sync_playwright
          origin,label,out=sys.argv[1],sys.argv[2],pathlib.Path(sys.argv[3]); out.mkdir(parents=True,exist_ok=True)
          selectors='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for width in (390,768,1440):
              page=b.new_page(viewport={'width':width,'height':900})
              for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                r=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000); assert r and r.status<400
                page.wait_for_timeout(1000)
                assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                bad=page.eval_on_selector_all(selectors,"els=>els.filter(e=>{const r=getComputedStyle(e).borderRadius;return r.split(/\\s+/).some(v=>parseFloat(v)>0)}).length")
                assert bad==0,(path,width,bad)
                page.screenshot(path=str(out/f'{label}-{name}-{width}.png'),full_page=True)
              page.close()
            b.close()
          PY

      - name: Migrate and deploy production
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          auth_pepper=$(openssl rand -hex 32)
          public_pepper=$(openssl rand -hex 32)
          echo "::add-mask::$auth_pepper"; echo "::add-mask::$public_pepper"
          export AUTH_RATE_LIMIT_PEPPER="$auth_pepper"
          export PUBLIC_RATE_LIMIT_PEPPER="$public_pepper"
          export TURNSTILE_SECRET_KEY="$PROD_TURNSTILE_SECRET_KEY"
          npx wrangler d1 time-travel info class_comment_db_v2 --config wrangler.toml > "$evidence/production-d1-bookmark-before.txt"
          npx wrangler d1 migrations apply DB --remote --config wrangler.toml > "$evidence/production-legacy-migrations.txt"
          npx wrangler d1 migrations apply DB_V2 --remote --config wrangler.toml > "$evidence/production-v2-migrations.txt"
          node scripts/verify-remote-d1.mjs --database class_comment_db_v2 --config wrangler.toml > "$evidence/production-remote-d1.txt"
          node scripts/configure-rate-limit-secret.mjs --config wrangler.toml > "$evidence/production-secret-configuration.txt"
          npx wrangler deploy --config wrangler.toml > "$evidence/production-deploy.txt"

      - name: Verify production deployment and screenshots
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          origin="$PRODUCTION_ORIGIN"
          verify_failed=0
          for path in / /about /guide /privacy /admin /signup; do
            code=$(curl -sS -L --retry 12 --retry-delay 3 --retry-all-errors -o "$evidence/production$(echo "$path" | tr '/' '_').html" -w '%{http_code}' "$origin$path?release=$RELEASE_COMMIT") || verify_failed=1
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then verify_failed=1; fi
          done
          curl --fail-with-body -sS --retry 12 --retry-delay 3 "$origin/assets/app.css?release=$RELEASE_COMMIT" > "$evidence/production-app.css" || verify_failed=1
          grep -F 'v0.8.10 flat hierarchy and tactile controls' "$evidence/production-app.css" || verify_failed=1
          grep -F 'border-radius: 0' "$evidence/production-app.css" || verify_failed=1
          if [ "$verify_failed" -ne 0 ]; then
            npx wrangler rollback --config wrangler.toml --message "Automated rollback after failed CPCV production smoke check" || true
            exit 1
          fi
          python - "$origin" production "$evidence" <<'PY'
          import sys, pathlib
          from playwright.sync_api import sync_playwright
          origin,label,out=sys.argv[1],sys.argv[2],pathlib.Path(sys.argv[3]); out.mkdir(parents=True,exist_ok=True)
          selectors='.card,.button,.input,.textarea,.select,.workspace-panel,.workspace-detail,.info-box,.comment-card,.qr-card'
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for width in (390,768,1440):
              page=b.new_page(viewport={'width':width,'height':900})
              for path,name in [('/','home'),('/admin','admin'),('/signup','signup')]:
                r=page.goto(origin+path,wait_until='domcontentloaded',timeout=60000); assert r and r.status<400
                page.wait_for_timeout(1000)
                assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1')
                bad=page.eval_on_selector_all(selectors,"els=>els.filter(e=>{const r=getComputedStyle(e).borderRadius;return r.split(/\\s+/).some(v=>parseFloat(v)>0)}).length")
                assert bad==0,(path,width,bad)
                page.screenshot(path=str(out/f'{label}-{name}-{width}.png'),full_page=True)
              page.close()
            b.close()
          PY

      - name: Record Cloudflare deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/deployment-evidence"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          for target in staging production; do
            if [ "$target" = staging ]; then worker="$STAGING_WORKER"; else worker="$PRODUCTION_WORKER"; fi
            api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}"
            curl --fail-with-body -sS "${auth[@]}" "$api/deployments" > "$evidence/${target}-deployments.json"
            curl --fail-with-body -sS "${auth[@]}" "$api/settings" | jq 'walk(if type=="object" and has("text") and ((.type//"")|startswith("secret")) then .text="<redacted>" else . end)' > "$evidence/${target}-settings.json"
            curl --fail-with-body -sS "${auth[@]}" "$api/secrets" > "$evidence/${target}-secret-names.json"
            jq -e '.success==true' "$evidence/${target}-deployments.json" >/dev/null
            jq -e '.success==true' "$evidence/${target}-settings.json" >/dev/null
          done
          cat > "$evidence/release-record.txt" <<EOF
          result=PASSED
          release_commit=$RELEASE_COMMIT
          source_commit=$SOURCE_COMMIT
          staging_origin=$STAGING_ORIGIN
          production_origin=$PRODUCTION_ORIGIN
          production_db_v2_id=$PROD_DB_V2_ID
          production_turnstile_sitekey=$PROD_TURNSTILE_SITE_KEY
          completed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          d1_migrations_applied=true
          staging_deployed=true
          production_deployed=true
          EOF
          find "$evidence" -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > "$evidence/SHA256SUMS.txt"

      - name: Push verified release commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:master

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-complete-release-evidence
          path: deployment-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary workflow after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B cleanup origin/master
          if [ -f .github/workflows/execute-all-cpcv-release.yml ]; then
            git rm .github/workflows/execute-all-cpcv-release.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Remove failed CPCV release workflow"
            git push origin HEAD:master
          fi
