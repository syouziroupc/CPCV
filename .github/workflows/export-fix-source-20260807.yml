name: Export fix source

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/export-fix-source-20260807.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-responsive-layout-hardening-20260807
          fetch-depth: 0
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_COMMIT.txt
          zip -qr /tmp/cpcv-fix-source.zip . -x '.git/*' 'node_modules/*'
      - uses: actions/upload-artifact@v4
        with:
          name: cpcv-fix-source-${{ github.sha }}
          path: /tmp/cpcv-fix-source.zip
          if-no-files-found: error
          retention-days: 7
