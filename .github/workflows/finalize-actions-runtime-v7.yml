name: Finalize GitHub Actions runtime

on:
  push:
    branches:
      - agent/ai-response-hardening-20260808
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-actions-runtime-v7
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'Modernize GitHub Actions runtime') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Modernize permanent workflows
        run: python scripts/finalize-actions-runtime-v7.py
      - name: Remove temporary finalizer
        run: |
          git rm -f scripts/finalize-actions-runtime-v7.py
          git rm -f .github/workflows/finalize-actions-runtime-v7.yml
      - name: Stage sources and regenerate manifest
        run: |
          git add -A
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
      - name: Create local validation commit
        run: |
          git config user.name "CPCV Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Modernize GitHub Actions runtime"
      - name: Full validation
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
          git diff --check
      - name: Push validated result
        run: git push origin HEAD:agent/ai-response-hardening-20260808
