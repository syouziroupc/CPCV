name: Finalize AI capacity v4 2026-08-08

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/finalize-ai-capacity-v4-20260808.yml
      - scripts/finalize-ai-capacity-v4-20260808.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ai-capacity-v2-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-capacity-v2-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final dedicated Queue cleanup
        run: python scripts/finalize-ai-capacity-v4-20260808.py

      - name: Remove every operational finalizer and generate exact source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-queue-batched-moderation-20260808.yml \
            .github/workflows/finalize-ai-capacity-v2-20260808.yml \
            .github/workflows/finalize-ai-capacity-v3-20260808.yml \
            .github/workflows/finalize-ai-capacity-v4-20260808.yml \
            scripts/finalize-ai-capacity-20260808.py \
            scripts/finalize-ai-capacity-v2-20260808.py \
            scripts/finalize-ai-capacity-v3-20260808.py \
            scripts/finalize-ai-capacity-v4-20260808.py
          npm ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize high-throughput AI runtime"
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"

      - name: Validate exact candidate before push
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          node scripts/test-ai-translation-resilience.mjs
          node scripts/test-load-hardening.mjs
          node scripts/test-ai-runtime-cleanup.mjs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev

      - name: Push verified clean candidate
        run: git push origin HEAD:agent/ai-capacity-v2-20260808
