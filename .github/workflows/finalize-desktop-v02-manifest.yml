name: Finalize CPCV Desktop v0.2 manifest

on:
  push:
    branches:
      - agent/desktop-overlay-v0.2
    paths:
      - ".github/workflows/finalize-desktop-v02-manifest.yml"

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-overlay-v0.2

      - name: Write exact source hashes
        shell: pwsh
        run: |
          $paths = @(
            ".github/workflows/desktop-overlay-poc.yml",
            "desktop-overlay-poc/CONTEST-SOURCE-NOTES.md",
            "desktop-overlay-poc/README.md",
            "desktop-overlay-poc/VERSION",
            "desktop-overlay-poc/package.json",
            "desktop-overlay-poc/src-tauri/Cargo.toml",
            "desktop-overlay-poc/src-tauri/capabilities/default.json",
            "desktop-overlay-poc/src-tauri/src/main.rs",
            "desktop-overlay-poc/src-tauri/tauri.conf.json",
            "desktop-overlay-poc/ui/app.css",
            "desktop-overlay-poc/ui/app.js",
            "desktop-overlay-poc/ui/index.html",
            "docs/desktop-overlay-stage2-plan.md"
          )
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            "$hash  $path"
          }
          [System.IO.File]::WriteAllText(
            "SOURCE_SHA256SUMS.override.txt",
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOURCE_SHA256SUMS.override.txt
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Finalize CPCV Desktop v0.2 source manifest"
          git push origin HEAD:agent/desktop-overlay-v0.2
