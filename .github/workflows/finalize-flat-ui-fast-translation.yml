name: Finalize verified flat UI and fast translation
on:
  push:
    branches: [master]
    paths: [.github/workflows/finalize-flat-ui-fast-translation.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global npm@11.18.0
          npm ci
          python -m pip install -r requirements-visual.txt -r requirements-manual.txt
          python -m playwright install --with-deps chromium
      - name: Prepare release candidate
        run: |
          rm -f .github/workflows/finalize-flat-ui-fast-translation.yml
          node --check src/ai/provider.js
          node --check src/ai/processor.js
          node --no-warnings scripts/test-ai-v2.mjs
          node scripts/test-v0810-usability.mjs
          node scripts/test-v0810-security-ui.mjs
          npm run visual:v0810
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          npm run manifest:source
          rm -f SOURCE_SHA256SUMS.override.txt
          git add -A
          git commit -m "Finalize flat UI and fast translation"
      - name: Verify clean release candidate
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run verify:final-docs
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified release candidate
        run: git push origin HEAD:master
