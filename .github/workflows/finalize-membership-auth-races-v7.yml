name: Finalize membership authorization races

on:
  push:
    branches:
      - agent/ai-response-hardening-20260808
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-membership-auth-races-v7
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'Finalize membership authorization races') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply authorization race fixes
        run: |
          python scripts/fix-v7-delete-test.py
          python scripts/finalize-membership-auth-races-v7.py
      - name: Remove temporary finalizer
        run: |
          git rm -f scripts/fix-v7-delete-test.py
          git rm -f scripts/finalize-membership-auth-races-v7.py
          git rm -f .github/workflows/finalize-membership-auth-races-v7.yml
      - name: Stage sources and regenerate manifest
        run: |
          git add -A
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
      - name: Create local validation commit
        run: |
          git config user.name "CPCV Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Finalize membership authorization races"
      - name: Focused regressions
        run: |
          node --no-warnings scripts/test-account-lifecycle-v2.mjs
          node --no-warnings scripts/test-email-auth-v2.mjs
          node --no-warnings scripts/test-auth-api-v2.mjs
          node scripts/test-system-hardening.mjs
          npm run check
          npm run check:project
          npm run verify:source-manifest
          git diff --check
      - name: Full regression
        run: npm run check:stage08
      - name: Deployment and dependency checks
        run: |
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push validated result
        run: git push origin HEAD:agent/ai-response-hardening-20260808
