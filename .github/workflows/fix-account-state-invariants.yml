name: Finalize account state invariants

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ai-response-hardening-20260808

permissions:
  contents: write

concurrency:
  group: finalize-account-state-invariants
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'Finalize account state invariants') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply invariant patch
        run: python scripts/fix-account-state-invariants.py

      - name: Remove temporary machinery
        run: |
          git rm -f scripts/fix-account-state-invariants.py
          git rm -f .github/workflows/fix-account-state-invariants.yml

      - name: Regenerate source manifest
        run: npm run manifest:source

      - name: Validate focused account flows
        run: |
          node --no-warnings scripts/test-email-auth-v2.mjs
          node --no-warnings scripts/test-account-lifecycle-v2.mjs
          node --no-warnings scripts/test-auth-api-v2.mjs
          node scripts/test-system-hardening.mjs
          npm run check
          npm run check:project
          npm run verify:source-manifest
          git diff --check

      - name: Validate full regression
        run: npm run check:stage08

      - name: Commit validated changes
        run: |
          git config user.name "CPCV Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize account state invariants"
          git push origin HEAD:agent/ai-response-hardening-20260808
