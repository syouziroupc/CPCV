name: Fix AI capacity manifest 2026-08-08
on:
  push:
    branches: [agent/ai-capacity-v2-20260808]
    paths: [.github/workflows/fix-ai-capacity-manifest-20260808.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-capacity-v2-20260808
          fetch-depth: 0
      - name: Remove obsolete helper path from manifest
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/\.github\/workflows\/refresh-ai-capacity-manifest-20260808\.yml$/d' SOURCE_SHA256SUMS.txt
          rm -f .github/workflows/fix-ai-capacity-manifest-20260808.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete manifest helper entry"
          git push origin HEAD:agent/ai-capacity-v2-20260808
          # trigger marker
