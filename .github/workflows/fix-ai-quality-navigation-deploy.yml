name: Fix AI quality navigation deployment source

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/fix-ai-quality-navigation-deploy.yml]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/deploy-ai-quality-navigation-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-ai-quality-navigation-20260806
          fetch-depth: 0
      - name: Restore immutable release after tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-ai-quality-navigation-20260806.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          npm audit
          npm audit --omit=dev
      - name: Materialize isolated staging configuration
'''
          new = '''          npm audit
          npm audit --omit=dev
          mkdir -p deployment-evidence/staging
          git status --short | tee deployment-evidence/staging/post-validation-working-tree.txt
          git reset --hard "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          npm run verify:source-manifest
      - name: Materialize isolated staging configuration
'''
          if old not in text:
              raise SystemExit('deployment revalidation anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-ai-quality-navigation-deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore immutable release before staging deploy'
          git push origin HEAD:agent/deploy-ai-quality-navigation-20260806
