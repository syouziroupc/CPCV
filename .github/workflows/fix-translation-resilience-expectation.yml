name: Fix translation resilience expectation

on:
  push:
    branches:
      - agent/translation-language-hardening-20260809
    paths:
      - .github/workflows/fix-translation-resilience-expectation.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/translation-language-hardening-20260809
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align stale resilience assertions with current routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-ai-translation-resilience.mjs')
          text = p.read_text()
          text = text.replace(
              'await balancedKnownLanguageUsesDedicatedTranslationFirst();\nawait balancedFallsBackAfterDedicatedOutage();',
              'await balancedKnownLanguageUsesBalancedTranslationFirst();\nawait balancedFallsBackThroughAccurateToDedicated();',
              1,
          )
          old1 = '''async function balancedKnownLanguageUsesDedicatedTranslationFirst() {
            const calls = [];
            const limits = [];
            const result = await runTranslationModel(environment(async (model, request) => {
              calls.push({ model, request });
              assert.equal(model, M2M);
              assert.equal(request.source_lang, "en");
              assert.equal(request.target_lang, "ja");
              return { translated_text: "専用翻訳モデルを優先します。" };
            }, limits), {
              message: "Prefer the dedicated translation model.",
              sourceLanguage: "en",
              targetLanguage: "ja",
              quality: "balanced"
            });
            assert.equal(result.translatedText, "専用翻訳モデルを優先します。");
            assert.deepEqual(calls.map((call) => call.model), [M2M]);
            assert.deepEqual(limits, []);
          }
          '''.replace('          ', '')
          new1 = '''async function balancedKnownLanguageUsesBalancedTranslationFirst() {
            const calls = [];
            const limits = [];
            const result = await runTranslationModel(environment(async (model, request) => {
              calls.push({ model, request });
              assert.equal(model, LLAMA);
              assert.equal(request.max_tokens, 220);
              assert.equal(request.max_completion_tokens, undefined);
              assert.match(request.messages[1].content, /"sourceLanguage":"en"/);
              return { choices: [{ message: { content: "バランス翻訳モデルを優先します。" } }] };
            }, limits), {
              message: "Prefer the balanced translation model.",
              sourceLanguage: "en",
              targetLanguage: "ja",
              quality: "balanced"
            });
            assert.equal(result.translatedText, "バランス翻訳モデルを優先します。");
            assert.deepEqual(calls.map((call) => call.model), [LLAMA]);
            assert.deepEqual(limits, ["workers-ai-moderation"]);
          }
          '''.replace('          ', '')
          old2 = '''async function balancedFallsBackAfterDedicatedOutage() {
            const calls = [];
            const limits = [];
            const result = await runTranslationModel(environment(async (model, request) => {
              calls.push({ model, request });
              if (model === M2M) {
                const error = new Error("temporary model capacity");
                error.status = 503;
                throw error;
              }
              assert.equal(model, LLAMA);
              assert.equal(request.max_tokens, 220);
              assert.equal(request.max_completion_tokens, undefined);
              assert.equal(request.reasoning_effort, undefined);
              return { choices: [{ message: { content: "代替モデルで翻訳しました。" } }] };
            }, limits), {
              message: "Fallback translation.",
              sourceLanguage: "en",
              targetLanguage: "ja",
              quality: "balanced"
            });
            assert.equal(result.translatedText, "代替モデルで翻訳しました。");
            assert.deepEqual(calls.map((call) => call.model), [M2M, LLAMA]);
            assert.deepEqual(limits, ["workers-ai-moderation"]);
          }
          '''.replace('          ', '')
          new2 = '''async function balancedFallsBackThroughAccurateToDedicated() {
            const calls = [];
            const limits = [];
            const result = await runTranslationModel(environment(async (model, request) => {
              calls.push({ model, request });
              if (model === LLAMA || model === KIMI) {
                const error = new Error("temporary model capacity");
                error.status = 503;
                throw error;
              }
              assert.equal(model, M2M);
              assert.equal(request.source_lang, "en");
              assert.equal(request.target_lang, "ja");
              return { translated_text: "専用モデルまでフォールバックしました。" };
            }, limits), {
              message: "Fallback translation.",
              sourceLanguage: "en",
              targetLanguage: "ja",
              quality: "balanced"
            });
            assert.equal(result.translatedText, "専用モデルまでフォールバックしました。");
            assert.deepEqual(calls.map((call) => call.model), [LLAMA, KIMI, M2M]);
            assert.deepEqual(limits, ["workers-ai-moderation", "workers-ai-moderation"]);
          }
          '''.replace('          ', '')
          if old1 not in text:
              raise SystemExit('first stale resilience block not found')
          text = text.replace(old1, new1, 1)
          if old2 not in text:
              raise SystemExit('second stale resilience block not found')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
          node scripts/test-ai-translation-resilience.mjs
      - name: Remove temporary workflow and build final commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-translation-resilience-expectation.yml
          git add -A
          npm run manifest:source
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Align translation resilience regression with balanced routing'
          test -z "$(git status --porcelain)"
      - name: Validate clean final tree
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:stage08
          npm run test:owner-bootstrap
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push validated final commit
        run: git push origin HEAD:agent/translation-language-hardening-20260809
