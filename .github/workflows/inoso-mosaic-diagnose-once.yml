name: Diagnose INOSO production mosaic once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inoso-mosaic-diagnose-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Probe production target and Cloudflare capabilities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          dig +short inoso.szpc.jp CNAME | tee evidence/dns-cname.txt || true
          dig +short inoso.szpc.jp A | tee evidence/dns-a.txt || true
          curl -sSIL --retry 4 "https://inoso.szpc.jp/?diagnose=$GITHUB_SHA" | tee evidence/headers.txt
          for ep in \
            "workers/domains" \
            "workers/scripts" \
            "workers/services" \
            "pages/projects"; do
            safe="$(echo "$ep" | tr '/' '-')"
            code="$(curl -sS -o "evidence/$safe.json" -w '%{http_code}' --retry 4 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$ep" || true)"
            echo "$ep $code" | tee -a evidence/cloudflare-endpoints.txt
          done
          if jq -e '.result[]? | select((.hostname // .domain // .name // "") == "inoso.szpc.jp")' evidence/workers-domains.json >/dev/null 2>&1; then
            jq '.result[] | select((.hostname // .domain // .name // "") == "inoso.szpc.jp")' evidence/workers-domains.json | tee evidence/inoso-worker-domain.json
          fi

      - name: Download current production privacy images
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' "https://inoso.szpc.jp/assets/images/truck.webp?diagnose=$GITHUB_SHA" -o evidence/truck-current.webp
          curl -fsSL --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' "https://inoso.szpc.jp/assets/images/permit-board.webp?diagnose=$GITHUB_SHA" -o evidence/permit-current.webp
          sha256sum evidence/*.webp | tee evidence/SHA256SUMS.txt
          file evidence/*.webp | tee evidence/file.txt

      - name: Capture current production screenshots
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1536,1152 --screenshot=evidence/truck-current.png "https://inoso.szpc.jp/assets/images/truck.webp?diagnose=$GITHUB_SHA"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1536,1152 --screenshot=evidence/permit-current.png "https://inoso.szpc.jp/assets/images/permit-board.webp?diagnose=$GITHUB_SHA"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,5000 --screenshot=evidence/page-current-desktop.png "https://inoso.szpc.jp/?diagnose=$GITHUB_SHA"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,5000 --screenshot=evidence/page-current-mobile.png "https://inoso.szpc.jp/?diagnose=$GITHUB_SHA"

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: inoso-mosaic-diagnostic-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

# trigger: exhaustive-production-diagnosis-2026-09-08
