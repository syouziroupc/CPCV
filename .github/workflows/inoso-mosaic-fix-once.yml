name: Deploy INOSO mosaic fix once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/inoso-mosaic-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inoso-production-mosaic-fix
  cancel-in-progress: false

jobs:
  deploy-inoso:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      HOSTNAME: inoso.szpc.jp
      PAGES_ORIGIN: inoso.pages.dev
      ZONE_ID: 7b3905101c71c6f8c189a1e4a6d3e628
      WORKER_NAME: inoso-mosaic-overlay
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v identify
          command -v convert
          command -v compare

      - name: Build corrected privacy images from current Pages origin
        id: build
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "https://$PAGES_ORIGIN/assets/images/truck.webp?source=${{ github.sha }}" -o truck-original.webp
          curl -fsSL --retry 5 "https://$PAGES_ORIGIN/assets/images/permit-board.webp?source=${{ github.sha }}" -o permit-original.webp
          test "$(identify -format '%wx%h' truck-original.webp)" = '1536x1152'
          test "$(identify -format '%wx%h' permit-original.webp)" = '1536x1152'
          convert truck-original.webp truck.png
          convert permit-original.webp permit.png
          mkdir -p overlay-assets/assets/images crops-before crops-after
          mosaic() {
            src="$1"; x="$2"; y="$3"; w="$4"; h="$5"; sw="$6"; sh="$7"; tag="$8"
            convert "$src" -crop "${w}x${h}+${x}+${y}" +repage "crops-before/${tag}.png"
            convert "crops-before/${tag}.png" -filter point -resize "${sw}x${sh}!" -resize "${w}x${h}!" /tmp/mosaic.png
            convert "$src" /tmp/mosaic.png -geometry "+${x}+${y}" -composite /tmp/out.png
            mv /tmp/out.png "$src"
            convert "$src" -crop "${w}x${h}+${x}+${y}" +repage "crops-after/${tag}.png"
            ae="$(compare -metric AE "crops-before/${tag}.png" "crops-after/${tag}.png" null: 2>&1 || true)"
            echo "$tag changed_pixels=$ae"
            test "$ae" != '0'
          }
          mosaic truck.png 580 330 245 205 16 14 truck-driver
          mosaic truck.png 995 685 215 170 14 11 truck-frontplate
          mosaic truck.png 125 530 110 105 8 8 truck-carplate
          mosaic permit.png 625 635 415 195 26 12 permit-private
          convert truck.png -quality 88 overlay-assets/assets/images/truck.webp
          convert permit.png -quality 88 overlay-assets/assets/images/permit-board.webp
          truck_sha="$(sha256sum overlay-assets/assets/images/truck.webp | awk '{print $1}')"
          permit_sha="$(sha256sum overlay-assets/assets/images/permit-board.webp | awk '{print $1}')"
          echo "truck_sha=$truck_sha" >> "$GITHUB_OUTPUT"
          echo "permit_sha=$permit_sha" >> "$GITHUB_OUTPUT"
          printf '%s  truck.webp\n%s  permit-board.webp\n' "$truck_sha" "$permit_sha" > expected-sha256.txt

      - name: Deploy fixed images on production Worker route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > worker.js <<'JS'
          export default {
            async fetch(request) {
              return fetch(request);
            }
          };
          JS
          cat > wrangler.jsonc <<JSON
          {
            "name": "$WORKER_NAME",
            "main": "worker.js",
            "compatibility_date": "2026-09-08",
            "assets": {
              "directory": "./overlay-assets",
              "binding": "ASSETS"
            },
            "routes": [
              {
                "pattern": "$HOSTNAME/*",
                "zone_id": "$ZONE_ID"
              }
            ]
          }
          JSON
          npx -y wrangler@4.110.0 deploy --config wrangler.jsonc 2>&1 | tee worker-route-deploy.txt

      - name: Verify production fixed bytes and unaffected pages
        env:
          EXPECTED_TRUCK: ${{ steps.build.outputs.truck_sha }}
          EXPECTED_PERMIT: ${{ steps.build.outputs.permit_sha }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            curl -fsSL --connect-timeout 10 --max-time 25 "https://$HOSTNAME/assets/images/truck.webp?v=${{ github.run_id }}-$i" -o live-truck.webp || true
            curl -fsSL --connect-timeout 10 --max-time 25 "https://$HOSTNAME/assets/images/permit-board.webp?v=${{ github.run_id }}-$i" -o live-permit.webp || true
            th="$(sha256sum live-truck.webp 2>/dev/null | awk '{print $1}')"
            ph="$(sha256sum live-permit.webp 2>/dev/null | awk '{print $1}')"
            echo "attempt=$i truck=$th permit=$ph"
            if [ "$th" = "$EXPECTED_TRUCK" ] && [ "$ph" = "$EXPECTED_PERMIT" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL "https://$HOSTNAME/?verify=${{ github.run_id }}" -o live-index.html
          curl -fsSL "https://$HOSTNAME/services.html?verify=${{ github.run_id }}" -o live-services.html
          curl -fsSI "https://$HOSTNAME/css/style.css?verify=${{ github.run_id }}" -o style-headers.txt
          curl -fsSI "https://$HOSTNAME/js/main.js?verify=${{ github.run_id }}" -o js-headers.txt
          grep -q '株式会社イノソー' live-index.html
          grep -q '株式会社イノソー' live-services.html
          echo 'PRODUCTION BYTES VERIFIED'

      - name: Screenshot-debug production desktop mobile and sensitive regions
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1536,1152 --screenshot=live-truck.png "https://$HOSTNAME/assets/images/truck.webp?shot=${{ github.run_id }}"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1536,1152 --screenshot=live-permit.png "https://$HOSTNAME/assets/images/permit-board.webp?shot=${{ github.run_id }}"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,5000 --screenshot=desktop.png "https://$HOSTNAME/?shot=${{ github.run_id }}"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,5000 --screenshot=mobile.png "https://$HOSTNAME/?shot=${{ github.run_id }}-m"
          convert live-truck.webp -crop 245x205+580+330 +repage live-truck-driver.png
          convert live-truck.webp -crop 215x170+995+685 +repage live-truck-frontplate.png
          convert live-truck.webp -crop 110x105+125+530 +repage live-truck-carplate.png
          convert live-permit.webp -crop 415x195+625+635 +repage live-permit-private.png
          identify live-truck.png live-permit.png desktop.png mobile.png live-truck-driver.png live-truck-frontplate.png live-truck-carplate.png live-permit-private.png | tee screenshot-check.txt

      - name: Upload final verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: inoso-production-mosaic-${{ github.run_id }}
          path: |
            worker-route-deploy.txt
            expected-sha256.txt
            live-index.html
            live-services.html
            style-headers.txt
            js-headers.txt
            live-truck.webp
            live-permit.webp
            live-truck.png
            live-permit.png
            desktop.png
            mobile.png
            live-truck-driver.png
            live-truck-frontplate.png
            live-truck-carplate.png
            live-permit-private.png
            crops-before/
            crops-after/
            screenshot-check.txt
          if-no-files-found: error
          retention-days: 7
