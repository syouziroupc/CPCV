name: Kimi live function smoke once

on:
  push:
    branches: [master]
    paths: [.github/workflows/kimi-live-function-smoke-once.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create temporary Kimi smoke Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kimi-smoke
          cat >/tmp/kimi-smoke/worker.mjs <<'JS'
          export default {
            async fetch(request, env) {
              const schema = {
                type: "object",
                additionalProperties: false,
                properties: {
                  verdict: { type: "string", enum: ["proceed", "revise", "verify"] },
                  risk: { type: "integer", minimum: 0, maximum: 3 },
                  issues: { type: "array", maxItems: 3, items: { type: "object", additionalProperties: false, properties: {
                    type: { type: "string" }, target: { type: "string" }, correction: { type: "string" }
                  }, required: ["type", "target", "correction"] } },
                  verify: { type: "array", maxItems: 2, items: { type: "string" } },
                  next_step: { type: "string" },
                  confidence: { type: "number", minimum: 0, maximum: 1 }
                },
                required: ["verdict", "risk", "issues", "verify", "next_step", "confidence"]
              };
              try {
                const raw = await env.AI.run("@cf/moonshotai/kimi-k2.6", {
                  messages: [
                    { role: "system", content: "You are a compact auditor. Do not answer in prose. Call submit_audit exactly once with the complete audit object." },
                    { role: "user", content: "Audit this harmless direction: prefer a tested deployment path over an untested one." }
                  ],
                  tools: [{ name: "submit_audit", description: "Return the audit result.", parameters: schema }],
                  tool_choice: "required",
                  parallel_tool_calls: false,
                  chat_template_kwargs: { thinking: false },
                  max_completion_tokens: 256,
                  temperature: 0,
                  stream: false
                });
                const root = raw && typeof raw === "object" ? raw : {};
                const wrapped = root.response && typeof root.response === "object" ? root.response : root;
                let calls = Array.isArray(wrapped.tool_calls) ? wrapped.tool_calls : null;
                if ((!calls || calls.length === 0) && Array.isArray(wrapped.choices)) {
                  const msg = wrapped.choices[0]?.message;
                  if (msg && Array.isArray(msg.tool_calls)) calls = msg.tool_calls;
                }
                const call = calls?.find((x) => (x?.name ?? x?.function?.name) === "submit_audit");
                if (!call) return Response.json({ ok: false, error: "missing_submit_audit", raw }, { status: 500 });
                const args = call.arguments ?? call.function?.arguments;
                return Response.json({ ok: true, tool: "submit_audit", arguments_type: typeof args, arguments: args });
              } catch (error) {
                return Response.json({ ok: false, error: String(error?.message ?? error) }, { status: 500 });
              }
            }
          };
          JS
          cat >/tmp/kimi-smoke/wrangler.jsonc <<'JSON'
          {
            "name": "kimivsgpt-kimi-smoke",
            "main": "worker.mjs",
            "compatibility_date": "2026-09-08",
            "ai": { "binding": "AI" }
          }
          JSON
          cd /tmp/kimi-smoke
          npx --yes wrangler@4.129.1 deploy --config wrangler.jsonc

      - name: Execute one real Kimi function call
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/kimi-result.json -w '%{http_code}' https://kimivsgpt-kimi-smoke.syouziroupc.workers.dev/ || true)"
            cat /tmp/kimi-result.json || true
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/kimi-result.json && grep -q '"tool":"submit_audit"' /tmp/kimi-result.json; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Delete temporary Worker
        if: always()
        shell: bash
        run: |
          cd /tmp/kimi-smoke 2>/dev/null || exit 0
          npx --yes wrangler@4.129.1 delete --config wrangler.jsonc --name kimivsgpt-kimi-smoke --force || \
          npx --yes wrangler@4.129.1 delete --config wrangler.jsonc --name kimivsgpt-kimi-smoke || true
