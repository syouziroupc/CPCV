name: Lock Kimi vs GPT MCP once

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lock:
    if: contains(github.event.head_commit.message, '[lock-kimivsgpt]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set unguessable temporary MCP access secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 48)"
          printf '%s' "$KEY" | npx wrangler@4.129.1 secret put AUDITOR_ACCESS_KEY --name kimivsgpt
          unset KEY

      - name: Verify unauthenticated MCP is blocked
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code="$(curl --silent --output /tmp/body.txt --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"lock-check","version":"1.0"}}}' \
              https://kimivsgpt.syouziroupc.workers.dev/mcp || true)"
            cat /tmp/body.txt || true
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Expected HTTP 401 from unauthenticated MCP" >&2
          exit 1
