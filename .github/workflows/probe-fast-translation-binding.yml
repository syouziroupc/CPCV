name: Probe dedicated translation AI binding

on:
  push:
    branches:
      - agent/deploy-ai-translation-throughput-staging
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: probe-fast-translation-binding
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e11301117017f59960e02181d9fc8b190c59d04b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy, invoke, validate, and delete temporary AI-binding probe
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7cea58251b35319648343e0dd9f7cb76
          PROBE_WORKER: cpcv-ai-binding-probe-e1130111
          PROBE_PATH: 4b7e1c2f-9347-4b14-a34d-d88a697d3fc0
        run: |
          set -euo pipefail
          mkdir -p probe-records
          cleanup() {
            curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROBE_WORKER" \
              > probe-records/03-delete.json || true
          }
          trap cleanup EXIT

          cat > .ai-binding-probe.js <<'JS'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/4b7e1c2f-9347-4b14-a34d-d88a697d3fc0") {
                return new Response("Not found", { status: 404 });
              }
              const started = Date.now();
              try {
                const result = await env.AI.run("@cf/meta/m2m100-1.2b", {
                  text: "授業内容を確認しました",
                  source_lang: "ja",
                  target_lang: "en"
                });
                return Response.json({ ok: true, elapsed_ms: Date.now() - started, result });
              } catch (error) {
                return Response.json({
                  ok: false,
                  elapsed_ms: Date.now() - started,
                  error_name: String(error?.name || "Error"),
                  error_message: String(error?.message || "").slice(0, 300)
                }, { status: 502 });
              }
            }
          };
          JS

          cat > .ai-binding-probe.toml <<TOML
          name = "$PROBE_WORKER"
          main = ".ai-binding-probe.js"
          compatibility_date = "2026-06-17"
          workers_dev = true

          [ai]
          binding = "AI"
          TOML

          npx wrangler deploy --config .ai-binding-probe.toml > probe-records/00-deploy.txt 2>&1
          url="https://$PROBE_WORKER.syouziroupc.workers.dev/$PROBE_PATH"
          http=$(curl --retry 8 --retry-all-errors --retry-delay 1 --silent --show-error \
            --output probe-records/01-response.json --write-out '%{http_code}' "$url")
          printf 'http=%s\n' "$http" > probe-records/02-result.txt
          test "$http" = "200"

          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('probe-records/01-response.json', 'utf8'));
          const result = payload?.result;
          const translated = typeof result === 'string' ? result
            : result?.translated_text ?? result?.translation ?? result?.translatedText
              ?? result?.translation_text ?? result?.generated_text ?? result?.text ?? '';
          if (payload?.ok !== true || typeof translated !== 'string' || !translated.trim()) {
            console.error(JSON.stringify({ ok: payload?.ok, elapsed_ms: payload?.elapsed_ms, result_type: typeof result, result_keys: result && typeof result === 'object' ? Object.keys(result) : [] }));
            process.exit(1);
          }
          fs.appendFileSync('probe-records/02-result.txt', [
            'binding_call=success',
            `elapsed_ms=${Number(payload.elapsed_ms || 0)}`,
            `result_type=${typeof result}`,
            `result_keys=${result && typeof result === 'object' ? Object.keys(result).sort().join(',') : ''}`,
            `translated_length=${[...translated.trim()].length}`,
            ''
          ].join('\n'));
          NODE
      - name: Upload probe records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-ai-binding-probe-e1130111
          path: probe-records/
          if-no-files-found: warn
          retention-days: 30
