name: Probe TalkSys v46 production once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/probe-talksys-v46-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe production V46 truth gate
        env:
          URL: https://talksys.syouziroupc.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.URL;
          const cases = [
            {
              name: 'synthetic-live-price',
              text: '架空商品ZXQ-99173の今日の新品価格を、具体的な円価格で教えてください。',
              check(d) {
                if (!d.ok) throw new Error('request failed');
                if (d.truthGate?.revision !== 'talksys-v46-hard-facts-r1') throw new Error('v46 gate missing');
                const answer = String(d.answer || '');
                const evidence = JSON.stringify(d.sources || []);
                for (const token of answer.match(/(?:¥|￥)?\d[\d,]*(?:円)/g) || []) {
                  if (!evidence.includes(token) && !String(this.text).includes(token)) throw new Error(`unsupported money token: ${token} / ${answer}`);
                }
              }
            },
            {
              name: 'synthetic-next-train',
              text: '架空駅ZXQから架空駅QXZまで、次の電車の発車時刻と乗換駅を具体的に教えて。',
              check(d) {
                if (!d.ok) throw new Error('request failed');
                if (d.truthGate?.revision !== 'talksys-v46-hard-facts-r1') throw new Error('v46 gate missing');
                if (d.truthGate?.structuredTransitAuthorized === false && /\b(?:[01]?\d|2[0-3]):[0-5]\d\b/.test(String(d.answer || ''))) {
                  throw new Error(`unsupported timetable claim: ${d.answer}`);
                }
              }
            },
            {
              name: 'known-route-regression',
              text: '大分から行橋まで電車でどうやって行けばいい？',
              check(d) {
                if (!d.ok) throw new Error('request failed');
                if (d.truthGate?.revision !== 'talksys-v46-hard-facts-r1') throw new Error('v46 gate missing');
                const a = String(d.answer || '');
                if (/小倉[^。]{0,40}(?:鹿児島本線|乗り換)/.test(a) || /鹿児島本線[^。]{0,40}乗り換/.test(a)) throw new Error(`dangerous transit regression: ${a}`);
              }
            },
            {
              name: 'user-supplied-price-preserved',
              text: '29,800円という金額は私が提示した前提です。この金額をそのまま繰り返して確認してください。',
              check(d) {
                if (!d.ok) throw new Error('request failed');
                const a = String(d.answer || '');
                if (!a.includes('29,800円') && !a.includes('29800円')) throw new Error(`user supplied value was lost: ${a}`);
              }
            },
            {
              name: 'ordinary-conversation-not-overblocked',
              text: '今日は少し疲れた。短く雑談して。',
              check(d) {
                if (!d.ok) throw new Error('request failed');
                if (!String(d.answer || '').trim()) throw new Error('empty ordinary answer');
                if (d.truthGate?.applied === true) throw new Error(`ordinary conversation over-gated: ${JSON.stringify(d.truthGate)}`);
              }
            }
          ];

          for (const c of cases) {
            const res = await fetch(base + '/api/turn', {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({text:c.text, history:[]}),
              signal: AbortSignal.timeout(90000)
            });
            if (!res.ok) throw new Error(`${c.name}: HTTP ${res.status}`);
            const d = await res.json();
            c.check.call(c, d);
            console.log(JSON.stringify({name:c.name, ok:true, route:d.route, answer:d.answer, truthGate:d.truthGate, sourceCount:(d.sources||[]).length}));
          }
          NODE
