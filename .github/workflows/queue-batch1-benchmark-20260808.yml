name: Staging Queue batch-size 1 benchmark 2026-08-08

on:
  pull_request:
    branches: [master]
    paths: [.github/workflows/queue-batch1-benchmark-20260808.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/queue-batch1-benchmark-20260808'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      RELEASE_COMMIT: 1d0f9355d7d96f35644b8f9e9203174f462d44f5
      STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/queue-batch1-benchmark-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy batch-size 1 staging variant and benchmark
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""; for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!key:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$account"
          git fetch origin agent/staging-reload-audit-20260807:refs/remotes/origin/agent/staging-reload-audit-20260807
          git show origin/agent/staging-reload-audit-20260807:scripts/staging-load-audit-v3.mjs > /tmp/staging-load-audit-v3.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/staging-load-audit-v3.mjs'); s=p.read_text()
          s=s.replace("count: 40, concurrency: 10", "count: 40, concurrency: 10")
          s=s.replace("count: 120, concurrency: 60", "count: 80, concurrency: 40")
          s=s.replace("count: 100, concurrency: 50", "count: 60, concurrency: 30")
          s=s.replace("count: 40, concurrency: 20", "count: 20, concurrency: 10")
          s=s.replace("timeoutMs: 150_000", "timeoutMs: 100_000").replace("timeoutMs: 240_000", "timeoutMs: 100_000").replace("timeoutMs: 300_000", "timeoutMs: 100_000").replace("await sleep(65_000);", "await sleep(5_000);")
          p.write_text(s)
          PY
          git reset --hard "$RELEASE_COMMIT"; git clean -fd; npm ci
          cat > .batch1.wrangler.toml <<'TOML'
          name = "class-pdf-comment-viewer-v01-staging"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          workers_dev = true
          assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }
          [[d1_databases]]
          binding = "DB"
          database_name = "class_comment_db_staging"
          database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          [[send_email]]
          name = "EMAIL"
          allowed_sender_addresses = ["noreply@szworld.uk"]
          [ai]
          binding = "AI"
          [[queues.producers]]
          binding = "AI_JOBS_QUEUE"
          queue = "cpcv-ai-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-jobs-staging"
          max_batch_size = 10
          max_batch_timeout = 0
          max_retries = 3
          [[queues.producers]]
          binding = "AI_TRANSLATION_QUEUE"
          queue = "cpcv-ai-translation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-translation-jobs-staging"
          max_batch_size = 1
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-translation-dlq-staging"
          [[queues.producers]]
          binding = "AI_MODERATION_QUEUE"
          queue = "cpcv-ai-moderation-jobs-staging"
          [[queues.consumers]]
          queue = "cpcv-ai-moderation-jobs-staging"
          max_batch_size = 1
          max_batch_timeout = 0
          max_retries = 100
          dead_letter_queue = "cpcv-ai-moderation-dlq-staging"
          [[durable_objects.bindings]]
          name = "COMMENT_ROOM"
          class_name = "CommentRoom"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["CommentRoom"]
          [[ratelimits]]
          name = "PUBLIC_COMMENT_RATE_LIMITER"
          namespace_id = "826071803"
          simple = { limit = 30, period = 60 }
          [[ratelimits]]
          name = "AI_TRANSLATION_RATE_LIMITER"
          namespace_id = "826071805"
          simple = { limit = 700, period = 60 }
          [[ratelimits]]
          name = "AI_MODERATION_RATE_LIMITER"
          namespace_id = "826071806"
          simple = { limit = 290, period = 60 }
          [vars]
          APP_ENV = "production"
          AUTH_V2_ENABLED = "1"
          EMAIL_AUTH_REQUIRED = "0"
          AI_MODERATION_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_MODERATION_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
          AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
          AI_TRANSLATION_ACCURATE_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_TIMEOUT_MS = "12000"
          AI_TRANSLATION_TIMEOUT_MS = "8000"
          AI_TRANSLATION_BALANCED_TIMEOUT_MS = "18000"
          AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "30000"
          AI_QUEUE_PARALLELISM = "5"
          AI_TRANSLATION_QUEUE_PARALLELISM = "1"
          AI_MODERATION_QUEUE_PARALLELISM = "1"
          AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev"
          AUTH_EMAIL_FROM = "noreply@szworld.uk"
          AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
          TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
          TOML
          npx wrangler deploy --config .batch1.wrangler.toml --keep-vars 2>&1 | tee deploy.txt
          sleep 8
          STAGING_ORIGIN="$STAGING_ORIGIN" STAGING_WRANGLER_CONFIG=.batch1.wrangler.toml node /tmp/staging-load-audit-v3.mjs
      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-queue-batch1-${{ github.run_id }}
          path: |
            load-v3-report.json
            load-v3-summary.md
            deploy.txt
          if-no-files-found: warn
          retention-days: 14
