name: Refresh AI capacity source manifest 2026-08-08

on:
  push:
    branches:
      - agent/ai-capacity-v2-20260808
    paths:
      - .github/workflows/refresh-ai-capacity-manifest-20260808.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-capacity-v2-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact manifest and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          rm -f SOURCE_SHA256SUMS.override.txt
          rm -f .github/workflows/refresh-ai-capacity-manifest-20260808.yml
          npm run manifest:source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh AI capacity source manifest"
          git push origin HEAD:agent/ai-capacity-v2-20260808
