name: Report PR57 release workflow runs

on:
  push:
    branches:
      - agent/deploy-pr57-staging-20260809
    paths:
      - .github/workflows/report-pr57-release-runs.yml

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report recent branch workflow runs to PR 57
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=agent%2Fdeploy-pr57-staging-20260809&per_page=20"
          curl --fail-with-body -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$api" > /tmp/runs.json
          summary="$(jq -r '.workflow_runs[] | [.id,.name,.status,(.conclusion // "-"),.head_sha] | @tsv' /tmp/runs.json | head -n 12)"
          body="<!-- PR57_RELEASE_RUN_REPORT -->\nPR57 release workflow run report:\n\n\`\`\`\n$summary\n\`\`\`"
          jq -n --arg body "$(printf '%b' "$body")" '{body:$body}' >/tmp/comment.json
          curl --fail-with-body -sS -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/57/comments" \
            --data-binary @/tmp/comment.json
