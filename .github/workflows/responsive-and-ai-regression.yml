name: Responsive and AI translation regression
# Permanent gate for layout overflow, mid-width admin overlap, and translation fallback behavior.

on:
  push:
    branches: [master]
    paths:
      - "public/**/*.html"
      - "public/assets/*.css"
      - "src/ai/provider*.js"
      - "scripts/audit-responsive-layout.py"
      - "scripts/audit-admin-midwidth.py"
      - "scripts/test-ai-translation-resilience.mjs"
      - ".github/workflows/responsive-and-ai-regression.yml"
  pull_request:
    paths:
      - "public/**/*.html"
      - "public/assets/*.css"
      - "src/ai/provider*.js"
      - "scripts/audit-responsive-layout.py"
      - "scripts/audit-admin-midwidth.py"
      - "scripts/test-ai-translation-resilience.mjs"
      - ".github/workflows/responsive-and-ai-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin and verify npm
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.18.0"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.12"
      - name: Install dependencies
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm ci
          npm install-scripts ls
          python -m pip install --disable-pip-version-check -r requirements-visual.txt
          python -m playwright install --with-deps chromium
      - name: Test AI translation fallback paths
        run: node scripts/test-ai-translation-resilience.mjs
      - name: Audit every public HTML across responsive widths
        run: python scripts/audit-responsive-layout.py
      - name: Audit admin overlap from 920px through 1200px
        run: python scripts/audit-admin-midwidth.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-ai-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/responsive-layout-audit/
            artifacts/admin-midwidth-audit/
          if-no-files-found: error
          retention-days: 30
