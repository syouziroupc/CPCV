name: Reusable responsive AI deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout deployment operations
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve operations and checkout immutable application release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cpcv-responsive-ai-ops
          cp .github/ops/deploy-responsive-ai-20260807.sh /tmp/cpcv-responsive-ai-ops/deploy.sh
          cp .github/ops/live-layout-audit-20260807.py /tmp/cpcv-responsive-ai-ops/live-layout-audit.py
          chmod +x /tmp/cpcv-responsive-ai-ops/deploy.sh
          git checkout --force 82e96a23e103c0c826b772c576408c58ec8f9ce7
          git clean -fd
          test "$(git rev-parse HEAD)" = "82e96a23e103c0c826b772c576408c58ec8f9ce7"
          test -z "$(git status --porcelain)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Resolve Cloudflare credentials
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!key:-}"
            [ -z "$value" ] || { account="$value"; break; }
          done
          test -n "$TOKEN"
          test -n "$account"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$account"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"

      - name: Install deployment dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          npm ci
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate, stage, test Workers AI, and deploy production
        shell: bash
        run: /tmp/cpcv-responsive-ai-ops/deploy.sh

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-responsive-ai-deployment-82e96a23e103c0c826b772c576408c58ec8f9ce7
          path: deployment-records/
          if-no-files-found: warn
          retention-days: 90
