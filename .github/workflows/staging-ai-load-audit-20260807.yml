name: Staging AI load and integrity audit 2026-08-07

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/staging-ai-load-audit-20260807.yml
      - scripts/staging-ai-load-test-v2.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-staging-ai-load-audit
  cancel-in-progress: false

jobs:
  load-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and validate test harness
        run: |
          npm ci
          node --check scripts/staging-ai-load-test-v2.mjs
          node scripts/predeploy-check.mjs
      - name: Execute real staging load test
        env:
          STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
          STAGING_DB_V2_NAME: DB_V2
          STAGING_WRANGLER_CONFIG: .load-staging.wrangler.toml
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          unset CLOUDFLARE_ACCOUNT_ID || true
          npx wrangler whoami --json > .wrangler-whoami.json
          mapfile -t accounts < <(jq -r '.accounts[]?.id // empty' .wrangler-whoami.json)
          test "${#accounts[@]}" -gt 0
          cat > .load-staging.wrangler.toml <<'TOML'
          name = "cpcv-load-audit-cli"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          TOML
          account=""
          for candidate in "${accounts[@]}"; do
            echo "::add-mask::$candidate"
            export CLOUDFLARE_ACCOUNT_ID="$candidate"
            if npx wrangler d1 execute DB_V2 --remote --yes --config .load-staging.wrangler.toml --command "SELECT 1 AS ok" --json > .d1-probe.json 2> .d1-probe.err; then
              account="$candidate"
              break
            fi
          done
          test -n "$account"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          rm -f .wrangler-whoami.json .d1-probe.json .d1-probe.err
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/staging-ai-load-test-v2.mjs')
          s = p.read_text()
          s = s.replace("'--remote', '--config', CONFIG", "'--remote', '--yes', '--config', CONFIG")
          p.write_text(s)
          PY
          node scripts/staging-ai-load-test-v2.mjs
          rm -f .load-staging.wrangler.toml
      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-staging-ai-load-audit-${{ github.run_id }}
          path: |
            load-test-report.json
            load-test-summary.md
          if-no-files-found: warn
          retention-days: 30
