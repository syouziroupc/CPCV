name: Staging AI load and integrity audit 2026-08-07

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/staging-ai-load-audit-20260807.yml
      - scripts/staging-ai-load-test-v2.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpcv-staging-ai-load-audit
  cancel-in-progress: false

jobs:
  load-audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and validate test harness
        run: |
          npm ci
          node --check scripts/staging-ai-load-test-v2.mjs
          node scripts/predeploy-check.mjs
      - name: Execute real staging load test
        env:
          STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev
          STAGING_DB_V2_NAME: DB_V2
          STAGING_WRANGLER_CONFIG: .load-staging.wrangler.toml
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do
            value="${!key:-}"
            if [ -n "$value" ]; then account="$value"; break; fi
          done
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$account"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$account"
          export CLOUDFLARE_ACCOUNT_ID="$account"
          cat > .load-staging.wrangler.toml <<'TOML'
          name = "cpcv-load-audit-cli"
          main = "src/index.js"
          compatibility_date = "2026-06-17"
          [[d1_databases]]
          binding = "DB_V2"
          database_name = "class_comment_db_v2_staging"
          database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"
          migrations_dir = "migrations-v2"
          TOML
          npx wrangler d1 execute DB_V2 --remote --yes --config .load-staging.wrangler.toml --command "SELECT 1 AS ok" --json > .d1-probe.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/staging-ai-load-test-v2.mjs')
          s = p.read_text()
          s = s.replace("'--remote', '--config', CONFIG", "'--remote', '--yes', '--config', CONFIG")
          old = "const message = `This classroom translation load test ${marker} sentence ${String(i + 1).padStart(4, '0')} explains a simple topic about energy, markets, and public policy for students.`;"
          new = "const message = `Load ${marker} ${String(i + 1).padStart(4, '0')}: Energy markets change.`;"
          if old in s:
              s = s.replace(old, new)
          s = s.replace(
              "if (phase.accepted !== count) throw new Error(`${name}: only ${phase.accepted}/${count} comments were accepted`);",
              "if (phase.accepted === 0) throw new Error(`${name}: no comments were accepted`);"
          )
          s = s.replace(
              "latencyMs: Math.round(performance.now() - started), error: body?.error || null };",
              "latencyMs: Math.round(performance.now() - started), error: body?.error || null, requestId: body?.requestId || null };"
          )
          p.write_text(s)
          PY
          timeout 1500s npx wrangler tail class-pdf-comment-viewer-v01-staging --format json --method POST > worker-tail.jsonl 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 5
          set +e
          node scripts/staging-ai-load-test-v2.mjs
          test_status=$?
          set -e
          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          rm -f .load-staging.wrangler.toml .d1-probe.json
          exit "$test_status"
      - name: Upload load-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpcv-staging-ai-load-audit-${{ github.run_id }}
          path: |
            load-test-report.json
            load-test-summary.md
            worker-tail.jsonl
          if-no-files-found: warn
          retention-days: 30
