name: TalkSys AI diagnostic 20260828

on:
  push:
    branches: [talksys-deploy-bridge-20260828]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Call Gemma 4 vision directly
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const image='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQmcAAAAASUVORK5CYII=';
          fs.writeFileSync('/tmp/body.json', JSON.stringify({
            messages:[
              {role:'system',content:'Return only compact JSON.'},
              {role:'user',content:'Return exactly {"found":false,"x":0,"y":0,"label":"","note":"none"}.'}
            ],
            image,
            max_tokens:180,
            temperature:0.1
          }));
          NODE
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/google/gemma-4-26b-a4b-it" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'content-type: application/json' \
            --data-binary @/tmp/body.json | tee /tmp/result.json
          echo
          node -e 'const x=require("/tmp/result.json"); console.log(JSON.stringify(x,null,2))'
