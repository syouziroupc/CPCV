name: TalkSys Grok route audit once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-grok-route-audit-once.yml

permissions:
  contents: read

jobs:
  audit-grok-route:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect AI Gateway names and xAI stored-key configs without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          gateways="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/ai-gateway/gateways")"
          GATEWAYS="$gateways" node <<'NODE'
          const d=JSON.parse(process.env.GATEWAYS||'{}');
          if (!d.success) {
            console.log(JSON.stringify({success:false, errors:d.errors||[]}));
            process.exit(2);
          }
          console.log('gateways=' + (d.result||[]).map(g=>g.id).join(','));
          NODE
          ids="$(GATEWAYS="$gateways" node -e "const d=JSON.parse(process.env.GATEWAYS||'{}');process.stdout.write((d.result||[]).map(g=>g.id).join(' '))")"
          found=0
          for id in $ids; do
            configs="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/ai-gateway/gateways/$id/provider_configs")"
            GATEWAY_ID="$id" CONFIGS="$configs" node <<'NODE'
          const d=JSON.parse(process.env.CONFIGS||'{}');
          const safe=(d.result||[]).map(x=>({provider_slug:x.provider_slug,alias:x.alias,default_config:x.default_config,has_secret:Boolean(x.secret_id)}));
          console.log(JSON.stringify({gateway:process.env.GATEWAY_ID,success:Boolean(d.success),configs:safe,errors:d.success?[]:(d.errors||[])}));
          NODE
            has_xai="$(CONFIGS="$configs" node -e "let d={};try{d=JSON.parse(process.env.CONFIGS||'{}')}catch{};process.stdout.write((d.result||[]).some(x=>/^(xai|grok)$/i.test(String(x.provider_slug||''))&&x.default_config)?'yes':'no')")"
            if [ "$has_xai" = yes ]; then
              echo "XAI_DEFAULT_GATEWAY=$id"
              found=1
            fi
          done
          echo "XAI_DEFAULT_FOUND=$found"
