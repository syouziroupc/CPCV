name: TalkSys realtime voice deploy 20260828

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']

concurrency:
  group: talksys-realtime-voice-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Fetch TalkSys main
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys
      - name: Validate fast grounded voice
        working-directory: talksys
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker.js
          node --check src/web-search.js
          node --check src/finalizable-nova3.js
          node --check src/realtime-voice-client.js
          node --check src/voice-fallback-client.js
          node --check desktop/voice-fallback.js
          npx wrangler deploy --dry-run
      - name: Deploy TalkSys
        id: deploy
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log | tail -1 | awk '{print $4}' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for fast-grounded-v8
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 25); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/health.json
            echo "attempt=$i $(cat /tmp/health.json)"
            if node -e 'const x=require("/tmp/health.json");process.exit(x.ok&&x.voiceRevision==="fast-grounded-v8"&&x.casualLlmModel==="@cf/meta/llama-3.2-3b-instruct"&&x.groundedLlmModel==="@cf/qwen/qwen3.8-27b"&&x.casualPrompt==="short"&&x.searchRelevanceFilter===true&&x.cloudTtsDisabled===true&&x.ttsPrimary==="device-ja-JP"?0:1)'; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1
      - name: Verify search relevance and latency
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          Q="$(python3 -c 'import urllib.parse;print(urllib.parse.quote("現在の日本の総理大臣"))')"
          START=$(date +%s%3N)
          curl --fail --silent --show-error "$WORKER_URL/api/web-search?q=$Q&ts=$(date +%s%N)" -o /tmp/search.json
          END=$(date +%s%3N)
          cat /tmp/search.json
          echo "search_ms=$((END-START))"
          node -e 'const x=require("/tmp/search.json");const r=x.results||[];if(!x.ok||r.length<1)process.exit(1);const text=r.map(v=>(v.title||"")+" "+(v.snippet||"")).join(" ");if(!/(総理|首相|内閣)/.test(text))process.exit(1);if(/Bookcase Junk Journal|Etsy/.test(text))process.exit(1)'
          test $((END-START)) -lt 4000
      - name: Verify fast connection and casual reply
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/v8-latency-'+Date.now());
          let startCallAt=0,questionAt=0,sent=false,done=false,reply='';
          const timer=setTimeout(()=>finish(new Error('timeout')),12000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);const now=Date.now();try{ws.close()}catch{};const metrics={reply,connectToListeningMs:questionAt-startCallAt,replyMs:questionAt?now-questionAt:0};console.log(JSON.stringify(metrics));if(error){console.error(error);process.exitCode=1;return}if(metrics.connectToListeningMs>1000)process.exitCode=1;if(metrics.replyMs>5000)process.exitCode=1}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return}
            if(d.type==='welcome'){startCallAt=Date.now();ws.send(JSON.stringify({type:'start_call',preferred_format:'mp3'}));return}
            if(d.type==='status'&&d.status==='listening'&&!sent){questionAt=Date.now();sent=true;ws.send(JSON.stringify({type:'text_message',text:'今日はちょっと疲れたなあ。'}));return}
            if(d.type==='transcript'&&d.role==='assistant'&&sent){reply=String(d.text||'').trim();if(!reply)return finish(new Error('empty reply'));if(/画面共有|クリック|PC操作/.test(reply))return finish(new Error('casual drift: '+reply));return finish()}
            if(d.type==='error')finish(new Error(d.message||'agent error'));
          });
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Verify grounded search voice turn
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/v8-search-'+Date.now());
          let sent=false,searched=false,count=0,reply='',done=false,start=0;
          const timer=setTimeout(()=>finish(new Error('timeout')),15000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};console.log(JSON.stringify({searched,count,reply,replyMs:start?Date.now()-start:0}));if(error){console.error(error);process.exitCode=1}}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return}
            if(d.type==='welcome'&&!sent){sent=true;start=Date.now();ws.send(JSON.stringify({type:'text_message',text:'現在の日本の総理大臣は誰？'}));return}
            if(d.type==='search_status'&&d.phase==='done'){searched=true;count=Number(d.resultCount||0);return}
            if(d.type==='transcript'&&d.role==='assistant'){reply=String(d.text||'').trim();if(!searched||count<1)return finish(new Error('reply without relevant search'));if(!reply)return finish(new Error('empty reply'));return finish()}
            if(d.type==='error')finish(new Error(d.message||'agent error'));
          });
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Verify no cloud TTS audio or error
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/v8-tts-'+Date.now());
          ws.binaryType='arraybuffer';let sent=false,reply=false,cloudAudio=false,done=false;const timer=setTimeout(()=>finish(new Error('timeout')),10000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};console.log(JSON.stringify({reply,cloudAudio}));if(error){console.error(error);process.exitCode=1}}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(ev.data instanceof ArrayBuffer){if(ev.data.byteLength>100)cloudAudio=true;return}if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return}
            if(d.type==='welcome')ws.send(JSON.stringify({type:'start_call',preferred_format:'mp3'}));
            if(d.type==='status'&&d.status==='listening'&&!sent){sent=true;ws.send(JSON.stringify({type:'text_message',text:'こんにちは'}))}
            if(d.type==='transcript'&&d.role==='assistant'&&sent){reply=true;setTimeout(()=>finish(cloudAudio?new Error('unexpected cloud audio'):null),500)}
            if(d.type==='error')finish(new Error('voice error: '+(d.message||'')));
          });
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: echo "TalkSys fast-grounded-v8 verified at $WORKER_URL version=$VERSION_ID"
