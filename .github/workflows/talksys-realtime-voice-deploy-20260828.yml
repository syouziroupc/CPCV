name: TalkSys realtime voice deploy 20260828

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']

concurrency:
  group: talksys-realtime-voice-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Fetch TalkSys main
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys
      - name: Validate accurate grounded voice
        working-directory: talksys
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker.js
          node --check src/web-search.js
          node --check src/search-rerank.js
          node --check src/finalizable-nova3.js
          node --check src/realtime-voice-client.js
          node --check src/voice-fallback-client.js
          node --check src/streaming-workers-ai.js
          npx wrangler deploy --dry-run
      - name: Deploy v12 canary
        id: canary
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy --name talksys-v12-canary 2>&1 | tee /tmp/canary.log
          CANARY_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/canary.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          test -n "$CANARY_URL"
          echo "url=$CANARY_URL" >> "$GITHUB_OUTPUT"
      - name: Verify v12 canary health and live response
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 20); do
            if curl --fail --silent "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/canary-health.json; then
              cat /tmp/canary-health.json
              if node -e 'const x=require("/tmp/canary-health.json");process.exit(x.voiceRevision==="accurate-grounded-v12"&&x.sttModel==="@cf/openai/whisper-large-v3-turbo"&&x.sttVadFilter===true&&x.sttConditionOnPreviousText===false&&x.searchReranker==="@cf/baai/bge-reranker-base"&&x.searchWaitSpeech===true?0:1)'; then matched=1; break; fi
            fi
            sleep 1
          done
          test "$matched" = 1
          node <<'NODE'
          const name='v12-canary-'+Date.now();
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/'+name);
          let start=0,first=0,final=0,reply='',done=false;
          const timer=setTimeout(()=>finish(new Error('canary timeout')),16000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};const m={firstChunkMs:first?first-start:0,finalMs:final?final-start:0,reply};console.log(JSON.stringify(m));if(error){console.error(error);process.exitCode=1;return}if(!first||!final||first>=final||m.firstChunkMs>5000||reply.length<16)process.exitCode=1}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return};if(d.type==='welcome'&&!start){start=Date.now();ws.send(JSON.stringify({type:'text_message',text:'今日は少し疲れた。気分転換を二つ提案して'}));return}if(d.type==='assistant_speech_chunk'&&!d.transient&&!first){first=Date.now();return}if(d.type==='transcript'&&d.role==='assistant'){final=Date.now();reply=String(d.text||'').trim();return finish()}if(d.type==='error')finish(new Error(d.message||'agent error'))});
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Verify v12 canary grounded search wait and reranking
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const name='v12-search-'+Date.now();
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/'+name);
          let waitPhrase=false,searched=false,reranked=false,count=0,reply='',done=false;
          const timer=setTimeout(()=>finish(new Error('timeout')),20000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};console.log(JSON.stringify({waitPhrase,searched,reranked,count,reply}));if(error){console.error(error);process.exitCode=1;return}if(!waitPhrase||!searched||!reranked||count<1||!reply)process.exitCode=1}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return};if(d.type==='welcome'){ws.send(JSON.stringify({type:'text_message',text:'現在の日本の総理大臣は誰？'}));return}if(d.type==='assistant_speech_chunk'&&d.transient&&/調べます/.test(String(d.text||''))){waitPhrase=true;return}if(d.type==='search_status'&&d.phase==='done'){searched=true;reranked=Boolean(d.reranked);count=Number(d.resultCount||0);return}if(d.type==='transcript'&&d.role==='assistant'){reply=String(d.text||'').trim();return finish()}if(d.type==='error')finish(new Error(d.message||'agent error'))});
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Deploy TalkSys production
        id: deploy
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log | tail -1 | awk '{print $4}' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for accurate-grounded-v12 production
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 25); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/health.json
            echo "attempt=$i $(cat /tmp/health.json)"
            if node -e 'const x=require("/tmp/health.json");process.exit(x.ok&&x.voiceRevision==="accurate-grounded-v12"&&x.sttModel==="@cf/openai/whisper-large-v3-turbo"&&x.liveLlmModel==="@cf/qwen/qwen3.8-27b"&&x.searchReranker==="@cf/baai/bge-reranker-base"&&x.searchWaitSpeech===true&&x.bargeIn===true?0:1)'; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1
      - name: Verify production search endpoint is reranked
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          Q="$(python3 -c 'import urllib.parse;print(urllib.parse.quote("現在の日本の総理大臣"))')"
          START=$(date +%s%3N)
          curl --fail --silent --show-error "$WORKER_URL/api/web-search?q=$Q&ts=$(date +%s%N)" -o /tmp/search.json
          END=$(date +%s%3N)
          cat /tmp/search.json
          echo "search_ms=$((END-START))"
          node -e 'const x=require("/tmp/search.json");const r=x.results||[];if(!x.ok||x.reranked!==true||r.length<1)process.exit(1);const text=r.map(v=>(v.title||"")+" "+(v.snippet||"")).join(" ");if(!/(総理|首相|内閣)/.test(text))process.exit(1)'
          test $((END-START)) -lt 6000
      - name: Verify production grounded wait phrase
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/v12-prod-'+Date.now());
          let waitPhrase=false,searched=false,reply='',done=false;
          const timer=setTimeout(()=>finish(new Error('timeout')),20000);
          function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close()}catch{};console.log(JSON.stringify({waitPhrase,searched,reply}));if(error){console.error(error);process.exitCode=1;return}if(!waitPhrase||!searched||!reply)process.exitCode=1}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return};if(d.type==='welcome'){ws.send(JSON.stringify({type:'text_message',text:'HIFUってどういうもの？'}));return}if(d.type==='assistant_speech_chunk'&&d.transient&&/調べます/.test(String(d.text||''))){waitPhrase=true;return}if(d.type==='search_status'&&d.phase==='done'){searched=true;return}if(d.type==='transcript'&&d.role==='assistant'){reply=String(d.text||'').trim();return finish()}if(d.type==='error')finish(new Error(d.message||'agent error'))});
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Cleanup canary
        if: always()
        working-directory: talksys
        run: npx wrangler delete --name talksys-v12-canary --force || true
      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: echo "TalkSys accurate-grounded-v12 verified at $WORKER_URL version=$VERSION_ID"
