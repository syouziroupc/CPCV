name: TalkSys Cloudflare Live v14 canary

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']
  workflow_dispatch:

concurrency:
  group: talksys-cloudflare-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare credentials only
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Fetch TalkSys main
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys

      - name: Validate Cloudflare live v14
        working-directory: talksys
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker-v14.js
          node --check src/cloudflare-live-client.js
          node --check src/cloudflare-japanese-stt.js
          node --check src/cloudflare-japanese-tts.js
          node --check src/cloudflare-llm.js
          grep -F '"main": "src/worker-v14.js"' wrangler.jsonc
          npx wrangler deploy --dry-run

      - name: Deploy isolated v14 canary
        id: canary
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy --name talksys-v14-canary 2>&1 | tee /tmp/canary.log
          CANARY_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/canary.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          test -n "$CANARY_URL"
          echo "url=$CANARY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify v14 revision
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 30); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/health.json || true
            echo "attempt=$i $(cat /tmp/health.json 2>/dev/null || true)"
            if node -e 'const x=require("/tmp/health.json");process.exit(x.ok&&x.voiceRevision==="cloudflare-live-v14"&&x.primary==="cloudflare-voice"&&x.providerApiKeysRequired===false&&x.sharedTypedAndVoiceHistory===true&&x.sttLanguage==="ja"?0:1)' 2>/dev/null; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1

      - name: Probe Unified Billing
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/api/unified-smoke?ts=$(date +%s%N)" -o /tmp/unified.json
          cat /tmp/unified.json
          node -e 'const x=require("/tmp/unified.json");if(!x.ok)process.exit(1);console.log("unifiedBilling="+x.unifiedBilling)'

      - name: Probe Japanese server TTS
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set +e
          code=$(curl --silent --show-error -w '%{http_code}' -o /tmp/voice.mp3 "$WORKER_URL/api/voice-smoke?ts=$(date +%s%N)")
          echo "tts_http=$code bytes=$(wc -c </tmp/voice.mp3)"
          if [ "$code" = "200" ]; then file /tmp/voice.mp3 || true; else cat /tmp/voice.mp3 || true; fi
          echo "$code" > /tmp/tts-code
          exit 0

      - name: Verify text conversation and search
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const workerUrl = process.env.WORKER_URL;
          const wsUrl = workerUrl.replace(/^http/, 'ws') + '/agents/talk-sys-voice-agent/default';
          async function ask(text, expectSearch=false) {
            return new Promise((resolve,reject)=>{
              const ws = new WebSocket(wsUrl);
              let welcomed=false, transcript='', searched=false, nativeSearch=null, done=false;
              const timer=setTimeout(()=>finish(new Error('timeout: '+text)),30000);
              function finish(error){if(done)return;done=true;clearTimeout(timer);try{ws.close(1000,'done')}catch{};if(error)return reject(error);resolve({transcript,searched,nativeSearch});}
              ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
              ws.addEventListener('message',ev=>{
                if(typeof ev.data!=='string')return;
                let d;try{d=JSON.parse(ev.data)}catch{return}
                if(d.type==='welcome'&&!welcomed){welcomed=true;ws.send(JSON.stringify({type:'text_message',text}));return}
                if(d.type==='search_status'){if(d.phase==='searching')searched=true;if(d.phase==='done')nativeSearch=d.nativeSearch;return}
                if(d.type==='transcript_delta')transcript+=d.text||'';
                if(d.type==='transcript_end'){transcript=d.text||transcript;if(transcript.trim())finish();}
                if(d.type==='error')console.error('agent error',d.message);
              });
              ws.addEventListener('error',()=>finish(new Error('websocket error')));
              ws.addEventListener('close',ev=>{if(!done)finish(new Error('closed '+ev.code+' '+ev.reason))});
            }).then(result=>{
              console.log(JSON.stringify({text,...result}));
              if(!result.transcript.trim())throw new Error('empty answer');
              if(expectSearch&&!result.searched)throw new Error('search did not start');
              return result;
            });
          }
          await ask('今日はちょっと疲れたなあ。普通に話して。', false);
          await ask('現在の日本の内閣総理大臣は誰ですか。確認して答えて。', true);
          NODE

      - name: Canary summary
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          echo "TalkSys v14 canary=$WORKER_URL"
          echo "Unified: $(cat /tmp/unified.json)"
          echo "TTS HTTP: $(cat /tmp/tts-code)"

      - name: Cleanup canary
        if: always()
        run: |
          if [ -d talksys ]; then
            cd talksys
            npx wrangler delete --name talksys-v14-canary --force || true
          fi
