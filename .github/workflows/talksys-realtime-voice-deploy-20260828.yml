name: TalkSys realtime voice deploy 20260828

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']

concurrency:
  group: talksys-realtime-voice-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Fetch TalkSys main
        shell: bash
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys

      - name: Validate TalkSys buffered voice turns
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker.js
          node --check src/finalizable-nova3.js
          node --check src/voice-marker-bridge.js
          node --check src/realtime-voice-client.js
          node --check desktop/voice-marker-bridge.js
          node --check desktop/realtime-voice.js
          npx wrangler deploy --dry-run

      - name: Deploy TalkSys with voice Durable Object
        id: deploy
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/talksys-voice-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/talksys-voice-deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/talksys-voice-deploy.log | tail -1 | awk '{print $4}' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $WORKER_URL"
          echo "Version ID: $VERSION_ID"

      - name: Wait for exact voice revision
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 20); do
            code="$(curl --silent --show-error -o /tmp/voice-health.json -w '%{http_code}' "$WORKER_URL/voice-health?revision_check=$i&ts=$(date +%s%N)")"
            echo "attempt=$i HTTP=$code $(cat /tmp/voice-health.json 2>/dev/null || true)"
            if [ "$code" = 200 ] && node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/voice-health.json","utf8"));process.exit(x.ok&&x.voiceRevision==="buffered-binary-v2"&&x.binaryTurnMarkers===true&&x.batchFinalStt===true&&x.sttLanguage==="ja"&&x.llmStream==="result.stream"&&x.aiSdkContract===7?0:1)'; then
              matched=1
              break
            fi
            sleep 1
          done
          test "$matched" = 1

          curl --fail --silent --show-error "$WORKER_URL/voice-marker-bridge.js?ts=$(date +%s%N)" -o /tmp/marker.js
          grep -q "start_of_speech" /tmp/marker.js
          grep -q "utterance_commit" /tmp/marker.js
          grep -q "local_turn_boundary" /tmp/marker.js

      - name: Verify chat remains healthy
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/chat.json -w '%{http_code}' -X POST "$WORKER_URL/api/chat" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"1+1を数字だけで答えて"}]}')"
          echo "chat HTTP $code"; cat /tmp/chat.json; echo
          test "$code" = 200
          node -e 'const x=require("/tmp/chat.json");if(String(x.reply||"").trim()!=="2")process.exit(1)'

      - name: Verify Voice Agent LLM response stream
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const worker = process.env.WORKER_URL;
          const wsUrl = worker.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:') + '/agents/talk-sys-voice-agent/llm-smoke-' + Date.now();
          const ws = new WebSocket(wsUrl);
          let welcomed = false;
          let thinking = false;
          let assistantStarted = false;
          let assistantText = '';
          let finished = false;
          const timeout = setTimeout(() => finish(new Error(`LLM voice timeout welcomed=${welcomed} thinking=${thinking} assistantStarted=${assistantStarted} text=${JSON.stringify(assistantText)}`)), 20000);

          function finish(error) {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            try { ws.close(); } catch {}
            if (error) {
              console.error(error);
              process.exitCode = 1;
            } else {
              console.log(JSON.stringify({ welcomed, thinking, assistantStarted, assistantText }));
            }
          }

          ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'hello', protocol_version: 1 })));
          ws.addEventListener('message', (event) => {
            if (typeof event.data !== 'string') return;
            let data;
            try { data = JSON.parse(event.data); } catch { return; }
            if (data.type === 'welcome' && !welcomed) {
              welcomed = true;
              ws.send(JSON.stringify({ type: 'text_message', text: '1+1を数字だけで答えて' }));
              return;
            }
            if (data.type === 'status' && data.status === 'thinking') thinking = true;
            if (data.type === 'transcript_start' && data.role === 'assistant') {
              assistantStarted = true;
              assistantText = '';
            }
            if (assistantStarted && data.type === 'transcript_delta') assistantText += String(data.text || '');
            if (assistantStarted && data.type === 'transcript_end') {
              assistantText = String(data.text || assistantText || '').trim();
              if (!assistantText.includes('2')) return finish(new Error(`unexpected assistant reply: ${JSON.stringify(assistantText)}`));
              finish();
            }
            if (data.type === 'completion_outcome' && data.code === 'model_error') finish(new Error(`model error: ${JSON.stringify(data)}`));
            if (data.type === 'error' && !String(data.message || '').includes('TTS')) finish(new Error(`voice agent error: ${data.message || JSON.stringify(data)}`));
          });
          ws.addEventListener('error', () => finish(new Error('voice agent websocket connection error')));
          ws.addEventListener('close', (event) => {
            if (!finished) finish(new Error(`voice agent websocket closed early code=${event.code} reason=${event.reason}`));
          });
          NODE

      - name: Verify realtime voice accepts binary turn markers
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const worker = process.env.WORKER_URL;
          const wsUrl = worker.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:') + '/agents/talk-sys-voice-agent/default';
          const ws = new WebSocket(wsUrl);
          const START = new Uint8Array([0x54,0x53,0x59,0x53,0x01,0x53,0x54,0x41]);
          const END = new Uint8Array([0x54,0x53,0x59,0x53,0x01,0x45,0x4e,0x44]);
          let welcomed = false;
          let listening = false;
          let finished = false;
          const timeout = setTimeout(() => finish(new Error(`voice timeout welcomed=${welcomed} listening=${listening}`)), 12000);

          function finish(error) {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            try { ws.close(); } catch {}
            if (error) {
              console.error(error);
              process.exitCode = 1;
            } else {
              console.log(JSON.stringify({ welcomed, listening, binaryMarkers: true }));
            }
          }

          ws.binaryType = 'arraybuffer';
          ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'hello', protocol_version: 1 })));
          ws.addEventListener('message', (event) => {
            if (typeof event.data !== 'string') return;
            let data;
            try { data = JSON.parse(event.data); } catch { return; }
            if (data.type === 'welcome') {
              welcomed = true;
              ws.send(JSON.stringify({ type: 'start_call', preferred_format: 'mp3' }));
            }
            if (data.type === 'status' && data.status === 'listening' && !listening) {
              listening = true;
              ws.send(START.buffer.slice(0));
              ws.send(END.buffer.slice(0));
              setTimeout(() => {
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'end_call' }));
                finish();
              }, 400);
            }
            if (data.type === 'error' && !String(data.message || '').includes('TTS')) finish(new Error(`voice error: ${data.message || JSON.stringify(data)}`));
          });
          ws.addEventListener('error', () => finish(new Error('voice websocket connection error')));
          ws.addEventListener('close', (event) => {
            if (!finished) finish(new Error(`voice websocket closed early code=${event.code} reason=${event.reason}`));
          });
          NODE

      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: echo "TalkSys buffered voice v2 + LLM response verified at $WORKER_URL version=$VERSION_ID"