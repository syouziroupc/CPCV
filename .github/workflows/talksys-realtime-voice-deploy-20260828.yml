name: TalkSys realtime voice deploy 20260828

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']

concurrency:
  group: talksys-realtime-voice-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Fetch TalkSys main
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys
      - name: Validate TalkSys voice pipeline
        working-directory: talksys
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker.js
          node --check src/finalizable-nova3.js
          node --check src/voice-marker-bridge.js
          node --check src/realtime-voice-client.js
          npx wrangler deploy --dry-run
      - name: Deploy TalkSys
        id: deploy
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log | tail -1 | awk '{print $4}' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Wait for direct-binding-v5
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 20); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/health.json
            echo "attempt=$i $(cat /tmp/health.json)"
            if node -e 'const x=require("/tmp/health.json");process.exit(x.ok&&x.voiceRevision==="direct-binding-v5"&&x.assistantTranscriptCompat===true&&x.llmThinking===false?0:1)'; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1
      - name: Verify REST chat
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST "$WORKER_URL/api/chat" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"1+1を数字だけで答えて"}]}' -o /tmp/chat.json
          cat /tmp/chat.json
          node -e 'const x=require("/tmp/chat.json");if(String(x.reply||"").trim()!=="2")process.exit(1)'
      - name: Verify active-call assistant text and TTS
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const worker = process.env.WORKER_URL;
          const ws = new WebSocket(worker.replace(/^https:/,'wss:') + '/agents/talk-sys-voice-agent/incall-smoke-' + Date.now());
          ws.binaryType = 'arraybuffer';
          let welcomed=false, listening=false, questionSent=false, assistantText='', assistantCompat=false, audioAfterReply=false, done=false;
          const timeout=setTimeout(()=>finish(new Error(`timeout welcomed=${welcomed} listening=${listening} compat=${assistantCompat} text=${JSON.stringify(assistantText)} audio=${audioAfterReply}`)),30000);
          function finish(error){if(done)return;done=true;clearTimeout(timeout);try{ws.close()}catch{};if(error){console.error(error);process.exitCode=1}else console.log(JSON.stringify({assistantText,audioAfterReply}))}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',(event)=>{
            if (event.data instanceof ArrayBuffer) {
              if (assistantCompat && event.data.byteLength > 100) { audioAfterReply=true; finish(); }
              return;
            }
            if (typeof event.data !== 'string') return;
            let d; try{d=JSON.parse(event.data)}catch{return}
            console.log('WS', event.data);
            if(d.type==='welcome'&&!welcomed){welcomed=true;ws.send(JSON.stringify({type:'start_call',preferred_format:'mp3'}));return}
            if(d.type==='status'&&d.status==='listening'&&!questionSent){listening=true;questionSent=true;ws.send(JSON.stringify({type:'text_message',text:'1+1を数字だけで答えて'}));return}
            if(d.type==='transcript'&&d.role==='assistant'){
              assistantText=String(d.text||'').trim();assistantCompat=true;
              if(!assistantText.includes('2'))return finish(new Error('unexpected assistant text '+JSON.stringify(assistantText)));
              return;
            }
            if(d.type==='error'&&!String(d.message||'').includes('TTS'))return finish(new Error(d.message||'voice error'));
            if(d.type==='error'&&String(d.message||'').includes('TTS'))return finish(new Error('TTS error: '+d.message));
          });
          ws.addEventListener('error',()=>finish(new Error('websocket error')));
          ws.addEventListener('close',e=>{if(!done)finish(new Error('closed '+e.code))});
          NODE
      - name: Verify binary voice turn markers
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const ws=new WebSocket(process.env.WORKER_URL.replace(/^https:/,'wss:')+'/agents/talk-sys-voice-agent/marker-'+Date.now());
          const START=new Uint8Array([0x54,0x53,0x59,0x53,0x01,0x53,0x54,0x41]);
          const END=new Uint8Array([0x54,0x53,0x59,0x53,0x01,0x45,0x4e,0x44]);
          let done=false,started=false;const t=setTimeout(()=>finish(new Error('timeout')),12000);
          function finish(e){if(done)return;done=true;clearTimeout(t);try{ws.close()}catch{};if(e){console.error(e);process.exitCode=1}else console.log('markers ok')}
          ws.addEventListener('open',()=>ws.send(JSON.stringify({type:'hello',protocol_version:1})));
          ws.addEventListener('message',ev=>{if(typeof ev.data!=='string')return;let d;try{d=JSON.parse(ev.data)}catch{return}if(d.type==='welcome')ws.send(JSON.stringify({type:'start_call',preferred_format:'mp3'}));if(d.type==='status'&&d.status==='listening'&&!started){started=true;ws.send(START.buffer.slice(0));ws.send(END.buffer.slice(0));setTimeout(()=>finish(),500)}});
          ws.addEventListener('error',()=>finish(new Error('ws error')));
          NODE
      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: echo "TalkSys direct-binding-v5 in-call reply + TTS verified at $WORKER_URL version=$VERSION_ID"