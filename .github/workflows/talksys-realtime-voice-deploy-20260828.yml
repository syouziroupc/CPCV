name: TalkSys Gemini Live v13.1 deploy

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']
  workflow_dispatch:

concurrency:
  group: talksys-gemini-live-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${GEMINI_API_KEY:-}"

      - name: Fetch TalkSys main
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys

      - name: Validate Gemini Live v13.1
        working-directory: talksys
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker-v13.js
          node --check src/gemini-live-v13-client.js
          node --check src/gemini-transcribe-companion.js
          node --check desktop/gemini-live.js
          node --check desktop/gemini-transcribe.js
          node --check scripts/verify-gemini-live.mjs
          grep -F '"main": "src/worker-v13.js"' wrangler.jsonc
          grep -F "realtimeInput: { text }" src/gemini-live-v13-client.js
          grep -F "audioStreamEnd: true" src/gemini-live-v13-client.js
          grep -F "gemini-3.5-transcribe-live" src/gemini-transcribe-companion.js
          npx wrangler deploy --dry-run

      - name: Deploy isolated v13.1 canary
        id: canary
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy --name talksys-v13-canary 2>&1 | tee /tmp/canary.log
          CANARY_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/canary.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          test -n "$CANARY_URL"
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --name talksys-v13-canary
          echo "url=$CANARY_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for canary revision
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 30); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/health.json || true
            echo "attempt=$i $(cat /tmp/health.json 2>/dev/null || true)"
            if node -e 'const x=require("/tmp/health.json");process.exit(x.ok&&x.voiceRevision==="gemini-live-v13.1"&&x.geminiLiveConfigured===true&&x.geminiLiveModel==="gemini-3.1-flash-live-preview"&&x.dedicatedTranscriptionModel==="gemini-3.5-transcribe-live"&&x.parallelHighAccuracyTranscription===true&&x.googleSearchGrounding===true&&x.typedChatTransport==="realtimeInput.text"?0:1)' 2>/dev/null; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1

      - name: Full real Gemini Live canary
        working-directory: talksys
        env:
          WORKER_URL: ${{ steps.canary.outputs.url }}
        run: node scripts/verify-gemini-live.mjs

      - name: Configure Gemini secret on production
        working-directory: talksys
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --name talksys

      - name: Deploy TalkSys production v13.1
        id: deploy
        working-directory: talksys
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          VERSION_ID="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/deploy.log | tail -1 | awk '{print $4}' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for production revision
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          matched=0
          for i in $(seq 1 30); do
            curl --silent --show-error "$WORKER_URL/voice-health?i=$i&ts=$(date +%s%N)" -o /tmp/prod-health.json || true
            echo "attempt=$i $(cat /tmp/prod-health.json 2>/dev/null || true)"
            if node -e 'const x=require("/tmp/prod-health.json");process.exit(x.ok&&x.voiceRevision==="gemini-live-v13.1"&&x.geminiLiveConfigured===true&&x.parallelHighAccuracyTranscription===true&&x.googleSearchGrounding===true&&x.hybridVad===true&&x.typedChatTransport==="realtimeInput.text"?0:1)' 2>/dev/null; then matched=1; break; fi
            sleep 1
          done
          test "$matched" = 1

      - name: Re-run real Gemini verification on production
        working-directory: talksys
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: node scripts/verify-gemini-live.mjs

      - name: Verify production client assets
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/gemini-live.js?ts=$(date +%s%N)" -o /tmp/live.js
          curl --fail --silent --show-error "$WORKER_URL/gemini-transcribe.js?ts=$(date +%s%N)" -o /tmp/transcribe.js
          grep -q 'gemini-3.1-flash-live-preview' /tmp/live.js
          grep -q 'googleSearch' /tmp/live.js
          grep -q "languageCodes: \['ja-JP'\]" /tmp/live.js
          grep -q "realtimeInput: { text }" /tmp/live.js
          grep -q "audioStreamEnd: true" /tmp/live.js
          grep -q 'gemini-3.5-transcribe-live' /tmp/transcribe.js
          grep -q "mode: 'SMART'" /tmp/transcribe.js
          ! grep -q 'SpeechSynthesisUtterance' /tmp/live.js

      - name: Cleanup canary
        if: always()
        run: |
          if [ -d talksys ]; then
            cd talksys
            npx wrangler delete --name talksys-v13-canary --force || true
          fi

      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: echo "TalkSys gemini-live-v13.1 fully verified at $WORKER_URL version=$VERSION_ID"