name: TalkSys realtime voice deploy 20260828

on:
  push:
    branches: [talksys-realtime-voice-20260828]
    paths: ['.github/workflows/talksys-realtime-voice-deploy-20260828.yml']

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Fetch TalkSys main
        shell: bash
        run: git clone --depth 1 --branch main https://github.com/syouziroupc/talksys.git talksys

      - name: Validate TalkSys realtime voice
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          node --check src/worker.js
          node --check src/realtime-voice-client.js
          node --check desktop/realtime-voice.js
          npx wrangler deploy --dry-run

      - name: Deploy TalkSys with voice Durable Object
        id: deploy
        working-directory: talksys
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/talksys-voice-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/talksys-voice-deploy.log | tail -1 | sed -E 's/[).,;]+$//' || true)"
          test -n "$WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $WORKER_URL"

      - name: Verify REST and report Japanese TTS state
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/voice-health.json -w '%{http_code}' "$WORKER_URL/voice-health")"
          echo "voice-health HTTP $code"; cat /tmp/voice-health.json; echo
          test "$code" = 200

          code="$(curl --silent --show-error -o /tmp/chat.json -w '%{http_code}' -X POST "$WORKER_URL/api/chat" -H 'content-type: application/json' --data '{"messages":[{"role":"user","content":"1+1を数字だけで答えて"}]}')"
          echo "chat HTTP $code"; cat /tmp/chat.json; echo
          test "$code" = 200

          code="$(curl --silent --show-error -o /tmp/voice-output -w '%{http_code}' "$WORKER_URL/api/voice-smoke")"
          echo "voice-smoke HTTP $code"
          if [ "$code" = 200 ]; then
            test "$(wc -c < /tmp/voice-output)" -gt 1000
            echo "Japanese TTS bytes: $(wc -c < /tmp/voice-output)"
          else
            echo "MeloTTS upstream currently unavailable; input/STT deployment continues."
            cat /tmp/voice-output; echo
          fi

      - name: Verify realtime voice WebSocket and STT transport startup
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const worker = process.env.WORKER_URL;
          const wsUrl = worker.replace(/^https:/, 'wss:').replace(/^http:/, 'ws:') + '/agents/talk-sys-voice-agent/default';
          const ws = new WebSocket(wsUrl);
          let welcomed = false;
          let listening = false;
          let binaryFramesSent = 0;
          let finished = false;
          const timeout = setTimeout(() => finish(new Error(`voice timeout welcomed=${welcomed} listening=${listening} frames=${binaryFramesSent}`)), 20000);

          function finish(error) {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            try { ws.close(); } catch {}
            if (error) {
              console.error(error);
              process.exitCode = 1;
            } else {
              console.log(JSON.stringify({ welcomed, listening, binaryFramesSent }));
            }
          }

          ws.binaryType = 'arraybuffer';
          ws.addEventListener('open', () => ws.send(JSON.stringify({ type: 'hello', protocol_version: 1 })));
          ws.addEventListener('message', (event) => {
            if (typeof event.data !== 'string') return;
            let data;
            try { data = JSON.parse(event.data); } catch { return; }
            if (data.type === 'welcome') {
              welcomed = true;
              ws.send(JSON.stringify({ type: 'start_call', preferred_format: 'mp3' }));
            }
            if (data.type === 'status' && data.status === 'listening' && !listening) {
              listening = true;
              ws.send(JSON.stringify({ type: 'start_of_speech' }));
              const silentFrame = new Int16Array(800);
              let sent = 0;
              const timer = setInterval(() => {
                if (ws.readyState !== WebSocket.OPEN) {
                  clearInterval(timer);
                  return;
                }
                ws.send(silentFrame.buffer.slice(0));
                binaryFramesSent += 1;
                sent += 1;
                if (sent >= 10) {
                  clearInterval(timer);
                  ws.send(JSON.stringify({ type: 'end_of_speech' }));
                  setTimeout(() => {
                    ws.send(JSON.stringify({ type: 'end_call' }));
                    finish();
                  }, 500);
                }
              }, 50);
            }
            if (data.type === 'error') finish(new Error(`voice error: ${data.message || JSON.stringify(data)}`));
          });
          ws.addEventListener('error', () => finish(new Error('voice websocket connection error')));
          ws.addEventListener('close', (event) => {
            if (!finished) finish(new Error(`voice websocket closed early code=${event.code} reason=${event.reason}`));
          });
          NODE

      - name: Production summary
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: echo "TalkSys mic transport and STT session verified at $WORKER_URL"
