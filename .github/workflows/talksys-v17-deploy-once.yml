name: Deploy TalkSys v17 hotfix once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v17-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout TalkSys v17 hotfix
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: cd8959729cb8f3ee51dc0e8487966990a6e021be
          path: talksys

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: talksys
        run: npm install --no-audit --no-fund

      - name: Validate TalkSys v17 hotfix
        working-directory: talksys
        run: |
          npm test
          npx wrangler deploy --dry-run

      - name: Require Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy TalkSys v17 hotfix to Cloudflare
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify TalkSys production health
        env:
          PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            revision="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            echo "Attempt $i: ${revision:-missing}"
            if [ "$revision" = "cloudflare-live-v16.0" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1
