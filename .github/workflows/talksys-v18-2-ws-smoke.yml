name: TalkSys v18.3 production conversation smoke

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v18-2-ws-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify production revision
        run: |
          body="$(curl -fsS --max-time 20 https://talksys.syouziroupc.workers.dev/voice-health)"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            llmRouting: d.llmRouting,
            normalConversationLiveOnly: d.normalConversationLiveOnly,
            casualFastPath: d.casualFastPath,
            searchPrecisionOnly: d.searchPrecisionOnly,
            crossTurnContext: d.crossTurnContext,
          }));
          if (d.voiceRevision !== 'cloudflare-live-v18.3') process.exit(1);
          if (d.normalConversationLiveOnly !== true || d.casualFastPath !== true || d.searchPrecisionOnly !== true) process.exit(1);
          if (d.crossTurnContext !== false) process.exit(1);
          NODE

      - name: Measure greeting, ordinary live stream, and deep search separately
        run: |
          node <<'NODE'
          const url = 'wss://talksys.syouziroupc.workers.dev/agents/talk-sys-voice-agent/default';

          async function probe({label, text, timeoutMs, expectedTier, expectSearch = false, maxFirstReplyMs = null}) {
            return await new Promise((resolve, reject) => {
              const ws = new WebSocket(url);
              const openedAt = Date.now();
              let sentAt = 0;
              let firstAssistantAt = 0;
              let assistantText = '';
              let route = '';
              const searchPhases = [];
              const events = [];
              let binaryCount = 0;
              let sent = false;
              let settled = false;

              function finish(error) {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                try { ws.close(); } catch {}
                const result = {
                  label,
                  text,
                  route,
                  searchPhases,
                  connectMs: sentAt ? sentAt - openedAt : null,
                  firstAssistantMs: firstAssistantAt && sentAt ? firstAssistantAt - sentAt : null,
                  totalMs: sentAt ? Date.now() - sentAt : null,
                  answer: assistantText.trim(),
                  binaryCount,
                  events,
                };
                console.log(JSON.stringify(result));
                if (error) reject(error); else resolve(result);
              }

              const timer = setTimeout(() => finish(new Error(label + ' timed out')), timeoutMs);

              ws.onopen = () => {
                events.push(['open', Date.now() - openedAt]);
                ws.send(JSON.stringify({type:'hello', protocol_version:1}));
              };
              ws.onerror = () => events.push(['error', Date.now() - openedAt]);
              ws.onclose = () => events.push(['close', Date.now() - openedAt]);
              ws.onmessage = async (event) => {
                if (typeof event.data !== 'string') {
                  binaryCount += 1;
                  return;
                }
                let d;
                try { d = JSON.parse(event.data); } catch { return; }
                const stamp = sentAt ? Date.now() - sentAt : Date.now() - openedAt;
                const summary = d.status || d.tier || d.phase || d.role || d.code || String(d.text || '').slice(0,80);
                events.push([d.type, stamp, summary]);

                if (d.type === 'welcome' && !sent) {
                  sent = true;
                  sentAt = Date.now();
                  ws.send(JSON.stringify({type:'text_message', text}));
                  return;
                }
                if (d.type === 'model_route') route = String(d.tier || '');
                if (d.type === 'search_status') searchPhases.push(String(d.phase || ''));
                if (d.type === 'transcript_delta') {
                  if (!firstAssistantAt) firstAssistantAt = Date.now();
                  assistantText += String(d.text || '');
                }
                if (d.type === 'transcript' && d.role === 'assistant' && d.text) {
                  if (!firstAssistantAt) firstAssistantAt = Date.now();
                  assistantText = String(d.text || assistantText);
                  finish();
                  return;
                }
                if (d.type === 'transcript_end') {
                  const finalText = String(d.text || '').trim();
                  if (finalText) {
                    if (!firstAssistantAt) firstAssistantAt = Date.now();
                    assistantText = finalText;
                  }
                  if (assistantText.trim()) {
                    finish();
                    return;
                  }
                }
              };
            }).then((result) => {
              if (expectedTier && result.route !== expectedTier) throw new Error(`${label}: expected tier ${expectedTier}, got ${result.route}`);
              const searched = result.searchPhases.length > 0;
              if (expectSearch !== searched) throw new Error(`${label}: search routing mismatch ${JSON.stringify(result.searchPhases)}`);
              if (!result.answer) throw new Error(`${label}: empty assistant answer`);
              if (maxFirstReplyMs != null && !(result.firstAssistantMs <= maxFirstReplyMs)) {
                throw new Error(`${label}: first reply ${result.firstAssistantMs}ms exceeded ${maxFirstReplyMs}ms`);
              }
              return result;
            });
          }

          const greeting = await probe({
            label: 'instant greeting',
            text: 'こんにちは',
            timeoutMs: 8000,
            expectedTier: 'instant-local',
            expectSearch: false,
            maxFirstReplyMs: 1500,
          });

          const ordinary = await probe({
            label: 'ordinary live conversation',
            text: '今日はちょっと疲れた',
            timeoutMs: 12000,
            expectedTier: 'live-fast',
            expectSearch: false,
          });

          const search = await probe({
            label: 'explicit deep search',
            text: '別府市内のパソコン販売店を検索して',
            timeoutMs: 50000,
            expectedTier: 'verified-deep-search-v18',
            expectSearch: true,
          });

          console.log(JSON.stringify({
            ok: true,
            greetingFirstReplyMs: greeting.firstAssistantMs,
            ordinaryFirstReplyMs: ordinary.firstAssistantMs,
            searchTotalMs: search.totalMs,
            searchPhases: search.searchPhases,
          }));
          NODE
