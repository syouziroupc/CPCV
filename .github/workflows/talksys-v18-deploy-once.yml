name: Deploy TalkSys v18.2 once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v18-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout exact TalkSys v18.2 main commit
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 5ad0ea2ed0e05f4ea6bb1bd00e773955e8954b6b
          path: talksys

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: talksys
        run: npm install --no-audit --no-fund

      - name: Validate exact TalkSys v18.2 commit
        working-directory: talksys
        run: |
          npm test
          npx wrangler deploy --dry-run

      - name: Require Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy TalkSys v18.2 to Cloudflare
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify TalkSys v18.2 production health
        env:
          PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            BODY="$body" node - <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.BODY || '{}'); } catch {}
          console.log(JSON.stringify({
            voiceRevision: data.voiceRevision,
            mode: data.mode,
            screenOverlay: data.screenOverlay,
            searchMaxQueries: data.searchMaxQueries,
            searchMaxRounds: data.searchMaxRounds,
            searchFillerGeneratedInParallel: data.searchFillerGeneratedInParallel,
            typedSpeechSimulation: data.typedSpeechSimulation,
            typedSpeechSilentWhenNotInCall: data.typedSpeechSilentWhenNotInCall,
            typedSpeechVoiceOutput: data.typedSpeechVoiceOutput,
            crossTurnContext: data.crossTurnContext,
            crossSessionContext: data.crossSessionContext,
            callConnectTimeoutMs: data.callConnectTimeoutMs,
            searchAnswerAudit: data.searchAnswerAudit,
          }));
          NODE
            revision="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            voiceout="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.typedSpeechVoiceOutput||''))")"
            cross="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(d.crossTurnContext === false ? 'false' : String(d.crossTurnContext||''))")"
            timeout="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.callConnectTimeoutMs||''))")"
            if [ "$revision" = "cloudflare-live-v18.2" ] && [ "$voiceout" = "true" ] && [ "$cross" = "false" ] && [ "$timeout" = "10000" ]; then
              exit 0
            fi
            sleep 3
          done
          exit 1
