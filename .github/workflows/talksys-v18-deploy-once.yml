name: Deploy TalkSys v18.3 once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v18-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout exact TalkSys v18.3 main commit
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: d344035ef083ef3146e7ba6d62a2a3802da6d905
          path: talksys

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: talksys
        run: npm install --no-audit --no-fund

      - name: Validate exact TalkSys v18.3 commit
        working-directory: talksys
        run: |
          npm test
          npx wrangler deploy --dry-run

      - name: Require Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy TalkSys v18.3 to Cloudflare
        working-directory: talksys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify TalkSys v18.3 production health
        env:
          PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
        run: |
          for i in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            BODY="$body" node - <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.BODY || '{}'); } catch {}
          console.log(JSON.stringify({
            voiceRevision: data.voiceRevision,
            mode: data.mode,
            normalConversationLiveOnly: data.normalConversationLiveOnly,
            casualFastPath: data.casualFastPath,
            searchPrecisionOnly: data.searchPrecisionOnly,
            searchMaxQueries: data.searchMaxQueries,
            searchMaxRounds: data.searchMaxRounds,
            typedSpeechVoiceOutput: data.typedSpeechVoiceOutput,
            crossTurnContext: data.crossTurnContext,
            crossSessionContext: data.crossSessionContext,
            callConnectTimeoutMs: data.callConnectTimeoutMs,
            searchAnswerAudit: data.searchAnswerAudit,
          }));
          NODE
            ok="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision==='cloudflare-live-v18.3' && d.normalConversationLiveOnly===true && d.casualFastPath===true && d.searchPrecisionOnly===true && d.typedSpeechVoiceOutput===true && d.crossTurnContext===false && d.crossSessionContext===false && d.callConnectTimeoutMs===10000))")"
            if [ "$ok" = "true" ]; then exit 0; fi
            sleep 3
          done
          exit 1
