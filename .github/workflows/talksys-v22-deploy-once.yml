name: TalkSys v22 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v22-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 1b07a49046022f8ee0353da5d45cd91a79d28172
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v22-grounding-by-default
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TalkSys before deploy
        run: |
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy TalkSys v22 to Cloudflare production
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/talksys-deploy.txt
          npx wrangler deployments status

      - name: Verify production voice and grounding contract
        shell: bash
        run: |
          body=""
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")" || true
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            echo "Production voiceRevision: ${current:-missing}"
            if [ "$current" = "$EXPECTED_VOICE_REVISION" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Production did not reach expected v22 revision"
              exit 1
            fi
            sleep 5
          done

          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log(JSON.stringify({
            voiceRevision: d.voiceRevision,
            groundingByDefault: d.groundingByDefault,
            factualQuestionsSearchByDefault: d.factualQuestionsSearchByDefault,
            mobileAudioContextPrimedOnUserGesture: d.mobileAudioContextPrimedOnUserGesture,
            hiddenModelFailureRetry: d.hiddenModelFailureRetry,
            userFacingMidStreamRetryMessageRemoved: d.userFacingMidStreamRetryMessageRemoved,
            proactiveCallGreeting: d.proactiveCallGreeting
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          if (d.groundingByDefault !== true || d.factualQuestionsSearchByDefault !== true) throw new Error('grounding-by-default contract failed');
          if (d.mobileAudioContextPrimedOnUserGesture !== true) throw new Error('mobile microphone priming contract failed');
          if (d.hiddenModelFailureRetry !== true || d.userFacingMidStreamRetryMessageRemoved !== true) throw new Error('mid-stream recovery contract failed');
          if (d.proactiveCallGreeting !== true) throw new Error('proactive greeting contract failed');
          NODE
