name: TalkSys v23 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v23-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys-v23:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: a578a08076dfd38bcfa29e9b561e21b99b918da4
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v23-mobile-search-pc-quality
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare production credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate exact v23 revision before deploy
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          npm test
          npx wrangler deploy --dry-run

      - name: Deploy TalkSys v23 to Cloudflare production
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/talksys-v23-deploy.txt
          npx wrangler deployments status

      - name: Verify production v23 health contract
        shell: bash
        run: |
          body=""
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")" || true
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            echo "Production voiceRevision: ${current:-missing}"
            if [ "$current" = "$EXPECTED_VOICE_REVISION" ]; then break; fi
            if [ "$attempt" -eq 15 ]; then
              echo "Production did not reach expected v23 revision"
              exit 1
            fi
            sleep 5
          done

          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          const expected = process.env.EXPECTED;
          console.log('HEALTH=' + JSON.stringify({
            voiceRevision: d.voiceRevision,
            conversationOrchestrator: d.conversationOrchestrator,
            webSearchTool: d.webSearchTool,
            groundingByDefault: d.groundingByDefault,
            parallelIntentSearch: d.parallelIntentSearch,
            audibleSearchWaitSpeech: d.audibleSearchWaitSpeech,
            searchWaitFollowupSpeech: d.searchWaitFollowupSpeech,
            searchMetaSpeechForbidden: d.searchMetaSpeechForbidden,
            pcExpertAnswerMode: d.pcExpertAnswerMode,
            pcExpertGroundedDetail: d.pcExpertGroundedDetail,
            groundedContinuationRetry: d.groundedContinuationRetry,
            microphoneConstraintFallback: d.microphoneConstraintFallback,
            microphoneFrameWatchdog: d.microphoneFrameWatchdog,
            microphoneAutoRecovery: d.microphoneAutoRecovery,
            workletToScriptProcessorAutoFallback: d.workletToScriptProcessorAutoFallback,
            duplicateSearchTraceFixed: d.duplicateSearchTraceFixed,
            duplicateBrowserTtsGuard: d.duplicateBrowserTtsGuard,
            serverTtsOwnershipGuard: d.serverTtsOwnershipGuard,
            browserAnswerFallbackOnlyWhenServerTtsNotExpected: d.browserAnswerFallbackOnlyWhenServerTtsNotExpected,
            mobileAudioContextPrimedOnUserGesture: d.mobileAudioContextPrimedOnUserGesture,
            hiddenModelFailureRetry: d.hiddenModelFailureRetry,
            userFacingMidStreamRetryMessageRemoved: d.userFacingMidStreamRetryMessageRemoved,
          }));
          if (d.voiceRevision !== expected) throw new Error(`expected ${expected}, got ${d.voiceRevision}`);
          const required = [
            'groundingByDefault','parallelIntentSearch','audibleSearchWaitSpeech','searchWaitFollowupSpeech',
            'searchMetaSpeechForbidden','pcExpertAnswerMode','pcExpertGroundedDetail','groundedContinuationRetry',
            'microphoneConstraintFallback','microphoneFrameWatchdog','microphoneAutoRecovery','workletToScriptProcessorAutoFallback',
            'duplicateSearchTraceFixed','duplicateBrowserTtsGuard','serverTtsOwnershipGuard',
            'browserAnswerFallbackOnlyWhenServerTtsNotExpected','mobileAudioContextPrimedOnUserGesture',
            'hiddenModelFailureRetry','userFacingMidStreamRetryMessageRemoved'
          ];
          for (const key of required) if (d[key] !== true) throw new Error(`${key} is not true`);
          NODE

      - name: Verify live client contains mic and duplicate-audio fixes
        shell: bash
        run: |
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "serverTtsExpectedThisTurn" <<< "$script"
          grep -F "speakJapaneseFallback(phrase, 'search-wait')" <<< "$script"
          grep -F "scheduleMicRecovery('track-ended')" <<< "$script"
          grep -F "scheduleMicRecovery('capture-stalled')" <<< "$script"
          grep -F "micCaptureKind === 'audio-worklet'" <<< "$script"

      - name: Smoke test exact spoken transit query and PC search quality
        shell: bash
        run: |
          transit="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v23-transit")"
          pc="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v23-pc")"
          echo "TRANSIT=$transit"
          echo "PC=$pc"
          TRANSIT="$transit" PC="$pc" node <<'NODE'
          const transit = JSON.parse(process.env.TRANSIT || '{}');
          const pc = JSON.parse(process.env.PC || '{}');
          if (!transit.ok || !Array.isArray(transit.sources) || transit.sources.length < 2) throw new Error('transit smoke has insufficient evidence');
          if (!pc.ok || !Array.isArray(pc.sources) || pc.sources.length < 2) throw new Error('PC smoke has insufficient evidence');
          if (transit.resolvedQuestion !== '鷺沼から用賀までの行き方を知りたい') throw new Error('transit smoke is not using the exact spoken phrasing');
          const tq = (transit.queries || []).join(' ');
          if (!/鷺沼/.test(tq) || !/用賀/.test(tq) || !/所要時間|運賃/.test(tq)) throw new Error('transit queries are not intent-expanded');
          for (const source of transit.sources) {
            const s = JSON.stringify(source);
            if (!/鷺沼/.test(s) || !/用賀/.test(s)) throw new Error(`off-topic transit source survived: ${source.title}`);
            if (/wikipedia/i.test(s)) throw new Error(`encyclopedia transit source survived: ${source.title}`);
          }
          const pq = (pc.queries || []).join(' ');
          if (!/CF-SV8/i.test(pq) || !/仕様|マニュアル|公式/.test(pq)) throw new Error('PC queries are not specification-oriented');
          for (const source of pc.sources) {
            const s = JSON.stringify(source).replace(/[\s\-‐‑‒–—―ー_]/g, '').toLowerCase();
            if (!s.includes('cfsv8')) throw new Error(`off-topic PC source survived: ${source.title}`);
            if (/gmail|apple community/i.test(JSON.stringify(source))) throw new Error(`irrelevant PC source survived: ${source.title}`);
          }
          NODE
