name: TalkSys v26 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v26-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys-v26:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 67264ffb5276e7456592bb934ea235b228613f76
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v26-grok-tts-android-realtime
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Validate exact v26 revision before deploy
        run: |
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v26-production.js
          node --check src/worker-v26.js
          node --check src/cloudflare-live-client-v26.js
          node --check src/grok-japanese-tts-v26.js
          node --check src/glm-conversation-v25.js
          node --check src/search-v26.js
          npm test
          npx wrangler deploy --dry-run
      - name: Probe Grok Japanese TTS through an ephemeral Worker AI binding
        run: |
          set -euo pipefail
          PROBE_DIR="$(mktemp -d)"
          PROBE_WORKER="talksys-grok-probe-${GITHUB_RUN_ID}"
          PROBE_TOKEN="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")"
          export PROBE_DIR PROBE_WORKER PROBE_TOKEN
          cleanup() {
            npx wrangler delete --config "$PROBE_DIR/wrangler.jsonc" --force >/tmp/grok-probe-delete.log 2>&1 || true
            rm -rf "$PROBE_DIR"
          }
          trap cleanup EXIT
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.PROBE_DIR;
          fs.writeFileSync(path.join(dir, 'wrangler.jsonc'), JSON.stringify({
            name: process.env.PROBE_WORKER,
            main: './worker.mjs',
            compatibility_date: '2026-08-30',
            workers_dev: true,
            ai: { binding: 'AI' },
            vars: { PROBE_TOKEN: process.env.PROBE_TOKEN },
          }, null, 2));
          fs.writeFileSync(path.join(dir, 'worker.mjs'), `
          function b64bytes(value) {
            const raw = String(value || '').replace(/^data:audio\\/[^;]+;base64,/i, '');
            if (!raw) return 0;
            try { return Uint8Array.from(atob(raw), c => c.charCodeAt(0)).byteLength; } catch { return 0; }
          }
          export default {
            async fetch(request, env) {
              if (request.headers.get('authorization') !== 'Bearer ' + env.PROBE_TOKEN) return new Response('not found', { status: 404 });
              try {
                const result = await env.AI.run('xai/grok-tts', {
                  text: 'TalkSysの日本語音声テストです。',
                  language: 'ja',
                  voice_id: 'ara',
                  text_normalization: true,
                  output_format: { codec: 'mp3', sample_rate: 24000, bit_rate: 64000 },
                });
                const root = result?.result ?? result;
                const audio = root?.audio ?? root?.result?.audio ?? root?.response?.audio ?? root?.output?.audio ?? root?.data?.audio;
                let bytes = 0;
                let kind = '';
                if (typeof audio === 'string' && /^https:\\/\\//i.test(audio)) {
                  kind = 'url';
                  const audioResponse = await fetch(audio);
                  if (!audioResponse.ok) throw new Error('generated audio URL returned ' + audioResponse.status);
                  bytes = (await audioResponse.arrayBuffer()).byteLength;
                } else if (typeof audio === 'string') {
                  kind = 'base64';
                  bytes = b64bytes(audio);
                }
                const ok = bytes > 500;
                return Response.json({ ok, bytes, kind, state: result?.state || root?.state || '', keySource: result?.gatewayMetadata?.keySource || root?.gatewayMetadata?.keySource || '' }, { status: ok ? 200 : 502 });
              } catch (error) {
                return Response.json({ ok: false, error: String(error?.message || error).slice(0, 300) }, { status: 500 });
              }
            },
          };
          `);
          NODE
          npx wrangler deploy --config "$PROBE_DIR/wrangler.jsonc" 2>&1 | tee /tmp/grok-probe-deploy.log
          PROBE_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/grok-probe-deploy.log | tail -1)"
          test -n "$PROBE_URL"
          body=""
          http_code=""
          for attempt in $(seq 1 12); do
            http_code="$(curl -sS --max-time 30 -o /tmp/grok-probe-response.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL" || true)"
            body="$(cat /tmp/grok-probe-response.json 2>/dev/null || true)"
            echo "Grok probe attempt $attempt: HTTP ${http_code:-none}"
            if [ "$http_code" = "200" ]; then break; fi
            if [ "$http_code" != "404" ] && [ -n "$body" ]; then echo "$body"; break; fi
            test "$attempt" -lt 12 || true
            sleep 2
          done
          test "$http_code" = "200"
          echo "$body"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error(`Grok TTS binding probe failed: ${d.error || 'no playable audio'}`);
          if (!(Number(d.bytes) > 500)) throw new Error(`Grok TTS audio too small: ${d.bytes}`);
          console.log(`Grok TTS runtime probe passed: ${d.bytes} audio bytes via ${d.kind || 'unknown'}; keySource=${d.keySource || 'unknown'}`);
          NODE
      - name: Deploy TalkSys v26 to Cloudflare production
        run: |
          npx wrangler deploy
          npx wrangler deployments status
      - name: Verify production v26 health and Android client
        run: |
          body=""
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            if [ "$current" = "$EXPECTED_VOICE_REVISION" ]; then break; fi
            sleep 3
          done
          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== process.env.EXPECTED) throw new Error('wrong v26 revision');
          if (d.conversationModel !== '@cf/zai-org/glm-5.3-flash') throw new Error('wrong GLM model');
          if (d.ttsPrimary !== 'xai/grok-tts') throw new Error('Grok TTS is not primary');
          if (d.ttsFallback !== '@cf/myshell-ai/melotts') throw new Error('Melo fallback missing');
          for (const key of ['glmVisibleFirstTokenDeadline','glmReasoningOnlyStreamEscape','inFlightUserContext','directTransitEvidenceFallback','mobileAudioPipelineV26','androidAudioWorkletPreferred','androidScriptProcessorFallback','androidPcmFrameProbeBeforeCall','androidCaptureBackendFailover','androidLifecycleResume','mobileWebSocketHardRecovery']) if (d[key] !== true) throw new Error(`${key} is not true`);
          NODE
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "verifyAndroidCapturePipeline" <<< "$script"
          grep -F "talksys-mic-no-frames" <<< "$script"
          grep -F "resumeMobileRuntime" <<< "$script"
          grep -F "socket?.close()" <<< "$script"
      - name: Verify production context regressions
        run: |
          transit="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v26-transit-followup")"
          echo "$transit"
          BODY="$transit" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error(`transit follow-up failed: ${d.directTransitError || 'no evidence'}`);
          const q = String(d.resolvedQuestion || '');
          if (!/鷺沼/.test(q) || !/相模大野/.test(q) || !/どうですか/.test(q)) throw new Error(`in-flight context lost: ${q}`);
          if (!(d.sources || []).some(s => /鷺沼/.test(JSON.stringify(s)) && /相模大野/.test(JSON.stringify(s)))) throw new Error('route evidence lacks endpoints');
          NODE
          shopping="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v26-context")"
          BODY="$shopping" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('shopping context smoke failed');
          const q = String(d.resolvedQuestion || '');
          if (!/パソコン/.test(q) || !/中古/.test(q) || !/横浜/.test(q) || /YouTube|ネットサーフィン/i.test(q)) throw new Error(`bad shopping context: ${q}`);
          NODE
