name: TalkSys v26 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v26-deploy-once.yml

# One-shot production deployment for TalkSys v26.
permissions:
  contents: read

jobs:
  deploy-talksys-v26:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: ff1d93813636e378536b8219e3a55b04de5dcbce
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v26-grok-tts-android-realtime
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Validate exact v26 revision before deploy
        run: |
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v26-production.js
          node --check src/worker-v26.js
          node --check src/cloudflare-live-client-v26.js
          node --check src/grok-japanese-tts-v26.js
          node --check src/glm-conversation-v25.js
          npm test
          npx wrangler deploy --dry-run
      - name: Deploy TalkSys v26 to Cloudflare production
        run: |
          set -o pipefail
          npx wrangler deploy
          npx wrangler deployments status
      - name: Verify production v26 health contract
        run: |
          body=""
          for attempt in $(seq 1 15); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")" || true
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            echo "Production voiceRevision: ${current:-missing}"
            if [ "$current" = "$EXPECTED_VOICE_REVISION" ]; then break; fi
            test "$attempt" -lt 15 || exit 1
            sleep 5
          done
          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== process.env.EXPECTED) throw new Error('wrong v26 revision');
          if (d.conversationModel !== '@cf/zai-org/glm-5.3-flash') throw new Error('wrong GLM model');
          if (d.ttsPrimary !== 'xai/grok-tts') throw new Error('Grok TTS is not primary');
          if (d.ttsFallback !== '@cf/myshell-ai/melotts') throw new Error('Melo fallback missing');
          for (const key of [
            'glmOnlyConversation','glmVisibleFirstTokenDeadline','glmReasoningOnlyStreamEscape','inFlightUserContext',
            'mobileAudioPipelineV26','androidAudioWorkletPreferred','androidScriptProcessorFallback',
            'androidPcmFrameProbeBeforeCall','androidCaptureBackendFailover','androidLifecycleResume','mobileWebSocketHardRecovery'
          ]) if (d[key] !== true) throw new Error(`${key} is not true`);
          NODE
      - name: Verify live v26 Android client code
        run: |
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "verifyAndroidCapturePipeline" <<< "$script"
          grep -F "talksys-mic-no-frames" <<< "$script"
          grep -F "visibilitychange" <<< "$script"
          grep -F "pageshow" <<< "$script"
          grep -F "resumeMobileRuntime" <<< "$script"
          grep -F "socket?.close()" <<< "$script"
          grep -F "callStartPending" <<< "$script"
          grep -F "talksys-barge-in" <<< "$script"
      - name: Verify in-flight transit follow-up regression
        run: |
          body="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v26-transit-followup")"
          echo "$body"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('transit follow-up smoke returned no evidence');
          const q = String(d.resolvedQuestion || '');
          if (!/鷺沼/.test(q) || !/相模大野/.test(q) || !/どうですか/.test(q)) throw new Error(`in-flight context lost: ${q}`);
          const queries = (d.queries || []).join(' ');
          if (/^どうですか(?:\s+公式)?$/m.test(queries)) throw new Error(`generic どうですか search survived: ${queries}`);
          NODE
      - name: Verify existing contextual shopping regression
        run: |
          body="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v26-context")"
          echo "$body"
          BODY="$body" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('context smoke returned no evidence');
          const q = String(d.resolvedQuestion || '');
          if (!/パソコン/.test(q) || !/中古/.test(q) || !/横浜/.test(q)) throw new Error(`context not preserved: ${q}`);
          if (/YouTube|ネットサーフィン/i.test(q)) throw new Error(`old usage polluted current search: ${q}`);
          NODE
