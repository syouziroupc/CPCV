name: TalkSys v27 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v27-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys-v27:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 61ed3d95c2c0b7fd62a233f6ab31af0049b63d36
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v27-grok-conversation-android-realtime
    steps:
      - name: Checkout exact TalkSys revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Require Cloudflare production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - run: npm install --no-audit --no-fund

      - name: Validate exact v27 revision before deploy
        run: |
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v27-production.js
          node --check src/worker-v27.js
          node --check src/grok-conversation-v27.js
          node --check src/cloudflare-live-client-v26.js
          node --check src/search-v26.js
          npm test
          npx wrangler deploy --dry-run

      - name: Probe Grok conversation runtime without blocking resilient deployment
        run: |
          set -euo pipefail
          PROBE_DIR="$(mktemp -d)"
          PROBE_WORKER="talksys-grok-text-probe-${GITHUB_RUN_ID}"
          PROBE_TOKEN="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")"
          export PROBE_DIR PROBE_WORKER PROBE_TOKEN
          cleanup() {
            npx wrangler delete --config "$PROBE_DIR/wrangler.jsonc" --force >/tmp/grok-text-probe-delete.log 2>&1 || true
            rm -rf "$PROBE_DIR"
          }
          trap cleanup EXIT
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.PROBE_DIR;
          fs.writeFileSync(path.join(dir, 'wrangler.jsonc'), JSON.stringify({
            name: process.env.PROBE_WORKER,
            main: './worker.mjs',
            compatibility_date: '2026-08-30',
            workers_dev: true,
            ai: { binding: 'AI' },
            vars: { PROBE_TOKEN: process.env.PROBE_TOKEN },
          }, null, 2));
          fs.writeFileSync(path.join(dir, 'worker.mjs'), `
          export default {
            async fetch(request, env) {
              if (request.headers.get('authorization') !== 'Bearer ' + env.PROBE_TOKEN) return new Response('not found', { status: 404 });
              try {
                const result = await env.AI.run('xai/grok-4.20-0309-non-reasoning', {
                  messages: [
                    { role: 'system', content: '日本語で一文だけ返す。' },
                    { role: 'user', content: 'TalkSysの接続テストです。「接続成功」とだけ返してください。' },
                  ],
                  max_completion_tokens: 24,
                  temperature: 0,
                });
                const root = result?.result ?? result;
                const text = String(root?.choices?.[0]?.message?.content || root?.response || root?.text || '').trim();
                return Response.json({ ok: Boolean(text), text: text.slice(0, 80), keySource: result?.gatewayMetadata?.keySource || root?.gatewayMetadata?.keySource || '' }, { status: text ? 200 : 502 });
              } catch (error) {
                return Response.json({ ok: false, error: String(error?.message || error).slice(0, 300) }, { status: 503 });
              }
            },
          };
          `);
          NODE
          npx wrangler deploy --config "$PROBE_DIR/wrangler.jsonc" 2>&1 | tee /tmp/grok-text-probe-deploy.log
          PROBE_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/grok-text-probe-deploy.log | tail -1)"
          test -n "$PROBE_URL"
          body=""
          code=""
          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 30 -o /tmp/grok-text-probe-response.json -w '%{http_code}' -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL" || true)"
            body="$(cat /tmp/grok-text-probe-response.json 2>/dev/null || true)"
            echo "Grok text probe attempt $attempt: HTTP ${code:-none}"
            if [ "$code" = "200" ] || { [ "$code" != "404" ] && [ -n "$body" ]; }; then break; fi
            sleep 2
          done
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::warning::Grok primary runtime is currently unavailable; TalkSys v27 will use its bounded GLM/Qwen fallbacks and automatically reprobe Grok from fresh isolates."
          fi

      - name: Deploy TalkSys v27 to Cloudflare production
        run: |
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          npx wrangler deploy
          npx wrangler deployments status

      - name: Verify production v27 health and Android client
        run: |
          body=""
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            if [ "$current" = "$EXPECTED_VOICE_REVISION" ]; then break; fi
            sleep 4
          done
          BODY="$body" EXPECTED="$EXPECTED_VOICE_REVISION" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (d.voiceRevision !== process.env.EXPECTED) throw new Error(`wrong v27 revision: ${d.voiceRevision}`);
          if (d.conversationModel !== 'xai/grok-4.20-0309-non-reasoning') throw new Error('Grok is not primary');
          if (d.conversationModelFallback !== '@cf/zai-org/glm-5.3-flash') throw new Error('GLM fallback missing');
          if (d.conversationEmergencyFallback !== '@cf/qwen/qwen3.8-27b') throw new Error('Qwen emergency fallback missing');
          if (d.ttsPrimary !== '@cf/myshell-ai/melotts') throw new Error('MeloTTS primary missing');
          for (const key of ['grokConversationPrimary','grokNonReasoningRealtime','grokStreaming','inFlightUserContext','directTransitEvidenceFallback','mobileAudioPipelineV26','androidAudioWorkletPreferred','androidScriptProcessorFallback','androidPcmFrameProbeBeforeCall','androidCaptureBackendFailover','androidLifecycleResume','mobileWebSocketHardRecovery','microphoneDiagnostics','contextualSearchSubjectOnlyCarryover']) if (d[key] !== true) throw new Error(`${key} is not true`);
          console.log(JSON.stringify(d));
          NODE
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "verifyAndroidCapturePipeline" <<< "$script"
          grep -F "talksys-mic-no-frames" <<< "$script"
          grep -F "resumeMobileRuntime" <<< "$script"
          grep -F "socket?.close()" <<< "$script"
          grep -F "callStartPending" <<< "$script"
          grep -F "talksys-barge-in" <<< "$script"

      - name: Verify production context regressions
        run: |
          transit="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v27-transit-followup")"
          echo "$transit"
          BODY="$transit" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error(`transit follow-up failed: ${d.directTransitError || 'no evidence'}`);
          const q = String(d.resolvedQuestion || '');
          if (!/鷺沼/.test(q) || !/相模大野/.test(q) || !/どうですか/.test(q)) throw new Error(`in-flight context lost: ${q}`);
          if (!(d.sources || []).some(s => /鷺沼/.test(JSON.stringify(s)) && /相模大野/.test(JSON.stringify(s)))) throw new Error('route evidence lacks endpoints');
          NODE
          shopping="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v27-context")"
          BODY="$shopping" node <<'NODE'
          const d = JSON.parse(process.env.BODY || '{}');
          if (!d.ok) throw new Error('shopping context smoke failed');
          const q = String(d.resolvedQuestion || '');
          if (!/パソコン/.test(q) || !/中古/.test(q) || !/横浜/.test(q) || /YouTube|ネットサーフィン/i.test(q)) throw new Error(`bad shopping context: ${q}`);
          NODE
