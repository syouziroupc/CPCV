name: TalkSys v28 final smoke once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v28-deploy-once.yml

permissions:
  contents: read

jobs:
  final-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
    steps:
      - name: Verify production and all smoke routes
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health")"
          HEALTH="$health" node -e "const d=JSON.parse(process.env.HEALTH||'{}'); if(d.voiceRevision!=='cloudflare-agent-v28-simple-qwen-android'||d.conversationModel!=='@cf/qwen/qwen3.8-27b'||d.multiModelFallback!==false) throw new Error('health mismatch')"

          transit="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v28-transit-followup")"
          TRANSIT="$transit" node -e "const d=JSON.parse(process.env.TRANSIT||'{}');const q=String(d.resolvedQuestion||'');if(!d.ok||!/鷺沼/.test(q)||!/相模大野/.test(q))throw new Error('transit smoke failed: '+q)"

          shopping="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v28-context")"
          SHOPPING="$shopping" node -e "const d=JSON.parse(process.env.SHOPPING||'{}');const q=String(d.resolvedQuestion||'');if(!d.ok||!/パソコン/.test(q)||!/中古/.test(q)||!/横浜/.test(q)||/YouTube|ネットサーフィン/i.test(q))throw new Error('shopping smoke failed: '+q)"

          pc="$(curl -fsS --max-time 35 "$PRODUCTION_URL/api/search-smoke-v28-pc")"
          PC="$pc" node <<'NODE'
          const d=JSON.parse(process.env.PC||'{}');
          console.log(JSON.stringify({ok:d.ok,revision:d.revision,resolvedQuestion:d.resolvedQuestion,queries:d.queries,evidenceCount:d.evidenceCount,elapsedMs:d.elapsedMs,sources:(d.sources||[]).slice(0,4)}));
          const q=String(d.resolvedQuestion||'');
          if(!/CF-SV8/i.test(q)) throw new Error('PC subject lost: '+q);
          if(!Array.isArray(d.queries)||d.queries.length<1) throw new Error('PC search planner returned no queries');
          NODE

          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          for marker in verifyAndroidCapturePipeline talksys-mic-no-frames resumeMobileRuntime callStartPending talksys-barge-in; do grep -F "$marker" <<< "$script" >/dev/null; done
          echo FINAL_V28_SMOKE_OK
