name: TalkSys v29 final verify once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v29-deploy-once.yml

permissions:
  contents: read

jobs:
  verify-talksys-v29:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_VOICE_REVISION: cloudflare-agent-v29-grok-tts-phone
    steps:
      - name: Verify production Grok contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 5 --retry-delay 2 --max-time 20 "$PRODUCTION_URL/voice-health")"
          BODY="$body" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if(d.voiceRevision!=='cloudflare-agent-v29-grok-tts-phone') throw new Error('revision mismatch');
          if(d.architecture!=='grok-centered-browser-and-pstn') throw new Error('architecture mismatch');
          if(d.conversationModel!=='xai/grok-4.20-0309-non-reasoning'||d.searchAnswerModel!=='xai/grok-4.20-0309-non-reasoning') throw new Error('Grok conversation mismatch');
          if(d.conversationModelFallback!==null||d.conversationEmergencyFallback!==null||d.multiModelFallback!==false) throw new Error('cross-model fallback active');
          for(const k of ['qwenActive','glmActive','deepSeekActive','gptOssActive']) if(d[k]!==false) throw new Error(k+' active');
          if(d.ttsPrimary!=='xai/grok-tts'||d.ttsFallback!==null) throw new Error('Grok TTS mismatch');
          if(d.phoneEnabled!==true||d.phoneStt!=='xai/grok-stt'||d.phoneInputCodec!=='mulaw'||d.phoneOutputCodec!=='mulaw'||d.phoneSampleRate!==8000||d.phoneBargeInClear!==true) throw new Error('phone contract mismatch');
          console.log(JSON.stringify({revision:d.voiceRevision,model:d.conversationModel,tts:d.ttsPrimary,phoneStt:d.phoneStt,phoneNumberConfiguredByTalkSys:d.phoneNumberConfiguredByTalkSys}));
          NODE

      - name: Verify phone routes Android and context
        shell: bash
        run: |
          set -euo pipefail
          fetch_ok() {
            local path="$1" body="" code="" tmp=""
            for attempt in $(seq 1 20); do
              tmp="$(mktemp)"
              code="$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 35 "$PRODUCTION_URL$path" || true)"
              body="$(cat "$tmp")"
              rm -f "$tmp"
              if [ "$code" = 200 ]; then printf '%s' "$body"; return 0; fi
              echo "attempt=$attempt path=$path status=$code" >&2
              sleep 3
            done
            echo "endpoint failed: $path status=$code body=${body:0:300}" >&2
            return 1
          }

          phone="$(fetch_ok /phone/health)"
          PHONE="$phone" node <<'NODE'
          const d=JSON.parse(process.env.PHONE||'{}');
          if(!d.ok||d.transport!=='twilio-bidirectional-media-stream'||d.sttModel!=='xai/grok-stt'||d.ttsModel!=='xai/grok-tts'||d.inputCodec!=='audio/x-mulaw'||d.sampleRate!==8000||d.bargeInClear!==true) throw new Error('phone health mismatch');
          console.log(JSON.stringify(d));
          NODE

          twiml="$(fetch_ok /phone/incoming)"
          grep -F '<Connect><Stream url="wss://talksys.syouziroupc.workers.dev/phone/media">' <<< "$twiml" >/dev/null
          code="$(curl -sS -o /tmp/phone-media.txt -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/phone/media")"
          test "$code" = 426

          script="$(fetch_ok /cloudflare-live.js)"
          for marker in verifyAndroidCapturePipeline talksys-mic-no-frames resumeMobileRuntime callStartPending talksys-barge-in; do grep -F "$marker" <<< "$script" >/dev/null; done

          transit="$(fetch_ok /api/search-smoke-v29-transit-followup)"
          TRANSIT="$transit" node -e "const d=JSON.parse(process.env.TRANSIT||'{}');const q=String(d.resolvedQuestion||'');if(!/鷺沼/.test(q)||!/相模大野/.test(q))throw new Error('transit context failed: '+q)"

          shopping="$(fetch_ok /api/search-smoke-v29-context)"
          SHOPPING="$shopping" node -e "const d=JSON.parse(process.env.SHOPPING||'{}');const q=String(d.resolvedQuestion||'');if(!/パソコン/.test(q)||!/中古/.test(q)||!/横浜/.test(q)||/YouTube|ネットサーフィン/i.test(q))throw new Error('shopping context failed: '+q)"

          pc="$(fetch_ok /api/search-smoke-v29-pc)"
          PC="$pc" node <<'NODE'
          const d=JSON.parse(process.env.PC||'{}');
          const q=String(d.resolvedQuestion||'');
          if(!/CF-SV8/i.test(q)) throw new Error('PC subject lost: '+q);
          if(!Array.isArray(d.queries)||d.queries.length<1) throw new Error('PC queries missing');
          console.log(JSON.stringify({ok:d.ok,resolvedQuestion:q,queries:d.queries,evidenceCount:d.evidenceCount}));
          NODE
          echo GROK_V29_FINAL_VERIFY_OK
