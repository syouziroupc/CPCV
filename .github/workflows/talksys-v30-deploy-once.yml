name: TalkSys v31 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v30-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy-talksys-v31:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: a6b7c95ab67013a9bffc4563d953b553c96550d8
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_REVISION: cloudflare-agent-v31-glm-melo-reliable
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: a6b7c95ab67013a9bffc4563d953b553c96550d8
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate exact v31 source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/glm-conversation-v31.js
          node --check src/cloudflare-live-client-v31.js
          node --check src/worker-v31.js
          node --check src/worker-v31-production.js
          npm test
          npx wrangler deploy --dry-run
      - name: Deploy exact v31 SHA
        run: |
          set -euo pipefail
          npx wrangler deploy
          npx wrangler deployments status
      - name: Verify v31 health and Workers AI bindings
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            [ "$current" = "$EXPECTED_REVISION" ] && break
            [ "$attempt" -eq 20 ] && { echo "v31 revision not live: $body"; exit 1; }
            sleep 3
          done
          BODY="$body" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if(d.voiceRevision!=='cloudflare-agent-v31-glm-melo-reliable') throw new Error('revision mismatch');
          if(d.conversationModel!=='@cf/zai-org/glm-5.3-flash'||d.glmOnlyConversation!==true) throw new Error('GLM mismatch');
          if(d.ttsPrimary!=='@cf/myshell-ai/melotts'||d.ttsFallback!==null) throw new Error('Melo mismatch');
          if(d.browserSpeechSynthesisEnabled!==false||d.typedSpeechUsesMeloTts!==true||d.thirdPartyModelCreditsRequired!==false) throw new Error('audio contract mismatch');
          NODE
          code="$(curl -sS -o /tmp/probe.json -w '%{http_code}' --max-time 45 "$PRODUCTION_URL/api/glm-binding-probe-v31")"
          echo "BINDING_PROBE_HTTP=$code"
          cat /tmp/probe.json; echo
          test "$code" = 200
          PROBE="$(cat /tmp/probe.json)" node -e "const d=JSON.parse(process.env.PROBE);if(!d.ok||!d.conversation?.ok||!d.tts?.ok||!(d.tts.bytes>100))throw new Error(JSON.stringify(d));console.log('GLM='+d.conversation.answer,'MELO_BYTES='+d.tts.bytes,'ELAPSED='+d.elapsedMs)"
      - name: Verify typed reply and explicit Melo audio path
        run: |
          set -euo pipefail
          node <<'NODE'
          const base='https://talksys.syouziroupc.workers.dev';
          const ws=new WebSocket('wss://talksys.syouziroupc.workers.dev/agents/talk-sys-voice-agent/default');
          let answer='', model='';
          await new Promise((resolve,reject)=>{
            const timer=setTimeout(()=>reject(new Error(`typed answer timeout answer=${answer}`)),20000);
            ws.onopen=()=>ws.send(JSON.stringify({type:'hello',protocol_version:1}));
            ws.onerror=()=>reject(new Error('websocket error'));
            ws.onmessage=e=>{
              if(typeof e.data!=='string') return;
              let d;try{d=JSON.parse(e.data)}catch{return}
              console.log('EVENT',d.type,d.status||d.role||'',String(d.text||'').slice(0,160));
              if(d.type==='welcome') ws.send(JSON.stringify({type:'text_message',text:'こんにちは。動作確認です。短く自然に返事してください。'}));
              if(d.type==='model_route') model=String(d.model||'');
              if((d.type==='transcript_end'||(d.type==='transcript'&&d.role==='assistant'))&&d.text){answer=String(d.text);clearTimeout(timer);resolve();}
            };
          });
          ws.close();
          if(!answer||/回答生成が一時的に失敗|現在この回答を生成できません/.test(answer)) throw new Error('GLM answer failed: '+answer);
          if(model&&model!=='@cf/zai-org/glm-5.3-flash') throw new Error('unexpected model '+model);
          const r=await fetch(base+'/api/melo-tts-v31',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:answer})});
          const bytes=await r.arrayBuffer();
          console.log('ANSWER',answer,'MELO_PROVIDER',r.headers.get('x-talksys-tts-provider'),'MELO_BYTES',bytes.byteLength);
          if(!r.ok||r.headers.get('x-talksys-tts-provider')!=='@cf/myshell-ai/melotts'||bytes.byteLength<500) throw new Error('Melo TTS failed');
          NODE
      - name: Verify live client and context
        run: |
          set -euo pipefail
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/cloudflare-live.js")"
          grep -F "browserSpeechSynthesisEnabled: false" <<< "$script" >/dev/null
          grep -F "requestTypedMeloTts" <<< "$script" >/dev/null
          grep -F "talksys-melo-audio" <<< "$script" >/dev/null
          grep -F "verifyAndroidCapturePipeline" <<< "$script" >/dev/null
          grep -F "resumeMobileRuntime" <<< "$script" >/dev/null
          ! grep -F "queueCompletedStreamSpeech(streamText, false)" <<< "$script" >/dev/null
          ! grep -F "queueCompletedStreamSpeech(value, true)" <<< "$script" >/dev/null
          transit="$(curl -fsS --max-time 50 "$PRODUCTION_URL/api/search-smoke-v31-transit-followup")"
          echo "$transit"
          TRANSIT="$transit" node -e "const d=JSON.parse(process.env.TRANSIT||'{}');const q=String(d.resolvedQuestion||'');if(!/鷺沼/.test(q)||!/相模大野/.test(q))throw new Error(q)"
          context="$(curl -fsS --max-time 50 "$PRODUCTION_URL/api/search-smoke-v31-context")"
          echo "$context"
          CONTEXT="$context" node -e "const d=JSON.parse(process.env.CONTEXT||'{}');const q=String(d.resolvedQuestion||'');if(!/パソコン/.test(q)||!/中古/.test(q)||!/横浜/.test(q))throw new Error(q)"
          echo TALKSYS_V31_PRODUCTION_E2E_OK
