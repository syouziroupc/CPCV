name: TalkSys v32 production verify once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v31-diagnose-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_ORIGIN: https://talksys.syouziroupc.workers.dev
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify deployed v32 HTTP contract
        run: |
          set -euo pipefail
          curl -fsS "$PROD_ORIGIN/voice-health" -o /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const ok = d.voiceRevision === 'cloudflare-agent-v32-coherent-reliable-glm-melo'
            && d.conversationModel === '@cf/zai-org/glm-5.3-flash'
            && d.ttsPrimary === '@cf/myshell-ai/melotts'
            && d.microphoneArchitecture === 'unified-capture-state-machine-v32'
            && d.microphonePlatformBranches === false
            && d.microphoneStartRequiresRealPcm === true
            && d.microphoneFrameSamples === 640
            && d.microphoneFrameBytes === 1280
            && d.microphoneTransportAck === true;
          if (!ok) { console.error(d); process.exit(1); }
          console.log('TALKSYS_V32_HTTP_VERIFY_OK');
          NODE
          curl -fsS "$PROD_ORIGIN/cloudflare-live.js" -o /tmp/live.js
          grep -q "unified-capture-state-machine-v32" /tmp/live.js
          grep -q "talksys-capture-v32" /tmp/live.js
          grep -q "captureState !== 'verified' || frameCount < 1" /tmp/live.js
          if grep -Eq "IS_ANDROID|Xperia" /tmp/live.js; then exit 1; fi
      - name: Verify production PCM reaches STT ingress and text reply completes
        run: |
          set -euo pipefail
          mkdir -p /tmp/talksys-probe && cd /tmp/talksys-probe
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund ws@8 >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import WebSocket from 'ws';

          const ws = new WebSocket('wss://talksys.syouziroupc.workers.dev/agents/talk-sys-voice-agent/default');
          let closed = false;
          let listening = false;
          let pcmStarted = false;
          let micAck = null;
          let querySent = false;
          let queryReply = '';
          let assistantBuffer = '';
          let queryStartedAt = 0;
          let pcmTimer = null;
          const seen = [];

          const deadline = setTimeout(() => finish(false, 'timeout; events=' + seen.join(',')), 45000);

          function finish(ok, reason = '') {
            if (closed) return;
            closed = true;
            clearTimeout(deadline);
            clearInterval(pcmTimer);
            try { ws.send(JSON.stringify({ type: 'end_call' })); } catch {}
            try { ws.close(); } catch {}
            if (!ok) {
              console.error('VERIFY_FAILED=' + reason);
              console.error('MIC_ACK=' + JSON.stringify(micAck));
              console.error('QUERY_REPLY=' + queryReply.replace(/\s+/g, ' ').slice(0, 500));
              process.exitCode = 1;
              return;
            }
            console.log('MIC_ACK=' + JSON.stringify(micAck));
            console.log('TEXT_REPLY=' + queryReply.replace(/\s+/g, ' ').slice(0, 500));
            console.log('TALKSYS_V32_WS_PCM_VERIFY_OK');
          }

          function sendSyntheticPcm() {
            if (pcmStarted || !listening || closed) return;
            pcmStarted = true;
            let phase = 0;
            let sent = 0;
            pcmTimer = setInterval(() => {
              if (closed || micAck || sent >= 40) { clearInterval(pcmTimer); return; }
              const ab = new ArrayBuffer(1280);
              const view = new DataView(ab);
              for (let i = 0; i < 640; i++) {
                view.setInt16(i * 2, Math.round(Math.sin(phase) * 500), true);
                phase += 2 * Math.PI * 440 / 16000;
              }
              ws.send(Buffer.from(ab));
              sent += 1;
            }, 40);
          }

          function sendQuery() {
            if (querySent || !micAck || closed) return;
            querySent = true;
            queryStartedAt = Date.now();
            assistantBuffer = '';
            ws.send(JSON.stringify({ type: 'text_message', text: 'パソコンの買い替えについて相談したいです' }));
          }

          ws.on('open', () => ws.send(JSON.stringify({ type: 'hello', protocol_version: 1 })));
          ws.on('error', (error) => finish(false, 'socket error ' + String(error?.message || error)));
          ws.on('close', () => { if (!closed) finish(false, 'socket closed early'); });
          ws.on('message', (raw, isBinary) => {
            if (isBinary) return;
            let data;
            try { data = JSON.parse(raw.toString()); } catch { return; }
            seen.push(data.type + (data.status ? ':' + data.status : ''));
            if (seen.length > 80) seen.shift();

            if (data.type === 'welcome') {
              ws.send(JSON.stringify({ type: 'start_call', preferred_format: 'mp3' }));
              return;
            }
            if (data.type === 'status' && data.status === 'listening') {
              listening = true;
              sendSyntheticPcm();
              return;
            }
            if (data.type === 'mic_transport') {
              const valid = Number(data.frames) >= 1 && Number(data.bytes) >= 1280
                && data.sampleRate === 16000 && data.format === 's16le-mono';
              if (!valid) return finish(false, 'invalid mic_transport ' + JSON.stringify(data));
              micAck = data;
              sendQuery();
              return;
            }

            if (!querySent) return;
            if (data.type === 'transcript_start' && data.role === 'assistant') {
              assistantBuffer = '';
              return;
            }
            if (data.type === 'transcript_delta') {
              assistantBuffer += String(data.text || '');
              return;
            }
            if (data.type === 'transcript_end') {
              const value = String(data.text || assistantBuffer || '').trim();
              if (value && Date.now() >= queryStartedAt) {
                queryReply = value;
                return finish(true);
              }
            }
            if (data.type === 'transcript' && data.role === 'assistant') {
              const value = String(data.text || '').trim();
              if (value && Date.now() >= queryStartedAt) {
                queryReply = value;
                return finish(true);
              }
            }
          });
          NODE
