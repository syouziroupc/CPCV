name: TalkSys v32 validate once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v31-diagnose-once.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TALKSYS_SHA: 89571c24a29380fb3309276659e0c5d9008ef5e0
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 89571c24a29380fb3309276659e0c5d9008ef5e0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate v32 source and tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          npm install --no-audit --no-fund
          node --check src/glm-conversation-v32.js
          node --check src/search-trace-client-v32.js
          node --check src/cloudflare-live-client-v32.js
          node --check src/worker-v32.js
          node --check src/worker-v32-production.js
          npm test
          npx wrangler deploy --dry-run
          echo TALKSYS_V32_VALIDATION_OK
