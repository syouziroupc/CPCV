name: TalkSys v34 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v34-deploy-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-talksys-v34:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 8a04ac0cc06eea44a7ba9e74c893ea919be62bba
      PRODUCTION_URL: https://talksys.syouziroupc.workers.dev
      EXPECTED_REVISION: talksys-v34-grok-ja-natural
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Validate v34
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v34.js
          node --check src/talk-client-v34.js
          node --test tests/v34-natural-ja.test.mjs
          npx wrangler deploy --dry-run
      - name: Deploy v34
        run: |
          set -euo pipefail
          npx wrangler deploy
          npx wrangler deployments status
      - name: Verify health after propagation
        run: |
          set -euo pipefail
          body=""
          for attempt in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$PRODUCTION_URL/voice-health" || true)"
            current="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(String(d.voiceRevision||''))")"
            echo "health attempt $attempt revision=${current:-missing}"
            if [ "$current" = "$EXPECTED_REVISION" ]; then break; fi
            if [ "$attempt" -eq 20 ]; then echo "$body"; exit 1; fi
            sleep 3
          done
          echo "$body"
          BODY="$body" EXPECTED="$EXPECTED_REVISION" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if(d.voiceRevision!==process.env.EXPECTED) throw new Error('revision mismatch: '+d.voiceRevision);
          if(d.ttsModel!=='xai/grok-tts'||d.ttsLanguage!=='ja') throw new Error('Grok Japanese TTS mismatch');
          if(d.conversationModel!=='@cf/zai-org/glm-5.3-flash') throw new Error('GLM mismatch');
          if(d.legacyWebSocketVoice!==false||d.durableObjectVoice!==false) throw new Error('legacy voice active');
          NODE
      - name: Verify Japanese Grok TTS
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 60 -D /tmp/tts.headers -o /tmp/tts.audio -w '%{http_code}' -H 'content-type: application/json' --data '{"text":"日本語音声の動作確認です。Windows 10とWindows 11も自然に読めれば正常です。"}' "$PRODUCTION_URL/api/tts")"
          echo "TTS HTTP=$code bytes=$(wc -c </tmp/tts.audio)"
          cat /tmp/tts.headers
          if [ "$code" != "200" ]; then cat /tmp/tts.audio; exit 1; fi
          test "$(wc -c </tmp/tts.audio)" -gt 1000
          grep -qi '^x-talksys-tts-model: xai/grok-tts' /tmp/tts.headers
          grep -qi '^x-talksys-tts-lang: ja' /tmp/tts.headers
          file /tmp/tts.audio
      - name: Reproduce PC consultation routing
        run: |
          set -euo pipefail
          one="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"text":"パソコンの買い替えについて相談したいんだけども。","history":[]}' "$PRODUCTION_URL/api/turn")"
          echo "TURN1=$one"
          ONE="$one" node <<'NODE'
          const d=JSON.parse(process.env.ONE||'{}');
          if(!d.ok) throw new Error('turn1 failed');
          if(d.search!==false) throw new Error('turn1 should not search');
          if(/具体的な内容を/.test(d.answer||'')) throw new Error('generic clarification regressed');
          NODE
          two="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"text":"ネットサーフィンができて安いやつがいいな。あんまり複雑な作業しないから簡単なやつでいい。","history":[{"role":"user","content":"パソコンの買い替えについて相談したいんだけども。"},{"role":"assistant","content":"買い替えですね。用途を聞きながら必要十分なクラスに絞れます。"}]}' "$PRODUCTION_URL/api/turn")"
          echo "TURN2=$two"
          TWO="$two" node <<'NODE'
          const d=JSON.parse(process.env.TWO||'{}');
          if(!d.ok) throw new Error('turn2 failed');
          if(d.search!==false) throw new Error('turn2 should not search');
          if(/価格\.com|ランキングや価格比較/.test(d.answer||'')) throw new Error('search-result-style answer regressed');
          if(/具体的な内容を/.test(d.answer||'')) throw new Error('generic clarification regressed');
          NODE
      - name: Verify live client
        run: |
          set -euo pipefail
          script="$(curl -fsS --max-time 20 "$PRODUCTION_URL/talk-v34.js")"
          grep -F 'Grok TTS / ja' <<< "$script"
          grep -F '/api/transcribe' <<< "$script"
          grep -F '/api/turn' <<< "$script"
          grep -F '/api/tts' <<< "$script"
          if grep -F 'new WebSocket' <<< "$script"; then exit 1; fi
