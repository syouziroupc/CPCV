name: TalkSys v35 deploy once
on:
  push:
    branches: [master]
    paths: [.github/workflows/talksys-v35-deploy-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 529719ee41bdf2250485d33d79a0ca422eaecda9
      URL: https://talksys.syouziroupc.workers.dev
      EXPECTED: talksys-v35-system-ja-quality
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Validate v35
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v35.js
          node --check src/talk-client-v35.js
          node --test tests/v35-system-ja-quality.test.mjs
          npx wrangler deploy --dry-run
      - name: Deploy v35
        run: |
          set -euo pipefail
          npx wrangler deploy
          npx wrangler deployments status
      - name: Wait for v35 propagation and verify health
        run: |
          set -euo pipefail
          body=''
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            rev="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(d.voiceRevision||'')")"
            echo "attempt=$i revision=${rev:-missing}"
            [ "$rev" = "$EXPECTED" ] && break
            [ "$i" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"
          BODY="$body" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if(d.ttsModel!=='browser/speechSynthesis'||d.ttsLanguage!=='ja-JP'||d.serverTtsEnabled!==false) throw new Error('safe Japanese browser TTS contract mismatch');
          if(d.conversationModel!=='@cf/zai-org/glm-5.3-flash') throw new Error('GLM mismatch');
          NODE
      - name: Verify browser client does not call broken server TTS
        run: |
          set -euo pipefail
          script="$(curl -fsS --max-time 20 "$URL/talk-v35.js")"
          grep -F 'SpeechSynthesisUtterance' <<< "$script"
          grep -F '日本語TTS音声（ja-JP）が端末にありません' <<< "$script"
          grep -F '/api/transcribe' <<< "$script"
          grep -F '/api/turn' <<< "$script"
          if grep -F "fetch('/api/tts'" <<< "$script"; then echo 'broken server TTS call remains'; exit 1; fi
      - name: Reproduce reported PC consultation
        run: |
          set -euo pipefail
          one="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data '{"text":"パソコンの買い替えについて相談したいんだけども。","history":[]}' "$URL/api/turn")"
          echo "TURN1=$one"
          answer1="$(ONE="$one" node -e "const d=JSON.parse(process.env.ONE);if(!d.ok||d.search)process.exit(2);process.stdout.write(d.answer||'')")"
          payload="$(ANSWER1="$answer1" node -e "process.stdout.write(JSON.stringify({text:'ネットサーフィンができて安いやつがいいな。あんまり複雑な作業しないから簡単なやつでいい。',history:[{role:'user',content:'パソコンの買い替えについて相談したいんだけども。'},{role:'assistant',content:process.env.ANSWER1}]}))")"
          two="$(curl -fsS --max-time 30 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          echo "TURN2=$two"
          TWO="$two" node <<'NODE'
          const d=JSON.parse(process.env.TWO||'{}');
          if(!d.ok||d.search) throw new Error('PC advice route failed');
          if(d.route!=='pc-contextual-v35') throw new Error('wrong route: '+d.route);
          if(/[0-9０-９][^。！？]{0,12}(?:円|万円)/.test(d.answer||'')) throw new Error('unsearched price leaked: '+d.answer);
          const sentences=(d.answer.match(/[。！？?]/g)||[]).length;
          if(sentences>3) throw new Error('answer too long: '+d.answer);
          if(/価格\.com|ランキングや価格比較|具体的な内容を/.test(d.answer||'')) throw new Error('old degraded answer pattern: '+d.answer);
          NODE
      - name: Verify old server TTS cannot emit gibberish
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/tts.json -w '%{http_code}' -H 'content-type: application/json' --data '{"text":"日本語テスト"}' "$URL/api/tts")"
          echo "server TTS HTTP=$code body=$(cat /tmp/tts.json)"
          test "$code" = '410'
