name: TalkSys v36 deploy once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/talksys-v36-deploy-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: 0d0f6d47146923d7e4f6cb3c755e4e2cec6ff0ff
      URL: https://talksys.syouziroupc.workers.dev
      EXPECTED: talksys-v36-search-voice-barge
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Validate v36
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v36.js
          node --check src/talk-client-v36.js
          node --check src/search-v26.js
          node --test tests/v36-search-voice-barge.test.mjs
          npx wrangler deploy --dry-run
      - name: Deploy v36
        run: |
          set -euo pipefail
          npx wrangler deploy
          npx wrangler deployments status
      - name: Wait for v36 propagation and verify health
        run: |
          set -euo pipefail
          body=''
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            rev="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(d.voiceRevision||'')")"
            echo "attempt=$i revision=${rev:-missing}"
            [ "$rev" = "$EXPECTED" ] && break
            [ "$i" -eq 20 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"
          BODY="$body" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if(d.searchContextRewrite!==true||d.bargeIn!==true) throw new Error('v36 features missing');
          if(d.ttsModel!=='browser/speechSynthesis'||d.ttsVoice!=='stable-ja-preferred') throw new Error('stable Japanese voice contract missing');
          if(d.serverTtsEnabled!==false) throw new Error('server TTS re-enabled');
          NODE
      - name: Verify stable voice and barge-in client after propagation
        run: |
          set -euo pipefail
          script=''
          for i in $(seq 1 20); do
            code="$(curl -sS --max-time 20 -D /tmp/client.headers -o /tmp/client.js -w '%{http_code}' "$URL/talk-v36.js" || true)"
            rev="$(tr -d '\r' </tmp/client.headers | awk -F': ' 'tolower($1)=="x-talksys-revision"{print $2}' | tail -1)"
            echo "client attempt=$i http=$code revision=${rev:-missing}"
            if [ "$code" = '200' ] && [ "$rev" = "$EXPECTED" ]; then script="$(cat /tmp/client.js)"; break; fi
            [ "$i" -eq 20 ] && { cat /tmp/client.headers; cat /tmp/client.js; exit 1; }
            sleep 3
          done
          grep -F 'lockedVoiceKey' <<< "$script"
          grep -F 'Google' <<< "$script"
          grep -F 'interruptSpeechForBargeIn' <<< "$script"
          grep -F 'bargeHits>=3' <<< "$script"
          grep -F 'speechSynthesis&&window.speechSynthesis.cancel' <<< "$script"
          if grep -F "fetch('/api/tts'" <<< "$script"; then exit 1; fi
      - name: Reproduce Oita PC store search
        run: |
          set -euo pipefail
          payload='{"text":"大分県内でおすすめのお店はありますか?","history":[{"role":"user","content":"パソコンの買い替えについて相談したい。"},{"role":"assistant","content":"用途から絞れます。"},{"role":"user","content":"ネットサーフィンとYouTubeぐらい。安いやつでいい。"},{"role":"assistant","content":"エントリークラスで十分です。"},{"role":"user","content":"ノートで画面の大きいやつがいい。"},{"role":"assistant","content":"大きめの画面を条件にしましょう。"}]}'
          out="$(curl -fsS --max-time 45 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          echo "OITA=$out"
          OUT="$out" node <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          if(!d.ok||d.search!==true) throw new Error('Oita store request did not search');
          const q=(d.queries||[]).join(' ');
          if(!/大分/.test(q)||!/パソコン|PC/i.test(q)) throw new Error('Oita/PC context missing from queries: '+q);
          if(!Array.isArray(d.sources)||d.sources.length<1) throw new Error('Oita store search returned no evidence');
          if(/ここでは具体的な店|大手家電量販店があります/.test(d.answer||'')) throw new Error('generic store answer regressed: '+d.answer);
          NODE
      - name: Reproduce subjectless transit follow-up search
        run: |
          set -euo pipefail
          payload='{"text":"今から君がちょっと検索してほしいんだけど。","history":[{"role":"user","content":"大分駅から別府駅まで行かないといけないんだけど、何を乗っていけばいいかわかんないんだよね。"},{"role":"assistant","content":"JR日豊本線で移動できます。正確な情報は検索できます。"}]}'
          out="$(curl -fsS --max-time 45 -H 'content-type: application/json' --data "$payload" "$URL/api/turn")"
          echo "TRANSIT=$out"
          OUT="$out" node <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          if(!d.ok||d.search!==true) throw new Error('subjectless transit follow-up did not search');
          const q=(d.queries||[]).join(' ');
          if(!/大分/.test(q)||!/別府/.test(q)||!/乗換|直通|時刻表/.test(q)) throw new Error('transit-specific queries missing: '+q);
          if(!Array.isArray(d.sources)||d.sources.length<1) throw new Error('transit search returned no evidence');
          const first=String(d.sources[0]?.url||'');
          if(!/transit\.yahoo\.co\.jp/.test(first)) throw new Error('direct transit evidence not prioritized: '+first);
          NODE
      - name: Verify server TTS remains disabled
        run: |
          code="$(curl -sS -o /tmp/tts.json -w '%{http_code}' -H 'content-type: application/json' --data '{"text":"日本語テスト"}' "$URL/api/tts")"
          echo "server TTS HTTP=$code body=$(cat /tmp/tts.json)"
          test "$code" = '410'
