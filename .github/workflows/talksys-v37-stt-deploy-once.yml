name: TalkSys v37 STT deploy once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v37-stt-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout TalkSys exact revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: 33abb2bbc0c77fa277ccece22234ea21b0e8e431

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install and verify STT fix
        run: |
          npm install --no-audit --no-fund
          node --check src/worker-v37.js
          node --test tests/v37-grounded-continuity.test.mjs
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy TalkSys production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live STT hallucination guard
        shell: bash
        run: |
          node <<'NODE'
          const url='https://talksys.syouziroupc.workers.dev/voice-health';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last='';
          for(let i=0;i<24;i++){
            try{
              const r=await fetch(url,{headers:{'cache-control':'no-cache'}});
              last=await r.text();
              if(r.ok){
                const j=JSON.parse(last);
                if(j.voiceRevision==='talksys-v37-grounded-continuity' &&
                   j.sttModel==='@cf/openai/whisper-large-v3-turbo' &&
                   j.sttPrompt===false &&
                   j.sttHallucinationGuard===true &&
                   j.sttSignalGate===true){
                  console.log(JSON.stringify(j,null,2));
                  process.exit(0);
                }
              }
            }catch(e){ last=String(e); }
            await sleep(5000);
          }
          console.error('Live TalkSys STT contract did not converge:',last);
          process.exit(1);
          NODE
