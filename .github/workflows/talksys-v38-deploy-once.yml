name: TalkSys v38 deploy once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v38-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 18
    steps:
      - name: Checkout TalkSys exact revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: b3f7bd2f6bb86f82a2a49de5adb0e86cb86e9ea9

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install and validate v38
        run: |
          npm install --no-audit --no-fund
          node --test tests/v38-history-search-tts.test.mjs
          npm test
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy TalkSys v38 production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live v38 contract client planner and TTS fallback
        shell: bash
        run: |
          node <<'NODE'
          const base='https://talksys.syouziroupc.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let health=null;
          for(let i=0;i<24;i++){
            try{const r=await fetch(base+'/voice-health',{headers:{'cache-control':'no-cache'}});if(r.ok){const j=await r.json();if(j.voiceRevision==='talksys-v38-history-search-tts-fallback'&&j.historyAwareSearchPlanner===true&&j.ttsFallbackEnabled===true){health=j;break;}}}catch{}
            await sleep(5000);
          }
          if(!health)throw new Error('v38 health did not converge');
          console.log('HEALTH',JSON.stringify(health,null,2));

          const js=await (await fetch(base+'/talk-v38.js',{headers:{'cache-control':'no-cache'}})).text();
          for(const needle of ['Cloudflare TTSへフォールバック','searchPlan:plan||null','相槌:'])if(!js.includes(needle))throw new Error('live client missing '+needle);

          const planRes=await fetch(base+'/api/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
            text:'もうちょっと安い方がいいなぁ4万3万ぐらい',
            history:[
              {role:'user',content:'パソコンの買い替えについて相談したいです。'},
              {role:'assistant',content:'用途に合った性能クラスを選ぶのが近道です。'},
              {role:'user',content:'動画編集とかはしないからなんかネットができる安いノートパソコンでいいかな'},
              {role:'assistant',content:'ネット閲覧中心なら低価格帯でも候補があります。'}
            ]
          })});
          const plan=await planRes.json();console.log('PLAN',JSON.stringify(plan,null,2));
          if(!planRes.ok||!plan.ok||plan.search!==true)throw new Error('planner did not request search');
          if(plan.planner!=='glm-history-v38')throw new Error('history planner not used: '+plan.planner);
          const combined=String(plan.resolvedQuestion||'')+' '+String(plan.searchInstruction||'');
          if(!/(ノート|パソコン|PC)/i.test(combined))throw new Error('planner lost PC context');
          if(!/(3|３|三).*(4|４|四)|(4|４|四).*(3|３|三)/.test(combined))throw new Error('planner lost 3-4万円 budget: '+combined);

          const ttsRes=await fetch(base+'/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:'スマートフォン向け日本語音声の確認です。'})});
          const audio=await ttsRes.arrayBuffer();console.log('TTS',ttsRes.status,ttsRes.headers.get('content-type'),audio.byteLength);
          if(!ttsRes.ok||audio.byteLength<1000||!/^audio\//.test(ttsRes.headers.get('content-type')||''))throw new Error('server TTS fallback failed');
          NODE
