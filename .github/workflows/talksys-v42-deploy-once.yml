name: TalkSys v42 deploy once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v42-deploy-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-talksys:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TALKSYS_SHA: a8cada8fb8df56c1eac28592fe806cd8b0db3877
      URL: https://talksys.syouziroupc.workers.dev
      EXPECTED: talksys-v42-search-judgment-persistent-logs
      LOG_DB: talksys-conversation-logs
    steps:
      - name: Checkout TalkSys exact revision
        uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: ${{ env.TALKSYS_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Require Cloudflare production credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate exact v42 hotfix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TALKSYS_SHA"
          node --check src/worker-v42-hotfix.js
          node --check src/worker-v42.js
          node --check src/talk-client-v42.js
          node --check src/search-v42.js
          node --check src/log-v42.js
          node --test tests/v42-search-judgment-logs.test.mjs
          npm test
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy TalkSys v42 production
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
          npx wrangler deployments status

      - name: Wait for v42 propagation and verify health
        run: |
          set -euo pipefail
          body=''
          for i in $(seq 1 24); do
            body="$(curl -fsS --max-time 20 "$URL/voice-health" || true)"
            rev="$(BODY="$body" node -e "let d={};try{d=JSON.parse(process.env.BODY||'{}')}catch{};process.stdout.write(d.voiceRevision||d.revision||'')")"
            echo "attempt=$i revision=${rev:-missing}"
            [ "$rev" = "$EXPECTED" ] && break
            [ "$i" -eq 24 ] && { echo "$body"; exit 1; }
            sleep 3
          done
          echo "$body"
          BODY="$body" EXPECTED="$EXPECTED" node <<'NODE'
          const d=JSON.parse(process.env.BODY||'{}');
          if((d.voiceRevision||d.revision)!==process.env.EXPECTED) throw new Error('wrong revision');
          if(d.persistentConversationLogs!=='d1-private') throw new Error('D1 persistent logs missing');
          if(d.rawAudioLogged!==false) throw new Error('raw audio logging contract wrong');
          if(d.maxSearchPasses!==5) throw new Error('five-pass search contract missing');
          if(d.searchGiveupBoilerplateGuard!==true) throw new Error('give-up guard missing');
          NODE

      - name: Verify live v42 client
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -D /tmp/client.headers -o /tmp/client.js -w '%{http_code}' "$URL/talk-v42.js")"
          test "$code" = '200'
          grep -F 'talkSessionId' /tmp/client.js
          grep -F 'sessionId:talkSessionId' /tmp/client.js
          grep -F "'x-talksys-session':talkSessionId" /tmp/client.js
          grep -F 'talksys-v42-search-judgment-persistent-logs' /tmp/client.js

      - name: Verify general repair advice stays local
        run: |
          set -euo pipefail
          SID="deploy-v42-general-$(date +%s)"
          payload="{\"sessionId\":\"$SID\",\"text\":\"背面割れです。機種はXperia 5で、半年前にゲオで8000円で買いました。大事なデータは特に入っていません。修理か買い替えか悩んでいます。\",\"history\":[{\"role\":\"user\",\"content\":\"スマホが壊れて修理か買い替えか悩んでいます。\"}]}"
          plan="$(curl -fsS --max-time 45 -H 'content-type: application/json' -H "x-talksys-session: $SID" --data "$payload" "$URL/api/plan")"
          echo "GENERAL_PLAN=$plan"
          PLAN="$plan" node <<'NODE'
          const d=JSON.parse(process.env.PLAN||'{}');
          if(!d.ok||d.search!==false||d.planner!=='device-decision-local-v42') throw new Error('general decision planned a search');
          NODE
          turnPayload="$(PLAN="$plan" PAYLOAD="$payload" node -e "const b=JSON.parse(process.env.PAYLOAD);b.searchPlan=JSON.parse(process.env.PLAN);process.stdout.write(JSON.stringify(b))")"
          out="$(curl -fsS --max-time 45 -H 'content-type: application/json' -H "x-talksys-session: $SID" --data "$turnPayload" "$URL/api/turn")"
          echo "GENERAL_TURN=$out"
          OUT="$out" node <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          if(!d.ok||d.search!==false||d.route!=='device-decision-v42') throw new Error('general repair decision route failed');
          if(/申し訳ありません|確認できません|検索してください/.test(d.answer||'')) throw new Error('give-up wording leaked');
          NODE
          echo "$SID" >/tmp/talksys-general-sid

      - name: Verify explicit budget lookup is user-only and grounded
        run: |
          set -euo pipefail
          SID="deploy-v42-search-$(date +%s)"
          payload="{\"sessionId\":\"$SID\",\"text\":\"もうちょっと調べてみてよ。2万円以下のスマホについて。\",\"history\":[{\"role\":\"user\",\"content\":\"初代Xperia 5はAndroidが古いので中古で安いスマホへ乗り換えたい。\"},{\"role\":\"assistant\",\"content\":\"Android 13以降、SIMフリー、保証付きが条件ですね。\"}]}"
          plan="$(curl -fsS --max-time 45 -H 'content-type: application/json' -H "x-talksys-session: $SID" --data "$payload" "$URL/api/plan")"
          echo "PHONE_PLAN=$plan"
          PLAN="$plan" node <<'NODE'
          const d=JSON.parse(process.env.PLAN||'{}');
          if(!d.ok||d.search!==true||d.planner!=='phone-shopping-local-v42') throw new Error('explicit lookup missed v42 planner');
          if(/Android 13|SIMフリー|保証付き/.test(d.resolvedQuestion||'')) throw new Error('assistant-invented constraint leaked into plan');
          NODE
          turnPayload="$(PLAN="$plan" PAYLOAD="$payload" node -e "const b=JSON.parse(process.env.PAYLOAD);b.searchPlan=JSON.parse(process.env.PLAN);process.stdout.write(JSON.stringify(b))")"
          out="$(curl -fsS --max-time 90 -H 'content-type: application/json' -H "x-talksys-session: $SID" --data "$turnPayload" "$URL/api/turn")"
          echo "PHONE_TURN=$out"
          OUT="$out" node <<'NODE'
          const d=JSON.parse(process.env.OUT||'{}');
          if(!d.ok||d.search!==true||d.route!=='resilient-search-v42') throw new Error('v42 resilient search route failed');
          if(Number(d.searchPasses||0)<1||Number(d.searchPasses||0)>5) throw new Error('bad search pass count');
          if(d.historyPolicy!=='user-only') throw new Error('search did not use user-only history');
          const qs=(d.queries||[]).join(' | ');
          if(/Android\s*13(?:\s*(?:以降|以上))?|SIM\s*フリー|保証付き/.test(qs)) throw new Error('assistant-invented constraint leaked into actual queries: '+qs);
          const a=String(d.answer||'');
          if(/申し訳ありません.{0,80}(確認|情報|検索)|具体的な.{0,40}(ご案内|提案).{0,20}できません|自分で.{0,20}(検索|確認)/.test(a)) throw new Error('old search give-up wording returned');
          if(/(?:発売|登場|年式).{0,30}(?:新し|最近).{0,55}(?:Android|OS|有力|おすすめ|安心)|(?:新し|最近).{0,35}(?:ため|ので).{0,45}(?:Android|OS|有力|おすすめ)/.test(a)) throw new Error('release-year OS inference returned: '+a);
          if(/(?:購入前|商品ページ|通販サイト|販売店|店舗).{0,55}(?:確認して|確認いただ|チェックして|見てください|調べてください)/.test(a)) throw new Error('search verification handed back to user: '+a);
          NODE
          echo "$SID" >/tmp/talksys-search-sid

      - name: Verify D1 actually contains production conversation logs
        run: |
          set -euo pipefail
          sleep 4
          G="$(cat /tmp/talksys-general-sid)"
          S="$(cat /tmp/talksys-search-sid)"
          q="SELECT session_id,event,status,revision,path,user_text FROM conversation_logs WHERE session_id IN ('$G','$S') ORDER BY timestamp;"
          out="$(npx wrangler d1 execute "$LOG_DB" --remote --command "$q")"
          echo "$out"
          OUT="$out" G="$G" S="$S" EXPECTED="$EXPECTED" node <<'NODE'
          const raw=process.env.OUT||'';
          if(!raw.includes(process.env.G)) throw new Error('general session missing from D1');
          if(!raw.includes(process.env.S)) throw new Error('search session missing from D1');
          if(!raw.includes(process.env.EXPECTED)) throw new Error('v42 revision missing from D1');
          NODE

      - name: Verify server TTS remains disabled with 410 contract
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/tts.json -w '%{http_code}' -H 'content-type: application/json' --data '{\"text\":\"日本語テスト\"}' "$URL/api/tts")"
          echo "server TTS HTTP=$code body=$(cat /tmp/tts.json)"
          test "$code" = '410'
