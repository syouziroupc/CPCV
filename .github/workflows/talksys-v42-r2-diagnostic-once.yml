name: TalkSys v42 storage diagnostic once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v42-r2-diagnostic-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-storage:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: cffff6fe8950a5e0e70f62dc783ebd25a02eb667
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Probe Cloudflare persistent storage permissions
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          echo '=== R2 ==='
          npx wrangler r2 bucket list > /tmp/r2.txt 2>&1; R2=$?
          echo "R2_RC=$R2"; cat /tmp/r2.txt
          echo
          echo '=== KV ==='
          npx wrangler kv namespace list > /tmp/kv.txt 2>&1; KV=$?
          echo "KV_RC=$KV"; cat /tmp/kv.txt
          echo
          echo '=== D1 ==='
          npx wrangler d1 list > /tmp/d1.txt 2>&1; D1=$?
          echo "D1_RC=$D1"; cat /tmp/d1.txt
          echo
          echo "STORAGE_SUMMARY R2=$R2 KV=$KV D1=$D1"
          exit 0
