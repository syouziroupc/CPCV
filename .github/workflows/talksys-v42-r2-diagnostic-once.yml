name: TalkSys v42 D1 log database once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/talksys-v42-r2-diagnostic-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-talksys-log-db:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: syouziroupc/talksys
          ref: cffff6fe8950a5e0e70f62dc783ebd25a02eb667
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Create and initialize TalkSys D1 logs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST="$(npx wrangler d1 list)"
          echo "$LIST"
          if ! printf '%s\n' "$LIST" | grep -q 'talksys-conversation-logs'; then
            npx wrangler d1 create talksys-conversation-logs --location=apac
          fi
          echo '=== D1 INFO ==='
          npx wrangler d1 info talksys-conversation-logs
          echo '=== CREATE SCHEMA ==='
          npx wrangler d1 execute talksys-conversation-logs --remote --command "CREATE TABLE IF NOT EXISTS conversation_logs (id TEXT PRIMARY KEY, session_id TEXT NOT NULL, event TEXT NOT NULL, timestamp TEXT NOT NULL, jst TEXT NOT NULL, revision TEXT, path TEXT, status INTEGER, user_text TEXT, history_json TEXT, search_plan_json TEXT, result_json TEXT, audio_bytes INTEGER DEFAULT 0); CREATE INDEX IF NOT EXISTS idx_conversation_logs_session_time ON conversation_logs(session_id, timestamp); CREATE INDEX IF NOT EXISTS idx_conversation_logs_time ON conversation_logs(timestamp);"
          echo '=== VERIFY SCHEMA ==='
          npx wrangler d1 execute talksys-conversation-logs --remote --command "SELECT name, type FROM sqlite_master WHERE name IN ('conversation_logs','idx_conversation_logs_session_time','idx_conversation_logs_time') ORDER BY name;"
