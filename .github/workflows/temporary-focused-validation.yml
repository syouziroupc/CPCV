name: Temporary focused validation
on:
  push:
    branches: [master]
    paths: [.github/workflows/temporary-focused-validation.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0 && npm ci
      - name: Capture focused tests
        shell: bash
        run: |
          mkdir -p focused-logs
          set +e
          node --check src/ai/provider.js > focused-logs/provider.log 2>&1; echo $? > focused-logs/provider.exit
          node --check src/ai/processor.js > focused-logs/processor.log 2>&1; echo $? > focused-logs/processor.exit
          node --no-warnings scripts/test-ai-v2.mjs > focused-logs/ai.log 2>&1; echo $? > focused-logs/ai.exit
          node scripts/test-v0810-usability.mjs > focused-logs/usability.log 2>&1; echo $? > focused-logs/usability.exit
          node scripts/test-v0810-security-ui.mjs > focused-logs/security-ui.log 2>&1; echo $? > focused-logs/security-ui.exit
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: focused-validation-logs
          path: focused-logs
          retention-days: 3
