name: Apply translation display fix on PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fix-translation-display-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply ordering fix
        run: |
          node .github/scripts/apply-translation-order-fix.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
          git diff --cached --check
          git commit -m "Serialize translation display before AI dispatch"
      - name: Verify ordering and regressions
        run: |
          node --check src/ai/processor.js
          node --check src/realtime/comment-room.js
          node --no-warnings scripts/test-realtime-v2.mjs
          node --no-warnings scripts/test-ai-v2.mjs
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run check:stage08
          npm run check:v0810
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Push verified ordering fix
        run: git push origin HEAD:agent/fix-translation-display-gate
