name: Apply translation display fix on PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: translation-display-fix-pr
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fix-translation-display-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused fix
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          text = Path('.github/workflows/translation-display-fix.yml').read_text()
          match = re.search(r"PATCH_GZIP_BASE64: '([^']+)'", text)
          if not match:
              raise SystemExit('PATCH_PAYLOAD_NOT_FOUND')
          script = gzip.decompress(base64.b64decode(match.group(1))).decode()
          script = script.replace(
              "  const matches = [...text.matchAll(pattern)];",
              "  const flags = pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g';\n  const matches = [...text.matchAll(new RegExp(pattern.source, flags))];"
          )
          Path('/tmp/apply-translation-display-gate.mjs').write_text(script)
          PY
          node /tmp/apply-translation-display-gate.mjs
          rm -f .github/workflows/translation-display-fix.yml .github/workflows/translation-display-fix-pr.yml
          npm run manifest:source
      - name: Targeted verification
        run: |
          node --check src/realtime/comment-room.js
          node --check src/realtime/repository.js
          node --check src/ai/repository.js
          node --check src/ai/processor.js
          node --check public/assets/viewer.js
          node --no-warnings scripts/test-realtime-v2.mjs
          node --no-warnings scripts/test-ai-v2.mjs
          node scripts/verify-stage07-boundaries.mjs
      - name: Full verification
        run: |
          npm run verify:source-manifest
          npm run check
          npm run check:project
          npm run check:pdf-links
          npm run check:stage08
          npm run check:v0810
          npm run test:owner-bootstrap
          npm run verify:ai-ready
          npm run verify:final-docs
          npm run deploy:dry-run
          npm audit
          npm audit --omit=dev
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix delayed AI translation display'
          git push origin HEAD:agent/fix-translation-display-gate
