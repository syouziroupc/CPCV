    try {
      const usageEventId = typeof options.reserveUsage === "function" ? await options.reserveUsage(candidate.model) : null;
      const dedicated = candidate.model === DEDICATED_TRANSLATION_MODEL;
      const baseRequest = dedicated
        ? { text: String(input.message || ""), source_lang: trustedSourceLanguage, target_lang: targetLanguage }
        : translationChatRequest(input.message, targetLanguage, trustedSourceLanguage);
