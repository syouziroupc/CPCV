name: U22 translation diagnostic

on:
  push:
    branches: [u22-real-capture-20260828]
    paths:
      - ".github/workflows/u22-translation-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: npm ci
      - name: Build staging config
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wrangler.toml').read_text(encoding='utf-8')
          repl={
            'name = "class-pdf-comment-viewer-v01"':'name = "class-pdf-comment-viewer-v01-staging"',
            'database_name = "class_comment_db"':'database_name = "class_comment_db_staging"',
            'database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"':'database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"',
            'database_name = "class_comment_db_v2"':'database_name = "class_comment_db_v2_staging"',
            'database_id = "8315a076-67ad-44e6-8286-11887af52ad3"':'database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"',
            'queue = "cpcv-ai-jobs"':'queue = "cpcv-ai-jobs-staging"',
            'queue = "cpcv-ai-translation-jobs"':'queue = "cpcv-ai-translation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-translation-dlq"':'dead_letter_queue = "cpcv-ai-translation-dlq-staging"',
            'queue = "cpcv-ai-moderation-jobs"':'queue = "cpcv-ai-moderation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-moderation-dlq"':'dead_letter_queue = "cpcv-ai-moderation-dlq-staging"',
            '826071901':'826071801','826071902':'826071802','826071903':'826071803','826071904':'826071804','826071905':'826071805','826071906':'826071806',
            'https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev':'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev',
            'TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"':'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"'
          }
          for old,new in repl.items():
            if old not in s: raise SystemExit('missing staging replacement: '+old)
            s=s.replace(old,new)
          Path('.cpcv-staging.wrangler.toml').write_text(s,encoding='utf-8')
          PY
      - name: Dump recent translation pipeline state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -x
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT ls.id, ls.title, ls.public_code, ls.created_at, oas.enabled AS org_ai_enabled, sas.translation_enabled, sas.target_language, sas.translation_quality, sas.updated_at AS ai_settings_updated_at FROM live_sessions ls LEFT JOIN organization_ai_settings oas ON oas.organization_id=ls.organization_id LEFT JOIN session_ai_settings sas ON sas.organization_id=ls.organization_id AND sas.live_session_id=ls.id ORDER BY ls.created_at DESC LIMIT 12;"
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT c.id, c.live_session_id, c.message, c.detected_language, c.language_confidence_milli, c.moderation_state, c.created_at FROM comments c ORDER BY c.created_at DESC LIMIT 30;"
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT j.id, j.live_session_id, j.comment_id, j.status, j.attempt_count, j.last_error_code, j.run_after, j.claimed_at, j.finished_at, j.created_at, c.message, c.detected_language, c.language_confidence_milli, c.moderation_state, COALESCE(s.translation_enabled,0) AS translation_enabled, COALESCE(s.target_language,'') AS target_language, COALESCE(s.translation_quality,'') AS translation_quality FROM ai_jobs j JOIN comments c ON c.id=j.comment_id LEFT JOIN session_ai_settings s ON s.organization_id=j.organization_id AND s.live_session_id=j.live_session_id WHERE j.job_type='translation' ORDER BY j.created_at DESC LIMIT 30;"
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT u.job_id, u.attempt_number, u.provider, u.model, u.input_characters, u.output_characters, u.created_at, u.updated_at FROM ai_usage_events u JOIN ai_jobs j ON j.id=u.job_id WHERE j.job_type='translation' ORDER BY u.created_at DESC LIMIT 30;"
