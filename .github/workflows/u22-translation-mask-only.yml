name: U22 translation and mask genuine capture

on:
  push:
    branches: [u22-real-capture-20260828]
    paths:
      - ".github/workflows/u22-translation-mask-only.yml"
      - "scripts/u22-translation-mask-only.py"

permissions:
  contents: read

env:
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  capture:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.12"

      - name: Install browser capture tools
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.57.0 pillow
          python -m playwright install --with-deps chromium
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi

      - name: Build isolated staging configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('wrangler.toml').read_text(encoding='utf-8')
          repl={
            'name = "class-pdf-comment-viewer-v01"':'name = "class-pdf-comment-viewer-v01-staging"',
            'database_name = "class_comment_db"':'database_name = "class_comment_db_staging"',
            'database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"':'database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"',
            'database_name = "class_comment_db_v2"':'database_name = "class_comment_db_v2_staging"',
            'database_id = "8315a076-67ad-44e6-8286-11887af52ad3"':'database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"',
            'queue = "cpcv-ai-jobs"':'queue = "cpcv-ai-jobs-staging"',
            'queue = "cpcv-ai-translation-jobs"':'queue = "cpcv-ai-translation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-translation-dlq"':'dead_letter_queue = "cpcv-ai-translation-dlq-staging"',
            'queue = "cpcv-ai-moderation-jobs"':'queue = "cpcv-ai-moderation-jobs-staging"',
            'dead_letter_queue = "cpcv-ai-moderation-dlq"':'dead_letter_queue = "cpcv-ai-moderation-dlq-staging"',
            '826071901':'826071801','826071902':'826071802','826071903':'826071803','826071904':'826071804','826071905':'826071805','826071906':'826071806',
            'https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev':'https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev',
            'TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"':'TURNSTILE_SITE_KEY = "1x00000000000000000000AA"'
          }
          for old,new in repl.items():
            if old not in s: raise SystemExit('missing staging replacement: '+old)
            s=s.replace(old,new)
          Path('.cpcv-staging.wrangler.toml').write_text(s,encoding='utf-8')
          PY
          node scripts/verify-deployment-config.mjs .cpcv-staging.wrangler.toml
          node scripts/verify-environment-separation.mjs --mode production-gate --production wrangler.toml --staging .cpcv-staging.wrangler.toml

      - name: Deploy current CPCV to isolated staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml
          npx wrangler deploy --config .cpcv-staging.wrangler.toml --keep-vars
          node scripts/smoke-production.mjs --config .cpcv-staging.wrangler.toml --origin "$STAGING_ORIGIN"

      - name: Seed temporary staging teacher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          import { createSalt, hashPassword, PASSWORD_SCHEME } from './src/auth/passwords.js';
          const suffix=`${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          const loginId=`u22tm_${suffix}`.slice(0,60), password='CPCV-U22-Capture-2026!';
          const orgId=`org_${randomUUID().replaceAll('-','')}`, userId=`usr_${randomUUID().replaceAll('-','')}`, now=new Date().toISOString();
          const salt=createSalt(), hash=await hashPassword(password,salt), q=(v)=>`'${String(v).replaceAll("'","''")}'`;
          const sql=[
            `INSERT INTO organizations (id,name,status,created_at,updated_at,deleted_at) VALUES (${q(orgId)},${q('U22 Translation Mask Capture')},'active',${q(now)},${q(now)},NULL);`,
            `INSERT INTO users (id,login_id,display_name,password_scheme,password_hash,password_salt,password_changed_at,status,created_at,updated_at,deleted_at) VALUES (${q(userId)},${q(loginId)},${q('U22 Capture Teacher')},${q(PASSWORD_SCHEME)},${q(hash)},${q(salt)},${q(now)},'active',${q(now)},${q(now)},NULL);`,
            `INSERT INTO organization_members (organization_id,user_id,role,status,created_at,updated_at,removed_at) VALUES (${q(orgId)},${q(userId)},'owner','active',${q(now)},${q(now)},NULL);`
          ].join('\n');
          writeFileSync('.u22-tm-seed.sql',sql,{encoding:'utf8',mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,`CAPTURE_LOGIN_ID=${loginId}\nCAPTURE_PASSWORD=${password}\nCAPTURE_ORG_ID=${orgId}\n`);
          NODE
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --file .u22-tm-seed.sql
          rm -f .u22-tm-seed.sql

      - name: Capture real translation and masking only
        run: |
          python scripts/u22-translation-mask-only.py 2>&1 | tee u22-translation-mask.log
          test -f u22-translation-mask-evidence/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('u22-translation-mask-evidence/manifest.json').read_text(encoding='utf-8'))
          t=m.get('translation_verified') or {}
          f=m.get('mask_verified') or {}
          if not t.get('translated') or t.get('source') not in t.get('visible','') or t.get('translated') not in t.get('visible',''):
              raise SystemExit('genuine translation result not verified')
          if '＊' not in f.get('visible','') or '無能' in f.get('visible',''):
              raise SystemExit('genuine mask result not verified')
          if len(m.get('clips',[])) != 6:
              raise SystemExit(f"expected 6 focused clips, got {len(m.get('clips',[]))}")
          print(json.dumps({'translation':t,'mask':f,'clips':len(m['clips'])},ensure_ascii=False,indent=2))
          PY

      - name: Verify backend records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT ls.title,c.message,c.display_message,c.detected_language,c.created_at FROM comments c JOIN live_sessions ls ON ls.id=c.live_session_id WHERE ls.organization_id='${CAPTURE_ORG_ID}' ORDER BY c.created_at;"
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --json --command "SELECT ls.title,j.status,j.last_error_code,c.message,r.translated_text FROM ai_jobs j JOIN comments c ON c.id=j.comment_id JOIN live_sessions ls ON ls.id=j.live_session_id LEFT JOIN ai_results r ON r.job_id=j.id WHERE ls.organization_id='${CAPTURE_ORG_ID}' AND j.job_type='translation' ORDER BY j.created_at;" || true

      - name: Upload verified focused material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcv-u22-translation-mask-verified-${{ github.run_id }}
          path: |
            u22-translation-mask-evidence/
            u22-translation-mask.log
          if-no-files-found: warn
          retention-days: 30
