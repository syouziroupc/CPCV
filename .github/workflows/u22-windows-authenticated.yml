name: U22 authenticated Windows desktop visual

on:
  push:
    branches: [u22-real-capture-20260828]
    paths:
      - ".github/workflows/u22-windows-authenticated.yml"

permissions:
  contents: read

env:
  STAGING_ORIGIN: https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev

jobs:
  capture:
    runs-on: windows-2025
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Install source dependencies and desktop toolchain
        shell: pwsh
        env:
          NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
        run: |
          npm ci
          rustup toolchain install 1.97.1 --profile minimal
          Push-Location desktop-overlay-poc
          npm ci
          Pop-Location

      - name: Build isolated staging config
        shell: pwsh
        run: |
          $s = Get-Content wrangler.toml -Raw -Encoding UTF8
          $pairs = @(
            @('name = "class-pdf-comment-viewer-v01"','name = "class-pdf-comment-viewer-v01-staging"'),
            @('database_name = "class_comment_db"','database_name = "class_comment_db_staging"'),
            @('database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"','database_id = "20e4531c-2765-46b5-a68f-940daa94d6a9"'),
            @('database_name = "class_comment_db_v2"','database_name = "class_comment_db_v2_staging"'),
            @('database_id = "8315a076-67ad-44e6-8286-11887af52ad3"','database_id = "7b30a11d-5b3c-49f5-bc54-9a1326818089"'),
            @('queue = "cpcv-ai-jobs"','queue = "cpcv-ai-jobs-staging"'),
            @('queue = "cpcv-ai-translation-jobs"','queue = "cpcv-ai-translation-jobs-staging"'),
            @('dead_letter_queue = "cpcv-ai-translation-dlq"','dead_letter_queue = "cpcv-ai-translation-dlq-staging"'),
            @('queue = "cpcv-ai-moderation-jobs"','queue = "cpcv-ai-moderation-jobs-staging"'),
            @('dead_letter_queue = "cpcv-ai-moderation-dlq"','dead_letter_queue = "cpcv-ai-moderation-dlq-staging"'),
            @('826071901','826071801'),@('826071902','826071802'),@('826071903','826071803'),@('826071904','826071804'),@('826071905','826071805'),@('826071906','826071806'),
            @('https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev','https://class-pdf-comment-viewer-v01-staging.syouziroupc.workers.dev'),
            @('TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"','TURNSTILE_SITE_KEY = "1x00000000000000000000AA"')
          )
          foreach ($p in $pairs) { if (-not $s.Contains($p[0])) { throw "missing staging replacement $($p[0])" }; $s=$s.Replace($p[0],$p[1]) }
          Set-Content .cpcv-staging.wrangler.toml -Value $s -Encoding UTF8

      - name: Seed temporary staging teacher
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          @'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          import { createSalt, hashPassword, PASSWORD_SCHEME } from './src/auth/passwords.js';
          const suffix=`${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          const loginId=`u22windesk_${suffix}`.slice(0,60), password='CPCV-U22-Capture-2026!';
          const orgId=`org_${randomUUID().replaceAll('-','')}`, userId=`usr_${randomUUID().replaceAll('-','')}`, now=new Date().toISOString();
          const salt=createSalt(), hash=await hashPassword(password,salt), q=(v)=>`'${String(v).replaceAll("'","''")}'`;
          writeFileSync('.u22-windesk-seed.sql',[
            `INSERT INTO organizations (id,name,status,created_at,updated_at,deleted_at) VALUES (${q(orgId)},${q('U22 Windows Desktop Capture')},'active',${q(now)},${q(now)},NULL);`,
            `INSERT INTO users (id,login_id,display_name,password_scheme,password_hash,password_salt,password_changed_at,status,created_at,updated_at,deleted_at) VALUES (${q(userId)},${q(loginId)},${q('U22 Windows Teacher')},${q(PASSWORD_SCHEME)},${q(hash)},${q(salt)},${q(now)},'active',${q(now)},${q(now)},NULL);`,
            `INSERT INTO organization_members (organization_id,user_id,role,status,created_at,updated_at,removed_at) VALUES (${q(orgId)},${q(userId)},'owner','active',${q(now)},${q(now)},NULL);`
          ].join('\n'),{encoding:'utf8',mode:0o600});
          appendFileSync(process.env.GITHUB_ENV,`CAPTURE_LOGIN_ID=${loginId}\nCAPTURE_PASSWORD=${password}\n`);
          '@ | Set-Content .u22-seed.mjs -Encoding UTF8
          node .u22-seed.mjs
          npx wrangler d1 execute class_comment_db_v2_staging --remote --config .cpcv-staging.wrangler.toml --file .u22-windesk-seed.sql
          Remove-Item .u22-seed.mjs,.u22-windesk-seed.sql -Force

      - name: Build actual Windows executable
        shell: pwsh
        run: |
          Push-Location desktop-overlay-poc
          npm run build:release
          Pop-Location
          if (-not (Test-Path 'desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe')) { throw 'desktop exe missing' }

      - name: Login in actual CPCV Desktop and capture
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
          }
          '@
          $exe = Resolve-Path 'desktop-overlay-poc/src-tauri/target/release/cpcv-desktop.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--staging' -PassThru
          Start-Sleep -Seconds 18
          $p.Refresh(); if ($p.HasExited) { throw "desktop app exited: $($p.ExitCode)" }
          [Win32]::ShowWindowAsync($p.MainWindowHandle, 3) | Out-Null
          [Win32]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          [System.Windows.Forms.SendKeys]::SendWait($env:CAPTURE_LOGIN_ID)
          [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
          [System.Windows.Forms.SendKeys]::SendWait($env:CAPTURE_PASSWORD)
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 12
          $p.Refresh(); [Win32]::SetForegroundWindow($p.MainWindowHandle) | Out-Null; Start-Sleep -Seconds 2
          $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp=New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          New-Item -ItemType Directory -Path 'u22-windows-auth' -Force | Out-Null
          $bmp.Save((Join-Path (Resolve-Path 'u22-windows-auth') 'cpcv-desktop-windows-authenticated.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose()
          @("source_sha=$(git rev-parse HEAD)","window_title=$($p.MainWindowTitle)","runner=windows-2025","authenticated_capture=true") | Set-Content -Encoding utf8 'u22-windows-auth/manifest.txt'
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpcv-u22-windows-auth-${{ github.run_id }}
          path: u22-windows-auth/
          if-no-files-found: error
          retention-days: 30
