name: Unify CPCV navigation once

on:
  push:
    paths:
      - .github/workflows/unify-navigation-once.yml

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
      - name: Apply navigation changes
        run: python .github/scripts/unify_navigation.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public SOURCE_SHA256SUMS.override.txt
          git commit -m "Unify public and authenticated navigation"
          git push origin HEAD:master
