name: Repair CPCV source manifest once

on:
  push:
    paths:
      - .github/workflows/unify-navigation-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          fetch-depth: 0
      - name: Update public navigation cache key and source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          for path in [Path('public/_admin_spa.html'), Path('public/admin/index.html')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('/assets/app.css?v=0.8.10-u22fix1', '/assets/app.css?v=0.8.10-nav3')
              path.write_text(text, encoding='utf-8', newline='\n')

          paths = [
              '.github/workflows/deploy-master-now.yml',
              '.github/workflows/unify-navigation-once.yml',
              'public/assets/app.css',
              'public/index.html',
              'public/about/index.html',
              'public/guide/index.html',
              'public/privacy/index.html',
              'public/signup/index.html',
              'public/forgot-password/index.html',
              'public/reset-password/index.html',
              'public/accept-invitation/index.html',
              'public/check-email/index.html',
              'public/confirm-email-change/index.html',
              'public/verify-email/index.html',
              'public/_admin_spa.html',
              'public/admin/index.html',
          ]
          manifest = Path('SOURCE_SHA256SUMS.override.txt')
          order = []
          values = {}
          for line in manifest.read_text(encoding='utf-8').splitlines():
              if not line:
                  continue
              digest, path = line.split('  ', 1)
              if path not in order:
                  order.append(path)
              values[path] = digest
          for path in paths:
              values[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if path not in order:
                  order.append(path)
          manifest.write_text(''.join(f'{values[path]}  {path}\n' for path in order), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/_admin_spa.html public/admin/index.html SOURCE_SHA256SUMS.override.txt
          git commit -m "Finalize public navigation and source manifest"
          git push origin HEAD:master
