name: Update secure Undici lock

on:
  push:
    branches:
      - agent/scale-ai-throughput
    paths:
      - ".github/workflows/update-undici-lock.yml"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scale-ai-throughput
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0
      - name: Pin patched Undici and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'overrides.undici=7.29.0'
          npm install --package-lock-only --ignore-scripts
          npm audit
          npm audit --omit=dev
      - name: Remove transient workflow and regenerate source manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/update-undici-lock.yml
          git add package.json package-lock.json
          npm run manifest:source
          git add SOURCE_SHA256SUMS.txt SOURCE_SHA256SUMS.override.txt
          npm run verify:source-manifest
      - name: Commit generated dependency update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin patched Undici dependency"
          git push origin HEAD:agent/scale-ai-throughput
