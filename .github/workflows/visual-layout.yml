name: Responsive layout audit

on:
  push:
    paths:
      - 'public/**/*.html'
      - 'public/assets/*.css'
      - 'scripts/audit-responsive-layout.py'
      - '.github/workflows/visual-layout.yml'
  pull_request:
    paths:
      - 'public/**/*.html'
      - 'public/assets/*.css'
      - 'scripts/audit-responsive-layout.py'
      - '.github/workflows/visual-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install browser audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Audit every public HTML at five viewport widths
        run: python scripts/audit-responsive-layout.py
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-${{ github.sha }}
          path: artifacts/responsive-layout-audit/
          if-no-files-found: error
          retention-days: 30
