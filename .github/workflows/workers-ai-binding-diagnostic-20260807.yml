name: Workers AI binding diagnostic 2026-08-07

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/workers-ai-binding-diagnostic-20260807.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Deploy isolated diagnostic Worker and probe AI binding
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm ci
          account=""
          for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!key:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          test -n "$TOKEN"; test -n "$account"
          echo "::add-mask::$TOKEN"; echo "::add-mask::$account"
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$account"
          mkdir -p binding-diagnostic
          cat > .binding-diagnostic-worker.mjs <<'JS'
          const MODELS={
            llama33:'@cf/meta/llama-3.3-70b-instruct-fp8-fast',
            llama31fast:'@cf/meta/llama-3.1-8b-instruct-fast',
            llama31fp8:'@cf/meta/llama-3.1-8b-instruct-fp8'
          };
          const SCHEMA={type:'object',additionalProperties:false,required:['recommendation','confidence','categories'],properties:{recommendation:{type:'string',enum:['allow','review','hide']},confidence:{type:'number',minimum:0,maximum:1},categories:{type:'array',maxItems:9,items:{type:'string'}}}};
          function requestFor(){return {messages:[{role:'system',content:'Classify a classroom comment. Return one JSON object only with recommendation, confidence, and categories. Categories must be chosen only from harassment, hate, sexual, violence, self_harm, spam, personal_data, prompt_injection, other.'},{role:'user',content:'Ordinary classroom comment about energy markets.'}],max_tokens:220,temperature:0,response_format:{type:'json_schema',json_schema:SCHEMA}};}
          export default {async fetch(request,env){
            const [modelKey]=new URL(request.url).pathname.split('/').filter(Boolean);
            if(modelKey==='health') return Response.json({ok:true});
            const model=MODELS[modelKey]; if(!model)return new Response('not found',{status:404});
            const started=Date.now();
            try{const result=await env.AI.run(model,requestFor());return Response.json({ok:true,model,elapsedMs:Date.now()-started,result});}
            catch(error){return Response.json({ok:false,model,elapsedMs:Date.now()-started,error:{name:String(error?.name||''),message:String(error?.message||''),status:error?.status??null,code:error?.code??null}},{status:502});}
          }};
          JS
          cat > .binding-diagnostic.toml <<'TOML'
          name = "cpcv-ai-binding-diagnostic-20260807"
          main = ".binding-diagnostic-worker.mjs"
          compatibility_date = "2026-06-17"
          workers_dev = true
          [ai]
          binding = "AI"
          TOML
          npx wrangler deploy --config .binding-diagnostic.toml 2>&1 | tee binding-diagnostic/deploy.txt
          origin=$(grep -Eo 'https://[^ ]+\.workers\.dev' binding-diagnostic/deploy.txt | tail -n1)
          test -n "$origin"; echo "diagnostic_origin=$origin" > binding-diagnostic/origin.txt
          ready=0
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            code=$(curl -sS -o binding-diagnostic/health.json -w '%{http_code}' "$origin/health" || true)
            if [ "$code" = 200 ] && jq -e '.ok == true' binding-diagnostic/health.json >/dev/null 2>&1; then ready=1; break; fi
          done
          test "$ready" = 1
          for model in llama33 llama31fast llama31fp8; do
            curl -sS --retry 2 --retry-all-errors --retry-delay 1 -w '\nHTTP_STATUS=%{http_code}\n' "$origin/$model" > "binding-diagnostic/${model}.txt"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          rows=[]
          for path in sorted(Path('binding-diagnostic').glob('llama*.txt')):
              text=path.read_text(); m=re.search(r'\nHTTP_STATUS=(\d+)\s*$',text); status=int(m.group(1)) if m else None; body=text[:m.start()] if m else text
              try:data=json.loads(body)
              except Exception:data={'raw':body[:1200]}
              result=data.get('result') if isinstance(data,dict) else None
              rows.append({'probe':path.stem,'httpStatus':status,'ok':data.get('ok') if isinstance(data,dict) else None,'elapsedMs':data.get('elapsedMs') if isinstance(data,dict) else None,'response':result.get('response') if isinstance(result,dict) else None,'error':data.get('error') if isinstance(data,dict) else data})
          Path('binding-diagnostic/summary.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)); print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - name: Delete isolated diagnostic Worker by API
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_2: ${{ secrets.CF_ACCOUNT_ID }}
          ACCOUNT_3: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          account=""; for key in ACCOUNT_1 ACCOUNT_2 ACCOUNT_3; do value="${!key:-}"; if [ -n "$value" ]; then account="$value"; break; fi; done
          code=$(curl -sS -o binding-diagnostic/delete-response.txt -w '%{http_code}' -X DELETE "https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/cpcv-ai-binding-diagnostic-20260807?force=true" -H "Authorization: Bearer ${TOKEN}")
          printf '%s\n' "$code" > binding-diagnostic/delete-status.txt
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then cat binding-diagnostic/delete-response.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpcv-workers-ai-binding-diagnostic-${{ github.run_id }}
          path: binding-diagnostic/
          if-no-files-found: error
          retention-days: 30
