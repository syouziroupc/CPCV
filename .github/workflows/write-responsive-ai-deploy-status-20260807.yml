name: Record responsive AI deployment status

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/write-responsive-ai-deploy-status-20260807.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: cpcv-responsive-ai-status-20260807
  cancel-in-progress: true

env:
  TARGET_HEAD_SHA: 4643a48a1462d5f4e234e1709f4e916601058d07
  TARGET_WORKFLOW: deploy-responsive-ai-fix-20260807.yml
  STATUS_PATH: deployment-status/responsive-ai-20260807.json

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Locate and wait for deployment workflow
        id: monitor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          run_id=""
          for attempt in $(seq 1 90); do
            run_id=$(gh api "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=master&event=push&per_page=30" --jq ".workflow_runs[] | select(.head_sha == \"$TARGET_HEAD_SHA\") | .id" | head -n1 2>/dev/null)
            [ -z "$run_id" ] || break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo 'run_id=' >> "$GITHUB_OUTPUT"
            echo 'conclusion=not_found' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          conclusion=""
          status=""
          for attempt in $(seq 1 1080); do
            status=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null)
            conclusion=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.conclusion // ""' 2>/dev/null)
            echo "deployment run=$run_id status=$status conclusion=$conclusion"
            [ "$status" != 'completed' ] || break
            sleep 10
          done
          [ "$status" = 'completed' ] || conclusion='monitor_timeout'
          echo "conclusion=${conclusion:-unknown}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record status in repository
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.monitor.outputs.run_id }}
          CONCLUSION: ${{ steps.monitor.outputs.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/deployment-status
          cat > /tmp/deployment-status/result.json <<EOF
          {
            "application_commit": "82e96a23e103c0c826b772c576408c58ec8f9ce7",
            "deployment_workflow_head": "$TARGET_HEAD_SHA",
            "deployment_run_id": "${RUN_ID:-}",
            "conclusion": "${CONCLUSION:-unknown}",
            "recorded_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          encoded=$(base64 -w0 /tmp/deployment-status/result.json)
          existing_sha=$(gh api "repos/$REPO/contents/$STATUS_PATH?ref=master" --jq '.sha' 2>/dev/null || true)
          args=(--method PUT "repos/$REPO/contents/$STATUS_PATH" -f message='Record responsive AI deployment result' -f content="$encoded" -f branch=master)
          [ -z "$existing_sha" ] || args+=(-f sha="$existing_sha")
          gh api "${args[@]}" >/dev/null
