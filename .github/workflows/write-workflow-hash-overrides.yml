name: Write workflow hash overrides

on:
  push:
    branches:
      - agent/ai-response-hardening-20260808
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: write-workflow-hash-overrides
  cancel-in-progress: true

jobs:
  write:
    if: ${{ !contains(github.event.head_commit.message || '', 'Record workflow hash overrides') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ai-response-hardening-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compute overrides
        run: node scripts/write-workflow-hash-overrides.mjs
      - name: Commit override only
        run: |
          git config user.name "CPCV Reliability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_SHA256SUMS.override.txt
          git commit -m "Record workflow hash overrides"
          git push origin HEAD:agent/ai-response-hardening-20260808