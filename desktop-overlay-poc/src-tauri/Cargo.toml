[package]
name = "cpcv-overlay-poc"
version = "0.1.1"
description = "CPCV transparent overlay proof of concept"
authors = ["syouziroupc"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
