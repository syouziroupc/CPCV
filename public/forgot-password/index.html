<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスワード再設定 | CPCV</title>
  <link rel="stylesheet" href="/assets/app.css?v=0.8.10-nav3">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <script src="/assets/turnstile-bootstrap.js?v=0.8.10"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=cpcvTurnstileReady&amp;render=explicit" defer></script>
</head>
<body class="page auth-page clear-auth-page public-auth-layout">
  <header class="site-header clear-site-header public-site-header">
    <a class="brand" href="/"><span class="brand-mark">C</span><span><strong>CPCV</strong><small>授業コメント</small></span></a>
    <nav class="site-nav" aria-label="メインメニュー">
      <a href="/">ホーム</a>
      <a href="/guide">使い方</a>
      <a href="/about">機能概要</a>
      <a href="/privacy">情報の扱い</a>
      <a href="/#desktop">Windows版</a>
      <a class="nav-cta" aria-current="page" href="/admin">先生ログイン</a>
    </nav>
  </header>
  <main class="auth-shell">
    <section class="auth-intro">
      <p class="eyebrow">ログイン補助</p>
      <h1>パスワード再設定</h1>
      <p>登録したメールアドレスに再設定リンクを送ります。</p>
      <a class="button" href="/admin">ログインへ戻る</a>
    </section>
    <section class="auth-form-panel">
      <form id="forgotForm" class="auth-form">
        <label class="label" for="email">メールアドレス</label>
        <input id="email" class="input" type="email" autocomplete="email" maxlength="254" required>
        <div id="turnstileWidget" class="auth-challenge"></div>
        <button id="submitButton" class="button primary auth-submit" type="submit" disabled>再設定メールを送る</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/assets/forgot-password.js?v=0.8.10"></script>
</body>
</html>
