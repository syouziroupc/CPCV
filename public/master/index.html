<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>組織管理 | CPCV</title>
  <link rel="stylesheet" href="/assets/app.css?v=0.8.10-min1">
</head>
<body class="page internal-page">
  <a class="skip-link" href="#mainContent">本文へ移動</a>
  <main id="mainContent" class="internal-shell">
    <header class="app-header app-topbar">
      <a class="app-brand-link" href="/admin"><span class="brand-mark">C</span><span><strong>CPCV</strong><small>組織管理</small></span></a>
      <nav class="app-nav" aria-label="管理メニュー">
        <a href="/admin">授業管理</a>
        <a href="/account">アカウント設定</a>
        <a aria-current="page" href="/master">組織管理</a>
        <a href="/">ホーム</a>
        <button id="masterLogoutButton" class="button hidden">ログアウト</button>
      </nav>
    </header>

    <section id="masterBootSection" class="section"><p id="masterBootStatus" class="status">組織管理を読み込んでいます。</p></section>

    <section id="masterLoginSection" class="auth-shell admin-login-shell hidden">
      <div class="auth-intro">
        <p class="eyebrow">Owner・Admin</p>
        <h1>組織管理へログイン</h1>
        <a class="button" href="/admin">授業管理へ</a>
      </div>
      <div class="auth-form-panel">
        <label class="label" for="masterLoginId">メールアドレス</label>
        <input id="masterLoginId" class="input" type="email" autocomplete="username">
        <label class="label" for="masterPassword">パスワード</label>
        <input id="masterPassword" class="input" type="password" autocomplete="current-password">
        <div id="masterOrganizationGroup" class="hidden">
          <label class="label" for="masterOrganization">組織</label>
          <select id="masterOrganization" class="select"></select>
        </div>
        <button id="masterLoginButton" class="button primary full-button">ログイン</button>
        <p id="masterLoginStatus" class="status"></p>
        <div class="auth-links"><a href="/forgot-password">パスワードを忘れた</a><a href="/signup">組織を登録</a></div>
      </div>
    </section>

    <section id="masterPanel" class="internal-content hidden">
      <header class="internal-page-heading">
        <div><p class="eyebrow">組織管理</p><h1 id="organizationName">組織</h1><p id="organizationRole" class="status"></p></div>
        <p id="masterTimeLeft" class="muted"></p>
      </header>

      <div class="internal-two-column">
        <section class="workspace-panel">
          <h2>メンバーを招待</h2>
          <label class="label" for="memberEmail">メールアドレス</label>
          <input id="memberEmail" class="input" type="email" autocomplete="off" placeholder="teacher@example.com">
          <label class="label" for="memberRole">権限</label>
          <select id="memberRole" class="select"><option value="teacher">Teacher</option><option value="admin">Admin</option><option value="owner">Owner</option></select>
          <button id="inviteMemberButton" class="button primary full-button">招待メールを送る</button>
          <p id="quotaStatus" class="muted"></p>
        </section>
      </div>

      <section class="workspace-detail" open>
        <div class="detail-body">
          <div class="row between wrap"><h2>未承認の招待</h2><button id="refreshInvitationsButton" class="button">再読み込み</button></div>
          <div id="invitationList" class="teacher-list"></div>
        </div>
      </section>
      <section class="workspace-detail" open>
        <div class="detail-body">
          <div class="row between wrap"><h2>メンバー一覧</h2><button id="refreshMembersButton" class="button">再読み込み</button></div>
          <div id="memberList" class="teacher-list"></div>
        </div>
      </section>
      <section class="workspace-detail" open>
        <div class="detail-body">
          <div class="row between wrap"><h2>進行中の授業</h2><button id="refreshSessionsButton" class="button">再読み込み</button></div>
          <div id="masterSessionList" class="teacher-list"></div>
        </div>
      </section>
      <details class="workspace-detail">
        <summary>監査ログ</summary>
        <div class="detail-body"><div class="row wrap"><button id="refreshAuditButton" class="button">再読み込み</button></div><div id="auditList" class="teacher-list"></div></div>
      </details>
    </section>

    <p id="masterStatus" class="status"></p>
  </main>
  <script src="/assets/master.js?v=0.8.10" type="module"></script>
</body>
</html>
