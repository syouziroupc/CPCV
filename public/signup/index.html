<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>組織を登録 | CPCV</title>
  <link rel="stylesheet" href="/assets/app.css?v=0.8.10-lp4">
  <link rel="stylesheet" href="/assets/public-responsive.css?v=0.8.10-public2">
  <link rel="preconnect" href="https://challenges.cloudflare.com">
  <script src="/assets/turnstile-bootstrap.js?v=0.8.10"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=cpcvTurnstileReady&amp;render=explicit" defer></script>
</head>
<body class="page auth-page clear-auth-page public-auth-layout">
  <header class="site-header clear-site-header public-site-header">
    <a class="brand" href="/"><span class="brand-mark">C</span><span><strong>CPCV</strong><small>授業コメント</small></span></a>
    <nav class="site-nav" aria-label="メインメニュー">
  <a href="/">公開サイト</a>
  <a class="nav-cta" href="/admin">先生ログイン</a>
</nav>
  </header>
  <main class="auth-shell">
    <section class="auth-intro">
      <p class="eyebrow">先生・組織管理者</p>
      <h1>組織を登録</h1>
      <p>確認メールを受け取った後に利用を開始できます。既にアカウントがある場合はログインしてください。</p>
      <a class="button" href="/admin">ログインへ</a>
    </section>
    <section class="auth-form-panel">
      <form id="signupForm" class="auth-form">
        <label class="label" for="email">メールアドレス</label>
        <input id="email" class="input" type="email" autocomplete="email" maxlength="254" required>
        <label class="label" for="displayName">表示名</label>
        <input id="displayName" class="input" autocomplete="name" maxlength="80" required>
        <label class="label" for="password">パスワード</label>
        <input id="password" class="input" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="passwordHint">
        <p id="passwordHint" class="muted small-text" aria-live="polite">8文字以上。</p>
        <div id="turnstileWidget" class="auth-challenge"></div>
        <button id="submitButton" class="button primary auth-submit" type="submit" disabled>確認メールを送る</button>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/assets/signup.js?v=0.8.10"></script>
</body>
</html>
