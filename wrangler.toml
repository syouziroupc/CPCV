#:schema node_modules/wrangler/config-schema.json
name = "class-pdf-comment-viewer-v01"
main = "src/index.js"
compatibility_date = "2026-06-17"
workers_dev = true

assets = { directory = "./public", binding = "ASSETS", run_worker_first = true, html_handling = "none" }

[[d1_databases]]
binding = "DB"
database_name = "class_comment_db"
database_id = "f11457fa-27af-468d-94cc-6cdf1ae814e4"

[[d1_databases]]
binding = "DB_V2"
database_name = "class_comment_db_v2"
database_id = "8315a076-67ad-44e6-8286-11887af52ad3"
migrations_dir = "migrations-v2"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "noreply@szworld.uk" ]

[ai]
binding = "AI"

# Translation and moderation scale independently. max_concurrency is intentionally
# unset so Cloudflare Queues can autoscale consumers as backlog grows. Translation
# uses small low-latency batches; moderation collects up to 20 messages for one
# Text Classification call during bursts.
[[queues.producers]]
binding = "AI_TRANSLATION_QUEUE"
queue = "cpcv-ai-translation-jobs"

[[queues.consumers]]
queue = "cpcv-ai-translation-jobs"
max_batch_size = 6
max_batch_timeout = 0
max_retries = 18
dead_letter_queue = "cpcv-ai-translation-dlq"

[[queues.producers]]
binding = "AI_MODERATION_QUEUE"
queue = "cpcv-ai-moderation-jobs"

[[queues.consumers]]
queue = "cpcv-ai-moderation-jobs"
max_batch_size = 20
max_batch_timeout = 1
max_retries = 6
dead_letter_queue = "cpcv-ai-moderation-dlq"

[[durable_objects.bindings]]
name = "COMMENT_ROOM"
class_name = "CommentRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "CommentRoom" ]

[[ratelimits]]
name = "AUTH_LOGIN_IP_LIMITER"
namespace_id = "826071901"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AUTH_LOGIN_ACCOUNT_LIMITER"
namespace_id = "826071902"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PUBLIC_COMMENT_RATE_LIMITER"
namespace_id = "826071903"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AUTH_PUBLIC_EMAIL_LIMITER"
namespace_id = "826071904"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AI_TRANSLATION_DEDICATED_RATE_LIMITER"
namespace_id = "826071908" # dedicated Translation task capacity
simple = { limit = 700, period = 60 }

# Primary moderation is batched Text Classification. This limiter counts model
# requests rather than comments and leaves a margin below Cloudflare's 2000 RPM
# Text Classification task limit. Raising account limits later requires config only.
[[ratelimits]]
name = "AI_MODERATION_CLASSIFIER_RATE_LIMITER"
namespace_id = "826071907" # batched moderation classification capacity
simple = { limit = 1900, period = 60 }

# Text-generation translation overflow and legacy moderation fallback share a
# single capacity namespace below the 300 RPM Text Generation task limit.
[[ratelimits]]
name = "AI_TEXT_GENERATION_RATE_LIMITER"
namespace_id = "826071906" # shared Text Generation capacity
simple = { limit = 290, period = 60 }

[vars]
APP_ENV = "production"
AUTH_V2_ENABLED = "1"
EMAIL_AUTH_REQUIRED = "0"
AI_MODERATION_CLASSIFIER_MODEL = "@cf/baai/bge-reranker-base"
AI_MODERATION_CLASSIFIER_TIMEOUT_MS = "5000"
AI_MODERATION_REVIEW_SCORE = "0.68"
AI_MODERATION_HIDE_SCORE = "0.90"
AI_MODERATION_CLASSIFIER_FALLBACK = "0"
AI_MODERATION_MODEL = "@cf/meta/llama-3.2-3b-instruct"
AI_MODERATION_FALLBACK_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"
AI_TRANSLATION_BALANCED_MODEL = "@cf/meta/llama-3.2-3b-instruct"
AI_TRANSLATION_ACCURATE_MODEL = "@cf/moonshotai/kimi-k2.6"
AI_TIMEOUT_MS = "12000"
AI_TRANSLATION_TIMEOUT_MS = "8000"
AI_TRANSLATION_BALANCED_TIMEOUT_MS = "18000"
AI_TRANSLATION_ACCURATE_TIMEOUT_MS = "30000"
AI_TRANSLATION_QUEUE_PARALLELISM = "6"
AI_MODERATION_QUEUE_PARALLELISM = "20"
AUTH_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
PUBLIC_ORIGIN = "https://class-pdf-comment-viewer-v01.syouziroupc.workers.dev"
AUTH_EMAIL_FROM = "noreply@szworld.uk"
AUTH_EMAIL_REPLY_TO = "noreply@szworld.uk"
TURNSTILE_SITE_KEY = "0x4AAAAAAD9zOVz8FBcawf0n"

[triggers]
crons = [ "*/5 * * * *", "17 3 * * *" ]
